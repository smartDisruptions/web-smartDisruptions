    <script>
      // Iron filings around the bar, as in the hero (islands/a-field.tsx), but
      // drawn once, bolder, from a fixed seed.
      (function () {
        var c = document.getElementById('c');
        var g = c.getContext('2d');
        var W = 1200,
          H = 630;
        var br = document.getElementById('bar').getBoundingClientRect();
        var cx = br.left + br.width / 2,
          cy = br.top + br.height / 2;
        var A = br.width / 2,
          B = (br.height / 2) * 0.86;
        function field(x, y, out) {
          var vp = y - cy + B,
            vm = y - cy - B;
          var du = x - (cx - A);
          if (Math.abs(du) < 1e-3) du = 1e-3;
          var rp = Math.sqrt(du * du + vp * vp),
            rm = Math.sqrt(du * du + vm * vm);
          var fu = (vp / rp - vm / rm) / du,
            fv = 1 / rm - 1 / rp;
          du = x - (cx + A);
          if (Math.abs(du) < 1e-3) du = 1e-3;
          rp = Math.sqrt(du * du + vp * vp);
          rm = Math.sqrt(du * du + vm * vm);
          fu -= (vp / rp - vm / rm) / du;
          fv -= 1 / rm - 1 / rp;
          out[0] = fu;
          out[1] = fv;
        }
        var a = 0x5ad15c0;
        function rnd() {
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        var f = [0, 0];
        field(cx, cy - A * 1.1, f);
        var ref = Math.hypot(f[0], f[1]);
        function box(el, p) {
          var r = el.getBoundingClientRect();
          return [r.left - p, r.top - p, r.right + p, r.bottom + p];
        }
        var clears = [];
        var range = document.createRange();
        ['txt', 'foot'].forEach(function (id) {
          var el = document.getElementById(id);
          el.querySelectorAll('p, h1, span > b, span:last-child').forEach(
            function (t) {
              range.selectNodeContents(t);
              var rs = range.getClientRects();
              for (var i = 0; i < rs.length; i++)
                clears.push([
                  rs[i].left - 10,
                  rs[i].top - 8,
                  rs[i].right + 10,
                  rs[i].bottom + 8,
                ]);
            }
          );
        });
        var seal = document.querySelector('.seal');
        clears.push(box(seal, 8));
        var barBox = box(document.getElementById('bar'), 5);
        function inBar(x, y) {
          return (
            x > barBox[0] && x < barBox[2] && y > barBox[1] && y < barBox[3]
          );
        }
        function clearDist(x, y) {
          var d = 1e9;
          for (var i = 0; i < clears.length; i++) {
            var q = clears[i];
            var dx = Math.max(q[0] - x, 0, x - q[2]),
              dy = Math.max(q[1] - y, 0, y - q[3]);
            var e = Math.sqrt(dx * dx + dy * dy);
            if (e < d) d = e;
          }
          return d;
        }
        function strength(x, y) {
          field(x, y, f);
          var m = Math.hypot(f[0], f[1]);
          return m / (m + ref);
        }
        g.lineCap = 'round';
        g.lineWidth = 2;
        g.strokeStyle = 'rgba(203, 213, 255, 0.86)';
        g.beginPath();
        var step = 13.5,
          n = 0;
        for (var gy = 0; gy < H; gy += step) {
          for (var gx = 0; gx < W; gx += step) {
            var x = gx + rnd() * step,
              y = gy + rnd() * step;
            if (inBar(x, y)) continue;
            var s = strength(x, y);
            var edge = Math.min(x, W - x, y, H - y);
            var cd = clearDist(x, y);
            if (cd < 2) continue;
            var p =
              Math.min(1, 0.1 + s * s) *
              (edge < 24 ? edge / 24 : 1) *
              (cd < 18 ? (cd / 18) * (cd / 18) : 1);
            if (rnd() > p) continue;
            var links = 1 + Math.floor(rnd() * (1 + 6 * s * s));
            var dir = rnd() < 0.5 ? -1 : 1;
            for (var k = 0; k < links; k++) {
              if (k > 0) s = strength(x, y);
              var len =
                (rnd() < 0.45 ? 3 + rnd() * 3.5 : 6 + rnd() * 7) *
                (0.74 + 0.46 * s);
              var m = Math.hypot(f[0], f[1]) || 1;
              var th =
                Math.atan2(f[1], f[0]) +
                (rnd() - 0.5) * 2.4 * (1 - s) * (1 - s);
              var hx = (Math.cos(th) * len) / 2,
                hy = (Math.sin(th) * len) / 2;
              g.moveTo(x - hx, y - hy);
              g.lineTo(x + hx, y + hy);
              n++;
              var st = len + 2 + rnd() * 2;
              x += (dir * f[0] * st) / m + (rnd() - 0.5);
              y += (dir * f[1] * st) / m + (rnd() - 0.5);
              if (
                x < 0 ||
                y < 0 ||
                x > W ||
                y > H ||
                inBar(x, y) ||
                clearDist(x, y) < 3
              )
                break;
            }
          }
        }
        g.stroke();
        document.body.dataset.filings = n;
      })();
