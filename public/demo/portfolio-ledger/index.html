.lb-res .lbl{color:var(--gold)}
.lb-big{font:800 46px/1 var(--display);letter-spacing:-.035em;margin-top:8px;font-variant-numeric:tabular-nums}
.lb-dl{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.lb-dl .pill{font-size:13px}
.lb-from{font-size:12.5px;color:var(--tx3)}.lb-from b{color:var(--tx2);font-weight:700}
.lb-bars{margin-top:14px;display:grid;gap:11px}
.lb-brh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px}
.lb-brh .sw{margin-right:7px;vertical-align:-1px}
.lb-brh .num{color:var(--tx2);white-space:nowrap}.lb-brh .num b{color:var(--tx);font-weight:700}
.lb-trk{position:relative;height:9px;border-radius:5px;background:var(--s3);overflow:hidden}
.lb-trk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.lb-ghost{opacity:.3}
.lb-trk .lb-mk{width:2px;margin-left:-2px;border-radius:0;background:rgba(238,241,251,.6)}
.lb-fill{width:100%;transform-origin:0 50%;transition:transform .45s var(--ease)}
.lite .lb-fill{transition:none}
.lb-kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lb-kv b{font:750 18px/1.2 var(--display);font-variant-numeric:tabular-nums}
.lb-chart{margin-top:12px;min-height:150px}
.lb-rank{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.lb-mr{margin-top:14px}
.lb-mr .lb-slh{font-size:14px}
.lb-mr .lb-slh small{font:500 12.5px var(--mono);color:var(--tx3);margin-left:6px}
.lb-sum{font:500 12.5px/1.5 var(--mono);color:var(--tx3);margin-top:12px}

.lb-dr .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.lb-dt::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line3)}
.lb-dt i{position:absolute;top:0;bottom:0;left:50%;width:50%;border-radius:5px;transform-origin:0 50%;transition:transform .4s var(--ease)}
.lite .lb-dt i{transition:none}
.lb-mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.lb-mv:first-child{border-top:0}
.lb-mv .grow{flex:1;min-width:0}
.lb-mv b{font-weight:700;font-variant-numeric:tabular-nums}
.lb-arw{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--mintA);color:var(--mint)}
.lb-add{display:flex;gap:8px;align-items:center;margin-top:12px}
.lb-add .lb-cur{flex:1;min-width:0}
.lb-cur{position:relative;display:block}
.lb-cur::before{content:"$";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
.lb-cur .input{padding-left:26px}
.lb-amt{font-variant-numeric:tabular-nums}

.lite .lb-meter i{transition:none}

.lb-tbar i:first-child{background:var(--mint);opacity:.75}
.lb-tbar span{margin-left:6px}
.lb-out{height:min(52vh,360px);overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 4px;font:500 12.5px/1.55 var(--mono);color:var(--tx2);white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
