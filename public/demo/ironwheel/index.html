 every plan and number in Ironwheel, and where they come from.",Cm="The short version, in the order you meet it. Each Why opens the science behind it, further down.",fd=[{id:"wheel",title:"The wheel",card:"frequency",body:"Your plan's days sit around a plate, in order. Finish a workout and it turns to the next day. Miss a day and it waits: nothing to make up, no streak to break."},{id:"map",title:"The muscle map",card:"rotation",body:"Each muscle reads Ready, Recovering or Fatigued from your own sets, with the hours until it's back. Behind: ready, and short on sets this week. When the next day needs a muscle that isn't back, Ironwheel offers a day that's ready, or rest."},{id:"logger",title:"The logger",card:"overload",body:"Log each set and how it felt: Easy, Solid, Hard or Max. From those sets it picks your next weight and the plates to load, and says why in one line."},{id:"budget",title:"Weekly sets",card:"volume",body:"Each muscle's sets this week against the range for your goal: a shaded band is your range, a solid line the upper limit. Aim for the shaded band. Past the line, fatigue tends to build faster than muscle. Only the sets that count: sets rated Solid, Hard or Max; warm-ups and Easy sets don't count."},{id:"deload",title:"A lighter week (deload)",card:"deload",body:"After five full weeks comes a lighter one: fewer sets, weights about 10% down. It's part of the plan, and most people come back fresher for it."}],Om="A training guide, not medical advice.",zl=[{id:"rotation",tag:"Recovery",title:"Rotate, don't repeat",rule:"48–72 hours between hard sessions for the same muscle.",body:"A muscle you trained hard needs about two to three days before it's ready to go hard again. Big muscles worked heavy, like legs after squats or your back after deadlifts, tend to need the longer end. That's what the rotation is for: legs work while the upper body recovers, and the other way round. Light work on a recovering muscle is fine. Another hard session on it usually just digs the hole deeper.",app:"Every muscle on the map reads Ready, Recovering or Fatigued from your own logged sets, with the hours until it's back, or Behind: ready, and short on sets this week. Boxing, kickboxing, grappling and runs you log add fatigue to the muscles they load. If the next day hits muscles that aren't back, Ironwheel says so and offers a day that's ready, or rest. The day it passes over stays next in line, so no day gets dropped. A muscle within about 6 hours of back counts as ready, with a reminder to warm up well.",source:"ACSM's guidance on prescribing exercise (Garber et al., 2011, Medicine & Science in Sports & Exercise): at least 48 hours between resistance sessions for the same muscle group. The longer end for big muscles is common coaching practice."},{id:"volume",tag:"Volume",title:"Sets per muscle, per week",rule:"10–20 hard sets per muscle a week to grow, with an upper limit around 20.",body:"The honest way to count training is hard sets per muscle per week: sets that end 3 or fewer reps short of failure (in Ironwheel, the sets that count: rated Solid, Hard or Max). More sets tend to build more muscle, up to a point: in the research, 10 or more a week beat fewer than 5. Roughly 10–20 to build muscle, 6–12 when the goal is strength on the main lifts, 4–6 to hold what you have. Past about 20 for most muscles, coaches find fatigue starts to climb faster than the gains, so that's where the upper limit sits (coaches call it the cap). It's a convention about fatigue, not a study's finding, and not a line where injury starts.",app:"Each muscle's week sits against the range for your goal, on Today and in Progress: a shaded band is the range, a solid line the upper limit. A set counts fully for the muscles it trains most and half for the ones that help. Past the upper limit, it says so plainly: more sets there mostly add fatigue.",source:"Schoenfeld, Ogborn and Krieger (2017), a dose-response meta-analysis of weekly sets and muscle growth: 10 or more a week beat fewer than 5. It grouped everything from 10 up together, so it says nothing about 20. The ranges and the upper limit are coaching convention built on it."},{id:"frequency",tag:"Frequency",title:"Twice a week",rule:"Hit each muscle twice a week to spread its sets.",body:"Twice a week is the traditional default, and the best reason for it is practical: it spreads the week's sets, so no single day asks too much of a muscle and every set gets done fresher. An early meta-analysis found two sessions grew more muscle than one. A later, larger look by the same group found that once the weekly sets are the same, how often you train a muscle tends to make little difference to growth. So the sets are what count, and twice a week is usually the easiest way to get 10–20 of them done well. Full-body and upper/lower splits (ways of sharing the muscles out across the week's days) are built around it.",app:"Every plan trains the big muscles on two days a week, at least 48 hours apart, wherever your equipment allows it; the plan's volume check shows the days and the gaps, and says plainly when a setup can't. A plan that trains a big muscle hard two days running doesn't ship.",source:"Schoenfeld, Ogborn and Krieger (2016), a meta-analysis of training frequency, found twice a week beat once for growth. Their 2019 update (Schoenfeld, Grgic and Krieger, Journal of Sports Sciences) found that with weekly sets equal, frequency made no meaningful difference."},{id:"rir",tag:"Effort",title:"Hard sets and reps in reserve",rule:"A set counts when it ends 3 or fewer reps short of failure.",body:"Reps in reserve (RIR) is how many more clean reps you had left. End a set with 3 or fewer left and it's a hard set: it counts. Four or more left is a warm-up or practice, and it doesn't count toward the week. Most work sets belong at 1–3 left. Going to true failure on every set tends to add more fatigue than growth, most of all on heavy compounds.",app:"After each set, one tap: Easy (4+ left), Solid (2–3), Hard (1), Max (nothing left). Solid, Hard and Max are the sets that count; Easy sets and warm-ups don't count toward volume or fatigue.",source:"Zourdos et al. (2016), the reps-in-reserve RPE scale for resistance training."},{id:"overload",tag:"Progression",title:"Progressive overload",rule:"Add weight while every rep is clean. Then climb the rep range.",body:"Early on, add a little weight every session as long as every rep is clean. That's linear progression, and it works until it doesn't. After that, double progression: keep the weight and add reps across the range, say 6 to 8. The first session every set reaches the top of the range, add the smallest jump and start back at the bottom. A more cautious version waits for two sessions in a row before adding weight. Three sessions with no progress on a lift: take about 10% off and build back up.",app:`The logger suggests the next weight from your own last sets and says why in one line: one session with every set at the top of the range earns more weight next time. Time away counts too: after two weeks off a lift it holds the weight, after three it takes about 10% off, after six about 20%. Lift trends in Progress chart each lift's estimate, session by session. ${Vn}`,source:"Double progression is common coaching practice. ACSM's position stand on progression models in resistance training (2009) is the more cautious version: add 2–10% when you can do 1–2 reps over the target on two sessions in a row. ACSM updated its position stand in 2026; these cards cite the 2009 stand and the studies named."},{id:"rest",tag:"Rest",title:"Rest by goal",rule:"Rest long enough to do the next set well.",body:"Strength: 3–5 minutes between sets of the main lifts, 3–6 reps a set. Muscle: 2–3 minutes on compounds (lifts that move several joints, like squats and rows) for 6–12 reps, 60–90 seconds on isolation work (one joint, like curls) for 10–15. General fitness: 1–2 minutes, 8–12 reps. Short rest feels productive, but it costs reps on the next set, and the reps are the point.",app:"The rest timer starts from your plan's rest for each lift, set by its role: main lift, big lift (compound) or single-muscle lift (isolation). Set your own for a role in Preferences and the timer uses that instead.",source:"ACSM (2009) for reps and rest by goal. Schoenfeld et al. (2016) found 3-minute rests built more muscle and strength than 1-minute rests."},{id:"compound",tag:"Order",title:"Compound lifts first",rule:"Squat, press, pull and hinge first, while you're fresh.",body:"Lifts that move several joints and a lot of muscle (squats, deadlifts, presses, rows, pull-ups) give the most for the time and ask the most of you. Do them first, when you're fresh and your form is at its best. Isolation work (curls, raises, extensions) goes at the end, where fatigue costs little.",app:"Every plan day opens with its main lift, then the big lifts (compounds), then the single-muscle lifts (isolation).",source:"ACSM (2009): large-muscle, multi-joint exercises before small-muscle, single-joint ones."},{id:"warmup",tag:"Warm-up",title:"Ramp up",rule:"Bar × 10, about 40% × 5, 60% × 3, 80% × 1–2, then the work sets.",body:"Before the day's first heavy lift, ramp up instead of jumping straight to the work weight. A few sets of rising weight and falling reps groove the movement and warm the joints without tiring you out. Later lifts in the session usually need one lighter set at most.",app:"The logger lays out the ramp for the day's first big lift, with the plates for each step.",source:"Common strength-coaching practice. There's little research on the exact percentages."},{id:"deload",tag:"Deload",title:"Deload",rule:"Every 4–8 hard weeks, one lighter week.",body:"Fatigue builds faster than you notice. A deload week means about 40–50% fewer sets, with the weights about the same or up to 10% lighter. You keep the skill and the strength, and you come back fresher. It's planned, not a lost week.",app:"Plans run five full weeks, then a lighter week (deload): the same lifts with about 40% fewer sets (the plan screen gives your plan's own figure) and the weights about 10% lighter. Progress and the plan show which week you're in and when the lighter week comes.",source:"Practitioner convention. Research on the exact timing is thin."},{id:"pain",tag:"Pain",title:"Pain is not soreness",rule:"Sharp or joint pain means stop and get it checked.",body:"Soreness is a dull, spread-out ache in the muscle a day or two after training. It tends to fade as you warm up and isn't a reason to skip, though it is a reason to go lighter. Pain is different: sharp, in or around a joint, or getting worse as you go. Stop that exercise. If it doesn't settle in a few days, get it checked by a doctor or a physio. Training around it is fine. Training through it isn't.",app:'Mark a joint as pain in "Anything hurt?" on Today and every exercise that loads it becomes a swap until a newer check-in clears it.',source:"General sports-medicine guidance, not a single study."},{id:"recovery",tag:"Sleep and food",title:"Sleep and protein",rule:"Most of the growing happens away from the gym.",body:"Training is the signal. Sleep and food are where it turns into progress. Most adults need 7–9 hours of sleep, and short nights tend to slow recovery and make the bar feel heavier. For protein, around 1.6 g per kg of bodyweight a day (about 0.7 g per lb) is where most people stop seeing extra benefit for muscle. Short on either for a while, expect slower progress, not a broken plan.",app:"Ironwheel tracks the training, not the food or the sleep. Those are on you.",source:"Morton et al. (2018), a meta-analysis of protein and muscle gain. The sleep range is the National Sleep Foundation's for adults."}],Yl=[["squat","Squat"],["hinge","Hinge"],["lunge","Lunge"],["push-h","Horizontal push"],["push-v","Vertical push"],["pull-h","Horizontal pull"],["pull-v","Vertical pull"],["iso-arm","Arms"],["iso-leg","Legs, single joint"],["c
