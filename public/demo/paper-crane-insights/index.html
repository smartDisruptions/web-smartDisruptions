<style>

:root {
  color-scheme: light;
  
  --page: #f5f2ec;
  --surface: #fdfcfa;
  --surface-2: #f1ede5;
  --ink: #151412;
  --ink-2: #5c5850;
  --muted: #8a857b;
  --hairline: #e6e1d7;
  --baseline: #cfc9bd;
  --ring: rgba(21, 20, 18, 0.10);
  
  --accent: #c41e24;
  --accent-ink: #ffffff;
  --gold: #b8912f;
  
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #a8467f;
  --series-soft: #9ec5f4;
  --series-mute: #c8c3b8;
  
  --heat-1: #dbe9fb;
  --heat-2: #b7d3f6;
  --heat-3: #86b6ef;
  --heat-4: #5598e7;
  --heat-5: #2a78d6;
  --heat-6: #1c5cab;
  --heat-7: #0d366b;
  --good: #1d7a1d;
  --shadow: 0 1px 2px rgba(21, 20, 18, 0.05), 0 8px 24px -16px rgba(21, 20, 18, 0.25);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121110;
    --surface: #1c1b19;
    --surface-2: #24221f;
    --ink: #f4f1ea;
    --ink-2: #c3beb2;
    --muted: #8f8a80;
    --hairline: #2c2a27;
    --baseline: #3a3733;
    --ring: rgba(255, 255, 255, 0.10);
    --accent: #e0424a;
    --accent-ink: #ffffff;
    --gold: #d4a843;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
  --series-4: #c4599a;
    --series-4: #c4599a;
    --series-soft: #2a5a94;
    --series-mute: #4a4742;
    --heat-1: #1a2a44;
    --heat-2: #1c3d6c;
    --heat-3: #1e4f92;
    --heat-4: #2a6cc0;
    --heat-5: #3987e5;
    --heat-6: #6da7ec;
    --heat-7: #a4cbf6;
    --good: #4cc04c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121110;
  --surface: #1c1b19;
  --surface-2: #24221f;
  --ink: #f4f1ea;
  --ink-2: #c3beb2;
  --muted: #8f8a80;
  --hairline: #2c2a27;
  --baseline: #3a3733;
  --ring: rgba(255, 255, 255, 0.10);
  --accent: #e0424a;
  --accent-ink: #ffffff;
  --gold: #d4a843;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-soft: #2a5a94;
  --series-mute: #4a4742;
  --heat-1: #1a2a44;
  --heat-2: #1c3d6c;
  --heat-3: #1e4f92;
  --heat-4: #2a6cc0;
  --heat-5: #3987e5;
  --heat-6: #6da7ec;
  --heat-7: #a4cbf6;
  --good: #4cc04c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-ui), system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.display {
  font-family: var(--font-display), "Bebas Neue", Impact, sans-serif;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.tnum {
  font-variant-numeric: tabular-nums;
}

.muted {
  color: var(--muted);
}

.ink2 {
  color: var(--ink-2);
}



.frame {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 64px;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 0 14px;
  flex-wrap: wrap;
}

.wordmark {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.wordmark .name {
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
}

.wordmark .name em {
  font-style: normal;
  color: var(--accent);
}

.wordmark .kanji {
  font-size: 22px;
  color: var(--gold);
  line-height: 1;
}

.topmeta {
  color: var(--ink-2);
  font-size: 13px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}

.topmeta .dot::before {
  content: "·";
  margin-right: 14px;
  color: var(--muted);
}

.textbtn {
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  text-decoration: none;
}

.textbtn:hover {
  border-color: var(--baseline);
  color: var(--ink);
}



.filters {
  position: sticky;
  top: 0;
  z-index: 5;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  padding: 10px 0;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.filters .group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.filters .label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 4px;
}

.chip {
  border: 1px solid var(--hairline);
  background: var(--surface);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1.2;
}

.chip:hover {
  border-color: var(--baseline);
  color: var(--ink);
}

.chip[aria-pressed="true"] {
  background: var(--ink);
  color: var(--page);
  border-color: var(--ink);
}

.chip .swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  display: inline-block;
  background: var(--sw, var(--series-1));
}

.chip[aria-pressed="false"] .swatch {
  opacity: 0.35;
}

.dates {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.dates input {
  border: 1px solid var(--hairline);
  background: var(--surface);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
}



.hero {
  display: grid;
  grid-template-columns: minmax(280px, 1.2fr) repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  padding: 22px 0 8px;
  align-items: stretch;
}

.herofig {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 18px 20px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.herofig .label {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.herofig .value {
  font-size: 52px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
}

.herofig .sub {
  color: var(--ink-2);
  font-size: 13px;
}

.herofig svg {
  margin-top: 6px;
  width: 100%;
  height: 44px;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 14px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.tile .label {
  font-size: 12px;
  color: var(--muted);
}

.tile .value {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.tile .sub {
  font-size: 12px;
  color: var(--ink-2);
}

.delta {
  font-size: 12px;
  font-weight: 500;
}

.delta.up {
  color: var(--good);
}

.delta.down {
  color: var(--accent);
}



.insights {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  padding: 10px 0 8px;
}

.insight {
  border-left: 3px solid var(--accent);
  padding: 4px 0 4px 14px;
}

.insight h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.insight p {
  font-size: 13px;
  color: var(--ink-2);
}



.jump {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 14px 0 4px;
}

.jump a {
  text-decoration: none;
  font-size: 13px;
  color: var(--ink-2);
  padding: 4px 10px;
  border-radius: 999px;
}

.jump a:hover {
  background: var(--surface-2);
  color: var(--ink);
}

section.block {
  padding: 28px 0 8px;
  scroll-margin-top: 70px;
}

.blockhead {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.blockhead .eyebrow {
  font-size: 22px;
  line-height: 1;
  color: var(--accent);
}

.blockhead h2 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.blockhead p {
  color: var(--ink-2);
  font-size: 13px;
  max-width: 62ch;
}

.grid {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
}

@media (min-width: 860px) {
  .grid.two {
    grid-template-columns: 1fr 1fr;
  }

  .grid.wide-left {
    grid-template-columns: 3fr 2fr;
  }

  .grid.three {
    grid-template-columns: repeat(3, 1fr);
  }
}



.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 14px 16px 12px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card.lift {
  box-shadow: var(--shadow);
}

.cardhead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.cardhead h3 {
  font-size: 14px;
  font-weight: 600;
}

.cardhead p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  overflow: hidden;
  flex: none;
}

.seg button {
  background: none;
  border: 0;
  padding: 3px 9px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}

.seg button + button {
  border-left: 1px solid var(--hairline);
}

.seg button[aria-pressed="true"] {
  background: var(--surface-2);
  color: var(--ink);
}

.cardbody {
  position: relative;
  min-width: 0;
}

.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-2);
}

.legend .key {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend .key i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
  background: var(--sw);
}

.legend .key i.line {
  height: 2px;
  width: 14px;
  border-radius: 1px;
}

.tip {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  background: var(--ink);
  color: var(--page);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.4;
  min-width: 120px;
  max-width: 240px;
  box-shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.5);
}

.tip .t {
  font-weight: 600;
  margin-bottom: 3px;
}

.tip .r {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.tip .r b {
  font-weight: 600;
}

.tip .r i {
  width: 12px;
  height: 2px;
  background: var(--sw);
  display: inline-block;
  margin-right: 6px;
  vertical-align: middle;
  border-radius: 1px;
}


.chart {
  display: block;
  width: 100%;
  overflow: visible;
}

.chart text {
  font-family: inherit;
  font-size: 11px;
  fill: var(--muted);
}

.chart .axis-label {
  font-size: 11px;
  fill: var(--ink-2);
}

.chart .grid-line {
  stroke: var(--hairline);
  stroke-width: 1;
}

.chart .base-line {
  stroke: var(--baseline);
  stroke-width: 1;
}

.chart .ref-line {
  stroke: var(--ink-2);
  stroke-width: 1;
}

.chart .ref-text {
  fill: var(--ink-2);
  font-size: 10.5px;
}

.chart .direct {
  fill: var(--ink);
  font-weight: 600;
  font-size: 11.5px;
}

.chart .hit {
  fill: transparent;
  cursor: default;
  outline: none;
}

.chart .hit:focus-visible + .bar,
.chart .bar[data-hover="true"] {
  opacity: 0.78;
}

.chart .bar {
  transition: opacity 120ms ease;
}

.chart .cross {
  stroke: var(--ink-2);
  stroke-width: 1;
}

.chart .glide {
  transition: transform 90ms linear;
}

.chart .scrub {
  touch-action: none;
}

.chart .ring {
  stroke: var(--surface);
  stroke-width: 2;
}



.tablewrap {
  overflow-x: auto;
}

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table.data th,
table.data td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--hairline);
  white-space: nowrap;
}

table.data th {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

table.data td.n,
table.data th.n {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

table.data tr.sel td {
  background: var(--surface-2);
}



.hbars {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.hrow {
  display: grid;
  grid-template-columns: minmax(96px, 34%) 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 2px 4px;
  border-radius: 6px;
  background: none;
  border: 0;
  text-align: left;
  width: 100%;
  color: inherit;
}

.hrow.clickable {
  cursor: pointer;
}

.hrow.clickable:hover {
  background: var(--surface-2);
}

.hrow[aria-pressed="true"] {
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--baseline);
}

.hrow .name {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.hrow .track {
  display: block;
  height: 12px;
  position: relative;
  min-width: 0;
}

.hrow .fill {
  display: block;
  height: 100%;
  border-radius: 0 4px 4px 0;
  background: var(--sw, var(--series-1));
  min-width: 2px;
}

.hrow .val {
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  text-align: right;
  white-space: nowrap;
}



.stack {
  display: flex;
  gap: 2px;
  height: 22px;
  border-radius: 4px;
  overflow: hidden;
}

.stack .segwrap {
  height: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--sw);
  font-size: 11.5px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  outline: none;
}

.stack .segwrap:focus-visible {
  box-shadow: inset 0 0 0 2px var(--surface);
}



.heat {
  display: grid;
  gap: 2px;
  align-items: stretch;
}

.heat .rl {
  font-size: 12px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  padding-right: 8px;
}

.heat .cl {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  padding-top: 4px;
}

.heat .cell {
  aspect-ratio: 1.6 / 1;
  border-radius: 3px;
  background: var(--sw, transparent);
  border: 0;
  padding: 0;
  cursor: default;
  min-height: 22px;
}

.heat .cell.zero {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--hairline);
}

.heat .cell:hover,
.heat .cell:focus-visible {
  box-shadow: inset 0 0 0 2px var(--ink);
}

.ramp {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}

.ramp .bar {
  flex: 0 0 120px;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--heat-1), var(--heat-4), var(--heat-7));
}



.detail {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.detail .big {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 10px;
}

.detail .big div {
  display: flex;
  flex-direction: column;
}

.detail .big b {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
}

.detail .big span {
  font-size: 11.5px;
  color: var(--muted);
}

.detail h4 {
  margin: 0 0 6px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.detail .empty {
  color: var(--muted);
  font-size: 13px;
  padding: 24px 0;
  text-align: center;
}



.reco {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 14px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.reco h3 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.reco dl {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.reco dl > div {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 8px;
  align-items: baseline;
}

.reco dt {
  font-size: 10.5px;

    padding: 16px 14px;
  }

  .o-todo-row {
    grid-template-columns: 30px minmax(0, 1fr);
    gap: 10px;
    padding: 12px;
  }

  .o-n {
    width: 26px;
    height: 26px;
    font-size: 13px;
  }

  .o-how {
    display: none;
  }

  .o-todo-body {
    padding: 0 14px 14px 14px;
  }

  .o-bars.dishes li {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .o-bars.dishes .o-bar-track {
    display: none;
  }
}
