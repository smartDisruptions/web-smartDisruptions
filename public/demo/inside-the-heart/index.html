<style>
:root{
  /* Layout: a full-screen dark stage with the heart, a lesson card (left on desktop, bottom sheet on phones),
     and a live ECG strip under the heart. The stage keeps one fixed look in both themes; the card follows the theme. */
  --stage:#070c17;

}

:root[data-theme="dark"]{--panel:#121826;--ink:#eef1f6;--muted:#a3aec0;--line:#283247;--chip:#1b2335;--chip-ink:#d9e0ec;--red:#ff6b7d;--blue:#72b2ff;--green:#4ade80;--amber:#fbbf24;--btn:#eef1f6;--btn-ink:#0e1320;color-scheme:dark}

body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{position:fixed;inset:0;background:var(--stage);overflow:hidden}
.stage{position:absolute;inset:0;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}

.status{position:absolute;left:0;right:0;top:42%;margin:0;text-align:center;font:500 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#a9c4d8;pointer-events:none}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--f-display);color:#eef2f8;letter-spacing:-.01em;white-space:nowrap}
.beat-dot{width:11px;height:11px;border-radius:50%;background:#ff5a68;transform:scale(var(--pulse,1));flex:none;box-shadow:0 0 12px rgba(255,90,104,.6)}

.tbtn{font:700 14px var(--f-body);color:var(--tb-ink);background:var(--tb-bg);border:1px solid var(--tb-line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--tb-on);color:var(--tb-on-ink);border-color:var(--tb-on)}

.panel{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:72px;width:380px;max-height:calc(100% - 92px);display:flex;flex-direction:column;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}

.dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots button[aria-current="step"]::before{background:var(--red);width:10px;height:10px}

.p-scroll .small{font-size:14.5px;color:var(--muted)}

a.chipbtn{text-decoration:none;display:inline-block}

.stops li.on{color:#fff;background:var(--c,#5a6372)}
.stops li.b{--c:#2c6ad1}.stops li.r{--c:#c81e3b}
.now{min-height:4.5em;font-size:17px;font-weight:700;margin:0 0 10px;padding:12px 14px;border-radius:12px;background:var(--chip);border-left:4px solid var(--c,#5a6372)}

.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

.quiz-q{font:800 21px/1.2 var(--f-display);margin:10px 0 10px;letter-spacing:-.01em}
.fb{min-height:3em;margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:15.5px}

.p-nav{display:flex;justify-content:space-between;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--panel)}

  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:none;height:min(47%,440px);border-radius:20px 20px 0 0;border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.4)}

  .p-scroll h2{font-size:25px;margin:4px 0 8px}
  .p-scroll p{font-size:15.5px;margin-bottom:8px}
  .p-nav{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const statusEl = $('status');

/* ---------------------------------------------------------------
   1. The heart as a distance field
   Heart space: x = viewer's right (the owner's left), y = up, z = toward the viewer. 1 unit ≈ 10 cm.
   --------------------------------------------------------------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];
function mkE(c, r, o) { return Object.assign({ t: 0, cx: c[0], cy: c[1], cz: c[2], rx: r[0], ry: r[1], rz: r[2], bc: c, br: Math.max(r[0], r[1], r[2]) }, o); }
function mkC(a, b, r, o) { const ba = sub(b, a), bb = ba[0] ** 2 + ba[1] ** 2 + ba[2] ** 2; return Object.assign({ t: 1, a, ba, bb, r, bc: mid(a, b), br: Math.sqrt(bb) / 2 + r }, o); }
function mkRC(a, b, r1, r2, o) { const ba = sub(b, a), l2 = ba[0] ** 2 + ba[1] ** 2 + ba[2] ** 2, rr = r1 - r2; return Object.assign({ t: 2, a, ba, l2, rr, a2: l2 - rr * rr, il2: 1 / l2, r1, r2, bc: mid(a, b), br: Math.sqrt(l2) / 2 + Math.max(r1, r2) }, o); }

// Regions: what a bit of heart is called (used by the quiz and the labels).
const REG_NAME = ['Left ventricle', 'Right ventricle', 'Right atrium', 'Left atrium', 'Aorta', 'Pulmonary artery', 'Vena cava', 'Pulmonary vein'];
const LV = 0, RV = 1, RA = 2, LA = 3, AORTA = 4, PART = 5, VCAVA = 6, PVEIN = 7;
// beat: 0 lower chambers, 1 upper chambers, 2 arteries, 3 still. col: 0 lower muscle, 1 upper muscle, 2 red vessel, 3 blue vessel. side: 0 oxygen-poor, 1 oxygen-rich.
const P = [
  mkRC([0.04, 0.02, -0.06], [0.34, -0.62, 0.06], 0.40, 0.10, { k: 0.1, beat: 0, col: 0, side: 1, reg: LV }),
  mkRC([-0.2, 0.04, 0.14], [0.16, -0.52, 0.2], 0.34, 0.12, { k: 0.07, beat: 0, col: 0, side: 0, reg: RV }),
  mkE([-0.46, 0.16, -0.02], [0.23, 0.27, 0.24], { k: 0.1, beat: 1, col: 1, side: 0, reg: RA }),
  mkRC([-0.48, 0.3, 0.08], [-0.24, 0.37, 0.25], 0.1, 0.045, { k: 0.06, beat: 1, col: 1, side: 0, reg: RA }),
  mkE([0.12, 0.27, -0.3], [0.32, 0.2, 0.22], { k: 0.1, beat: 1, col: 1, side: 1, reg: LA }),
  mkRC([0.44, 0.24, -0.04], [0.31, 0.3, 0.17], 0.085, 0.04, { k: 0.06, beat: 1, col: 1, side: 1, reg: LA }),
];
const AO = { beat: 2, col: 2, side: 1, reg: AORTA };
P.push(
  mkC([-0.06, 0.1, 0.02], [-0.08, 0.52, 0.03], 0.12, { k: 0.06, ...AO }),
  mkC([-0.08, 0.52, 0.03], [-0.04, 0.64, -0.03], 0.115, { k: 0.05, ...AO }),
  mkC([-0.04, 0.64, -0.03], [0.1, 0.68, -0.13], 0.11, { k: 0.05, ...AO }),
  mkC([0.1, 0.68, -0.13], [0.25, 0.58, -0.27], 0.11, { k: 0.05, ...AO }),
  mkC([0.25, 0.58, -0.27], [0.3, -0.1, -0.4], 0.105, { k: 0.05, ...AO, clip: [[0, -1, 0, 0.05]] }),
  mkC([-0.05, 0.66, -0.02], [-0.15, 0.95, 0.02], 0.05, { k: 0.03, ...AO, clip: [[0, 1, 0, 0.91]] }),
  mkC([0.06, 0.7, -0.08], [0.07, 0.96, -0.09], 0.038, { k: 0.03, ...AO, clip: [[0, 1, 0, 0.93]] }),
  mkC([0.17, 0.66, -0.18], [0.25, 0.95, -0.21], 0.042, { k: 0.03, ...AO, clip: [[0, 1, 0, 0.91]] }),
);
const PA = { beat: 2, col: 3, side: 0, reg: PART };
P.push(
  mkC([0.04, 0.08, 0.24], [0.15, 0.47, 0.1], 0.11, { k: 0.06, ...PA }),
  mkC([0.15, 0.47, 0.08], [0.56, 0.52, -0.24], 0.075, { k: 0.04, ...PA, clip: [[1, 0, 0, 0.52]] }),
  mkC([0.12, 0.48, 0.0], [-0.12, 0.5, -0.2], 0.07, { k: 0.04, ...PA }),
  mkC([-0.12, 0.5, -0.2], [-0.66, 0.46, -0.22], 0.07, { k: 0.03, ...PA, clip: [[-1, 0, 0, 0.6]] }),
);
const VC = { beat: 3, col: 3, side: 0, reg: VCAVA };
P.push(
  mkC([-0.44, 0.3, 0.0], [-0.42, 0.92, 0.02], 0.1, { k: 0.05, ...VC, clip: [[0, 1, 0, 0.86]] }),
  mkC([-0.46, 0.0, -0.1], [-0.45, -0.5, -0.14], 0.1, { k: 0.05, ...VC, clip: [[0, -1, 0, 0.36]] }),
);
const PV = { beat: 3, col: 2, side: 1, reg: PVEIN };
P.push(
  mkC([-0.08, 0.34, -0.38], [-0.66, 0.37, -0.36], 0.05, { k: 0.035, ...PV, clip: [[-1, 0, 0, 0.58]] }),
  mkC([-0.08, 0.2, -0.38], [-0.66, 0.17, -0.37], 0.05, { k: 0.035, ...PV, clip: [[-1, 0, 0, 0.58]] }),
  mkC([0.32, 0.34, -0.32], [0.72, 0.37, -0.3], 0.05, { k: 0.035, ...PV, clip: [[1, 0, 0, 0.64]] }),
  mkC([0.32, 0.2, -0.32], [0.72, 0.16, -0.31], 0.05, { k: 0.035, ...PV, clip: [[1, 0, 0, 0.64]] }),
);

// The hollow insides, used when the heart is cut open. Three groups that never merge, so walls stay between them.
const CAV_R = [ // right heart: oxygen-poor
  mkE([-0.46, 0.16, -0.02], [0.185, 0.225, 0.195], { k: 0.05 }),                 // right atrium
  mkRC([-0.2, 0.04, 0.14], [0.13, -0.46, 0.19], 0.29, 0.06, { k: 0.06 }),        // right ventricle
  mkC([0.04, 0.08, 0.24], [0.15, 0.47, 0.1], 0.075, { k: 0.04 }),                 // pulmonary trunk
  mkC([0.15, 0.47, 0.08], [0.56, 0.52, -0.24], 0.045, { k: 0.02, clip: [[1, 0, 0, 0.56]] }),
  mkC([0.12, 0.48, 0.0], [-0.12, 0.5, -0.2], 0.042, { k: 0.02 }),
  mkC([-0.12, 0.5, -0.2], [-0.66, 0.46, -0.22], 0.042, { k: 0.02, clip: [[-1, 0, 0, 0.64]] }),
  mkC([-0.44, 0.3, 0.0], [-0.42, 0.92, 0.02], 0.065, { k: 0.04, clip: [[0, 1, 0, 0.9]] }),   // superior vena cava
  mkC([-0.46, 0.0, -0.1], [-0.45, -0.5, -0.14], 0.065, { k: 0.04, clip: [[0, -1, 0, 0.4]] }), // inferior vena cava
];
const CAV_L = [ // left heart: oxygen-rich
  mkE([0.12, 0.27, -0.3], [0.275, 0.155, 0.175], { k: 0.05 }),                   // left atrium
  mkRC([0.06, 0.0, -0.05], [0.28, -0.48, 0.04], 0.27, 0.04, { k: 0.06 }),        // left ventricle (thick wall)
  mkC([-0.06, 0.1, 0.02], [-0.08, 0.52, 0.03], 0.085, { k: 0.04 }),              // ascending aorta
  mkC([-0.08, 0.52, 0.03], [-0.04, 0.64, -0.03], 0.08, { k: 0.03 }),
  mkC([-0.04, 0.64, -0.03], [0.1, 0.68, -0.13], 0.077, { k: 0.03 }),
  mkC([0.1, 0.68, -0.13], [0.22, 0.6, -0.25], 0.077, { k: 0.03 }),
];
const CAV_D = [ // descending aorta, kept apart from the left atrium it runs behind
  mkC([0.25, 0.58, -0.27], [0.3, -0.1, -0.4], 0.075, { k: 0.03, clip: [[0, -1, 0, 0.09]] }),
];
const SEP = 0.045; // half the thickness of a wall between two groups (the septum)

function primDist(q, x, y, z) {
  let d;
  if (q.t === 0) {
    const X = (x - q.cx) / q.rx, Y = (y - q.cy) / q.ry, Z = (z - q.cz) / q.rz;
    const k0 = Math.sqrt(X * X + Y * Y + Z * Z);
    const X1 = X / q.rx, Y1 = Y / q.ry, Z1 = Z / q.rz;
    const k1 = Math.sqrt(X1 * X1 + Y1 * Y1 + Z1 * Z1);
    d = k1 > 1e-9 ? k0 * (k0 - 1) / k1 : -Math.min(q.rx, q.ry, q.rz);

    fb.textContent = q.near[reg] || `That is the ${REG_NAME[reg].toLowerCase()}. Try again.`;
  }
}
function finishQuiz() {
  quiz.done = true; U.uHiAmt.value = 0; tapMark = null;
  const n = quiz.first;
  $('q-n').textContent = 'Done'; $('q-q').textContent = `${n} of ${QUIZ.length} on the first try.`;
  const fb = $('q-fb'); fb.className = 'fb good';
  fb.textContent = n === QUIZ.length ? 'Perfect. You know your way around a heart.' : n >= 2 ? 'Nice work. Go again and see if you can get all four on the first tap.' : 'Good start. Steps 2 and 3 are worth another look, then try again.';
  $('q-ctrl').innerHTML = '<button class="chipbtn" id="q-again">Try again</button>' + (HOME ? `<a class="chipbtn" href="${HOME}">About this lesson</a>` : '');
  $('q-again').addEventListener('click', startQuiz);
}
let hiFade = 0;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
stage.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
stage.addEventListener('pointerup', (e) => {
  if (!downAt || STEPS[cur].id !== 'quiz' || !shell) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), dt = performance.now() - downAt.t; downAt = null;
  if (moved > 8 || dt > 600) return;
  const r = stage.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam); const hit = ray.intersectObject(shell, false)[0];
  if (!hit) { const fb = $('q-fb'); if (fb && !quiz.done) { fb.className = 'fb'; fb.textContent = 'Missed the heart. Tap right on it.'; } return; }
  const p = hit.point; answer(regionAt(p.x, p.y, p.z).reg, p.clone());
});

/* What the labels say in each step */
const LBL = {
  fb: { p: new THREE.Vector3(-0.42, 0.85, 0.02), text: 'From the body', color: '#58a6ff', s: 'r' },
  tl: { p: new THREE.Vector3(0.5, 0.52, -0.22), text: 'To the lungs', color: '#58a6ff', s: 'r' },
  fl: { p: new THREE.Vector3(0.64, 0.17, -0.31), text: 'From the lungs', color: '#ff5a68', s: 'l' },
  tb: { p: new THREE.Vector3(0.07, 0.9, -0.09), text: 'To the body', color: '#ff5a68', s: 'l' },
  rp: { p: new THREE.Vector3(-0.3, -0.12, 0.38), text: 'Right pump', color: '#58a6ff', s: 'r' },
  lp: { p: new THREE.Vector3(0.42, -0.32, 0.18), text: 'Left pump', color: '#ff5a68', s: 'l' },
};
function labelsFor(st) {
  if (st.id === 'pumps') return Object.values(LBL).filter(l => pumpMode === 'both' || (pumpMode === 'right') === (l.s === 'r'));
  if (st.id === 'drop') {
    const leg = DROP.leg, out = [{ p: new THREE.Vector3(0.93, 0.44, -0.34), text: 'Lungs', color: '#9cc9ff' }, { p: new THREE.Vector3(-0.27, 1.12, 0.03), text: 'Body', color: '#ffb0b8' }];
    if (leg && leg[3] !== 'Lungs' && leg[3] !== 'Body') out.push({ p: DROP.head.clone(), text: leg[3], color: leg[6] ? '#ff8a96' : '#7fbaff' });
    return out;
  }
  if (st.id === 'open' && openAnchors && cutSettled) {
    const A = openAnchors, out = [
      { p: A.ra, text: 'Right atrium', color: '#7fbaff' }, { p: A.rv, text: 'Right ventricle', color: '#7fbaff' },
      { p: A.la, text: 'Left atrium', color: '#ff8a96' }, { p: A.lv, text: 'Left ventricle', color: '#ff8a96' },
    ];
    if (A.lvWall) out.push({ p: A.lvWall.p, text: 'Thick wall', color: '#ffd08a' });
    if (A.rvWall) out.push({ p: A.rvWall.p, text: 'Thin wall', color: '#ffd08a' });
    if (A.sep) out.push({ p: A.sep.p, text: 'Septum', color: '#c9d3e6' });
    return out;
  }
  if (st.id === 'valves') { const [av, sl] = valveOpen(frac(phaseTot)); return VALVES.list.map(v => { const o = v.kind === 0 ? av : sl; return { p: v.p, text: v.name.replace(' valve', ''), color: o > 0.5 ? '#4ade80' : '#c9d3e6' }; }); }
  if (st.id === 'quiz' && tapMark) return [tapMark];
  return [];
}

/* ---------------------------------------------------------------
   9. The loop
   --------------------------------------------------------------- */
let last = performance.now(), frameTimes = [], frameNo = 0;
const dot = $('beat-dot');
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frameNo++;
  advance(dt * speed);
  const p = frac(phaseTot), [bv, ba, br] = beatAt(p);
  U.uBeat.value.set(bv, ba, br);
  if (!reduceMotion) dot.style.setProperty('--pulse', (1 + 0.45 * bv + 0.15 * ba).toFixed(3));
  const st = STEPS[cur];
  // camera
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.0); const e = sm(0, 1, tween.t), f = tween.from, t = tween.to;
    placeCam(f.az + (t.az - f.az) * e, f.el + (t.el - f.el) * e, f.dist + (t.dist - f.dist) * e);
    if (tween.t >= 1) tween = null;
  } else if (st.id === 'meet' && !userMoved && !reduceMotion) {
    const a = camAngles(); placeCam(0.32 + Math.sin(simT * 0.35) * 0.45, 0.06 + Math.sin(simT * 0.27) * 0.05, a.dist);
  }
  controls.update();
  keyLight.position.copy(cam.position).add(new THREE.Vector3(1.2, 1.6, 0.4));
  // the cut
  const want = cutTarget === CUT_SHUT ? CUT_SHUT : cutTarget;
  if (hollowReady) cutC += (want - cutC) * Math.min(1, dt * (want === CUT_SHUT ? 3.2 : 2.4));
  const cutVisible = hollowReady && cutC > CUT_SHUT + 0.02;
  if (hollow) { hollow.visible = capMesh.visible = cutVisible; }
  U.uCutOn.value = cutVisible ? 1 : 0; U.uCut.value.set(CUT_N.x, CUT_N.y, CUT_N.z, cutC);
  cutSettled = cutVisible && want !== CUT_SHUT && Math.abs(want - cutC) < 0.012;
  if (st.id === 'open') { U.uOpacity.value = cutVisible ? 1 - 0.55 * sm(CUT_SHUT, CUT_OPEN, cutC) : 1; if (cutSettled && (anchorsAt === null || Math.abs(anchorsAt - want) > 0.002)) computeOpenAnchors(want); }
  // glow the chambers that are squeezing, in the valves step
  U.uGlow.value.set(st.id === 'valves' ? bv : 0, st.id === 'valves' ? ba : 0);
  if (hiFade < 90 && U.uHiAmt.value > 0) { hiFade -= dt; if (hiFade <= 0) { U.uHiAmt.value = Math.max(0, U.uHiAmt.value - dt * 3); } }
  // moving parts
  BLOOD.step(dt * speed);
  if (st.id === 'drop') DROP.update();
  if (st.id === 'valves') { const [av, sl] = valveOpen(p); for (const v of VALVES.list) v.set(v.kind === 0 ? av : sl); updateValveUI(av, sl); }
  // draw
  const w = stage.clientWidth, h = stage.clientHeight, R = reserve();
  U.uPtScale.value = (h * PR) / (2 * TANH);
  const t0 = performance.now();
  renderer.render(scene, cam);
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, overlay.width, overlay.height); octx.setTransform(PR, 0, 0, PR, 0, 0);
  drawLabels(octx, labelsFor(st), w, h, R);
  drawECG(octx, R, w, h);
  adapt(dt);
  // background work: build the cut-open heart a slice at a time
  if (job) { const tEnd = performance.now() + 7; let r; do { r = job.next(); } while (!r.done && performance.now() < tEnd); if (r.done) { job = null; finishHollow(r.value); } }
  requestAnimationFrame(frame);
}
function adapt(dt) {
  frameTimes.push(dt); if (frameTimes.length < 90) return;
  const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length; frameTimes = [];
  if (avg > 0.026 && PR > 1) { PR = Math.max(1, PR - 0.5); resize(); }
}

/* ---------------------------------------------------------------
   10. Start
   --------------------------------------------------------------- */
['700 13px "Atkinson Hyperlegible"', '700 12px "JetBrains Mono"'].forEach(f => document.fonts && document.fonts.load(f).catch(() => {}));
requestAnimationFrame(() => setTimeout(() => {
  try { buildShell(); } catch (e) { statusEl.textContent = 'Could not build the heart on this device.'; console.error(e); return; }
  statusEl.remove();
  const m = /^#step-(\d)$/.exec(location.hash), start = m ? Math.min(STEPS.length, Math.max(1, +m[1])) - 1 : 0;
  cur = start; enterStep(start, true);
  resize(); goView(STEPS[cur], true); resize();
  window.addEventListener('hashchange', () => { const h = /^#step-(\d)$/.exec(location.hash); if (h) go(Math.min(STEPS.length, Math.max(1, +h[1])) - 1); });
  new ResizeObserver(resize).observe(stage);
  new ResizeObserver(resize).observe(panel);
  advance(3.6); marks.length = 0;
  job = hollowGen();
  window.__lesson = { shell: H, go: (i) => go(i), get step() { return STEPS[cur].id; }, get ready() { return hollowReady; }, setRate, answer,
    screen: (p) => toScreen(new THREE.Vector3(...project(p).p), stage.clientWidth, stage.clientHeight) };
  window.__heart = H;
  console.log('heart built', JSON.stringify(H));
  requestAnimationFrame((t) => { last = t; frame(t); });
}, 30));
