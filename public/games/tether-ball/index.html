        S.hdx = cx; S.hdy = cy; rlo = lo2 = k; S.spn = 0; // a new swing starts from rest again
        if (swallow) { swallow = false; sid = ++sidSeq; isFirst = true; } // re-armed
      } else if (!swallow) { // follow a curving swipe, so only a real turn trips the test (after a hit the heading stays at the hit's)
        const bx = S.hdx + (cx - S.hdx) * 0.25, by = S.hdy + (cy - S.hdy) * 0.25, bl = Math.sqrt(bx * bx + by * by);
        S.hdx = bx / bl; S.hdy = by / bl;
      }
    }

    // Smoothed velocity: the chord over the window (Vw). That reads the finger's average over the last 50 ms, which lags a swipe
    // that is still speeding up (by ~15 % at the peak of a typical 120 ms swipe, by a third early in one). If the speed changes
    // linearly, Vw + (V1 − V0) is exactly the speed at the newest sample, V1 and V0 being the chords over the window's recent
    // and older halves. It is never allowed above the newest single pair, so noise cannot invent speed, and a stop reads as a stop.
    const W = C.windowMs;
    let j = i - 1, j1 = i - 1;
    while (j > lo2 && t - rtm[(j - 1) & RM] <= W) j--;
    while (j1 > j && t - rtm[(j1 - 1) & RM] <= W * 0.5) j1--;
    let dw = t - rtm[j & RM];
    if (dw < MIN_DT) dw = MIN_DT;
    let vx = (x - rx[j & RM]) * 1000 / dw, vy = (y - ry[j & RM]) * 1000 / dw;
    if (j1 > j && C.lead > 0) {
      let d1 = t - rtm[j1 & RM], d0 = rtm[j1 & RM] - rtm[j & RM];
      if (d1 < MIN_DT) d1 = MIN_DT;
      if (d0 < MIN_DT) d0 = MIN_DT;
      let wx = vx + C.lead * ((x - rx[j1 & RM]) * 1000 / d1 - (rx[j1 & RM] - rx[j & RM]) * 1000 / d0);
      let wy = vy + C.lead * ((y - ry[j1 & RM]) * 1000 / d1 - (ry[j1 & RM] - ry[j & RM]) * 1000 / d0);
      if (wx * vx + wy * vy <= 0) { wx = 0; wy = 0; } // it came to a stop
      else {
        let dp = t - ot;
        if (dp < MIN_DT) dp = MIN_DT;
        const px = (x - ox) * 1000 / dp, py = (y - oy) * 1000 / dp, mp = Math.sqrt(px * px + py * py), mw = Math.sqrt(wx * wx + wy * wy);
        if (mw > mp && mw > Math.sqrt(vx * vx + vy * vy)) { wx *= mp / mw; wy *= mp / mw; }
      }
      vx = wx; vy = wy;
    }

    // still speeding up? Against the speed two samples back (a rise inside the noise is not one), and not already easing off. A swing's
    // first samples have nothing to compare with and count as rising: a stroke begins at rest.
    const sp = Math.sqrt(vx * vx + vy * vy);
    S.rising = S.spn < 2 || (sp > S.sp2 * 1.1 && sp >= S.sp1);
    S.sp2 = S.sp1; S.sp1 = sp; S.spn++;

    // the trail, thinned to a point every few ms so a 1 kHz mouse does not flood it (poll() flushes the newest sample)
    S.pendX = x; S.pendY = y; S.pendT = t;
    if (t - S.tlast >= 5) { bridge(); putTrail(); } else pendSet = true;

    if (swallow) return;
    let s;
    if (nseg < PN) {
      s = pool[nseg]; segments[nseg++] = s;
      s.x0 = ox; s.y0 = oy; s.t0 = ot; s.stroke = sid; s.first = isFirst; s.spent = false;
    } else s = pool[PN - 1]; // a stall delivered more than a pool of segments: fold the rest into the last one
    s.x1 = x; s.y1 = y; s.t1 = t; s.vxPx = vx; s.vyPx = vy; s.speedPx = sp; s.rising = S.rising;
    isFirst = false;
  }

  function poll(now) {
    if (!(now >= 0)) now = performance.now();
    nseg = 0;
    while (qn > 0) {
      const q = qh, k = qk[q];
      qh = (qh + 1) % QN; qn--;
      if (k === DOWN) begin(q);
      else if (k === MOVE) { if (open) move(q); else begin(q); }
      else open = false;
    }
    // the array's length is the count; V8 frees an array's storage when its length is set to 0, so only touch it when it changes
    if (segments.length !== nseg) segments.length = nseg;
    if (pendSet) { bridge(); putTrail(); }
    const ttl = CFG.input.trailMs;
    while (tn > 0 && now - tpool[th].t > ttl) { th = (th + 1) % TN; tn--; }
    if (open && (tn === 0 || now - tpool[(th + tn - 1) % TN].t > 24)) { // a finger holding still keeps its point
      const o = (rn - 1) & RM;
      S.pendX = rx[o]; S.pendY = ry[o]; S.pendT = now; putTrail();
    }
    // oldest first, ages falling toward the finger. Stamps can disagree with the frame clock by a few ms, so ages are clamped to
    // never rise and anything past its time to live (a stamp that lags the frame clock) is skipped
    let m = 0, prev = ttl;
    for (let n = 0; n < tn; n++) {
      const p = tpool[(th + n) % TN];
      let a = now > p.t ? now - p.t : 0;
      if (a > ttl) continue;
      if (a > prev) a = prev;
      p.age = a; prev = a; trail[m++] = p;
    }
    if (trail.length !== m) trail.length = m;
  }

  // ---- screen → world ----
  const probe = { x: 0, y: 0, z: 0 };
  const spare = { p0: { x: 0, y: 0, z: 0 }, p1: { x: 0, y: 0, z: 0 }, vx: 0, vz: 0, speed: 0, r: 0, stroke: 0, owner: 'you' };

  function toHand(seg, planeY, out) {
    if (!seg || seg.spent) return null;
    const h = out || spare;
    if (!h.p0) h.p0 = { x: 0, y: 0, z: 0 };
    if (!h.p1) h.p1 = { x: 0, y: 0, z: 0 };
    if (!cam.unproject(seg.x0, seg.y0, planeY, h.p0) || !cam.unproject(seg.x1, seg.y1, planeY, h.p1)) return null;
    // world velocity = the end point minus a point one short step back along the smoothed screen velocity. The step is kept
    // under ~12 px so perspective stays local, and cam.unproject keeps zoom, shake and roll honest.
    const sp = seg.speedPx, db = sp * BACK_S > BACK_PX ? BACK_PX / sp : BACK_S;
    const c = cam.unproject(seg.x1 - seg.vxPx * db, seg.y1 - seg.vyPx * db, planeY, probe);
    if (!c) return null;
    const g = CFG.input.gain, H = CFG.hit;
    h.vx = (h.p1.x - c.x) / db * g; h.vz = (h.p1.z - c.z) / db * g;
    h.speed = Math.sqrt(h.vx * h.vx + h.vz * h.vz);
    h.r = Math.max(H && H.handR > 0 ? H.handR : 0.26, cam.pxPerM > 0 ? (H && H.minReachPx > 0 ? H.minReachPx : 28) / cam.pxPerM : 0);
    h.stroke = seg.stroke; h.owner = 'you';
    return h;
  }

  // Should main wait before offering this segment to the physics? Only for a stroke that BEGAN on the ball (its first segment starts
  // within reach), is still weak and still speeding up, and whose finger is still in reach at the segment's end (so the next segment,
  // which starts there, can still touch). The wait is stroke time from the first held segment, at most holdMs, and only while the ball
  // cannot drift out of reach meanwhile. Call it for every segment in order, with the hand toHand() made of it and the world's ball.
  function within(p, ball, r) { const dx = p.x - ball.p.x, dz = p.z - ball.p.z, rs = ball.r + r; return dx * dx + dz * dz <= rs * rs; }

  function shouldHold(seg, hand, ball) {
    const C = CFG.input;
    if (!seg || !hand || !ball || !(C.holdMs > 0)) return false;
    if (seg.first) { S.onStroke = seg.stroke; S.onBall = within(hand.p0, ball, hand.r); }
    if (!S.onBall || S.onStroke !== seg.stroke || !seg.rising || !(hand.speed < C.holdBelow)) return false;
    if (ball.speed * C.holdMs * 0.001 > 0.3 * (ball.r + hand.r) || !within(hand.p1, ball, hand.r)) return false;
    if (S.heldStroke !== seg.stroke) { S.heldStroke = seg.stroke; S.heldFrom = seg.t0; }
    return seg.t1 - S.heldFrom < C.holdMs;
  }

  // after a hit: this stroke is spent, here and in whatever of its segments are still waiting in this poll
  function consumeStroke(id) {
    for (let i = 0; i < nseg; i++) if (pool[i].stroke === id) pool[i].spent = true;
    if (open && id === sid) swallow = true;
  }

  // ---- wiring ----
  const wires = [
    ['pointerdown', onDown], ['pointermove', onMove], ['pointerup', onUp], ['pointercancel', onCancel], ['lostpointercapture', onCancel],
    ['contextmenu', (e) => e.preventDefault()], // an Android long-press would otherwise cancel the stroke
  ];
  if (canvas.style) canvas.style.touchAction = 'none'; // the CSS says so too; without it the browser steals swipes to scroll
  for (let i = 0; i < wires.length; i++) canvas.addEventListener(wires[i][0], wires[i][1]);

  function dispose() {
    for (let i = 0; i < wires.length; i++) canvas.removeEventListener(wires[i][0], wires[i][1]);
    if (pid !== -1) { try { canvas.releasePointerCapture(pid); } catch (err) { /* gone already */ } }
    pid = -1; down = false; qn = 0; open = false; nseg = 0; tn = 0; pendSet = false;
    segments.length = 0; trail.length = 0; gestures.length = 0;
  }

  return { segments, trail, poll, toHand, shouldHold, consumeStroke, onGesture(fn) { if (typeof fn === 'function') gestures.push(fn); }, dispose, get active() { return down; } };
}

// ════════ game.js ════════
// game.js — the solo rules: wind the rope all the way up the pole as fast as you can; the best time is kept.
//
// Rules only: no physics and no DOM. It consumes HitResults and world events, so swapping the rules (or adding an
// opponent that winds the other way) never touches physics.js. The one outside thing it touches is localStorage,
// inside try/catch, so a private window or a blocked store just means the best time lives for the session.

CFG.game = {
  startPower: 0.1, // the first hit at least this strong starts the clock (a brush against the ball does not)
};

function createGame() {
  const KEY = 'tetherball.best';
  const snap = { state: 'ready', timeMs: 0, hits: 0, topMph: 0, turns: 0, turnsGoal: 1, best: null, newBest: false, mode: 'solo' };
  const players = [{ id: 'you', side: 1 }]; // side: which way along φ this player winds (solo: both ways count)
  let best = readBest();
  let fresh = false; // the clock just started: the frame it started in was spent before the hit, so it is not counted

  function readBest() {
    try { const v = parseFloat(localStorage.getItem(KEY)); return v > 0 && isFinite(v) ? v : null; } catch (e) { return null; }
  }
  function writeBest(ms) {
    try { localStorage.setItem(KEY, String(Math.round(ms))); } catch (e) { /* storage blocked: best stays in memory */ }
  }

  // turns at which physics calls the rope wound: the free rope (tie → ball centre) is down to what clears ball + pole,
  // sqrt(r² + 2·R·r), plus physics' woundMargin, and each turn eats 2π·poleR. Matching it keeps the bar from stalling short.
  function goal() {
    const W = CFG.world, P = CFG.physics;
    const need = Math.sqrt(W.ballR * W.ballR + 2 * W.poleR * W.ballR) + (P && P.woundMargin > 0 ? P.woundMargin : 0);
    const g = (W.ropeL - need) / (2 * Math.PI * W.poleR);
    return g > 0 && isFinite(g) ? g : 1;
  }

  function reset() {
    snap.state = 'ready'; snap.timeMs = 0; snap.hits = 0; snap.topMph = 0; snap.turns = 0;
    snap.turnsGoal = goal(); snap.best = best; snap.newBest = false;
    fresh = false;
  }

  function onHit(res) {
    if (!res || snap.state === 'wound') return;
    if (snap.state === 'ready') {
      if (!(res.power >= CFG.game.startPower)) return;
      snap.state = 'playing'; snap.timeMs = 0; fresh = true;
    }
    snap.hits++;
    const mph = U.mph(res.speedAfter);
    if (mph > snap.topMph) snap.topMph = mph;
  }

  function onEvent(ev) {
    if (!ev || ev.type !== 'wound' || snap.state !== 'playing') return;
    snap.state = 'wound';
    snap.timeMs = Math.round(snap.timeMs);
    snap.turnsGoal = goal();
    snap.turns = snap.turnsGoal; // wound means full: don't show 6.2 / 6.4 on the result card
    snap.newBest = best === null || snap.timeMs < best;
    if (snap.newBest) { best = snap.timeMs; writeBest(best); }
    snap.best = best;
  }

  // realDt: the player's stopwatch runs on real time, through every freeze and slow-mo
  function update(realDt, world) {
    snap.turnsGoal = goal();
    if (snap.state === 'playing') {
      if (realDt > 0 && isFinite(realDt)) { if (fresh) fresh = false; else snap.timeMs += realDt * 1000; }
      if (world && world.ball) { const mph = U.mph(world.ball.speed); if (mph > snap.topMph) snap.topMph = mph; }
    }
    if (snap.state !== 'wound' && world && world.rope && world.rope.turns >= 0) snap.turns = Math.min(world.rope.turns, snap.turnsGoal);
  }

  reset();
  return { mode: 'solo', players, snap, get state() { return snap.state; }, onHit, onEvent, update, reset };
}

// ════════ ui.js ════════
// ui.js — everything in the DOM: the HUD numbers, the round card, the bottom hint and the Feel panel.
//
// The markup lives in shell.html (ids below) and the look in style.css; this file binds to them and keeps them current.
// HUD text is written only when the number it shows changes (last-value cache per field), so a steady frame costs a
// handful of compares and no allocation. The canvas owns every swipe: only the HUD buttons take the pointer (CSS).
//
// The Feel panel persists only the numbers you moved off their defaults, so retuning a default in code reaches every
// slider you never touched instead of being masked by a stale snapshot. Copy/Paste speak the full snapshot.

CFG.ui = {
  ease: 18, // 1/s: how fast the big mph number chases the ball as it speeds up (it settles down at 30 % of this)
  pop: 0.3, // how far the number swells on a hit (0.3 = +30 %)
  resultArmMs: 450, // taps on the round card are ignored this long after it appears, so a finishing swipe cannot dismiss it
};
CFG_SCHEMA.push(
  { path: 'ui.pop', label: 'Speed number pop', min: 0, max: 0.8, step: 0.02, group: 'HUD', unit: '' },
  { path: 'ui.ease', label: 'Speed number chase', min: 4, max: 40, step: 1, group: 'HUD', unit: '1/s' }
);

function createUI(root, opts) {
  opts = opts || {};
  const $ = (id) => root.querySelector('#' + id);
  const doc = root.ownerDocument;
  const hud = $('hud'), speedEl = $('hSpeed'), hitsEl = $('hHits'), barEl = $('hBar'), barWrap = barEl.parentNode;
  const resultEl = $('result'), hintEl = $('hint'), soundBtn = $('bSound'), gearBtn = $('bFeel');

  // A text field that rewrites its node only when its key changes. Callers pass a small integer key (the value already
  // quantised to what is shown), so an unchanged frame neither formats a string nor touches the DOM.
  function field(id, fmt) {
    const e = $(id);
    if (!e.firstChild) e.appendChild(doc.createTextNode(''));
    const node = e.firstChild;
    let last = NaN;
    return (k) => { if (k !== last) { last = k; node.data = fmt(k); } };
  }
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const clock = (cs) => Math.floor(cs / 6000) + ':' + pad2(Math.floor(cs / 100) % 60) + '.' + pad2(cs % 100);
  const setSpeed = field('hSpeed', String), setHits = field('hHits', String), setTime = field('hTime', clock);
  const setTurns = field('hTurns', (k) => (k / 10).toFixed(1)), setGoal = field('hGoal', (k) => (k / 10).toFixed(1));

  // ───────────── HUD ─────────────
  let shown = 0, lastHits = 0, heat = -1, barQ = -1, tickQ = -1, state = '';

  // a hit: the number swells and flashes white-hot, then settles (the counter follows at half strength)
  function pop() {
    const k = CFG.ui.pop;
    if (!(k > 0) || !speedEl.animate) return;
    const kick = (e, m) => e.animate([{ transform: 'scale(' + (1 + k * m) + ')', filter: 'brightness(' + (1 + m) + ')' }, { transform: 'scale(1)', filter: 'brightness(1)' }], { duration: 340, easing: 'cubic-bezier(.2,1.6,.4,1)' });
    kick(speedEl, 1);
    kick(hitsEl, 0.5);
  }

  function update(snap, dt) {
    if (!snap) return;
    const w = opts.getWorld ? opts.getWorld() : null;
    const target = w && w.ball ? U.mph(w.ball.speed) : 0;
    // the number chases the ball fast on the way up (it revs with the hit) and settles slower on the way down
    shown = U.damp(shown, target, target > shown ? CFG.ui.ease : CFG.ui.ease * 0.3, dt > 0 ? dt : 0);
    setSpeed(shown < 1.5 ? 0 : Math.round(shown)); // a hanging ball's last few cm/s are not a speed
    const f = shown / U.mph((CFG.hit && CFG.hit.vMax) || 17);
    const h = f < 0.3 ? 0 : f < 0.55 ? 1 : f < 0.8 ? 2 : f < 0.95 ? 3 : 4;
    if (h !== heat) { heat = h; speedEl.setAttribute('data-heat', h); }

    if (snap.state !== state) { state = snap.state; hud.setAttribute('data-state', state); }
    const goal = snap.turnsGoal > 0 ? snap.turnsGoal : 1, turns = snap.turns > 0 ? snap.turns : 0;
    setTurns(Math.round(turns * 10));
    setGoal(Math.round(goal * 10));
    setTime(snap.timeMs > 0 ? Math.floor(snap.timeMs / 10) : 0);
    setHits(snap.hits | 0);
    const bq = Math.round(U.clamp01(turns / goal) * 500);
    if (bq !== barQ) { barQ = bq; barEl.style.transform = 'scaleX(' + bq / 500 + ')'; }
    const tq = Math.round(goal * 10);
    if (tq !== tickQ) { tickQ = tq; barWrap.style.setProperty('--tick', 1000 / tq + '%'); }

    if (snap.hits !== lastHits) { if (snap.hits > lastHits) pop(); lastHits = snap.hits; }
  }

  function hint(text) {
    if (text) { $('hintText').textContent = text; hintEl.classList.add('on'); } else hintEl.classList.remove('on');
  }

  function setMuted(m) {
    soundBtn.classList.toggle('muted', !!m);
    soundBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  }
  soundBtn.addEventListener('click', () => {
    const r = opts.onMuteToggle ? opts.onMuteToggle() : undefined;
    setMuted(typeof r === 'boolean' ? r : !!(opts.audio && opts.audio.muted));
  });
  setMuted(!!(opts.audio && opts.audio.muted));
  $('bReset').addEventListener('click', () => { hideResult(); if (opts.onReset) opts.onReset(); });
  gearBtn.addEventListener('click', () => tuner.toggle());

  // ───────────── round card ─────────────
  let armedAt = 0;
  const secs = (ms) => (ms / 1000).toFixed(2) + 's';
  // a rope this slow reads better as m:ss.cc than as 94.20s
  const span = (ms) => (ms >= 60000 ? clock(Math.floor(ms / 10)) : secs(ms));

  function showResult(s) {
    if (!s) return;
    const ms = Math.max(0, s.timeMs), slow = ms >= 60000;
    $('rTime').textContent = slow ? clock(Math.floor(ms / 10)) : (ms / 1000).toFixed(2);
    $('rUnit').hidden = slow;
    $('rHits').textContent = s.hits;
    $('rTop').textContent = Math.round(s.topMph);
    $('rBest').textContent = s.best > 0 ? span(s.best) : '-';
    $('rNew').hidden = !s.newBest;
    $('rDelta').textContent = !s.newBest && s.best > 0 ? '+' + secs(ms - s.best) + ' off your best' : '';
    armedAt = performance.now() + CFG.ui.resultArmMs;
    resultEl.classList.add('on');
    resultEl.setAttribute('aria-hidden', 'false');
    try { $('rAgain').focus({ preventScroll: true }); } catch (e) { /* nothing to focus */ }
  }
  function hideResult() { resultEl.classList.remove('on'); resultEl.setAttribute('aria-hidden', 'true'); }
  // the whole overlay is the button: a tap anywhere (Go again included, it bubbles) starts the next round
  resultEl.addEventListener('click', () => {
    if (!resultEl.classList.contains('on') || performance.now() < armedAt) return;
    hideResult();
    if (opts.onReset) opts.onReset();
  });

  // ───────────── Feel panel ─────────────
  const tuner = (function () {
    const FEEL = 'tetherball.feel.v1', GROUPS = 'tetherball.feel.groups.v1';
    const panel = $('panel'), listEl = $('feelGroups'), body = $('feelBody');
    const ioWrap = $('feelIOWrap'), ta = $('feelIO'), ioHint = $('feelIOHint'), applyBtn = $('feelApply'), toastEl = $('feelToast');
    const RESET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.3-5.4"/><path d="M19.8 4.2v4.6h-4.6"/></svg>';
    const rows = [], badges = {}, known = new Set();
    let built = -1, saveT = 0, toastT = 0;

    const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private window: tuning lasts the session */ } };
    const parse = (s) => { try { const o = JSON.parse(s); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; } };
    function dflt(path) {
      let o = CFG_DEFAULT;
      const ks = path.split('.');
      for (let i = 0; i < ks.length; i++) o = o && o[ks[i]];
      return typeof o === 'number' ? o : undefined;
    }
    const moved = (path, v) => { const d = dflt(path); return d !== undefined && Math.abs(v - d) > 1e-9 * Math.max(1, Math.abs(d)); };

    // only what differs from the defaults is stored (see the header comment)
    function save() {
      clearTimeout(saveT);
      const snap = cfgSnapshotTuned(), out = {};
      let n = 0;
      for (const p in snap) if (typeof snap[p] === 'number' && (dflt(p) === undefined || moved(p, snap[p]))) { out[p] = snap[p]; n++; }
      lsSet(FEEL, n ? JSON.stringify(out) : null);
    }
    const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 160); };

    // schema entries can arrive after createUI (a module loaded later): they get their saved value when first seen
    function adopt() {
      const saved = parse(lsGet(FEEL));
      for (let i = 0; i < CFG_SCHEMA.length; i++) {
        const p = CFG_SCHEMA[i].path;
        if (known.has(p)) continue;
        known.add(p);
        if (saved && typeof saved[p] === 'number') { const one = {}; one[p] = saved[p]; cfgApplyTuned(one); }
      }
    }

    const el = (tag, cls) => { const e = doc.createElement(tag); if (cls) e.className = cls; return e; };
    const decimals = (s) => { const d = String(s.step).split('.')[1]; return d ? d.length : 0; };

    function paint(r, dragging) {
      const v = cfgGet(r.s.path), num = typeof v === 'number' && isFinite(v) ? v : r.s.min;
      if (!dragging) r.inp.value = String(num);
      r.inp.style.setProperty('--f', String(U.clamp01((num - r.s.min) / (r.s.max - r.s.min || 1))));
      r.num.data = num.toFixed(r.dec);
      r.row.classList.toggle('chg', moved(r.s.path, num));
    }
    function badge() {
      const count = {};
      for (let i = 0; i < rows.length; i++) if (rows[i].row.classList.contains('chg')) count[rows[i].g] = (count[rows[i].g] || 0) + 1;
      for (const g in badges) { badges[g].textContent = count[g] || ''; badges[g].hidden = !count[g]; }
    }
    function paintAll() { for (let i = 0; i < rows.length; i++) paint(rows[i], false); badge(); }

    // A touch on a slider must never move it while the list is being scrolled. The native input stays for the look, the
    // keyboard and the step grid, but its wrapper takes the pointer: a horizontal drag moves it (relative to where the
    // finger landed), a short tap jumps to that spot, and a vertical pan is the browser's (pointercancel) and leaves it be.
    function dragWire(sl, inp, s) {
      let id = -1, x0 = 0, y0 = 0, t0 = 0, v0 = 0, drag = false;
      const reach = () => Math.max(1, sl.clientWidth - 26); // the thumb's travel: its centre runs 13 px in from each end
      const put = (v) => { inp.value = String(U.clamp(v, s.min, s.max)); inp.dispatchEvent(new Event('input', { bubbles: true })); };
      sl.addEventListener('pointerdown', (e) => { if (id >= 0 || e.button) return; id = e.pointerId; x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp; drag = false; });
      sl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== id) return;
        if (!drag) {
          const dx = e.clientX - x0;
          if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(e.clientY - y0)) return;
          drag = true; x0 = e.clientX; v0 = cfgGet(s.path);
          sl.classList.add('held');
          try { sl.setPointerCapture(id); } catch (err) { /* a synthetic pointer: moves still arrive */ }
        }
        put(v0 + (e.clientX - x0) / reach() * (s.max - s.min));
      });
      const end = (e) => {
        if (e.pointerId !== id) return;
        const tap = !drag && e.type === 'pointerup' && e.timeStamp - t0 < 400;
        if (tap) put(s.min + U.clamp01((e.clientX - sl.getBoundingClientRect().left - 13) / reach()) * (s.max - s.min));
        if (tap || drag) inp.dispatchEvent(new Event('change', { bubbles: true }));
        id = -1; drag = false; sl.classList.remove('held');
      };
      sl.addEventListener('pointerup', end);
      sl.addEventListener('pointercancel', end);
    }

    function makeRow(s) {
      const r = { s, g: s.group || 'Other', dec: decimals(s), row: el('div', 'row'), num: doc.createTextNode('') };
      const id = 'f-' + s.path.replace(/\W/g, '-');
      const lab = el('label', 'lab'); lab.htmlFor = id; lab.textContent = s.label;
      const val = el('output', 'val'); val.htmlFor = id; val.appendChild(r.num);
      if (s.unit) { const u = el('small'); u.textContent = s.unit; val.appendChild(u); }
      const rst = el('button', 'rst'); rst.type = 'button'; rst.setAttribute('aria-label', 'Reset ' + s.label); rst.innerHTML = RESET_SVG;
      const sl = el('div', 'sl'), inp = r.inp = el('input'); inp.type = 'range'; inp.id = id; inp.min = s.min; inp.max = s.max; inp.step = s.step;
      sl.appendChild(inp);
      dragWire(sl, inp, s);
      inp.addEventListener('input', () => { cfgSet(s.path, +(+inp.value).toFixed(r.dec)); paint(r, true); badge(); saveSoon(); });
      inp.addEventListener('change', save);
      rst.addEventListener('click', () => { const d = dflt(s.path); if (d !== undefined) { cfgSet(s.path, d); paint(r, false); badge(); save(); } });
      r.row.append(lab, rst, val, sl);
      return r;
    }

    function openGroups() { try { const a = JSON.parse(lsGet(GROUPS)); return Array.isArray(a) ? a : null; } catch (e) { return null; } }
    function saveGroups() {
      const open = [];
      for (let i = 0; i < listEl.children.length; i++) if (listEl.children[i].open) open.push(listEl.children[i].dataset.g);
      lsSet(GROUPS, JSON.stringify(open));
    }
    function build() {
      listEl.textContent = ''; rows.length = 0;
      for (const g in badges) delete badges[g];
      const byGroup = new Map(), remembered = openGroups();
      for (let i = 0; i < CFG_SCHEMA.length; i++) {
        const g = CFG_SCHEMA[i].group || 'Other';
        if (!byGroup.has(g)) byGroup.set(g, []);
        byGroup.get(g).push(CFG_SCHEMA[i]);
      }
      let first = true;
      byGroup.forEach((items, name) => {
        const d = el('details', 'grp'), sum = el('summary'), n = badges[name] = el('span', 'n');
        d.dataset.g = name;
        d.open = remembered ? remembered.indexOf(name) >= 0 : first;
        first = false;
        sum.append(doc.createTextNode(name), n);
        d.appendChild(sum);
        for (let i = 0; i < items.length; i++) { const r = makeRow(items[i]); rows.push(r); d.appendChild(r.row); }
        d.addEventListener('toggle', saveGroups);
        listEl.appendChild(d);
      });
      built = CFG_SCHEMA.length;
    }

    // ---- toast and the copy / paste box ----
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('on');
      clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1800);
    }
    function showIO(mode, text, hintText) {
      ta.readOnly = mode === 'copy'; ta.value = text; ta.placeholder = mode === 'paste' ? '{ "hit.vMax": 17, ... }' : '';
      ioHint.textContent = hintText; ioHint.classList.remove('err');
      applyBtn.hidden = mode === 'copy';
      ioWrap.hidden = false; body.scrollTop = 0;
      ta.focus({ preventScroll: true });
      if (mode === 'copy') { ta.select(); ta.setSelectionRange(0, text.length); }
    }
    function ioError(msg) { ioHint.textContent = msg; ioHint.classList.add('err'); }

    // The async clipboard when allowed; otherwise the JSON in a readonly box, selected, with a last try at execCommand.
    function copy() {
      const text = JSON.stringify(cfgSnapshotTuned(), null, 2);
      let p;
      try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard')); } catch (e) { p = Promise.reject(e); }
      return p.then(() => { ioWrap.hidden = true; toast('Settings copied'); return 'clipboard'; }, () => {
        showIO('copy', text, 'Clipboard blocked. Copy the selected text:');
        let ok = false;
        try { ok = doc.execCommand('copy'); } catch (e) { /* manual copy it is */ }
        if (ok) { ioHint.textContent = 'Copied. The text is below too.'; toast('Settings copied'); }
        return 'textarea';
      });
    }

    // Applies a pasted snapshot (clamped by cfgApplyTuned). Returns how many values it set, or -1 when it is not settings JSON.
    function paste(text) {
      const o = parse(text);
      if (!o) return -1;
      let n = 0;
      for (let i = 0; i < CFG_SCHEMA.length; i++) { const v = o[CFG_SCHEMA[i].path]; if (typeof v === 'number' && isFinite(v)) n++; }
      cfgApplyTuned(o);
      paintAll(); save();
      return n;
    }
    function applyPasted() {
      const n = paste(ta.value);
      if (n < 0) return ioError('That is not settings JSON.');
      if (n === 0) return ioError('No matching settings in that text.');
      ioWrap.hidden = true; toast('Applied ' + n + (n === 1 ? ' value' : ' values'));
    }

    function reset() { cfgResetTuned(); lsSet(FEEL, null); paintAll(); toast('Reset to defaults'); }

    function isOpen() { return panel.classList.contains('open'); }
    function open() {
      adopt();
      if (built !== CFG_SCHEMA.length) build();
      paintAll();
      panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); gearBtn.setAttribute('aria-expanded', 'true');
    }
    function close() {
      save();
      panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); gearBtn.setAttribute('aria-expanded', 'false');
    }
    const toggle = () => (isOpen() ? close() : open());

    $('feelClose').addEventListener('click', close);
    $('feelCopy').addEventListener('click', copy);
    $('feelPaste').addEventListener('click', () => showIO('paste', '', 'Paste settings JSON, then tap Apply.'));
    $('feelReset').addEventListener('click', reset);
    $('feelDone').addEventListener('click', () => { ioWrap.hidden = true; });
    applyBtn.addEventListener('click', applyPasted);
    ta.addEventListener('paste', () => setTimeout(() => { if (!ta.readOnly && parse(ta.value)) applyPasted(); }, 0));
    // typing JSON must not reach the page's own hotkeys (main.js resets the round on "r")
    ta.addEventListener('keydown', (e) => { if (e.key !== 'Escape') e.stopPropagation(); });
    doc.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) { close(); gearBtn.focus(); } });
    window.addEventListener('pagehide', save);

    // Saved numbers take effect now: createUI runs after every module has declared its section. The defaults must be
    // frozen first or "reset" and "changed" have nothing to compare with (main.js already does it; this covers a bare page).
    if (!CFG_DEFAULT) cfgFreezeDefaults();
    adopt();

    return { open, close, toggle, isOpen, copy, paste, reset, save };
  })();

  return { update, showResult, hideResult, hint, setMuted, tuner };
}

// ════════ main.js ════════
// main.js — the loop. REAL time drives input, FX, the camera and the HUD; SIM time (real × time-warp scale)
// drives the physics. A freeze is scale 0, so the world holds perfectly still while the impact animates; slow-mo
// is smooth because advance() substeps the already-scaled dt.
(function boot() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const cam = createCamera();
  const world = createWorld();
  const tw = createTimeWarp();
  const fx = createFX();
  const scene = createScene(canvas);
  const input = createTouchInput(canvas, cam);
  const game = createGame();
  const audio = createAudio();
  cfgFreezeDefaults(); // every module has declared its CFG section by now
  const ui = createUI(document.getElementById('app') || document.body, {
    game,
    getWorld: () => world,
    onReset: resetAll,
    onMuteToggle: () => { audio.unlock(); audio.setMuted(!audio.muted); return audio.muted; },
    audio,
  });
  input.onGesture(() => audio.unlock());

  // ---- size ----
  let quality = 1; // the governor steps this 1 → .75 → .5 only if the main thread is genuinely slow
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const vv = window.visualViewport;
    const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth)), h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    const cs = getComputedStyle(probe);
    const inset = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const short = h < 520;
    const safe = { top: (short ? 48 : 88) + inset.t, bottom: (short ? 28 : 64) + inset.b, left: 10 + inset.l, right: 10 + inset.r };
    cam.resize(w, h, Math.min(window.devicePixelRatio || 1, 2) * quality, safe);
    scene.resize(w, h, Math.min(window.devicePixelRatio || 1, 2) * quality);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---- state ----
  let lastHitAt = -1e9, woundAt = -1, resultShown = false, prevPhase = 'idle';
  const handBuf = { p0: { x: 0, y: 0, z: 0 }, p1: { x: 0, y: 0, z: 0 }, vx: 0, vz: 0, speed: 0, r: 0.26, stroke: 0, owner: 'you' };
  const view = { fx, input, time: tw, now: 0 };
  const ballScr = { x: 0, y: 0, s: 0, d: 0 };
  const tick = { speed01: 0, pan: 0, timeScale: 1 };

  function resetAll() {
    resetWorld(world);
    tw.cancel();
    fx.reset();
    game.reset();
    ui.hideResult();
    ui.hint('Swipe the ball');
    resultShown = false; woundAt = -1; lastHitAt = -1e9; prevPhase = 'idle';
  }

  // ---- a hit, from any source (touch now; a CPU or a peer later) ----
  function tryHit(hand, now) {
    if (world.state !== 'live' || !tw.canHit() || now - lastHitAt < CFG.hit.cooldownMs) return null;
    const res = applyHit(world, hand);
    if (!res) return null;
    lastHitAt = now;
    game.onHit(res);
    tw.trigger(res.power, res.quality);
    fx.impact(res, cam, world);
    audio.hit(res);
    audio.vibrate(res.power > 0.7 ? [20, 30, 35] : res.power > 0.25 ? [12] : null);
    ui.hint(null);
    return res;
  }

  function pumpInput(now) {
    input.poll(now);
    const segs = input.segments;
    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      if (world.state !== 'live' || !tw.canHit()) continue; // swipes during the freeze are swallowed: no double hit on the follow-through
      const hand = input.toHand(seg, world.ball.p.y, handBuf);
      if (!hand) continue;
      hand.owner = 'you';
      if (input.shouldHold(seg, hand, world.ball)) continue; // a finger that landed ON the ball: its first contact is the slowest part of the swipe, so wait ~2 frames for the peak
      if (tryHit(hand, now)) input.consumeStroke(seg.stroke);
    }
  }

  function onEvents(now) {
    const evs = drainEvents(world);
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      fx.event(ev, cam, world);
      game.onEvent(ev);
      if (ev.type === 'snap') audio.snap(ev.strength);
      else if (ev.type === 'ground') audio.ground(ev.speed);
      else if (ev.type === 'pole') audio.pole(ev.speed);
      else if (ev.type === 'wrap') audio.wrapTick(ev.turns);
      else if (ev.type === 'wound') {
        audio.wound();
        audio.vibrate([25, 40, 45]);
        tw.trigger(Math.min(1, Math.max(0.85, ev.speed / CFG.hit.vMax)), 'perfect', true); // the finish is always a big moment: forced past the re-hit window and the rally pacing
        woundAt = now;
      }
    }
  }

  // The Feel panel is a bottom drawer on tall phones: lift the court above it while it is open so the ball stays in view.
  // offsetHeight is layout size (the slide-in transform does not change it), so the camera refits once, not every frame.
  const panelEl = document.getElementById('panel');
  let panelInset = 0, panelOpen = false;
  function syncPanel() {
    const open = ui.tuner.isOpen();
    if (open === panelOpen) return;
    panelOpen = open;
    const inset = open && panelEl.offsetWidth > cam.w * 0.8 ? panelEl.offsetHeight + 8 : 0;
    if (inset !== panelInset) { panelInset = inset; cam.setInsetBottom(inset); }
  }
  window.addEventListener('resize', () => { panelOpen = !panelOpen; syncPanel(); }); // a rotation can turn the drawer into a side panel (and back)

  // ---- one frame of the whole game ----
  // realDt drives the sim (clamped by the caller); clockDt is the true elapsed time, which is all the stopwatch should count
  function step(realDt, now, draw, clockDt) {
    pumpInput(now);
    const scale = tw.update(realDt);
    const simDt = realDt * scale;
    if (simDt > 0) advance(world, simDt);
    onEvents(now);
    if (prevPhase !== 'ramp' && tw.phase === 'ramp') audio.release(tw.seq.power); // the running sequence's power, so the whoosh fits the ramp tw plays (a wound slam can replace it)
    prevPhase = tw.phase;

    fx.update(realDt, simDt, tw, world);
    fx.applyCamera(cam);
    game.update(clockDt, world);

    cam.project(world.ball.p.x, world.ball.p.y, world.ball.p.z, ballScr);
    tick.speed01 = Math.min(1, world.ball.speed / CFG.hit.vMax);
    tick.pan = Math.max(-1, Math.min(1, (ballScr.x / cam.w) * 2 - 1));
    tick.timeScale = scale;
    audio.tick(realDt, tick);

    if (game.state === 'wound' && !resultShown && woundAt >= 0 && now - woundAt > 900) { resultShown = true; ui.showResult(game.snap); }
    ui.update(game.snap, realDt);
    syncPanel();

    if (draw) { view.now = now; scene.draw(ctx, cam, world, view); }
  }

  // ---- the frame loop, with a governor that watches main-thread WORK (not frame interval:
  //      a 30 fps embed cap would otherwise read as a slow phone) ----
  const work = new Float32Array(90);
  let wi = 0, wn = 0, lastDown = 0, last = performance.now(), manual = false;
  const perf = { workMs: 0, fps: 0 };
  function frame(now) {
    requestAnimationFrame(frame);
    if (manual) return;
    let realDt = (now - last) / 1000;
    last = now;
    if (!(realDt > 0)) realDt = 0;
    const clockDt = realDt > 0.5 ? 0 : realDt; // the stopwatch runs on true time (a 20 fps phone is not 33 % faster), but a hidden tab is a pause
    if (realDt > 1 / 30) realDt = 1 / 30; // a hidden tab or a hiccup must not teleport the ball
    const t0 = performance.now();
    step(realDt, now, true, clockDt);
    const w = performance.now() - t0;
    work[wi] = w; wi = (wi + 1) % work.length; if (wn < work.length) wn++;
    perf.fps = clockDt > 0 ? 1 / clockDt : 0; // the real frame rate, not the clamped one
    if (wn === work.length && now - lastDown > 2500 && quality > 0.5) {
      const s = Array.from(work).sort((a, b) => a - b);
      perf.workMs = s[s.length >> 1];
      if (perf.workMs > 11) { quality = quality > 0.75 ? 0.75 : 0.5; scene.setQuality(quality); resize(); lastDown = now; wn = 0; }
    }
  }

  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  window.addEventListener('keydown', (e) => { // not while a Feel-panel slider or the paste box has focus
    if ((e.key === 'r' || e.key === 'R') && !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) resetAll();
  });

  // ---- test hooks: manual stepping and synthetic swipes through the SAME hit path as a finger ----
  window.__tb = {
    CFG, world, cam, tw, fx, game, input, scene, audio, ui, perf,
    manual(b) { manual = b !== false; },
    // advance REAL time by ms in 1/60 s frames (with drawing on the last one)
    advance(ms) {
      let t = performance.now();
      const n = Math.max(1, Math.round(ms / 16.667));
      for (let i = 0; i < n; i++) { t += 16.667; step(1 / 60, t, i === n - 1, 1 / 60); }
    },
    // a synthetic swipe through the ball along (dx,dz) at `speed` m/s, via the real hit path
    hit(dx, dz, speed) {
      lastHitAt = -1e9; // tests may chain hits freely; the real cooldown still guards fingers
      const l = Math.hypot(dx, dz) || 1, ux = dx / l, uz = dz / l, b = world.ball.p;
      const h = handBuf;
      h.p0.x = b.x - ux * 0.5; h.p0.y = b.y; h.p0.z = b.z - uz * 0.5;
      h.p1.x = b.x + ux * 0.05; h.p1.y = b.y; h.p1.z = b.z + uz * 0.05;
      h.vx = ux * speed; h.vz = uz * speed; h.speed = speed; h.r = CFG.hit.handR; h.stroke = -1; h.owner = 'you';
      return tryHit(h, performance.now());
    },
    reset: resetAll,
  };

  resetAll();
  requestAnimationFrame(frame);
})();

})();
</script>
</body>
</html>
