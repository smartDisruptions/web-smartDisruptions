// ════════ audio.js ════════
// audio.js — synthesised sound and haptics. No files: oscillators, filtered noise and envelopes, so a hit can be shaped by
// power, quality and direction, and slow-mo can be HEARD (the whirr falls in pitch and muffles, then climbs back with the ramp).
// The one exception is the hit itself, which can also be a sampled voice: deeper takes generated with ElevenLabs, embedded as
// MP3 in hitsounds.js and picked on the Feel panel ("Hit sound"). A sampled hit still scales with power (level, pitch and a
// low-pass that opens up), still rings when it is perfect, and gets the synth's contact tick on top so it lands on a phone.
//
//   voices ─► pan ─► master (volume / mute) ─► compressor ─► soft clip ─► speakers
//   (volume sits BEFORE the limiter, so even the loudest Feel-panel setting cannot clip the output)
//
// Everything is scheduled on the audio clock at call time. A context that is missing, suspended or interrupted turns every call
// into a silent no-op (a hit that lands before the browser lets us play is held for 0.6 s and sounds the moment it can).
// createAudio({ context }) builds on a caller's context instead of its own: tests render through an OfflineAudioContext on
// exactly the code path the game uses.

CFG.audio = {
  volume: 1, // master
  hitBody: 1, // the thump layer of a hit
  hitCrack: 1, // the crack and tick layers of a hit
  thumpHz: 140, // where the thump starts before it falls to ~45
  whirr: 1, // ambient whirr / whoosh while the ball moves
  release: 1, // the rising whoosh as time speeds back up
  flash: 1, // Kiru's flash step: the swish as he blinks across the court
  special: 1, // the specials (energy.js): Raijin's thunderclap, Kage's shadow cut, and the energy bar's cues
  hitVoice: 0, // the hit: 0 the synth below, 1.. a sampled voice from hitsounds.js (Thump, Smack, Boom, Taiko: deeper)
  hitPitch: 1, // × a sampled voice's pitch: under 1 is deeper still
  haptics: 1, // 1 = vibrate where the browser can
  maxNodes: 60, // voice-node cap: past it the quiet effects are skipped, so a pile-up can never swamp a phone (a rapid round peaks near 40)
  seed: 20260713, // variation between hits is seeded, so renders repeat
};
CFG_SCHEMA.push(
  { path: 'audio.volume', label: 'Master volume', min: 0, max: 1.5, step: 0.05, group: 'Audio', unit: '' },
  // the voices come from hitsounds.js when it is in the build; without it the choice is the synth alone
  { path: 'audio.hitVoice', label: 'Hit sound', type: 'choice', options: ['Synth'].concat(typeof HIT_SOUNDS !== 'undefined' ? HIT_SOUNDS.map((v) => v.label) : []), min: 0, max: typeof HIT_SOUNDS !== 'undefined' ? HIT_SOUNDS.length : 0, step: 1, group: 'Audio', unit: '' },
  { path: 'audio.hitPitch', label: 'Sampled hit pitch', min: 0.6, max: 1.4, step: 0.02, group: 'Audio', unit: 'x' },
  { path: 'audio.hitBody', label: 'Hit thump', min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.hitCrack', label: 'Hit crack', min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.thumpHz', label: 'Thump pitch', min: 90, max: 220, step: 5, group: 'Audio', unit: 'Hz' },
  { path: 'audio.whirr', label: 'Whirr while moving', min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.release', label: 'Speed-up whoosh', min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.flash', label: "Kiru's flash step", min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.special', label: 'Special moves', min: 0, max: 2, step: 0.05, group: 'Audio', unit: 'x' },
  { path: 'audio.haptics', label: 'Haptics', min: 0, max: 1, step: 1, group: 'Audio', unit: '' }
);

function createAudio(opts) {
  opts = opts || {};
  const LEAD = 0.003; // s: scheduled sounds start just ahead of the clock, so no envelope begins mid-block
  const WARM = 0.12; // s: Chrome's compressor swallows the first ~100 ms of a context (measured: -9 dB at 3 ms, -2 dB at 50 ms), so nothing starts earlier
  const TAIL = 0.02; // s: a decay scheduled after a value curve must start past its end; Chrome rounds the curve's start up to a 128-frame block, so an event AT the end can overlap it and throw
  const FLOOR = 0.0005; // exponential ramps cannot reach 0; this is -66 dB, then the source is stopped
  const rnd = U.rng(CFG.audio.seed);
  const active = []; // voices whose sound has not finished yet
  // voice nodes sounding now / at most / voices skipped by the cap / nodes made and nodes disconnected again (equal once the sound is over)
  // / calls that failed (a bad value from the Feel panel, say) and were swallowed: sound must never be able to break the game loop
  const stats = { peak: 0, dropped: 0, made: 0, freed: 0, errors: 0, lastError: null, get live() { return liveNodes(); } };
  let cur = null; // the voice being built, so a failure halfway can take its nodes down with it
  const late = { at: -1, power: 0, quality: 'good', reversed: false }; // a hit that landed before the context could play
  const S = { muted: false, gestured: false, offline: false, failed: false, nudge: 0, tSnap: -1, tGround: -1, tPole: -1, tWrap: -1 };
  // the ambient voice (a looped noise through a band-pass and a low-pass) and the last value sent to each of its params
  const A = { src: null, bp: null, lp: null, g: null, quiet: 0, vG: -1, vF: -1, vL: -1, vR: -1, vP: 9, vol: -1 };
  let ctx = null, bus = null, master = null, pan = null, noise = null;
  const W = { thump: null, chime: null };
  const HV = { buf: [], off: [], started: false, loaded: 0, failed: 0, ready: null }; // the sampled hit voices, decoded
  const LADDER = [0, 2, 4, 7, 9, 12, 14, 16]; // semitones above A4, one rung per turn of rope

  try { S.muted = localStorage.getItem('tetherball.muted') === '1'; } catch (e) { /* private mode: start unmuted */ }

  // ---- the chain ----
  function softClip() { // identity to 0.7, then a smooth knee that peaks at 0.95: nothing past this node can reach 1
    const N = 2049, c = new Float32Array(N), a = 0.7, top = 0.95, w = 1 - a;
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * 2 - 1, ax = Math.abs(x);
      let y = ax;
      if (ax > a) { const t = (ax - a) / w, t2 = t * t, t3 = t2 * t; y = (2 * t3 - 3 * t2 + 1) * a + (t3 - 2 * t2 + t) * w + (3 * t2 - 2 * t3) * top; }
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }

  function wave(imag) {
    try { return ctx.createPeriodicWave(new Float32Array(imag.length), Float32Array.from(imag)); } catch (e) { return null; }
  }

  function build() {
    if (S.failed) return;
    try {
      let AC = null;
      if (!opts.context) AC = typeof AudioContext !== 'undefined' ? AudioContext : typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null;
      if (opts.context) ctx = opts.context;
      else if (AC) { try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); } }
      if (!ctx) return;
      S.offline = typeof OfflineAudioContext !== 'undefined' && ctx instanceof OfflineAudioContext;

      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -1; comp.knee.value = 2; comp.ratio.value = 20; comp.attack.value = 0.001; comp.release.value = 0.1;
      const clip = ctx.createWaveShaper();
      clip.curve = softClip();
      master = ctx.createGain();
      master.gain.value = S.muted ? 0 : volume();
      A.vol = volume();
      master.connect(comp); comp.connect(clip); clip.connect(ctx.destination);
      if (ctx.createStereoPanner) { pan = ctx.createStereoPanner(); pan.connect(master); bus = pan; } else bus = master;

      const n = Math.floor(ctx.sampleRate * 2);
      noise = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = rnd() * 2 - 1;
      W.thump = wave([1, 0.42, 0.2, 0.08]); // a sine with overtones: phone speakers cannot make 45 Hz, but they can make its harmonics
      W.chime = wave([1, 0, 0.22, 0, 0.08]); // soft and bell-like
      loadVoices();

      ctx.onstatechange = function () { if (ctx.state === 'running') flushLate(); };
      keepAlive();
    } catch (e) { // any failure leaves a silent but working object, and does not leak a context or retry on every tap
      S.failed = true;
      if (ctx && !opts.context) { try { ctx.close(); } catch (err) { /* already gone */ } }
      ctx = null; bus = null; master = null; pan = null; noise = null;
    }
  }

  // a hidden page must not keep whirring on its last frame's gain; a returning page, or the next tap after an iOS interruption
  // (a call, Siri), has to wake the context again, and only a gesture can
  function keepAlive() {
    if (S.offline || typeof document === 'undefined') return;
    const wake = function () { if (ctx.state === 'suspended' || ctx.state === 'interrupted') resume(); };
    document.addEventListener('visibilitychange', function () {
      if (ctx.state === 'closed') return;
      try { if (document.hidden) ctx.suspend(); else wake(); } catch (e) { /* nothing to do */ }
    });
    document.addEventListener('pointerdown', wake, true);
    document.addEventListener('touchend', wake, true);
  }

  function resume() {
    try { const r = ctx.resume(); if (r && r.then) r.then(flushLate, function () {}); } catch (e) { /* needs a gesture; the next unlock() asks again */ }

// The characters (view.actors: Kage, Kiru) are depth-sorted into that order against the pole, the ball and each other by
// their z, and their speech goes over everything. view.halves (−1 / +1: the side Kage's half is on, 0 none) paints the two
// halves into the baked court.

// z = 0 is split there (it can pass in front of the pole at one end and behind it at the other); fx.drawTrail goes just

  { path: 'scene.shadow', label: 'Floor shadow', min: 0, max: 1.6, step: 0.05, group: 'Scene', unit: '' },

    c.strokeStyle = pal.pole; c.globalAlpha = 0.5; c.lineWidth = 1; c.stroke(); c.globalAlpha = 1;

    const dg = Math.sqrt(W * W + H * H);

    g.addColorStop(0, 'rgba(4,6,12,0)'); g.addColorStop(1, 'rgba(4,6,12,0.62)');

  // Rebake when the camera was refit (a resize, the Feel panel's cam.setInsetBottom, a retuned pitch), the canvas changed or
  // the world's dimensions did. The camera's own fingerprint is enough: pos.y / pos.z stand in for dist, targetY and pitch.
  function sync(cam) {
    const w = CFG.world;
    kn[0] = W; kn[1] = H; kn[2] = kx; kn[3] = ky; kn[4] = cam.F; kn[5] = cam.cx; kn[6] = cam.cy; kn[7] = cam.w; kn[8] = cam.h;
    kn[9] = cam.pitchDeg; kn[10] = cam.pos.y; kn[11] = cam.pos.z; kn[12] = w.groundR; kn[13] = w.poleH; kn[14] = w.ropeL; kn[15] = w.poleR; kn[16] = halves;
    let i = 0;
    while (i < NK && kn[i] === L.key[i]) i++;

  }

  // The baked layer rides the same zoom → roll → shake the camera applies to every projected point. Resampling it is the
  // dearest thing a camera-effect frame does (a CPU raster pays per screen pixel), so: shake alone is rounded to whole device
  // pixels and stays a straight copy (a fractional offset made it a full-screen bilinear resample, ~8x slower), and zoom or
  // roll resample nearest-neighbour (~2.5x cheaper than bilinear; the court is faint lines on a gradient and the effect lasts
  // a few frames, so the aliasing hides in the motion).
  function blit(ctx, cam) {

    }
    const z = cam.zoom, co = Math.cos(cam.roll), si = Math.sin(cam.roll), mx = cam.w * 0.5, my = cam.h * 0.5;
    const tx = cam.focusX * (1 - z) - mx, ty = cam.focusY * (1 - z) - my;

    ctx.setTransform(kx * z * co, ky * z * si, -kx * z * si, ky * z * co, kx * (mx + tx * co - ty * si + cam.shakeX), ky * (my + tx * si + ty * co + cam.shakeY));
    ctx.imageSmoothingEnabled = false;

  }

  // ---- floor shadows ----
  function floorDisc(ctx, cam, x, z, r, alpha) {
    cam.project(x, 0, z, A); cam.project(x + r, 0, z, B); cam.project(x, 0, z + r, C);
    ctx.setTransform(kx * (B.x - A.x), ky * (B.y - A.y), kx * (C.x - A.x), ky * (C.y - A.y), kx * A.x, ky * A.y);
    ctx.globalAlpha = alpha; ctx.fillStyle = G.shadow;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
  }

  // altitude reads from the shadow: close to the floor it is broad and dark, high up small and faint; a plumb line
  // drops from the ball to the spot straight under it
  function drawShadows(ctx, cam, world) {
    const S = CFG.scene, b = world.ball, p = b.p;
    if (!(S.shadow > 0)) return;
    const k = U.smoothstep(0, 2.4, Math.max(0, p.y - b.r));
    floorDisc(ctx, cam, p.x + THROW_X * p.y, p.z + THROW_Z * p.y, b.r * (1.5 - 0.6 * k), Math.min(1, S.shadow * (0.85 - 0.4 * k)));
    base(ctx);
    cam.project(p.x, 0, p.z, A); cam.project(p.x, p.y - b.r, p.z, B);
    ctx.globalAlpha = 0.2 * S.shadow; ctx.strokeStyle = P.white; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(A.x, A.y, Math.max(0, 0.07 * A.s), Math.max(0, 0.07 * A.s * Math.abs(cam.up.z)), 0, 0, TAU); ctx.stroke();
    // the live orbit: a faint floor ring at the ball's current radius (it tightens as the rope winds in)
    const rho = Math.sqrt(p.x * p.x + p.z * p.z);
    if (S.orbitRing > 0 && rho > CFG.world.poleR + b.r) {
      ctx.globalAlpha = S.orbitRing; ctx.strokeStyle = P.white; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 48; i++) { const a = (i / 48) * TAU; cam.project(Math.cos(a) * rho, 0, Math.sin(a) * rho, A); if (i) ctx.lineTo(A.x, A.y); else ctx.moveTo(A.x, A.y); }
      ctx.stroke();
    }
    base(ctx);
  }

  // ---- the pole, the coils on it, the ball and the rope ----
  function preparePole(cam, world) {
    const Wd = CFG.world, S = CFG.scene;
    cam.project(0, 0, 0, PA); cam.project(0, Wd.poleH, 0, PB); cam.project(0, Wd.attachY, 0, PC);
    PG.wt = Math.max(Wd.poleR * PB.s, 3); // half-width px at the top: never thinner than a readable pole
    PG.wb = PG.wt * (PA.s / PB.s) * 1.14; // nearer, and a taper
    PG.ratio = Math.abs(cam.up.z);
    PG.ropePx = Math.max(1.9, S.ropeW * PC.s);
    PG.pitch = Math.max(3.2, PG.ropePx * 1.3, Wd.coilPitch * PC.s) / PC.s; // coil spacing, m: wide enough that a stack reads
    PG.rCoil = (PG.wt / PB.s) * (1 + 0.14 * (1 - Wd.attachY / Wd.poleH)) + PG.ropePx * 0.5 / PC.s;
    // where the free rope leaves the stack: the bottom coil, on the coil radius, in the direction of the physics pivot
    const r = world.rope, pv = r.pivot, b = world.ball.p;
    let dx = pv.x, dz = pv.z, dl = Math.sqrt(dx * dx + dz * dz);
    if (dl < 1e-6) { dx = b.x; dz = b.z; dl = Math.sqrt(dx * dx + dz * dz) || 1; }
    PG.px = (dx / dl) * PG.rCoil; PG.pz = (dz / dl) * PG.rCoil;
    PG.wrap = Math.min(Math.abs(r.wrap) || 0, 12 * TAU); // a bad wrap from upstream must never turn the coil loop endless
    PG.py = Wd.attachY - (PG.wrap / TAU) * PG.pitch;
  }

  // the ball's frame: centre, radius, the 2×2 that squashes and stretches it, and where the rope ties on
  function prepareBall(cam, world, view, fx) {
    const b = world.ball, p = b.p, S = CFG.scene;
    cam.project(p.x, p.y, p.z, A);
    BL.x = A.x; BL.y = A.y; BL.rp = Math.max(0, b.r * A.s);
    DF.sx = 1; DF.sy = 1; DF.ang = 0;
    if (fx && fx.deform) fx.deform(DF);
    const c = Math.cos(DF.ang), s = Math.sin(DF.ang);
    const d00 = DF.sx * c * c + DF.sy * s * s, d01 = (DF.sx - DF.sy) * c * s, d11 = DF.sx * s * s + DF.sy * c * c;
    // motion stretch follows what the eye sees: world speed × time scale, so slow-mo does not smear the ball
    const ts = view && view.time && view.time.scale != null ? U.clamp01(view.time.scale) : 1;
    const k = S.stretch * U.smoothstep(3, 16, b.speed * ts);
    let s00 = 1, s01 = 0, s11 = 1;
    if (k > 0.004) {
      cam.project(p.x + b.v.x * 0.02, p.y + b.v.y * 0.02, p.z + b.v.z * 0.02, B);
      const dx = B.x - A.x, dy = B.y - A.y, l = Math.sqrt(dx * dx + dy * dy);
      if (l > 1e-3) {

        s00 = e * ux * ux + f * uy * uy; s01 = (e - f) * ux * uy; s11 = e * uy * uy + f * ux * ux;
      }
    }
    BL.m00 = d00 * s00 + d01 * s01; BL.m01 = d00 * s01 + d01 * s11;
    BL.m10 = d01 * s00 + d11 * s01; BL.m11 = d01 * s01 + d11 * s11;
    // markings: the body → world rotation from the quaternion
    const q = b.q;
    let w = 1, x = 0, y = 0, z = 0;
    if (q) { w = q.w; x = q.x; y = q.y; z = q.z; }
    const n = w * w + x * x + y * y + z * z, f2 = n > 1e-9 ? 2 / n : 0;
    RM[0] = 1 - f2 * (y * y + z * z); RM[1] = f2 * (x * y - z * w); RM[2] = f2 * (x * z + y * w);
    RM[3] = f2 * (x * y + z * w); RM[4] = 1 - f2 * (x * x + z * z); RM[5] = f2 * (y * z - x * w);
    RM[6] = f2 * (x * z - y * w); RM[7] = f2 * (y * z + x * w); RM[8] = 1 - f2 * (x * x + y * y);
    if (n <= 1e-9) { RM[0] = RM[4] = RM[8] = 1; }

    let ax = PG.px - p.x, ay = PG.py - p.y, az = PG.pz - p.z;

    BL.ax = BL.x + BL.rp * (BL.m00 * X + BL.m01 * Y); BL.ay = BL.y + BL.rp * (BL.m10 * X + BL.m11 * Y);

  }

  // rope points: straight when taut, a parabolic sag toward gravity when slack
  function buildRope(cam, world) {
    const r = world.rope;
    const dx = BL.wx - PG.px, dy = BL.wy - PG.py, dz = BL.wz - PG.pz, len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
    const sl = r.slack > 0 ? r.slack : 0;
    const h = Math.min(0.6 * len, Math.sqrt(0.375 * len * sl) * U.smoothstep(0.002, 0.03, sl));
    ropeTaut = h < 0.004; ropeTension = r.tension > 0 ? U.clamp01(r.tension) : 0;
    rn = ropeTaut ? 2 : NS + 1;
    let nx = 0, ny = 0, nz = 0;
    if (!ropeTaut) {
      const ux = dx / len, uy = dy / len, uz = dz / len, s2 = 1 - uy * uy, k = U.smoothstep(0.04, 0.16, s2), sq = Math.sqrt(Math.max(s2, 1e-6));
      const p = world.ball.p, rho = Math.sqrt(p.x * p.x + p.z * p.z) || 1;
      nx = k * ((uy * ux) / sq) + (1 - k) * (p.x / rho); ny = k * (-(s2) / sq); nz = k * ((uy * uz) / sq) + (1 - k) * (p.z / rho);
      const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    }
    for (let i = 0; i < rn; i++) {
      const t = ropeTaut ? i : i / NS, sag = ropeTaut ? 0 : h * 4 * t * (1 - t);
      const x = PG.px + dx * t + nx * sag, y = PG.py + dy * t + ny * sag, z = PG.pz + dz * t + nz * sag;
      cam.project(x, y, z, A);
      rX[i] = A.x; rY[i] = A.y; rS[i] = A.s; rZ[i] = z;
    }
    rX[rn - 1] = BL.ax; rY[rn - 1] = BL.ay; // the last point rides the squashed ball
  }

  // one stroke style over the part of the rope on one side of the pole's plane (side −1 behind, +1 in front); a segment
  // that crosses z = 0 is cut there. Outlines go down before cores so a sagging rope has no dark beads at its joints.
  function ropeStrokes(ctx, side, pass) {
    const S = CFG.scene;
    for (let i = 0; i < rn - 1; i++) {
      const z0 = rZ[i], z1 = rZ[i + 1], s0 = z0 < 0 ? -1 : 1, s1 = z1 < 0 ? -1 : 1;
      if (s0 !== side && s1 !== side) continue;

      if (s0 !== s1) {
        const t = z0 / (z0 - z1), cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t;
        if (s0 === side) { x1 = cx; y1 = cy; } else { x0 = cx; y0 = cy; }
      }

  }
  function ropePass(ctx, side) {
    base(ctx);

    ctx.strokeStyle = P.ropeLo; ropeStrokes(ctx, side, 1);

  }

  // The visible half of one great circle of the ball, body normal (bx,by,bz): in the ball's unit frame it is a half-ellipse.
  // With the normal's screen-plane part along angle rot and its toward-the-camera part c, the ellipse has semi-axes |c|
  // (along rot) and 1, and the half that faces us bulges away from the normal's lean.
  function seam(ctx, cam, bx, by, bz) {
    const rx = RM[0] * bx + RM[1] * by + RM[2] * bz, ry = RM[3] * bx + RM[4] * by + RM[5] * bz, rz = RM[6] * bx + RM[7] * by + RM[8] * bz;
    const X = rx, Y = -(cam.up.y * ry + cam.up.z * rz), c = -(cam.fwd.y * ry + cam.fwd.z * rz), rot = Math.atan2(Y, X), s = c >= 0 ? 1 : -1;
    ctx.moveTo(-s * Math.sin(rot), s * Math.cos(rot));
    ctx.ellipse(0, 0, Math.abs(c), 1, rot, s > 0 ? HALF_PI : -HALF_PI, s > 0 ? 3 * HALF_PI : HALF_PI);
  }

  function drawBall(ctx, cam) {
    const rp = BL.rp;
    ctx.setTransform(kx * rp * BL.m00, ky * rp * BL.m10, kx * rp * BL.m01, ky * rp * BL.m11, kx * BL.x, ky * BL.y);
    ctx.globalAlpha = 1; ctx.fillStyle = G.ball;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.save();
    ctx.clip(); // the path above: markings that straddle the limb are cut by the silhouette
    ctx.strokeStyle = P.mark;
    for (let pass = 0; pass < 2; pass++) { // the bold stripe is seam 0; the other two are thin
      ctx.lineWidth = pass ? SEAM_W : STRIPE_W;
      ctx.beginPath();
      for (let i = pass ? 1 : 0; i < (pass ? 3 : 1); i++) seam(ctx, cam, SEAM[i * 3], SEAM[i * 3 + 1], SEAM[i * 3 + 2]);
      ctx.stroke();
    }
    ctx.fillStyle = G.ballOv; ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
    ctx.globalAlpha = 0.5; ctx.fillStyle = P.white; // soft highlight
    ctx.beginPath(); ctx.ellipse(-0.38, -0.44, 0.2, 0.11, -0.75, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = P.ropeLo; ctx.lineWidth = 0.07; // a thin dark outline separates the ball from rope and pole
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.stroke();

      ctx.fillStyle = P.ropeLo; ctx.beginPath(); ctx.arc(BL.ax, BL.ay, Math.max(1.5, PG.ropePx * 0.8), 0, TAU); ctx.fill();
    }
  }

  // everything on one side of the pole. The rope goes under the ball when its tie point is hidden, over it when in view.
  function layer(ctx, cam, world, fx, side) {
    const hasBall = (side > 0) === (world.ball.p.z >= 0);
    if (!hasBall) { ropePass(ctx, side); return; }
    if (!BL.facing) ropePass(ctx, side);
    if (fx && fx.drawTrail) { base(ctx); fx.drawTrail(ctx, cam); }
    drawBall(ctx, cam);
    if (BL.facing) ropePass(ctx, side);
  }

  function drawPole(ctx, cam, world) {
    const Wd = CFG.world, S = CFG.scene;
    const dx = PB.x - PA.x, dy = PB.y - PA.y, len = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / len, uy = dy / len;
    const wb = PG.wb, rt = PG.wt / wb;
    // body, in a frame where x runs across the pole (±1 = base half-width) and y runs up it in px
    ctx.setTransform(kx * -uy * wb, ky * ux * wb, kx * ux, ky * uy, kx * PA.x, ky * PA.y);
    ctx.globalAlpha = 1; ctx.fillStyle = G.pole;
    const bulge = wb * PG.ratio; // the foot is a circle seen from above: its near edge dips below the axis point
    ctx.beginPath(); ctx.moveTo(-1, 0); ctx.ellipse(0, 0, 1, bulge, 0, Math.PI, TAU); ctx.lineTo(rt, len); ctx.lineTo(-rt, len); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = P.black;
    for (let h = 0.5, i = 1; h < Wd.poleH - 0.2; h += 0.5, i++) { // a height gauge: the ball's altitude reads against it
      cam.project(0, h, 0, PC);
      ctx.globalAlpha = S.gauge * (i & 1 ? 1 : 1.8);
      ctx.fillRect(-1.2, (PC.x - PA.x) * ux + (PC.y - PA.y) * uy - 0.7, 2.4, 1.4);
    }
    ctx.globalAlpha = 0.28; ctx.fillRect(-1.2, -bulge, 2.4, bulge + 5); // collar
    ctx.globalAlpha = 0.16; ctx.fillStyle = P.white; ctx.fillRect(-0.64, 0, 0.14, len); // lit shoulder
    ctx.restore();

    const wc = PG.wt * 1.3, ry = wc * PG.ratio, th = Math.max(2, wc * 0.5);
    ctx.fillStyle = P.capSide;
    ctx.beginPath(); ctx.ellipse(PB.x, PB.y + th, wc, ry, 0, 0, TAU); ctx.fill();
    ctx.fillRect(PB.x - wc, PB.y, 2 * wc, th);
    ctx.setTransform(kx * wc, 0, 0, ky * ry, kx * PB.x, ky * PB.y);
    ctx.fillStyle = G.cap; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = P.ropeLo; ctx.lineWidth = 0.08; ctx.stroke();
    base(ctx);
  }

  // the wound rope: a helix from the tie point down to the pivot, front half only (the back is behind the pole)
  function drawCoils(ctx, cam, world) {
    const r = world.rope, wrap = PG.wrap;
    if (wrap < 0.03) return;
    const sg = r.wrap < 0 ? -1 : 1, thp = Math.atan2(r.pivot.z, r.pivot.x), ds = Math.PI / 9;
    let run = false;
    ctx.beginPath();
    for (let s = wrap; ; s -= ds) {
      const sc = s > 0 ? s : 0, th = thp - sg * (wrap - sc), sn = Math.sin(th);
      if (sn > 0) {
        cam.project(PG.rCoil * Math.cos(th), CFG.world.attachY - (PG.pitch * sc) / TAU, PG.rCoil * sn, PC);
        if (run) ctx.lineTo(PC.x, PC.y); else { ctx.moveTo(PC.x, PC.y); run = true; }
      } else run = false;
      if (s <= 0) break;
    }
    ctx.strokeStyle = P.ropeLo; ctx.lineWidth = PG.ropePx + 1.5; ctx.stroke();
    ctx.strokeStyle = P.rope; ctx.lineWidth = PG.ropePx; ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = P.white; ctx.lineWidth = Math.max(0.6, PG.ropePx * 0.3); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- the finger ----
  // charged: the swing has curved enough to unleash a full energy bar (energy.js), so it burns storm blue, wider and brighter
  function drawFinger(ctx, cam, input, charged) {
    const tr = input && input.trail;
    if (!tr || !tr.length) return;
    const n = tr.length, S = CFG.scene, life = S.fingerMs;
    let m = 0;
    for (let i = Math.max(0, n - NF); i < n; i++) {
      const p = tr[i];
      if (!(p.age < life)) continue;
      fX[m] = p.x; fY[m] = p.y; fA[m] = Math.pow(1 - p.age / life, 1.2); m++;
    }
    for (let k = 0; k < m; k++) {
      const a = fX[Math.min(m - 1, k + 1)] - fX[Math.max(0, k - 1)], b = fY[Math.min(m - 1, k + 1)] - fY[Math.max(0, k - 1)], l = Math.sqrt(a * a + b * b) || 1;
      fNx[k] = -b / l; fNy[k] = a / l;
    }

    for (let pass = 0; pass < 2; pass++) {
      const wm = pass ? (charged ? 5.5 : 4.2) : charged ? 20 : 11, am = pass ? 0.9 : charged ? 0.55 : 0.2;
      ctx.fillStyle = pass ? (charged ? '#eaffff' : P.text) : P.cool;
      for (let k = 0; k < m - 1; k++) {
        const w0 = fA[k] * wm, w1 = fA[k + 1] * wm;
        ctx.globalAlpha = Math.min(1, (fA[k] + fA[k + 1]) * 0.5 * am);

      const p = tpool[(th + n) % TN];
      let a = now > p.t ? now - p.t : 0;
      if (a > ttl) continue;
      if (a > prev) a = prev;
      p.age = a; prev = a; trail[m++] = p;
    }
    if (trail.length !== m) trail.length = m;
  }

  // ---- screen → world ----
  const probe = { x: 0, y: 0, z: 0 };
  const spare = { p0: { x: 0, y: 0, z: 0 }, p1: { x: 0, y: 0, z: 0 }, vx: 0, vz: 0, speed: 0, r: 0, stroke: 0, owner: 'you' };

  function toHand(seg, planeY, out) {
    if (!seg || seg.spent) return null;
    const h = out || spare;
    if (!h.p0) h.p0 = { x: 0, y: 0, z: 0 };
    if (!h.p1) h.p1 = { x: 0, y: 0, z: 0 };
    if (!cam.unproject(seg.x0, seg.y0, planeY, h.p0) || !cam.unproject(seg.x1, seg.y1, planeY, h.p1)) return null;
    // world velocity = the end point minus a point one short step back along the smoothed screen velocity. The step is kept
    // under ~12 px so perspective stays local, and cam.unproject keeps zoom, shake and roll honest.
    const sp = seg.speedPx, db = sp * BACK_S > BACK_PX ? BACK_PX / sp : BACK_S;
    const c = cam.unproject(seg.x1 - seg.vxPx * db, seg.y1 - seg.vyPx * db, planeY, probe);
    if (!c) return null;
    const g = CFG.input.gain, H = CFG.hit;
    h.vx = (h.p1.x - c.x) / db * g; h.vz = (h.p1.z - c.z) / db * g;
    h.speed = Math.sqrt(h.vx * h.vx + h.vz * h.vz);
    h.r = Math.max(H && H.handR > 0 ? H.handR : 0.26, cam.pxPerM > 0 ? (H && H.minReachPx > 0 ? H.minReachPx : 28) / cam.pxPerM : 0);
    h.stroke = seg.stroke; h.owner = 'you';
    return h;
  }

  // Should main wait before offering this segment to the physics? Only for a stroke that BEGAN on the ball (its first segment starts
  // within reach), is still weak and still speeding up, and whose finger is still in reach at the segment's end (so the next segment,
  // which starts there, can still touch). The wait is stroke time from the first held segment, at most holdMs, and only while the ball
  // cannot drift out of reach meanwhile. Call it for every segment in order, with the hand toHand() made of it and the world's ball.
  function within(p, ball, r) { const dx = p.x - ball.p.x, dz = p.z - ball.p.z, rs = ball.r + r; return dx * dx + dz * dz <= rs * rs; }

  function shouldHold(seg, hand, ball) {
    const C = CFG.input;
    if (!seg || !hand || !ball || !(C.holdMs > 0)) return false;
    if (seg.first) { S.onStroke = seg.stroke; S.onBall = within(hand.p0, ball, hand.r); }
    if (!S.onBall || S.onStroke !== seg.stroke || !seg.rising || !(hand.speed < C.holdBelow)) return false;
    if (ball.speed * C.holdMs * 0.001 > 0.3 * (ball.r + hand.r) || !within(hand.p1, ball, hand.r)) return false;
    if (S.heldStroke !== seg.stroke) { S.heldStroke = seg.stroke; S.heldFrom = seg.t0; }
    return seg.t1 - S.heldFrom < C.holdMs;
  }

  // after a hit: this stroke is spent, here and in whatever of its segments are still waiting in this poll
  function consumeStroke(id) {
    for (let i = 0; i < nseg; i++) if (pool[i].stroke === id) pool[i].spent = true;
    if (open && id === sid) swallow = true;
  }

  // ---- wiring ----
  const wires = [
    ['pointerdown', onDown], ['pointermove', onMove], ['pointerup', onUp], ['pointercancel', onCancel], ['lostpointercapture', onCancel],
    ['contextmenu', (e) => e.preventDefault()], // an Android long-press would otherwise cancel the stroke
  ];
  if (canvas.style) canvas.style.touchAction = 'none'; // the CSS says so too; without it the browser steals swipes to scroll
  for (let i = 0; i < wires.length; i++) canvas.addEventListener(wires[i][0], wires[i][1]);

  function dispose() {
    for (let i = 0; i < wires.length; i++) canvas.removeEventListener(wires[i][0], wires[i][1]);
    if (pid !== -1) { try { canvas.releasePointerCapture(pid); } catch (err) { /* gone already */ } }
    pid = -1; down = false; qn = 0; open = false; nseg = 0; tn = 0; pendSet = false;
    segments.length = 0; trail.length = 0; gestures.length = 0;
  }

  return {
    segments, trail, poll, toHand, shouldHold, consumeStroke, onGesture(fn) { if (typeof fn === 'function') gestures.push(fn); }, dispose,
    get active() { return down; },
    // the finger's swing so far: its shape (as on its segments), and whether it already hit (spent until it turns back or lifts)
    get turn() { return open ? S.turn : 0; }, get turnAbs() { return open ? S.turnAbs : 0; }, get arc() { return open ? S.arc : 0; },
    get spent() { return swallow; },
  };
}

// ════════ game.js ════════
// game.js — the solo rules: wind the rope all the way up the pole as fast as you can; the best time is kept.
//
// Rules only: no physics and no DOM. It consumes HitResults and world events, so swapping the rules (or adding an
// opponent that winds the other way) never touches physics.js. The one outside thing it touches is localStorage,
// inside try/catch, so a private window or a blocked store just means the best time lives for the session.

CFG.game = {
  startPower: 0.1, // the first hit at least this strong starts the clock (a brush against the ball does not)
};

function createGame() {
  const KEY = 'tetherball.best';
  const snap = { state: 'ready', timeMs: 0, hits: 0, topMph: 0, turns: 0, turnsGoal: 1, best: null, newBest: false, mode: 'solo' };
  const players = [{ id: 'you', side: 1 }]; // side: which way along φ this player winds (solo: both ways count)
  let best = readBest();
  let fresh = false; // the clock just started: the frame it started in was spent before the hit, so it is not counted

  function readBest() {
    try { const v = parseFloat(localStorage.getItem(KEY)); return v > 0 && isFinite(v) ? v : null; } catch (e) { return null; }
  }
  function writeBest(ms) {
    try { localStorage.setItem(KEY, String(Math.round(ms))); } catch (e) { /* storage blocked: best stays in memory */ }
  }

  // turns at which physics calls the rope wound: the free rope (tie → ball centre) is down to what clears ball + pole,
  // sqrt(r² + 2·R·r), plus physics' woundMargin, and each turn eats 2π·poleR. Matching it keeps the bar from stalling short.
  function goal() {
    const W = CFG.world, P = CFG.physics;
    const need = Math.sqrt(W.ballR * W.ballR + 2 * W.poleR * W.ballR) + (P && P.woundMargin > 0 ? P.woundMargin : 0);
    const g = (W.ropeL - need) / (2 * Math.PI * W.poleR);
    return g > 0 && isFinite(g) ? g : 1;
  }

  function reset() {
    snap.state = 'ready'; snap.timeMs = 0; snap.hits = 0; snap.topMph = 0; snap.turns = 0;
    snap.turnsGoal = goal(); snap.best = best; snap.newBest = false;
    fresh = false;
  }

  function onHit(res) {
    if (!res || snap.state === 'wound') return;
    if (snap.state === 'ready') {
      if (!(res.power >= CFG.game.startPower)) return;
      snap.state = 'playing'; snap.timeMs = 0; fresh = true;
    }
    snap.hits++;
    const mph = U.mph(res.speedAfter);
    if (mph > snap.topMph) snap.topMph = mph;
  }

  function onEvent(ev) {
    if (!ev || ev.type !== 'wound' || snap.state !== 'playing') return;
    snap.state = 'wound';
    snap.timeMs = Math.round(snap.timeMs);
    snap.turnsGoal = goal();
    snap.turns = snap.turnsGoal; // wound means full: don't show 6.2 / 6.4 on the result card
    snap.newBest = best === null || snap.timeMs < best;
    if (snap.newBest) { best = snap.timeMs; writeBest(best); }
    snap.best = best;
  }

  // realDt: the player's stopwatch runs on real time, through every freeze and slow-mo
  function update(realDt, world) {
    snap.turnsGoal = goal();
    if (snap.state === 'playing') {
      if (realDt > 0 && isFinite(realDt)) { if (fresh) fresh = false; else snap.timeMs += realDt * 1000; }
      if (world && world.ball) { const mph = U.mph(world.ball.speed); if (mph > snap.topMph) snap.topMph = mph; }
    }
    if (snap.state !== 'wound' && world && world.rope && world.rope.turns >= 0) snap.turns = Math.min(world.rope.turns, snap.turnsGoal);
  }

  reset();
  return { mode: 'solo', players, snap, get state() { return snap.state; }, onHit, onEvent, update, reset };
}

// ════════ versus.js ════════
// versus.js — the rules against Kage: two halves of the court, two ways round the pole, first to N rounds.
//
// Each player owns half the court (Kage the half CFG.kage.side gives him, you the other) and winds the rope the way a hit
// AWAY from the camera on their own half sends it: the right half winds counter-clockwise (−1 along φ), the left half
// clockwise (+1). A round ends when the rope is fully wound; whoever's way it is wound wins it. Rules only, like game.js:
// no physics, no DOM. It reads the world for the winding (the sign of rope.wrap says whose way it went).

CFG.match = {
  opponent: 1, // 0 = solo time trial (game.js), 1 = versus Kage (this file)
  rounds: 3, // first to this many rounds wins the match
  serve: 0, // 0 alternate (you first), 1 always you, 2 always Kage, 3 whoever lost the last round
  crossHits: 0, // 1 = your swipes count on Kage's half too
};
CFG_SCHEMA.push(
  { path: 'match.opponent', label: 'Mode', type: 'choice', options: ['Solo time trial', 'Versus Kage'], min: 0, max: 1, step: 1, group: 'Match', rank: -3, unit: '' },
  { path: 'match.rounds', label: 'First to', min: 1, max: 7, step: 1, group: 'Match', rank: -3, unit: 'rounds' },
  { path: 'match.serve', label: 'Who serves', type: 'choice', options: ['Turns', 'You', 'Kage', 'Loser'], min: 0, max: 3, step: 1, group: 'Match', rank: -3, unit: '' },
  { path: 'match.crossHits', label: 'You may hit on his half', type: 'toggle', min: 0, max: 1, step: 1, group: 'Match', rank: -3, unit: '' }
);

function createVersus() {
  const TAU = Math.PI * 2;
  const snap = {
    mode: 'versus', state: 'ready', // 'ready' | 'playing' | 'wound'
    timeMs: 0, hits: 0, kageHits: 0, topMph: 0,
    lead: 0, turns: 0, turnsGoal: 1, // lead: turns wound YOUR way (negative = his way); turns = |lead|
    you: 0, kage: 0, round: 1, rounds: 3, // the score
    winner: null, matchOver: false, server: 'you',
    kageSide: -1, // −1 Kage plays the left half, +1 the right
    dir: -1, // the way YOU wind along φ (Kage winds −dir)
  };
  const players = [{ id: 'you', side: -1 }, { id: 'kage', side: 1 }];
  let wrap = 0, fresh = false, lastWinner = null;

  // the same full-pole turn count as game.js (physics' wound test, in turns)
  function goal() {
    const W = CFG.world, P = CFG.physics;
    const need = Math.sqrt(W.ballR * W.ballR + 2 * W.poleR * W.ballR) + (P && P.woundMargin > 0 ? P.woundMargin : 0);
    const g = (W.ropeL - need) / (2 * Math.PI * W.poleR);
    return g > 0 && isFinite(g) ? g : 1;
  }

  // Kage on the left → you play the right half and wind counter-clockwise; on the right → you wind clockwise
  function setSides(kageSide) {
    snap.kageSide = kageSide < 0 ? -1 : 1;
    snap.dir = snap.kageSide < 0 ? -1 : 1;
    players[0].side = snap.dir; players[1].side = -snap.dir;
  }

  function serverFor(round) {
    const s = CFG.match.serve | 0;
    if (s === 1) return 'you';
    if (s === 2) return 'kage';
    if (s === 3) return lastWinner === 'you' ? 'kage' : 'you'; // the loser serves; you open the match
    return round % 2 === 1 ? 'you' : 'kage';
  }

  function clearRound() {
    snap.state = 'ready'; snap.timeMs = 0; snap.hits = 0; snap.kageHits = 0; snap.topMph = 0;
    snap.lead = 0; snap.turns = 0; snap.turnsGoal = goal(); snap.winner = null;
    wrap = 0; fresh = false;
  }

  function reset() { // a new match
    snap.you = 0; snap.kage = 0; snap.round = 1; snap.matchOver = false; lastWinner = null;
    snap.rounds = Math.max(1, Math.round(CFG.match.rounds) || 1);
    clearRound();
    snap.server = serverFor(1);
  }

  // the same round again (the court changed mid-round): the score and the server stay
  function replay() { if (snap.state !== 'wound') clearRound(); }

  function nextRound() {
    if (snap.matchOver) { reset(); return; }
    snap.round++;
    clearRound();
    snap.server = serverFor(snap.round);
  }

  // who: 'you' | 'kage'
  function onHit(res, who) {
    if (!res || snap.state === 'wound') return;
    if (snap.state === 'ready') {
      if (!(res.power >= CFG.game.startPower)) return;
      snap.state = 'playing'; snap.timeMs = 0; fresh = true;
    }
    if (who === 'kage') snap.kageHits++; else snap.hits++;
    const mph = U.mph(res.speedAfter);
    if (mph > snap.topMph) snap.topMph = mph;
  }

  function onEvent(ev, world) {
    if (!ev || ev.type !== 'wound' || snap.state !== 'playing') return;
    if (world && world.rope && world.rope.wrap !== 0) wrap = world.rope.wrap;
    snap.state = 'wound';
    snap.timeMs = Math.round(snap.timeMs);
    snap.turnsGoal = goal(); snap.turns = snap.turnsGoal;
    snap.winner = (wrap > 0 ? 1 : -1) === snap.dir ? 'you' : 'kage';
    snap.lead = snap.winner === 'you' ? snap.turnsGoal : -snap.turnsGoal;
    if (snap.winner === 'you') snap.you++; else snap.kage++;
    lastWinner = snap.winner;
    snap.rounds = Math.max(1, Math.round(CFG.match.rounds) || 1);
    snap.matchOver = snap.you >= snap.rounds || snap.kage >= snap.rounds;
  }

  // the rally clock runs on real time, like the solo stopwatch
  function update(realDt, world) {
    snap.turnsGoal = goal();
    if (snap.state === 'playing') {
      if (realDt > 0 && isFinite(realDt)) { if (fresh) fresh = false; else snap.timeMs += realDt * 1000; }
      if (world && world.ball) { const mph = U.mph(world.ball.speed); if (mph > snap.topMph) snap.topMph = mph; }
    }
    if (snap.state !== 'wound' && world && world.rope) {
      wrap = world.rope.wrap;
      const l = (wrap / TAU) * snap.dir, g = snap.turnsGoal;
      snap.lead = l > g ? g : l < -g ? -g : l;
      snap.turns = snap.lead < 0 ? -snap.lead : snap.lead;
    }
  }

  setSides(-1);
  reset();
  return { mode: 'versus', players, snap, get state() { return snap.state; }, setSides, onHit, onEvent, update, reset, nextRound, replay };
}

// ════════ energy.js ════════
// energy.js — the energy bars and the special move (versus only). Rally with your opponent and both bars fill together: one
// step for every volley (a hit that answers the other player's last one), `volleys` steps to fill. A full bar is one special
// for its owner. You unleash yours with a curved swipe: a swing that has turned `curve` degrees one way (input.js measures it)
// when it meets the ball is the special, and the moment it has turned that far the stroke shows it is charged. The trigger
// setting can make it a tap on your ring (or E) instead, which arms the next hit, or either. Kage weighs his as each swing
// starts (kage.wantsSpecial). The special:
//   · it leaves the hand `boost` times harder (the soft speed cap rises by as much, so a weak swipe stays a weak special), and
//   · the ball carries the special's charge until the OTHER player's next touch, or `charge` seconds of game time: that touch
//     lands at `damp` of its strength (they can still turn it, it is just heavy in their hands).
// Then it is a plain ball again: nothing about the ball itself changes, and nothing carries past that one touch.
//
// Bars keep their energy from round to round (you earned it) and empty only when spent or at a new match; an armed special
// that never lands is disarmed when the round ends, and the bar stays full. Rules only, like versus.js: no physics, no DOM.

CFG.energy = {
  on: 1, // 1 = energy bars and specials (versus only)
  volleys: 16, // volleys that fill a bar (tuned in tests/energy.mjs: 2–3 specials a side in a long round, never the match)
  boost: 1.2, // a special hit leaves the hand this much harder
  charge: 1.5, // s of game time the ball carries a special's charge, if the other player does not touch it first
  damp: 0.7, // the other player's next touch lands at this share of its strength
  kage: 1, // 1 = Kage uses his specials
  trigger: 0, // how you unleash yours: 0 a curved swipe, 1 a tap on your ring (or E) arms the next hit, 2 either
  curve: 40, // degrees a swing must have turned, one way, when it meets the ball. Measured at contact (tests/energy.mjs): a natural
  // thumb arc 4-20°, a half-circle through the ball 54-71°, a 150° arc with the ball mid-way 35-58°
};
CFG_SCHEMA.push(
  { path: 'energy.on', label: 'Energy and specials', type: 'toggle', min: 0, max: 1, step: 1, group: 'Energy', rank: -2.8, unit: '' },
  { path: 'energy.volleys', label: 'Volleys to fill a bar', min: 4, max: 40, step: 1, group: 'Energy', rank: -2.8, unit: '' },
  { path: 'energy.boost', label: 'Special hit power', min: 1, max: 1.5, step: 0.05, group: 'Energy', rank: -2.8, unit: 'x' },
  { path: 'energy.charge', label: 'Charge lasts', min: 0.3, max: 3, step: 0.1, group: 'Energy', rank: -2.8, unit: 's' },
  { path: 'energy.damp', label: 'Their next touch lands at', min: 0.2, max: 1, step: 0.05, group: 'Energy', rank: -2.8, unit: 'x' },
  { path: 'energy.kage', label: 'Kage uses specials', type: 'toggle', min: 0, max: 1, step: 1, group: 'Energy', rank: -2.8, unit: '' },
  { path: 'energy.trigger', label: 'Unleash yours with', type: 'choice', options: ['Curved swipe', 'Tap the ring', 'Either'], min: 0, max: 2, step: 1, group: 'Energy', rank: -2.8, unit: '' },
  { path: 'energy.curve', label: 'Curve it takes', min: 20, max: 150, step: 5, group: 'Energy', rank: -2.8, unit: '°' }
);

function createEnergy() {
  const snap = {
    on: true, // CFG.energy.on, as of the last update
    you: 0, kage: 0, // the bars, 0..1
    armedYou: false, armedKage: false,
    charge: '', chargeT: 0, chargeK: 0, // the ball's charge: whose ('you' | 'kage' | ''), seconds left, and the share left (0..1)
    volleys: 0, // volleys this rally
    used: { you: 0, kage: 0 }, // specials landed this match
  };
  let last = ''; // who hit last this rally

  const on = () => CFG.energy.on > 0;
  const step = () => 1 / Math.max(1, Math.round(CFG.energy.volleys) || 1);
  const fill = (v) => (v > 1 - 1e-6 ? 1 : v); // six sixths are 0.9999999999999999: a full bar is exactly 1

  function reset() { // a new match
    snap.you = 0; snap.kage = 0; snap.used.you = 0; snap.used.kage = 0;
    newRally();
  }
  function newRally() { // a round starts (or the court changed): the bars stay, nothing else does
    last = ''; snap.volleys = 0; snap.armedYou = false; snap.armedKage = false;
    snap.charge = ''; snap.chargeT = 0; snap.chargeK = 0;
  }

  function full(who) { return on() && (who === 'kage' ? snap.kage : snap.you) >= 1; }
  function armed(who) { return who === 'kage' ? snap.armedKage : snap.armedYou; }
  // the curve test, on a swing's shape as input.js measures it: turned at least CFG.energy.curve, mostly one way, over a real length
  function curved(turn, turnAbs, arc) {
    const t = turn < 0 ? -turn : turn, need = (Math.max(1, CFG.energy.curve) * Math.PI) / 180;
    return t >= need && turnAbs <= 1.8 * t + 0.5 && arc >= 50;
  }
  const curveOn = () => (CFG.energy.trigger | 0) !== 1;
  const tapOn = () => (CFG.energy.trigger | 0) !== 0;

  // a full bar can be armed (and disarmed again, by asking twice); returns whether it is armed now
  function arm(who, want) {
    if (!full(who)) return false;
    const a = want === undefined ? !armed(who) : !!want;
    if (who === 'kage') snap.armedKage = a; else snap.armedYou = a;
    return a;
  }

  // what this touch carries, before the physics sees it: an armed special's boost, or the other player's charge
  function prepare(who, hand) {
    hand.boost = 1; hand.gain = 1;
    if (!on()) return hand;
    if (armed(who)) hand.boost = Math.max(1, CFG.energy.boost);
    if (snap.charge && snap.charge !== who && snap.chargeT > 0) hand.gain = U.clamp(CFG.energy.damp, 0, 1);
    return hand;
  }

  // a hit landed (live: it counts in a rally, rather than a serve that did not open the round). Returns 'special' (an armed
  // special went off), 'heavy' (a touch on the other player's charged ball: it was damped, and the charge is spent), 'volley'
  // (an answer: both bars stepped), or ''.
  function onHit(who, live) {
    if (!on()) { if (live) last = who; return ''; }
    let out = '';
    if (snap.charge) { out = snap.charge !== who ? 'heavy' : ''; snap.charge = ''; snap.chargeT = 0; snap.chargeK = 0; } // any touch spends a charge
    if (armed(who)) { // an armed special goes off on whatever it boosted, a serve included
      if (who === 'kage') { snap.armedKage = false; snap.kage = 0; } else { snap.armedYou = false; snap.you = 0; }
      snap.used[who === 'kage' ? 'kage' : 'you']++;
      snap.charge = who === 'kage' ? 'kage' : 'you'; snap.chargeT = Math.max(0, CFG.energy.charge); snap.chargeK = 1;
      out = 'special';
    }
    if (!live) return out;
    if (last && last !== who) { // an answer steps both bars, bar the one a special just spent
      snap.volleys++;
      const s = step(), spent = out === 'special' ? who : '';
      if (spent !== 'kage') snap.kage = fill(snap.kage + s);
      if (spent !== 'you') snap.you = fill(snap.you + s);
      if (!out) out = 'volley';
    }
    last = who;
    return out;
  }

  // game time: the charge runs down (a hit's freeze and slow-mo hold it too)
  function update(simDt) {
    snap.on = on();
    if (!snap.on) { snap.armedYou = false; snap.armedKage = false; snap.charge = ''; snap.chargeT = 0; snap.chargeK = 0; return; }
    if (snap.charge && simDt > 0) {
      snap.chargeT -= simDt;
      const T = Math.max(1e-3, CFG.energy.charge);
      if (snap.chargeT <= 0) { snap.charge = ''; snap.chargeT = 0; snap.chargeK = 0; } else snap.chargeK = U.clamp01(snap.chargeT / T);
    }
  }

  reset();
  return { snap, reset, newRally, full, armed, arm, prepare, onHit, update, curved, get on() { return on(); }, get curveOn() { return curveOn(); }, get tapOn() { return tapOn(); } };
}

// ════════ ninja.js ════════
// ninja.js — the Neo Dojo rig: Kiru's own body, which the cast sheet (Tools/neo-dojo-cast) draws every character on, in the
// sheet's units (x 0..200, the hood centred on (100, 90), the soles on y = 231.5). A "look" says what goes on it: Kage-X's
// dark gi and magenta neon (kage.js), Kiru's blue gi and vermilion headband (kiru.js).
//
// The parts that never bend (the head in each of the look's expressions, the torso, the katana on the back) are baked once per
// size into small canvases, glow included (shadowBlur at bake time only, never per frame). What moves is drawn live with plain
// strokes: the headband tails, both arms, both legs and the shoes. So a frame of a character is three drawImage calls and ~20
// strokes. A look that needs them also gets whole-body silhouettes of named poses in its ghost colour (afterimages: one
// drawImage each) and a scratch canvas for a one-colour pass over any pose (the white flash of an arrival, a glow, clones).
//
// look = { colors: { armF, armB, legF, legB, fist, fistS, shoe, stripe|null, smear, ghost },
//          heads: ['open', 'blink', ...],          the expressions to bake (pose.face picks one; 'open' is the fallback)
//          key(): a number that rebakes the art when it changes (Kage's neon slider),  glow(): the bake's glow strength,
//          smearA(): the strike smear's strength (optional),
//          head(H, g, k, face), torso(H, g, k), back(H, g, k)   bake into g (already in sheet units),
//          tails(H, ctx, P)                         live, in the head's frame,
//          sil: { name: pose fields }               silhouettes to bake (optional),  tint: true  keep the scratch canvas }

const NINJA = {
  SOLE: 231.5, CX: 100, // the sheet point between the feet
  NECK_X: 100, NECK_Y: 150, // the head turns about this
  SH_F: { x: 73, y: 156 }, SH_B: { x: 127, y: 156 }, // shoulders: front (toward the target) and back
  HIP_F: { x: 90, y: 196 }, HIP_B: { x: 110, y: 196 },
  ARM_LEN: 36, // shoulder → fist at rest
  ARM_MAX: 2.5, // a strike stretches the arm this far (a smear frame reads as speed, not as a rubber arm)
  L: '#3d4c95', // Kiru's moonlit sticker outline: every character wears it
  HOOD: 'M26 90a74 66 0 1 0 148 0a74 66 0 1 0 -148 0Z',
  FACE: 'M44 80 C70 68 130 68 156 80 C168 85 168 104 156 109 C130 121 70 121 44 109 C32 104 32 85 44 80 Z',
  TORSO: 'M64 158 Q66 146 82 143 L118 143 Q134 146 136 158 L133 199 Q100 205 67 199 Z',
  TORSO_SH: 'M112 144 L118 143 Q134 146 136 158 L133 199 Q123 202 112 203 Z',
};

function createNinja(doc, look) {
  const TAU = Math.PI * 2, N = NINJA, C = look.colors;
  const SIL_K = 0.6, TINT_K = 0.75; // afterimages and flashes are translucent and brief: baked under full size
  const art = { k: 0, key: NaN, heads: {}, torso: null, back: null, sil: {}, tint: null };
  const hasCanvas = !!(doc && doc.createElement && typeof Path2D !== 'undefined');

  function part(x0, y0, x1, y1, k) {
    const c = doc.createElement('canvas');
    c.width = Math.max(1, Math.ceil((x1 - x0) * k)); c.height = Math.max(1, Math.ceil((y1 - y0) * k));
    const g = c.getContext('2d');
    g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
    g.lineCap = 'round'; g.lineJoin = 'round';
    return { c, g, k, x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  // the sheet's helpers, on a canvas: sp = a fill with the sticker outline under it, ln = a round stroke, fl = a fill,
  // se = an ellipse with the outline (rot in degrees)
  const H = {
    L: N.L,
    sp(g, d, fill, w) { const p = new Path2D(d); g.lineWidth = w; g.strokeStyle = N.L; g.stroke(p); g.fillStyle = fill; g.fill(p); },
    ln(g, d, col, w, a, dash) {
      const p = new Path2D(d);
      g.save(); g.globalAlpha = a == null ? 1 : a; g.lineWidth = w; g.strokeStyle = col;
      if (dash) g.setLineDash(dash);
      g.stroke(p); g.restore();
    },
    fl(g, d, col, a) { g.save(); g.globalAlpha = a == null ? 1 : a; g.fillStyle = col; g.fill(new Path2D(d)); g.restore(); },
    ell(cx, cy, rx, ry, rot) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); return p; },
    se(g, cx, cy, rx, ry, fill, w, rotDeg) { const p = H.ell(cx, cy, rx, ry, (rotDeg || 0) * Math.PI / 180); g.lineWidth = w; g.strokeStyle = N.L; g.stroke(p); g.fillStyle = fill; g.fill(p); },
    rrect(x, y, w, h, r) {
      const p = new Path2D();
      p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath();
      return p;
    },
    // the sheet's #glow (a 3.2-unit gaussian blur merged twice under the shape): two shadow passes, then the shape clean
    glow(g, k, col, draw) {
      const s = look.glow ? look.glow() : 0;
      if (s > 0) { g.save(); g.shadowColor = col; g.shadowBlur = 6.4 * k * s; draw(); if (s > 0.5) draw(); g.restore(); }
      draw();
    },
    grad(g, x1, y1, x2, y2, stops) {
      const gr = g.createLinearGradient(x1, y1, x2, y2);
      for (let i = 0; i < stops.length; i++) gr.addColorStop(i / (stops.length - 1), stops[i]);
      return gr;
    },
  };

  // ───────────────────────── the rig, in sheet units ─────────────────────────
  // limb(): the sheet's two-stroke capsule, shoulder → fist, bowed by `bend` (units, sideways)
  function limb(ctx, sx, sy, hx, hy, bend, col, w) {
    const dx = hx - sx, dy = hy - sy, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const mx = (sx + hx) / 2 - (dy / d) * bend, my = (sy + hy) / 2 + (dx / d) * bend;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, hx, hy);
    ctx.strokeStyle = N.L; ctx.lineWidth = w + 7; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }
  function fist(ctx, x, y, r) {
    ctx.beginPath(); ctx.ellipse(x, y, r, r, 0, 0, TAU);
    ctx.lineWidth = 4; ctx.strokeStyle = N.L; ctx.stroke(); ctx.fillStyle = C.fist; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, y - 2.5); ctx.quadraticCurveTo(x, y + 0.5, x + 6, y - 2.5);
    ctx.lineWidth = 2; ctx.strokeStyle = C.fistS; ctx.stroke();
  }
  function leg(ctx, hx, hy, ax, ay, knee, col) {
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo((hx + ax) / 2 - knee, (hy + ay) / 2); ctx.lineTo(ax, ay);
    ctx.strokeStyle = N.L; ctx.lineWidth = 24; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 18; ctx.stroke();
  }
  function shoe(ctx, x, y, rot) { // 'M-14 8 q0 -10 12 -10 h8 q6 0 6 6 v4 z' at the ankle, and the look's sole stripe if it has one
    ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
    ctx.beginPath(); ctx.moveTo(-14, 8); ctx.quadraticCurveTo(-14, -2, -2, -2); ctx.lineTo(6, -2); ctx.quadraticCurveTo(12, -2, 12, 4); ctx.lineTo(12, 8); ctx.closePath();
    ctx.lineWidth = 5; ctx.strokeStyle = N.L; ctx.stroke(); ctx.fillStyle = C.shoe; ctx.fill();
    if (C.stripe) { ctx.beginPath(); ctx.moveTo(-13, 7.5); ctx.lineTo(5, 7.5); ctx.lineWidth = 2; ctx.strokeStyle = C.stripe; ctx.stroke(); }
    ctx.restore();
  }

  // pose: everything one frame needs, in sheet units unless named otherwise
  const pose = {
    x: 0, y: 0, s: 1, mir: 1, tilt: 0, sqx: 1, sqy: 1, // screen foot point (CSS px), px per sheet unit, facing, lean, squash
    headTilt: 0, headDy: 0, face: 'open', t: 0, wind: 0, lift: 0,
    fx: 50, fy: 184, fBend: 10, // front fist
    bx: 151, by: 193, bBend: -9, // back fist
    lax: 85, lay: 223.5, lrot: 0, lknee: 3, rax: 115, ray: 223.5, rrot: 0, rknee: 3, // ankles (front leg = l)
    smear: 0, // 0..1 a strike's speed: a ghost of the arm trails it
    sx0: 0, sy0: 0, // where the fist was a moment ago (smear)
  };
  const REST = { x: 0, y: 0, s: 1, mir: 1, tilt: 0, sqx: 1, sqy: 1, headTilt: 0, headDy: 0, face: 'open', t: 0, wind: 0, lift: 0, fx: 50, fy: 184, fBend: 10, bx: 151, by: 193, bBend: -9, lax: 85, lay: 223.5, lrot: 0, lknee: 3, rax: 115, ray: 223.5, rrot: 0, rknee: 3, smear: 0, sx0: 0, sy0: 0 };

  const blit = (ctx, P) => ctx.drawImage(P.c, P.x, P.y, P.w, P.h);
  function headFrame(ctx, P) { ctx.translate(N.NECK_X, N.NECK_Y + P.headDy); ctx.rotate(P.headTilt); ctx.translate(-N.NECK_X, -N.NECK_Y); }

  // the body in sheet units, under whatever transform the caller set
  function body(ctx, P) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.save(); headFrame(ctx, P); look.tails(H, ctx, P); ctx.restore(); // the tails ride the head, behind everything
    blit(ctx, art.back);
    limb(ctx, N.SH_B.x, N.SH_B.y, P.bx, P.by, P.bBend, C.armB, 15); fist(ctx, P.bx, P.by, 9.5);
    leg(ctx, N.HIP_B.x, N.HIP_B.y, P.rax, P.ray, P.rknee, C.legB); leg(ctx, N.HIP_F.x, N.HIP_F.y, P.lax, P.lay, P.lknee, C.legF);
    shoe(ctx, P.rax, P.ray, P.rrot); shoe(ctx, P.lax, P.lay, P.lrot);
    blit(ctx, art.torso);
    ctx.save(); headFrame(ctx, P); blit(ctx, art.heads[P.face] || art.heads.open); ctx.restore();
    if (P.smear > 0.05) { // a strike: a ghost of the arm, in the look's colour, behind the fist
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 * P.smear * (look.smearA ? look.smearA() : 1);
      ctx.beginPath(); ctx.moveTo(P.sx0, P.sy0); ctx.lineTo(P.fx, P.fy);
      ctx.strokeStyle = C.smear; ctx.lineWidth = 22; ctx.stroke();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    limb(ctx, N.SH_F.x, N.SH_F.y, P.fx, P.fy, P.fBend, C.armF, 15); fist(ctx, P.fx, P.fy, 9.5 + 2 * P.smear);
  }
  function frame(ctx, kx, ky, P) {
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.translate(P.x, P.y); if (P.tilt) ctx.rotate(P.tilt); ctx.scale(P.mir * P.s * P.sqx, P.s * P.sqy); ctx.translate(-N.CX, -N.SOLE);
  }

  // ───────────────────────── bake ─────────────────────────
  // one pose of the whole body in one colour, into a part canvas (cleared first)
  function solid(P, Q, col) {
    const g = P.g;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.clearRect(0, 0, P.c.width, P.c.height);
    g.setTransform(P.k, 0, 0, P.k, -P.x * P.k, -P.y * P.k);
    body(g, Q);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-in';
    g.fillStyle = col; g.fillRect(0, 0, P.c.width, P.c.height);
    g.globalCompositeOperation = 'source-over';
  }
  // bake at k device px per sheet unit: when the shown size grows past what is baked, shrinks well under it, or the look changed
  function ensureArt(k) {
    if (!hasCanvas) return false;
    k = U.clamp(k, 0.3, 6);
    const key = look.key ? look.key() : 0;
    if (art.torso && k <= art.k * 1.02 && k >= art.k * 0.5 && art.key === key) return true;
    art.k = k; art.key = key;
    for (let i = 0; i < look.heads.length; i++) { const p = part(8, 6, 196, 168, k); look.head(H, p.g, k, look.heads[i]); art.heads[look.heads[i]] = p; }
    let p = part(54, 134, 146, 214, k); look.torso(H, p.g, k); art.torso = p;
    p = part(16, 102, 172, 236, k); look.back(H, p.g, k); art.back = p;
    if (look.sil) for (const name in look.sil) { p = part(-6, 0, 290, 244, k * SIL_K); solid(p, Object.assign({}, REST, look.sil[name]), C.ghost); art.sil[name] = p; }
    art.tint = look.tint ? part(-34, -24, 294, 250, k * TINT_K) : null; // wide enough for a fist at full stretch
    return true;
  }

  function drawRig(ctx, kx, ky, P) {
    frame(ctx, kx, ky, P);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    body(ctx, P);
  }
  // an afterimage: a baked silhouette (look.sil[name]) placed by P's position, size, facing, lean and squash
  function drawSil(ctx, kx, ky, P, name, alpha, lighter) {
    const S = art.sil[name];
    if (!S || !(alpha > 0.004)) return;
    frame(ctx, kx, ky, P);
    ctx.globalAlpha = Math.min(1, alpha); ctx.globalCompositeOperation = lighter ? 'lighter' : 'source-over';
    blit(ctx, S);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // the whole body in P's pose as one colour (look.tint): rendered into the scratch canvas, then placed like the rig
  function drawTint(ctx, kx, ky, P, col, alpha, lighter) {
    const T = art.tint;
    if (!T || !(alpha > 0.004)) return;
    solid(T, P, col);
    frame(ctx, kx, ky, P);
    ctx.globalAlpha = Math.min(1, alpha); ctx.globalCompositeOperation = lighter ? 'lighter' : 'source-over';
    blit(ctx, T);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // a soft glow round the whole body (an armed special): one radial fill, in sheet units so it fits the character at any size
  let auraG = null, auraCtx = null, auraCol = '';
  function drawAura(ctx, kx, ky, P, col, alpha) {
    if (!(alpha > 0.004)) return;
    if (auraCtx !== ctx || auraCol !== col) {
      auraCtx = ctx; auraCol = col;
      auraG = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      auraG.addColorStop(0, U.rgba(col, 0.85)); auraG.addColorStop(0.45, U.rgba(col, 0.4)); auraG.addColorStop(1, U.rgba(col, 0));
    }
    frame(ctx, kx, ky, P);
    ctx.translate(N.CX, 128); ctx.scale(122, 136);
    ctx.globalAlpha = Math.min(1, alpha); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = auraG;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // the same one-colour pass, rendered once and placed n times, each (dx, dy) CSS px further from P and fainter (clones)
  function drawTints(ctx, kx, ky, P, col, n, dx, dy, alpha, lighter) {
    const T = art.tint;
    if (!T || !(alpha > 0.004) || !(n > 0)) return;
    solid(T, P, col);
    const x0 = P.x, y0 = P.y;
    ctx.globalCompositeOperation = lighter ? 'lighter' : 'source-over';
    for (let i = 1; i <= n; i++) {
      P.x = x0 + dx * i; P.y = y0 + dy * i;
      frame(ctx, kx, ky, P);
      ctx.globalAlpha = Math.min(1, alpha * (1 - (i - 1) / n));
      blit(ctx, T);
    }
    P.x = x0; P.y = y0;
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // screen point → sheet units, through the pose's rig transform (the inverse of drawRig's)
  function toSheet(sx, sy, out) {
    let dx = sx - pose.x, dy = sy - pose.y;
    if (pose.tilt) { const c = Math.cos(-pose.tilt), s = Math.sin(-pose.tilt), ex = dx * c - dy * s; dy = dx * s + dy * c; dx = ex; }
    out.x = dx / (pose.mir * pose.s * pose.sqx) + N.CX; out.y = dy / (pose.s * pose.sqy) + N.SOLE;
    return out;
  }
  // keep a fist within the stretched arm's length of its shoulder
  function limitArm(sh, p) {
    const dx = p.x - sh.x, dy = p.y - sh.y, d = Math.sqrt(dx * dx + dy * dy), m = N.ARM_LEN * N.ARM_MAX;
    if (d > m) { p.x = sh.x + (dx / d) * m; p.y = sh.y + (dy / d) * m; }
  }

  return { art, pose, REST, hasCanvas, ensureArt, drawRig, drawSil, drawTint, drawTints, drawAura, toSheet, limitArm, H };
}

// ════════ kage.js ════════
// kage.js — Kage-X, Kiru's rival from 2099 (Neo Dojo Cast, ND-03), as the computer opponent: his art, his rig and the brain
// that plays the other half of the court.
//
// ART. Drawn from the cast sheet's own path data (Tools/neo-dojo-cast/index.html: Kiru's hood, face, torso and shoe, Kage's
// colours and his magenta neon) on the Neo Dojo rig in ninja.js, which Kiru (kiru.js) shares: KAGE_LOOK below is what goes
// on it. Hood and face, torso and belt and the katana on his back are baked at the size they are shown, glow included; the
// headband tails, arms, legs and shoes are drawn live.
//
// BRAIN. He never cheats the physics: a swing is a `hand` (owner 'cpu') handed to the same applyHit a finger uses. To pick
// where to swing he runs a private copy of the world forward (the real physics, 1.2 s ahead, re-run after every hit and
// a few times a second), then takes the first moment the ball is in his half, in reach (a ninja jumps for high balls) and
// somewhere his legs can get him in time. Skill is time and error, not foreknowledge: a reaction delay after every hit
// (he cannot read a ball nobody has seen yet), top foot speed, jump height, and how clean the contact is (accuracy).
//
// He plays the half given by setSide(−1 left / +1 right) and winds the rope the way that half's player does: a hit AWAY
// from the camera on your own half. Left → clockwise (+1 along φ), right → counter-clockwise (−1).
//
// SPECIAL (energy.js). When his bar is full he weighs it as each swing starts: often when you are winding the rope, now and
// then when it is level, rarely when he is winding it. Armed, he glows; his special leaves shadow clones along the strike.
//
// Clocks: everything he does runs on SIM time, so a hit's freeze and slow-mo hold him too (fair, and it reads as drama). The
// glow and the clones run on REAL time, so they play out inside the freeze.

CFG.kage = {
  side: 0, // 0 left, 1 right, 2 a coin flip each match
  difficulty: 5, // 1..10: reaction, foot speed, wind-up, jump and hand speed (kageSkill)
  accuracy: 0.7, // 0..1: how clean his contact is (whiffs, grazes and wild aim fall as it rises)
  power: 1, // × his hand speed
  reaction: 1, // × his reaction time (lower = sharper)
  speed: 1, // × his foot speed
  jump: 1, // × his jump height (0 = he never leaves the ground)
  size: 1.75, // m tall
  glow: 1, // his neon
  boost: 1, // 1 = he also hits a ball already going his way, to speed it up
  taunts: 1, // 1 = he talks
  warp: 1, // 1 = his hits get the slow-mo too (at reduced strength)
  warpScale: 0.7, // how much of a hit's slow-mo his hits get
  showReach: 0, // 1 = draw his reach and his planned contact (tuning aid)
};
CFG_SCHEMA.push(
  { path: 'kage.side', label: 'Kage plays', type: 'choice', options: ['Left', 'Right', 'Random'], min: 0, max: 2, step: 1, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.difficulty', label: 'Difficulty', min: 1, max: 10, step: 1, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.accuracy', label: 'Accuracy', min: 0, max: 1, step: 0.05, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.power', label: 'Hit power', min: 0.4, max: 1.6, step: 0.05, group: 'Kage', rank: -2, unit: 'x' },
  { path: 'kage.reaction', label: 'Reaction time', min: 0.25, max: 3, step: 0.05, group: 'Kage', rank: -2, unit: 'x' },
  { path: 'kage.speed', label: 'Foot speed', min: 0.3, max: 2, step: 0.05, group: 'Kage', rank: -2, unit: 'x' },
  { path: 'kage.jump', label: 'Jump height', min: 0, max: 1.6, step: 0.05, group: 'Kage', rank: -2, unit: 'x' },
  { path: 'kage.boost', label: 'Speeds up balls going his way', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.taunts', label: 'Trash talk', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.warp', label: 'Slow-mo on his hits', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kage', rank: -2, unit: '' },
  { path: 'kage.size', label: 'Height', min: 1.1, max: 2.2, step: 0.05, group: 'Kage', rank: -2, unit: 'm' },
  { path: 'kage.glow', label: 'Neon', min: 0, max: 1.5, step: 0.05, group: 'Kage', rank: -2, unit: 'x' },
  { path: 'kage.showReach', label: 'Show his reach', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kage', rank: -2, unit: '' }
);

// What a difficulty level means, end to end (t = 0 at level 1, 1 at level 10). The multipliers above scale these.
function kageSkill(out) {
  const K = CFG.kage, t = U.clamp01((K.difficulty - 1) / 9);
  out.t = t;
  out.reaction = U.lerp(0.38, 0.06, t) * K.reaction; // s from a hit until he can read the new trajectory
  out.foot = U.lerp(3, 7.5, t) * K.speed; // m/s
  out.accel = U.lerp(16, 40, t); // m/s²
  out.windup = U.lerp(0.16, 0.08, t); // s his fist needs from guard to contact
  out.hop = U.lerp(0.15, 0.1, t); // s to leave the ground (a leap's apex comes this + 0.07·√height after takeoff)
  out.jump = U.lerp(1.1, 1.75, t) * K.jump; // m of leap: a hard hit rides up near the pole top, so a ninja has to fly
  out.hand = U.lerp(7, 14, t) * K.power; // m/s of fist
  const a = U.clamp01(K.accuracy);
  out.whiff = 0.32 * (1 - a) * (1 - a * 0.5); // chance a swing finds nothing (0.32 at 0, ~0.06 at 0.7, 0 at 1); fast balls add to it
  out.offSd = 0.08 + 0.55 * (1 - a); // sd of where the fist meets the ball, in (ball + fist) radii: 0 = dead centre
  out.aimSd = (2 + 24 * (1 - a)) * Math.PI / 180; // sd of his aim
  return out;
}

};

// Kage-X on the Neo Dojo rig (ninja.js): the sheet's dark gi and visor, and his magenta neon
const KAGE_ART = {
  RIM: '#a9bcff', NEON: '#e93dff', NEON_D: '#b52bd1', INK: '#13152a',
  EYE_L: 'M62 94 L90 90 L88 101 L64 102 Z', EYE_R: 'M138 94 L110 90 L112 101 L136 102 Z',
  EYE_LH: 'M64 95 L88 92 L87 95 L65 97 Z', EYE_RH: 'M136 95 L112 92 L113 95 L135 97 Z',

      steer(st.sx, st.sz, dt);
      if (!st.struck && st.t >= st.tc) { st.struck = true; out = strike(w, serving); if (!out) { st.res = -1; quip('whiff', 0.35); } }
      if (st.t >= st.tc + Math.max(0.26, st.up) && st.y <= 0) { st.phase = 'ready'; st.tLand = st.h > 0.05 ? st.t : st.tLand; st.y = 0; st.cool = 0.12; st.reread = 0; }
    } else {
      st.y = 0;
      if (info.state === 'ready' && !serving) { st.has = false; steer(st.homeX, st.homeZ, dt); } // your serve: he waits at home
      else {
        if (serving) st.serveT += dt;

  // a hit landed (or not) — his, or yours
  function onSwing(res) {

  }
  function onWorldHit(res, who) {

    kageSkill(SK);
    st.blind = SK.reaction; st.has = false; st.reread = 0;
    if (lastW) guardSpot(lastW); // he cannot read it yet, but he knows where reversals come back
    if (st.phase === 'swing' && !st.struck) { st.phase = 'ready'; st.y = 0; } // he was set for a different ball
  }
  // his bar is full and a swing is starting: does he cut loose? lead: turns wound YOUR way (+) or his (−)
  function wantsSpecial(lead) {
    const p = lead > 0.4 ? 0.8 : lead > -0.4 ? 0.4 : 0.2;
    if (!(rndE() < p)) return false;
    if (CFG.kage.taunts > 0) { const L = KAGE_LINES.special; st.say = L[Math.floor(rndE() * L.length) % L.length]; st.sayT = 1.5; st.sayCool = 2.2; }
    return true;
  }
  function onSpecial() { st.specialRt = st.rt; st.specials++; }
  function onRoundEnd(winner) {
    st.phase = winner === 'kage' ? 'won' : 'lost'; st.moodT = 0; st.has = false; st.vx = 0; st.vz = 0;
    st.sayCool = 0; quip(winner === 'kage' ? 'won' : 'lost', 0.95);
  }

  // a new rally: home (or by the ball when he serves), still, reading again
  function reset(w, info) {
    geom(); home();
    st.phase = 'ready'; st.has = false; st.blind = 0.3; st.cool = 0; st.reread = 0; st.serveT = 0;
    st.vx = 0; st.vz = 0; st.y = 0; st.struck = false; st.res = 0; st.moodT = 0; st.sx = 0; st.sz = 0;
    st.x = st.homeX; st.z = st.homeZ;
    if (info && info.server === 'kage' && w) { const b = w.ball.p; st.x = b.x + st.side * 0.5; st.z = b.z + 0.45; }
    clampRegion();
    st.say = ''; st.sayT = 0; st.specialRt = -9;
    if (info && info.server === 'kage') quip('serve', 0.6);
  }

  // ───────────────────────── the actor the scene draws ─────────────────────────
  const A = { x: 0, y: 0, s: 0, d: 0 }, B = { x: 0, y: 0, s: 0, d: 0 }, Cc = { x: 0, y: 0, s: 0, d: 0 };
  const T1 = { x: 0, y: 0 }, T2 = { x: 0, y: 0 };
  let shadowG = null, shadowCtx = null;

  function poseFor(cam, w) {
    const P = pose, K = CFG.kage, t = st.t;
    cam.project(st.x, st.y, st.z, A);
    P.x = A.x; P.y = A.y; P.s = (A.s * K.size) / 207.5; P.t = t;
    // facing: toward what he is about to hit, else the ball (hysteresis so he does not flicker)

    cam.project(tx, ty, tz, B);
    if (st.phase !== 'swing') { if (B.x > A.x + 14) st.face = 1; else if (B.x < A.x - 14) st.face = -1; }
    P.mir = st.face > 0 ? -1 : 1;
    const sp = Math.sqrt(st.vx * st.vx + st.vz * st.vz), runK = U.clamp01(sp / 3);
    cam.project(st.x + st.vx * 0.05, st.y, st.z + st.vz * 0.05, Cc);
    const svx = (Cc.x - A.x) * 20; // screen px/s
    P.tilt = U.clamp(svx * 0.0006, -0.22, 0.22);
    P.sqx = 1; P.sqy = 1; P.headTilt = Math.sin(t * 1.3) * 0.03; P.headDy = Math.sin(t * 2.2) * 1.2; P.lift = 0;
    P.wind = U.clamp01(sp / 4 + (st.y > 0.05 ? 0.6 : 0)); P.face = t > st.blinkAt - 0.12 && t < st.blinkAt ? 'blink' : 'open'; P.smear = 0;

    if (land >= 0 && land < 0.25) { const k = Math.exp(-land * 14) * Math.cos(land * 30) * 0.12; P.sqy = 1 - k; P.sqx = 1 + k * 0.7; }
    else { const br = Math.sin(t * 2.4) * 0.012; P.sqy = 1 + br; P.sqx = 1 - br * 0.5; }

    if (st.y > 0.04) { P.lax = 90; P.lay = 210; P.rax = 116; P.ray = 214; P.lknee = 12; P.rknee = 10; P.lrot = 0.2; P.rrot = 0.1; P.lift = 0.6; }
    else {

      P.lknee = 3 + 6 * runK; P.rknee = 3 + 6 * runK; P.lrot = -s1 * 0.2 * runK; P.rrot = s1 * 0.2 * runK;
    }
    // arms: rest, guard (the ball is his), the swing, and the moods
    const guard = st.has || (w.ball.p.x * st.side > 0 && w.ball.speed > 1);
    P.fx = guard ? 58 : 50 + Math.sin(t * 2.4) * 1.5; P.fy = guard ? 162 : 184; P.fBend = 10;
    P.bx = guard ? 142 : 151; P.by = guard ? 170 : 193; P.bBend = -9;
    if (sp > 0.6 && !guard) { P.fx = 50 + c1 * 10 * runK; P.fy = 182 - Math.abs(s1) * 4; P.bx = 151 - c1 * 10 * runK; P.by = 190 - Math.abs(c1) * 4; }
    if (st.phase === 'won') { const k = Math.min(1, st.moodT * 5); P.fx = U.lerp(50, 64, k); P.fy = U.lerp(184, 112, k); P.bx = U.lerp(151, 138, k); P.by = U.lerp(193, 112, k); P.lift = 1; P.headTilt = -0.06 + Math.sin(st.moodT * 9) * 0.05; }

  // the striking arm: wind back, whip through the contact point at the moment of contact, follow through, recover
  function swingArm(cam, w, P) {
    const t = st.t, tc = st.tc, ts = st.ts, r = w.ball.r;
    cam.project(st.cx - st.dx * r, st.cy, st.cz - st.dz * r, B); toSheet(B.x, B.y, T1); // where the fist meets the ball
    limitArm(SH_F, T1);
    const ax = T1.x - SH_F.x, ay = T1.y - SH_F.y, al = Math.sqrt(ax * ax + ay * ay) || 1, ux = ax / al, uy = ay / al;
    const bkx = SH_F.x - ux * 30 + 6, bky = SH_F.y - uy * 30 - 12; // wound back, away from the ball

      else { const e = U.easeIn((u - 0.55) / 0.45, 2.2); fx = U.lerp(bkx, T1.x, e); fy = U.lerp(bky, T1.y, e); P.smear = e; const e0 = U.easeIn(Math.max(0, (u - 0.62) / 0.45), 2.2); k0x = U.lerp(bkx, T1.x, e0); k0y = U.lerp(bky, T1.y, e0); }

      else { const e = U.easeInOut(U.clamp01((v - 1) * 0.11 / 0.24)); fx = U.lerp(T2.x, 58, e); fy = U.lerp(T2.y, 162, e); k0x = fx; k0y = fy; P.smear = 0.3 * (1 - e); }
    }
    P.fx = fx; P.fy = fy; P.sx0 = k0x; P.sy0 = k0y; P.fBend = 4;
    P.bx = 150 + ux * 8; P.by = 176 - uy * 10; // the back arm counter-swings
  }

  function drawShadow(ctx, cam, kx, ky) {
    const K = CFG.kage, rr = 0.3 * K.size / 1.6 * (1 - 0.35 * U.clamp01(st.y / 1.5));
    cam.project(st.x, 0, st.z, A); cam.project(st.x + rr, 0, st.z, B); cam.project(st.x, 0, st.z + rr, Cc);
    if (shadowCtx !== ctx) { shadowCtx = ctx; shadowG = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); shadowG.addColorStop(0, 'rgba(0,0,0,0.85)'); shadowG.addColorStop(0.6, 'rgba(0,0,0,0.6)'); shadowG.addColorStop(1, 'rgba(0,0,0,0)'); }
    ctx.setTransform(kx * (B.x - A.x), ky * (B.y - A.y), kx * (Cc.x - A.x), ky * (Cc.y - A.y), kx * A.x, ky * A.y);
    ctx.globalAlpha = 0.55 * (1 - 0.5 * U.clamp01(st.y / 1.5)); ctx.fillStyle = shadowG;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();

    if (K.glow > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.1 * K.glow * (1 - U.clamp01(st.y)); ctx.fillStyle = NEON; ctx.beginPath(); ctx.arc(0, 0, 1.25, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalAlpha = 1;

  }

  function drawReach(ctx, cam, kx, ky) {
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.strokeStyle = NEON; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.6;
    ctx.beginPath();
    for (let i = 0; i <= 32; i++) { const a = (i / 32) * TAU; cam.project(st.x + Math.cos(a) * G.so, 0, st.z + Math.sin(a) * G.so, A); if (i) ctx.lineTo(A.x, A.y); else ctx.moveTo(A.x, A.y); }
    ctx.stroke();
    if (st.has || st.phase === 'swing') { // the planned contact, and where he will stand for it
      cam.project(st.cx, st.cy, st.cz, A); ctx.beginPath(); ctx.arc(A.x, A.y, 10, 0, TAU); ctx.moveTo(A.x - 14, A.y); ctx.lineTo(A.x + 14, A.y); ctx.moveTo(A.x, A.y - 14); ctx.lineTo(A.x, A.y + 14); ctx.stroke();
      cam.project(st.sx, 0, st.sz, A); ctx.beginPath(); ctx.arc(A.x, A.y, 4, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawSay(ctx, cam, kx, ky) {
    if (!(st.sayT > 0) || !st.say) return;
    const a = U.clamp01(st.sayT / 0.25) * U.clamp01((st.sayT > 1.4 ? 1.6 - st.sayT : 1) * 6);
    if (a <= 0.01) return;
    // over the hood as drawn (he is an upright billboard; a projected head-top point would sit on his face at this pitch)
    A.x = pose.x; A.y = pose.y - (SOLE - 16) * pose.s * pose.sqy;

    ctx.font = '800 ' + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    const tw = ctx.measureText(st.say).width, pw = tw + fs * 1.3, ph = fs * 1.9;
    const x = U.clamp(A.x - pw / 2, 6, cam.w - pw - 6), y = Math.max(cam.safe.top - ph * 0.4, A.y - ph - 10);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(24,12,34,0.92)'; ctx.strokeStyle = NEON; ctx.lineWidth = 1.5;

    ctx.beginPath(); ctx.moveTo(U.clamp(A.x, x + ph / 2, x + pw - ph / 2) - 6, y + ph - 0.5); ctx.lineTo(U.clamp(A.x, x + ph / 2, x + pw - ph / 2), y + ph + 8); ctx.lineTo(U.clamp(A.x, x + ph / 2, x + pw - ph / 2) + 6, y + ph - 0.5); ctx.fill();
    ctx.fillStyle = '#fbeaff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  }

  function draw(ctx, cam, kx, ky, w) {
    if (!hasCanvas) return;
    poseFor(cam, w);
    const need = pose.s * Math.max(kx, ky);
    if (!R.ensureArt(need * 1.15)) return;
    // his special: shadow clones of the strike, strung back along it (a dark body, then a neon edge)
    const ca = st.rt - st.specialRt;
    if (ca >= 0 && ca < CLONE) {
      const q = ca / CLONE, d = (0.16 + 0.5 * U.easeOut(q, 2)) * CFG.kage.size / 1.75;
