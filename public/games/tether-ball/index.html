<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tether Ball</title>
<meta name="description" content="Swipe to hit the tether ball and wind the rope up the pole as fast as you can.">
<meta name="theme-color" content="#0e1119">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tether Ball">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1119'/%3E%3Crect x='29' y='6' width='6' height='52' rx='3' fill='%23a9b1c2'/%3E%3Cpath d='M32 10Q52 24 46 40' stroke='%23ece7d8' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='46' cy='44' r='10' fill='%23ffb020'/%3E%3C/svg%3E">
<style>
/* Tether Ball: dark greybox, one amber accent. Phones first (portrait), then landscape (slim HUD), tablet, desktop.
   The canvas owns every swipe: the HUD layer ignores the pointer except on its buttons, and the page never scrolls. */

:root {
  /* mirrors CFG.pal in config.js (tests/ui.mjs fails if they drift) */
  --bg0: #0e1119; --bg1: #1a2030; --ground: #262d3d; --groundLine: #37405a; --groundRim: #4a5575;
  --pole: #a9b1c2; --poleDark: #6d7690; --rope: #ece7d8; --ball: #f3f2ec; --ballShade: #9aa0b0; --ballMark: #2f3547;
  --shadow: rgba(0,0,0,0.38); --accent: #ffb020; --hot: #ff5a1f; --cool: #5ad1ff; --text: #e9edf6; --dim: #8c95ab;

  color-scheme: dark; /* one committed dark look: native controls and scrollbars follow it (the Artifact host pins light on :root) */
  --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
  --ink: #1a1100; /* text on amber */
  --kage: #e93dff; --kage-ink: #1a0322; /* Kage-X's neon (Neo Dojo Cast), and text on it */
  --glass: rgba(26,32,48,.78); --line: rgba(255,255,255,.1);
  --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--text);
  font: 500 14px/1.2 var(--ui); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
  touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; margin: 0; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

/* ───────────── HUD: the top band is 76 px under the safe inset (the camera keeps the court out of it) ───────────── */
#hud { position: absolute; inset: 0; z-index: 4; padding: calc(var(--st) + 12px) var(--sr) 0 var(--sl); pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.4), 0 0 14px rgba(14,17,25,.9); }
.hud-in { max-width: 640px; height: 76px; margin: 0 auto; padding: 3px 12px 0; display: flex; flex-direction: column; }
.r1 { display: flex; align-items: center; gap: 8px; height: 46px; }
.r2 { display: flex; align-items: center; gap: 10px; height: 22px; padding-right: 2px; margin-top: 2px; }

.k { font: 800 10px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.u { font: 800 12px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

.speed { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
#hSpeed { display: inline-block; min-width: 2ch; font-size: 46px; font-weight: 800; line-height: 46px; letter-spacing: -.02em; color: var(--text); transform-origin: 0 70%; transition: color .18s; }
#hSpeed[data-heat="1"] { color: #f2d5a0; }
#hSpeed[data-heat="2"] { color: var(--accent); }
#hSpeed[data-heat="3"] { color: #ff8519; }
#hSpeed[data-heat="4"] { color: var(--hot); }

.clock { flex: 1; display: flex; justify-content: center; }
#hTime { display: block; width: 7ch; font-size: 21px; font-weight: 700; line-height: 1; color: var(--dim); transition: color .2s; }
#hud[data-state="playing"] #hTime { color: var(--text); }
#hud[data-state="wound"] #hTime { color: var(--accent); }

.btns { display: flex; margin-right: -3px; }
.ib { position: relative; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--text); pointer-events: auto; text-shadow: none; }
.ib::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); transition: background .12s, transform .12s, border-color .15s; }
.ib svg { position: relative; display: block; width: 22px; height: 22px; margin: auto; }
.ib:active::before { transform: scale(.9); background: rgba(52,62,88,.92); }
.ib[aria-expanded="true"] { color: var(--accent); }
.ib[aria-expanded="true"]::before { border-color: rgba(255,176,32,.55); }
.ib .x { display: none; }
.ib.muted { color: var(--dim); }
.ib.muted .x { display: inline; }
.ib.muted .w { display: none; }

.wind { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
#hTurns { min-width: 3ch; font-size: 15px; font-weight: 800; color: var(--text); text-align: right; }
.of { margin-left: -2px; font-size: 12px; font-weight: 700; color: var(--dim); }
.bar { position: relative; flex: 1; min-width: 36px; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(233,237,246,.13); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
#hBar { position: absolute; inset: 0; border-radius: 3px; background: linear-gradient(90deg, #ff9a1f, var(--accent)); transform-origin: 0 50%; transform: scaleX(0); will-change: transform; }
.bar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--tick, 16%) - 1.5px), rgba(14,17,25,.8) calc(var(--tick, 16%) - 1.5px), rgba(14,17,25,.8) var(--tick, 16%)); }
.hits { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
#hHits { display: inline-block; min-width: 2ch; font-size: 15px; font-weight: 800; text-align: right; transform-origin: 100% 60%; }

/* versus: the score takes the clock's place and a tug of war for the rope takes the winding row. Kage's side of each sits on
   his side of the screen (data-ks), and the tug fills from the middle toward whoever the rope is winding for. */
.score, .tug { display: none; }
#hud[data-mode="versus"] .clock, #hud[data-mode="versus"] .wind, #hud[data-mode="versus"] .bar, #hud[data-mode="versus"] .hits { display: none; }
#hud[data-mode="versus"] .score { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 7px; white-space: nowrap; }
#hud[data-mode="versus"] .tug { flex: 1; display: flex; align-items: center; gap: 8px; }
#hud[data-ks="r"] .score, #hud[data-ks="r"] .tug, #hud[data-ks="r"] .tl { flex-direction: row-reverse; }
#hud[data-ks="r"] .tbar { transform: scaleX(-1); }
.score b { min-width: 1.2ch; font-size: 25px; font-weight: 800; line-height: 1; text-align: center; }
.score .who { font: 800 11px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; }
.score .kage, #hKage { color: var(--kage); }
.score .you, #hYou { color: var(--accent); }
.score .dash { font-size: 18px; font-weight: 700; color: var(--dim); }
.tl { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.tl b { min-width: 3ch; font-size: 14px; font-weight: 800; text-align: center; color: var(--dim); transition: color .2s; }
.tk .k { color: #c98bd6; } .ty .k { color: #e7c58a; }
#hud[data-lead="y"] .ty b { color: var(--accent); }
#hud[data-lead="k"] .tk b { color: var(--kage); }
.tbar { position: relative; flex: 1; min-width: 40px; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(233,237,246,.13); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.tbar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(233,237,246,.6); }
#hTugK, #hTugY { position: absolute; top: 0; bottom: 0; width: 50%; transform: scaleX(0); will-change: transform; }
#hTugK { right: 50%; transform-origin: 100% 50%; background: linear-gradient(270deg, #b52bd1, var(--kage)); }
#hTugY { left: 50%; transform-origin: 0 50%; background: linear-gradient(90deg, #ff9a1f, var(--accent)); }

#hint { position: absolute; left: 0; right: 0; bottom: calc(var(--sb) + 16px); display: flex; justify-content: center; opacity: 0; transition: opacity .45s ease; text-shadow: none; }
#hint.on { opacity: 1; }
#hintText { padding: 10px 20px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); font: 800 14px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--text); animation: hintPulse 2.2s ease-in-out infinite; }
@keyframes hintPulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }

/* ───────────── energy (versus): your special button in your bottom corner, Kage's gauge in his. The ring fills with volleys
   (amber yours, magenta his); a full one glows, and yours takes a tap: armed, it fills storm blue. The hint keeps between them. */
#energy { display: none; }
#hud[data-energy="on"] #energy { display: block; }
.eg { position: absolute; bottom: calc(var(--sb) + 10px); width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); pointer-events: none; text-shadow: none; transition: background .15s, color .15s, box-shadow .2s, transform .1s; }
#hud[data-ks="l"] .ek, #hud[data-ks="r"] .ey { left: calc(var(--sl) + 12px); }
#hud[data-ks="l"] .ey, #hud[data-ks="r"] .ek { right: calc(var(--sr) + 12px); }
.eg svg { display: block; width: 100%; height: 100%; overflow: visible; }
.eg .tr { fill: none; stroke: rgba(233,237,246,.13); stroke-width: 4; }
.eg .fl { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .25s ease-out, stroke .15s; }
.eg .ic { fill: currentColor; }
.ey .fl { stroke: var(--accent); }
.ek .fl { stroke: var(--kage); }
.ey[data-st="full"], .ey[data-st="armed"] { pointer-events: auto; }
.ey[data-st="full"] { color: var(--cool); animation: egPulse 1.1s ease-in-out infinite; }
.ey[data-st="full"] .fl { stroke: var(--cool); }
.ey[data-st="armed"] { background: var(--cool); color: #04121c; box-shadow: 0 0 0 3px rgba(90,209,255,.35), 0 0 26px rgba(90,209,255,.75); }
.ey[data-st="armed"] .fl { stroke: #f2fdff; }
.ey:active { transform: scale(.92); }
.ek[data-st="full"] { color: var(--kage); box-shadow: inset 0 0 0 1px rgba(233,61,255,.55), 0 0 16px rgba(233,61,255,.45); }
.ek[data-st="armed"] { background: var(--kage); color: var(--kage-ink); box-shadow: 0 0 0 3px rgba(233,61,255,.3), 0 0 26px rgba(233,61,255,.75); }
.ek[data-st="armed"] .fl { stroke: #fff1ff; }
#hud[data-state="wound"] .ey, #hud[data-trigger="curve"] .ey[data-st] { pointer-events: none; } /* a curved swipe is the trigger: the ring only shows it */
@keyframes egPulse { 0%, 100% { box-shadow: inset 0 0 0 1px rgba(90,209,255,.5), 0 0 6px rgba(90,209,255,.3); transform: scale(1); } 50% { box-shadow: inset 0 0 0 1px rgba(90,209,255,.9), 0 0 24px rgba(90,209,255,.75); transform: scale(1.07); } }
#hud[data-energy="on"] #hint { padding: 0 76px; }
#hud[data-energy="on"] #hintText { text-align: center; line-height: 1.25; }
@media (max-width: 429px) { #hud[data-energy="on"] #hintText { padding: 8px 14px; font-size: 12px; letter-spacing: .05em; } }

/* ───────────── result card ───────────── */
#result { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: calc(var(--st) + 84px) calc(var(--sr) + 20px) calc(var(--sb) + 20px) calc(var(--sl) + 20px); background: rgba(14,17,25,.62); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s ease, visibility 0s .25s; cursor: pointer; }
#result.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .25s ease; }
.card { width: min(100%, 340px); padding: 22px 20px 16px; border-radius: 22px; text-align: center; cursor: default; background: linear-gradient(180deg, rgba(36,44,64,.98), rgba(22,28,42,.98)); border: 1px solid var(--line); box-shadow: 0 24px 64px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
#result.on .card { animation: cardIn .42s cubic-bezier(.2,1.25,.35,1) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
.kick { margin: 0; font: 800 13px/1 var(--ui); letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.rtime { margin-top: 10px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
#rTime { font-size: 78px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
#rUnit { font: 800 26px/1 var(--ui); color: var(--dim); font-style: normal; }
.delta { margin: 8px 0 0; min-height: 26px; display: flex; align-items: center; justify-content: center; font: 700 14px/1 var(--ui); color: var(--dim); }
.badge { padding: 7px 14px; border-radius: 99px; background: var(--accent); color: var(--ink); font: 800 12px/1 var(--ui); letter-spacing: .18em; text-transform: uppercase; }
#result.on .badge { animation: badgePop .55s .25s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes badgePop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { padding: 10px 4px 9px; border-radius: 12px; background: rgba(255,255,255,.05); }
.stat b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.stat span { display: block; margin-top: 4px; font: 800 10px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.go { width: 100%; height: 52px; margin-top: 16px; border: 0; border-radius: 14px; background: var(--accent); color: var(--ink); font: 800 17px/1 var(--ui); letter-spacing: .02em; box-shadow: 0 6px 18px rgba(255,176,32,.28); transition: transform .1s; }
.go:active { transform: scale(.97); }
.tap { margin: 10px 0 0; font: 600 12px/1 var(--ui); color: var(--dim); }
/* versus: who took the round, and the score, in place of the time */
.vres { display: none; margin-top: 12px; }
#result[data-mode="versus"] .vres { display: block; }
#result[data-mode="versus"] .rtime, #result[data-mode="versus"] .delta { display: none; }
#rWho { display: block; font-size: 32px; font-weight: 800; line-height: 1.08; letter-spacing: -.01em; }
#result[data-winner="you"] #rWho { color: var(--accent); }
#result[data-winner="kage"] #rWho { color: var(--kage); }
#rScore { margin: 10px 0 2px; font: 800 15px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
#result[data-winner="kage"] .kick { color: var(--kage); }
#result[data-winner="kage"] .go { background: var(--kage); color: var(--kage-ink); box-shadow: 0 6px 18px rgba(233,61,255,.3); }

/* ───────────── Feel panel: bottom drawer (~45 %) on tall screens, side drawer on wide ones ───────────── */
#panel { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 45%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: var(--sb); border-radius: 18px 18px 0 0; background: rgba(16,20,30,.99); border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -12px 40px rgba(0,0,0,.5); transform: translateY(100%); visibility: hidden; pointer-events: none; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s; }
#panel.open { transform: none; visibility: visible; pointer-events: auto; transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.grab { flex: none; display: block; width: 36px; height: 4px; margin: 6px auto 0; border-radius: 2px; background: rgba(255,255,255,.2); }
.ph { flex: none; display: flex; align-items: center; gap: 4px; padding: 2px 2px 6px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
.ph h2 { margin: 0 auto 0 0; font: 800 18px/1 var(--ui); letter-spacing: .02em; }
.pb-btn { flex: none; height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font: 700 13px/1 var(--ui); white-space: nowrap; }
.pb-btn:active { background: rgba(255,255,255,.14); }
.pb-btn.warn { color: #ff9a7a; }
.pb-btn.go { width: auto; height: 36px; margin: 0; padding: 0 16px; background: var(--accent); border-color: transparent; color: var(--ink); box-shadow: none; font-size: 13px; }
.pb-x { flex: none; width: 44px; height: 44px; margin-left: -2px; padding: 0; border: 0; background: none; color: var(--dim); display: grid; place-items: center; }
.pb-x svg { width: 20px; height: 20px; }
.more { display: none; }
@media (max-aspect-ratio: 1/1) and (min-width: 480px) { .more { display: inline; } }

.pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 0 14px 14px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
.grp { border-bottom: 1px solid rgba(255,255,255,.06); }
.grp > summary { display: flex; align-items: center; gap: 8px; min-height: 44px; list-style: none; cursor: pointer; font: 800 12px/1 var(--ui); letter-spacing: .15em; text-transform: uppercase; color: var(--dim); }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::after { content: ''; margin: 0 4px 3px auto; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
.grp[open] > summary::after { transform: rotate(45deg); margin-bottom: 5px; }
.grp[open] > summary { color: var(--text); }
.grp .n { padding: 3px 7px; border-radius: 99px; background: rgba(255,176,32,.16); color: var(--accent); font-size: 11px; letter-spacing: .04em; }

.row { display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: 2px; padding: 4px 0 2px; }
.lab { margin-right: 4px; font: 600 14px/1.2 var(--ui); }
.val { justify-self: end; font: 700 14px/1 var(--ui); text-align: right; color: var(--dim); white-space: nowrap; }
.val small { margin-left: 3px; font-size: 11px; font-weight: 600; opacity: .8; }
.row.chg .val { color: var(--accent); }
.rst { width: 32px; height: 32px; margin: -10px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--accent); display: grid; place-items: center; visibility: hidden; }
.rst svg { width: 16px; height: 16px; }
.row.chg .rst { visibility: visible; }
.sl { grid-column: 1 / -1; position: relative; height: 36px; touch-action: pan-y; cursor: pointer; }
.sl input[type="range"] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; --f: .5; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(13px + (100% - 26px) * var(--f)), rgba(255,255,255,.14) calc(13px + (100% - 26px) * var(--f))); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,.55); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,.55); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb, .sl.held input[type="range"]::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(255,176,32,.32), 0 1px 5px rgba(0,0,0,.55); }

/* a switch (0/1) at the end of its label, and a row of choices under its label */
.row.tg { grid-template-columns: 1fr auto auto; padding: 7px 0; }
.sw { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: rgba(255,255,255,.16); transition: background .15s; }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.sw:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row.ch { grid-template-columns: 1fr auto; row-gap: 6px; padding: 7px 0 5px; }
.seg { grid-column: 1 / -1; display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: rgba(255,255,255,.07); }
.opt { flex: 1 1 0; min-width: 0; height: 34px; padding: 0 6px; border: 0; border-radius: 8px; background: none; color: var(--dim); font: 700 13px/1 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt[aria-checked="true"] { background: var(--accent); color: var(--ink); }
.row.chg .opt[aria-checked="true"] { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }

.io { padding: 10px 0 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
.io-hint { margin: 0 0 8px; font: 600 13px/1.3 var(--ui); color: var(--dim); }
.io-hint.err { color: var(--hot); }
.io textarea { display: block; width: 100%; height: 100px; padding: 8px 10px; resize: none; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.4); color: var(--text); font: 16px/1.3 var(--mono); user-select: text; -webkit-user-select: text; touch-action: pan-y; }
.io textarea:focus { outline: none; border-color: var(--accent); }
.io-row { display: flex; gap: 8px; margin-top: 8px; }
.toast { position: absolute; left: 50%; bottom: calc(var(--sb) + 14px); padding: 9px 16px; border-radius: 99px; background: var(--accent); color: var(--ink); font: 800 13px/1 var(--ui); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.45); opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ───────────── expanded: the panel fills the screen, the groups flow into columns, and a filter row appears ───────────── */
.pb-full { width: 34px; margin-left: 0; }
.pb-full svg { width: 19px; height: 19px; }
.pb-full .i { display: none; }
#panel.full .pb-full { color: var(--accent); }
#panel.full .pb-full .o { display: none; }
#panel.full .pb-full .i { display: inline; }
.pfind { display: none; }
#panel.full { left: 0; right: 0; top: 0; bottom: 0; width: auto; height: auto; max-width: none; margin: 0; padding: var(--st) var(--sr) var(--sb) var(--sl); border-radius: 0; border: 0; background: rgba(12,15,24,.975); box-shadow: none; }
#panel.full .grab { display: none; }
#panel.full .ph { padding-top: 8px; }
#panel.full .pfind { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
.pfind input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.35); color: var(--text); font: 600 16px/1 var(--ui); user-select: text; -webkit-user-select: text; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
.pfind input:focus { outline: none; border-color: var(--accent); }
#panel.full #feelGroups { columns: 290px auto; column-gap: 16px; padding-top: 10px; }
#panel.full .grp { display: block; break-inside: avoid; margin: 0 0 12px; padding: 0 12px 6px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(255,255,255,.025); }
#panel.full .sl { height: 30px; }
/* each group a container: wherever its column is wide enough a slider row is one line (label · value · slider), so a phone
   shows twice the rows; labels wrap rather than truncate. Browsers without container queries keep the two-line rows. */
#panel.full .grp { container-type: inline-size; }
@container (min-width: 300px) {
  .row { grid-template-columns: minmax(0, 1fr) 26px auto minmax(96px, 40%); column-gap: 6px; padding: 2px 0; }
  .row .sl { grid-column: auto; height: 30px; }
  .row .lab { font-size: 13.5px; line-height: 1.15; }
  .row .val { font-size: 13px; }
  .row.tg { grid-template-columns: minmax(0, 1fr) 26px auto; padding: 4px 0; }
  .row.ch { grid-template-columns: minmax(0, 1fr) 26px; padding: 4px 0; }
  .grp > summary { min-height: 40px; }
}

/* ───────────── wide screens: the panel docks right, the strip stays centred over the court ───────────── */
@media (min-aspect-ratio: 1/1) {
  #panel { left: auto; top: 0; bottom: 0; right: 0; width: min(320px, 46vw); height: auto; max-width: none; margin: 0; padding: var(--st) var(--sr) var(--sb) 0; border-radius: 0; border: 0; border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.5); transform: translateX(100%); }
  #panel.open { transform: none; }
  .grab { display: none; }
  .ph { padding-top: 8px; padding-left: 10px; }
  .pb-btn { padding: 0 6px; font-size: 12px; } /* the docked drawer is 300 px: the header keeps ~20 px to spare */
}

/* a phone is too narrow for the names in the score: the tug row under it carries them */
@media (max-width: 429px) { .score .who { display: none; } .score { gap: 9px; } }

/* ───────────── narrow phones (320 px): the same strip, one size down so nothing outgrows the screen ───────────── */
@media (max-width: 359px) {
  .r1 { gap: 4px; }
  .speed { gap: 4px; }
  #hSpeed { font-size: 36px; }
  .u { font-size: 11px; letter-spacing: .08em; }
  #hTime { font-size: 16px; }
  .r2 { gap: 8px; }
}

/* ───────────── short screens (landscape phones): one slim row, the camera gives the court the height ───────────── */
@media (max-height: 519px) {
  #panel { top: calc(var(--st) + 48px); width: min(300px, 44vw); padding-top: 0; } /* docks under the slim HUD row, so the gear and every readout stay in view */
  #hud { padding-top: calc(var(--st) + 4px); }
  .hud-in { max-width: 800px; height: 44px; padding-top: 0; flex-direction: row; align-items: center; gap: 14px; }
  .r1, .r2 { display: contents; }
  .speed { order: 1; }
  .clock { order: 2; flex: none; }
  #hud[data-mode="versus"] .score { order: 2; flex: none; }
  #hud[data-mode="versus"] .tug { order: 3; }
  .wind { order: 3; }
  .bar { order: 4; }
  .hits { order: 5; }
  .btns { order: 6; margin-left: 0; }
  #hSpeed { font-size: 34px; line-height: 40px; }
  #hTime { font-size: 19px; }
  #hint { bottom: calc(var(--sb) + 2px); }
  #hintText { padding: 6px 14px; font-size: 11px; }
  .eg { bottom: calc(var(--sb) + 4px); width: 44px; height: 44px; }
  #result { padding-top: calc(var(--st) + 48px); padding-bottom: calc(var(--sb) + 8px); }
  .card { padding: 12px 16px 10px; }
  .rtime { margin-top: 6px; }
  #rTime { font-size: 54px; }
  #rWho { font-size: 24px; }
  .vres { margin-top: 6px; }
  #rScore { margin-top: 6px; }
  #rUnit { font-size: 20px; }
  .delta { margin-top: 4px; min-height: 22px; }
  .stats { margin-top: 8px; }
  .stat { padding: 6px 4px; }
  .stat b { font-size: 19px; }
  .go { height: 44px; margin-top: 10px; }
  .tap { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #panel, #panel.open, #result, #result.on, #hint, .toast, #hSpeed { transition: none; }
  #hintText, #result.on .card, #result.on .badge, .ey[data-st="full"] { animation: none; }
  .eg, .eg .fl { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Tether ball court. Swipe across the ball to hit it."></canvas>

  <div id="hud" data-state="ready">
    <div class="hud-in">
      <div class="r1">

          </button>
          <button id="bReset" class="ib" type="button" aria-label="Restart">

          </button>
        </div>
      </div>
      <div class="r2">
        <div class="wind"><span class="k">Winding</span><b id="hTurns">0.0</b><span class="of">/ <span id="hGoal">6.3</span> turns</span></div>
        <div class="bar" aria-hidden="true"><i id="hBar"></i></div>
        <div class="hits"><b id="hHits">0</b><span class="k">hits</span></div>
        <div class="tug" aria-label="Rope: who it is winding for"><span class="tl tk"><b id="hTK">0.0</b><span class="k">Kage</span></span><div class="tbar" aria-hidden="true"><i id="hTugK"></i><i id="hTugY"></i></div><span class="tl ty"><span class="k">You</span><b id="hTY">0.0</b></span></div>
      </div>
    </div>
    <div id="hint" role="status"><span id="hintText">Swipe the ball</span></div>
    <div id="energy">
      <div id="eKage" class="eg ek" role="img" aria-label="Kage's energy" data-st="fill">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="tr" cx="24" cy="24" r="20"/><circle id="eKageR" class="fl" cx="24" cy="24" r="20" pathLength="100" transform="rotate(-90 24 24)"/><path class="ic" d="M14.5 34.5 Q18.5 17.5 34.5 12.5 Q24.5 20.5 19.5 35.5 Z"/></svg>
      </div>
      <button id="bSpecial" class="eg ey" type="button" aria-label="Special: charging" aria-pressed="false" data-st="fill" disabled>
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="tr" cx="24" cy="24" r="20"/><circle id="eYouR" class="fl" cx="24" cy="24" r="20" pathLength="100" transform="rotate(-90 24 24)"/><path class="ic" d="M26.8 11.5 L16.5 26.2 H23.2 L21.2 36.5 L31.5 21.8 H24.8 Z"/></svg>
      </button>

  </div>

  <div id="result" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="rTitle">

      <div class="rtime"><b id="rTime">0.00</b><i id="rUnit">s</i></div>
      <p class="delta"><span class="badge" id="rNew" hidden>New best</span><span id="rDelta"></span></p>
      <div class="stats">
        <div class="stat"><b id="rHits">0</b><span>Hits</span></div>
        <div class="stat"><b id="rTop">0</b><span>Top mph</span></div>
        <div class="stat"><b id="rBest">-</b><span id="rBestK">Best</span></div>
      </div>
      <button id="rAgain" class="go" type="button">Go again</button>

  </div>

  <aside id="panel" aria-label="Feel settings" aria-hidden="true">
    <span class="grab" aria-hidden="true"></span>
    <header class="ph">
      <h2>Feel</h2>
      <button id="feelFull" class="pb-x pb-full" type="button" aria-label="Expand settings to full screen" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="o" d="M14.5 4.5h5v5M9.5 19.5h-5v-5M19.5 4.5l-6 6M4.5 19.5l6-6"/><path class="i" d="M19.5 10.5h-6v-6M4.5 13.5h6v6M13.5 10.5l6-6M10.5 13.5l-6 6"/></svg>
      </button>
      <button id="feelCopy" class="pb-btn" type="button" aria-label="Copy settings"><span>Copy</span><span class="more"> settings</span></button>
      <button id="feelPaste" class="pb-btn" type="button" aria-label="Paste settings"><span>Paste</span><span class="more"> settings</span></button>
      <button id="feelReset" class="pb-btn warn" type="button" aria-label="Reset all settings to defaults">Reset</button>
      <button id="feelClose" class="pb-x" type="button" aria-label="Close Feel settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11l-11 11"/></svg>
      </button>

      <button id="feelOpenAll" class="pb-btn" type="button">Open all</button>
      <button id="feelCloseAll" class="pb-btn" type="button">Close all</button>

      <div class="io" id="feelIOWrap" hidden>

        <textarea id="feelIO" rows="6" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Settings JSON"></textarea>
        <div class="io-row"><button id="feelApply" class="pb-btn go" type="button">Apply</button><button id="feelDone" class="pb-btn" type="button">Done</button></div>

  </aside>
</div>
<script>
(() => {
'use strict';
// ════════ config.js ════════
// config.js — the shared numbers, and the registry the Feel panel reads.
//
// RULES (every module):
//  · CFG is ONE mutable object. Read values at USE time (CFG.hit.vMax inside the function that needs it),
//    never copy them into a local at creation: the Feel panel retunes them live.
//  · A module owns ITS OWN section and declares it at the top of its own file (CFG.fx = {...}). Nobody edits
//    another module's section, and nobody but the physics module edits CFG.world / CFG.physics / CFG.hit.
//  · A module that wants a value on the Feel panel pushes entries onto CFG_SCHEMA in its own file.
//  · Nothing here (or in any module) touches window/document/AudioContext at load time, so the pure
//    modules load in Node for tests.
//
// Units: metres, seconds, kilograms, radians. Screen units are CSS pixels.
// World axes: +x right, +y up, +z TOWARD the camera (the player's side). The pole stands on the y axis.
// Azimuth φ = atan2(z, x): increasing φ runs +x → +z, i.e. CLOCKWISE seen from above / on screen.

const CFG = {
  // The physical setup. The physics module owns this section (it may retune these to hit its feel targets).
  world: {
    poleR: 0.034, // pole radius (m): sets how much rope one turn eats (2π·poleR); 0.034 → ~6.3 turns fill the pole
    poleH: 2.75, // top of the pole
    attachY: 2.65, // where the rope is tied (just under the top)
    ropeL: 1.6, // rope length, tie point → BALL CENTRE, fully unwound
    ballR: 0.26, // a toy-sized ball: readable on a phone
    ballMass: 0.3,
    coilPitch: 0.012, // the rope's tangent point steps down this far per turn, so wound coils read as a stack
    swayD: 0.16, // m: a fresh ball starts this far out from the pole and swings back to tap it, so it is alive
    groundR: 1.9, // the court radius the camera must keep on screen (the scene may draw a bigger floor that bleeds off)
  },

  // Camera framing (the camera module owns this). A pitched three-quarter view from the player's side:
  // the whole orbit is visible and a swipe maps onto the plane the ball is flying in.
  cam: {
    pitchDeg: 48, // how far down we look (90 = straight down)
    dist: 9.5, // metres from the target: larger = flatter perspective
    targetY: 1.35, // what the camera looks at (on the pole axis)
    fitMarginPx: 10,
    fovHint: 0, // unused; the focal length is fitted to the screen, see camera.js
  },

  // Greybox palette: neutral greys and one amber accent that only the hit uses.
  pal: {
    bg0: '#0e1119',
    bg1: '#1a2030',
    ground: '#262d3d',
    groundLine: '#37405a',
    groundRim: '#4a5575',
    pole: '#a9b1c2',
    poleDark: '#6d7690',
    rope: '#ece7d8',
    ball: '#f3f2ec',
    ballShade: '#9aa0b0',
    ballMark: '#2f3547',
    shadow: 'rgba(0,0,0,0.38)',
    accent: '#ffb020', // amber: the hit
    hot: '#ff5a1f', // orange-red: the hard hit
    cool: '#5ad1ff', // cyan: speed streaks
    text: '#e9edf6',
    dim: '#8c95ab',
  },
};

// The Feel panel's schema: [{ path:'hit.vMax', label:'Max ball speed', min, max, step, group:'Hit', unit:'m/s' }]
const CFG_SCHEMA = [];

// ---- helpers the panel and main.js use (pure) ----
function cfgGet(path) {
  let o = CFG;
  const ks = path.split('.');
  for (let i = 0; i < ks.length; i++) { if (o == null) return undefined; o = o[ks[i]]; }
  return o;
}
function cfgSet(path, v) {
  const ks = path.split('.');
  let o = CFG;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = v;
}
// Defaults are frozen by main.js AFTER every module has declared its section.
let CFG_DEFAULT = null;
function cfgFreezeDefaults() { CFG_DEFAULT = JSON.parse(JSON.stringify(CFG)); }
// Only the numbers on the panel: { 'hit.vMax': 17, ... }
function cfgSnapshotTuned() {
  const o = {};
  for (let i = 0; i < CFG_SCHEMA.length; i++) o[CFG_SCHEMA[i].path] = cfgGet(CFG_SCHEMA[i].path);
  return o;
}
function cfgApplyTuned(o) {
  if (!o) return;
  for (let i = 0; i < CFG_SCHEMA.length; i++) {
    const s = CFG_SCHEMA[i];
    const v = o[s.path];
    if (typeof v === 'number' && isFinite(v)) cfgSet(s.path, Math.min(s.max, Math.max(s.min, v)));
  }
}
function cfgResetTuned() {
  if (!CFG_DEFAULT) return;
  for (let i = 0; i < CFG_SCHEMA.length; i++) {
    const p = CFG_SCHEMA[i].path;
    let o = CFG_DEFAULT;
    const ks = p.split('.');
    for (let j = 0; j < ks.length; j++) o = o && o[ks[j]];
    if (typeof o === 'number') cfgSet(p, o);
  }
}

// ════════ util.js ════════
// util.js — small shared tools. One namespace object (U) so names never collide across modules.
// Everything here is pure and allocation-free except U.rng (which returns a closure once).

const U = {
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  invLerp(a, b, v) { return a === b ? 0 : (v - a) / (b - a); },
  // map v from [a,b] to [c,d], clamped
  remap(v, a, b, c, d) { const t = a === b ? 0 : (v - a) / (b - a); return c + (d - c) * (t < 0 ? 0 : t > 1 ? 1 : t); },
  smoothstep(a, b, v) { let t = a === b ? 0 : (v - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },

  // easings, all on t in [0,1]
  easeOut(t, p) { t = 1 - t; return 1 - Math.pow(t < 0 ? 0 : t, p || 3); },
  easeIn(t, p) { return Math.pow(t < 0 ? 0 : t > 1 ? 1 : t, p || 3); },
  easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  // overshoots past 1 then settles; s ~ 1.7 is the classic
  easeOutBack(t, s) { s = s == null ? 1.70158 : s; const u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; },

  // frame-rate independent exponential approach: x moves toward target with rate lambda (1/s)
  damp(x, target, lambda, dt) { return target + (x - target) * Math.exp(-lambda * dt); },

  // angles
  TAU: Math.PI * 2,
  // wrap to (-π, π]
  wrapAngle(a) { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; },
  // shortest signed difference b - a
  angDiff(a, b) { return U.wrapAngle(b - a); },

  // seeded RNG (mulberry32): U.rng(seed)() → [0,1)
  rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },

  // colour: '#rrggbb' → [r,g,b]; U.rgba('#ffb020', .5) → 'rgba(255,176,32,0.5)'; U.mix(c1,c2,t) → '#rrggbb'
  hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
  rgba(c, a) { const h = U.hex(c); return 'rgba(' + h[0] + ',' + h[1] + ',' + h[2] + ',' + (a == null ? 1 : a) + ')'; },
  mix(c1, c2, t) {
    const a = U.hex(c1), b = U.hex(c2);
    const r = Math.round(a[0] + (b[0] - a[0]) * t), g = Math.round(a[1] + (b[1] - a[1]) * t), bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
  },

  // m/s → mph (what the HUD shows)
  mph(ms) { return ms * 2.2369363; },

  // vector helpers on {x,y,z} objects, writing into `o` (never allocating)
  v3(o, x, y, z) { o.x = x; o.y = y; o.z = z; return o; },
  len3(v) { return Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z); },
  dot3(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; },

// ════════ camera.js ════════
// camera.js — a pitched three-quarter perspective camera, fitted to the screen.
//
// project(x,y,z,out)       world → screen px (CSS), plus out.s = px per metre at that depth, out.d = depth
// unproject(sx,sy,planeY)  screen px → the world point where that pixel's ray meets the horizontal plane y=planeY
//                          (this is how a swipe becomes a hand moving through the ball's plane)
// setInsetBottom(px)       px of extra safe space under the court (the Feel panel covers it): the court refits above it
// area                     {l,t,r,b}: the screen box the fit keeps the ball's envelope and the pole in
// sync()                   refit if a CFG number the fit reads was retuned (the scene calls it every frame)
//
// The fit is about the BALL, not the floor: the ball's reachable envelope and the pole top must stay inside the safe
// rect, and the floor disc and its rings are free to bleed off the edges. That makes the ball as big as the window allows
// on a short or wide screen, where fitting the whole court used to shrink it to a dot.
//
// Hit-feel effects live on the camera so EVERYTHING (scene, fx, input) agrees on where things are:
//   cam.zoom      punch-in multiplier about (focusX, focusY)    (default 1)
//   cam.shakeX/Y  px offset                                      (default 0)
//   cam.roll      radians about the screen centre                (default 0)
// project/unproject apply and invert all three. The fx module sets them each frame.

Object.assign(CFG.cam, {
  fitHighY: 2.6, // fallback height of the highest orbit when physics.lidGap is not declared (it is attachY − lidGap)
  fitBall: 1.16, // ball radii kept clear above and below: the scene's own speed stretch at full speed
  pitchWideDeg: 56, // looking-down angle on a wide window: steeper than pitchDeg (the tall-window one) keeps a round court in less height
  wideFrom: 1.0, // w/h where the blend from pitchDeg to pitchWideDeg starts (a square window) …
  wideTo: 2.0, // … and where it is all pitchWideDeg
});
// Not on the Feel panel: tests/ui.mjs counts the panel's groups and rows with this file loaded. pitchDeg and pitchWideDeg are the
// ones to expose; until then retune CFG.cam from the console and sync() refits.

function createCamera() {
  const cam = {
    w: 390, h: 844, dpr: 1,
    safe: { top: 76, bottom: 64, left: 10, right: 10 }, // px kept clear for HUD / notches / the open Feel panel (bottom includes insetBottom)
    insetBottom: 0, pitchDeg: 48, // the extra bottom space asked for, and the pitch the fit actually chose
    F: 700, cx: 195, cy: 422, // focal length (px) and the screen point the target projects to
    zoom: 1, shakeX: 0, shakeY: 0, roll: 0, focusX: 195, focusY: 422,
    pos: { x: 0, y: 0, z: 0 }, fwd: { x: 0, y: 0, z: -1 }, up: { x: 0, y: 1, z: 0 },
    pxPerM: 100, // px per metre at the pole axis, mid-height (for sizing things in screen space)
    area: { l: 0, t: 0, r: 0, b: 0 }, // the screen box the fit keeps the ball's envelope and the pole in (at rest: no zoom, roll or shake)
  };
  const base = { top: 76, bottom: 64, left: 10, right: 10 }; // the HUD bands the caller asked for, before the inset
  const NK = 14;
  const key = new Float64Array(NK), probe = new Float64Array(NK);
  const NL = 16, NA = 64; // polar steps and azimuths sampled over the ball's envelope: the fit errs by under a pixel

  // the pitch follows the window's shape: a wide window is short for the orbit's width, a tall one is narrow for its height
  function pitchFor() {
    const c = CFG.cam, t = U.smoothstep(c.wideFrom, c.wideTo, cam.w / cam.h);
    return c.pitchDeg + (c.pitchWideDeg - c.pitchDeg) * t;
  }

  function basis() {
    const c = CFG.cam;
    cam.pitchDeg = pitchFor();
    const th = (cam.pitchDeg * Math.PI) / 180, s = Math.sin(th), co = Math.cos(th);
    cam.pos.x = 0; cam.pos.y = c.targetY + c.dist * s; cam.pos.z = c.dist * co;
    cam.fwd.x = 0; cam.fwd.y = -s; cam.fwd.z = -co; // looking at (0, targetY, 0)
    cam.up.x = 0; cam.up.y = co; cam.up.z = -s;
  }

  // the height the lid holds the ball under; physics declares its gap, and the fallback covers a build without it
  function lidY() {
    const W = CFG.world, P = CFG.physics;
    return Math.min(W.attachY, P && typeof P.lidGap === 'number' ? W.attachY - P.lidGap : CFG.cam.fitHighY);
  }

  // normalised (pre-focal) coords of a world point: xn = x/depth, yn = up/depth, depth
  function norm(x, y, z, out) {
    const dx = x - cam.pos.x, dy = y - cam.pos.y, dz = z - cam.pos.z;
    const depth = dy * cam.fwd.y + dz * cam.fwd.z;
    out.xn = dx / depth; out.yn = (dy * cam.up.y + dz * cam.up.z) / depth; out.d = depth;
    return out;

  cam.refit = function () {
    basis();
    const W = CFG.world, c = CFG.cam, pad = c.fitMarginPx;
    const t = { xn: 0, yn: 0, d: 0 };
    let xMax = 0, yMin = Infinity, yMax = -Infinity;
    // mx, my: metric half-sizes around the point, seen at its own depth (a ball is bigger the nearer it is)
    const add = (x, y, z, mx, my) => {
      norm(x, y, z, t);
      const ex = mx / t.d, ey = my / t.d;

      if (t.yn + ey > yMax) yMax = t.yn + ey;

    // radius is the rope plus the pole's, since the rope leaves the pole's surface: the sim reaches 1.63 m of a 1.6 m rope.
    // The extremes of a convex set seen in perspective are on its boundary, so sample the shell.
    const reach = W.ropeL + W.poleR, aMax = Math.acos(Math.min(1, Math.max(-1, (W.attachY - lidY()) / reach)));
    const myBall = c.fitBall * W.ballR; // a hair taller than wide: a climbing ball can stretch up the screen at the orbit's top, but at its sides it moves toward or away from us and only narrows
    for (let k = 0; k <= NL; k++) {

      for (let i = 0; i < NA; i++) { const a = (i / NA) * Math.PI * 2; add(Math.cos(a) * rho, y, Math.sin(a) * rho, W.ballR, myBall); }

    add(0, W.poleH, 0, 0.08, 0.08); // the pole cap
    add(0, 0, 0, 0.14, 0.14); // and its foot, so the pole stands on something

    cam.focusX = cam.w / 2; cam.focusY = cam.h / 2;
    norm(0, 1.2, 0, t);
    cam.pxPerM = cam.F / t.d;
    stamp();
  };

  // every CFG number the fit reads: a Feel-panel retune refits on the next sync()
  function stamp(into) {
    const c = CFG.cam, W = CFG.world, k = into || key;
    k[0] = c.pitchDeg; k[1] = c.pitchWideDeg; k[2] = c.wideFrom; k[3] = c.wideTo; k[4] = c.dist; k[5] = c.targetY;
    k[6] = c.fitBall; k[7] = c.fitMarginPx; k[8] = W.attachY; k[9] = W.ropeL; k[10] = W.poleH; k[11] = W.ballR;
    k[12] = W.poleR; k[13] = lidY();

  };

  function applySafe() {
    cam.safe.top = base.top; cam.safe.left = base.left; cam.safe.right = base.right; cam.safe.bottom = base.bottom + cam.insetBottom;

  cam.resize = function (w, h, dpr, safe) {
    cam.w = w; cam.h = h; cam.dpr = dpr || 1;

    else {

      const short = h < 520;

    }
    applySafe();
    cam.refit();
  };

  // the Feel panel covers the bottom of a tall phone: keep the court out from under it. 0 restores the full-height fit.
  cam.setInsetBottom = function (px) {
    const v = px > 0 ? px : 0;
    if (v === cam.insetBottom) return;
    cam.insetBottom = v;
    applySafe();
    cam.refit();
  };

  cam.project = function (x, y, z, out) {
    const dx = x - cam.pos.x, dy = y - cam.pos.y, dz = z - cam.pos.z;
    const depth = dy * cam.fwd.y + dz * cam.fwd.z;
    const k = cam.F / depth;
    let sx = cam.cx + dx * k, sy = cam.cy - (dy * cam.up.y + dz * cam.up.z) * k;
    if (cam.zoom !== 1) { sx = cam.focusX + (sx - cam.focusX) * cam.zoom; sy = cam.focusY + (sy - cam.focusY) * cam.zoom; }
    if (cam.roll !== 0) {
      const mx = cam.w * 0.5, my = cam.h * 0.5, cr = Math.cos(cam.roll), sr = Math.sin(cam.roll), rx = sx - mx, ry = sy - my;
      sx = mx + rx * cr - ry * sr; sy = my + rx * sr + ry * cr;
    }
    out.x = sx + cam.shakeX; out.y = sy + cam.shakeY; out.s = k * cam.zoom; out.d = depth;
    return out;
  };

  // returns `out` filled, or null when the ray does not reach the plane (above the horizon)
  cam.unproject = function (sx, sy, planeY, out) {
    let x = sx - cam.shakeX, y = sy - cam.shakeY;
    if (cam.roll !== 0) {
      const mx = cam.w * 0.5, my = cam.h * 0.5, cr = Math.cos(-cam.roll), sr = Math.sin(-cam.roll), rx = x - mx, ry = y - my;
      x = mx + rx * cr - ry * sr; y = my + rx * sr + ry * cr;
    }
    if (cam.zoom !== 1) { x = cam.focusX + (x - cam.focusX) / cam.zoom; y = cam.focusY + (y - cam.focusY) / cam.zoom; }
    const a = (x - cam.cx) / cam.F, b = -(y - cam.cy) / cam.F;
    const dy = cam.fwd.y + b * cam.up.y, dz = cam.fwd.z + b * cam.up.z;
    if (dy > -1e-6) return null;
    const t = (planeY - cam.pos.y) / dy;
    if (!(t > 0)) return null;
    out.x = a * t; out.y = planeY; out.z = cam.pos.z + dz * t;
    return out;
  };

  cam.resize(cam.w, cam.h, 1);
  return cam;
}

// ════════ physics.js ════════
// physics.js — the tether: a ball on a rope that winds around a pole, and the hit that sends it.
//
// MODEL
//  · Ball = point mass with a radius. Rope = inextensible, one-sided (pulls, never pushes), tied at the pole top.
//  · Rope + pole: φu is the ball's UNWRAPPED azimuth, ψ0 the tie azimuth (the front, unless resetWorld was given a side). While the ball is within γ = acos(R/ρ)
//    of the tie point the rope runs straight from the tie point (deadband, wrap 0). Past that it lies on the pole
//    and leaves at the tangent point ψ = φ − s·γ, so wrap W = φu − ψ0 − s·γ, free length = L0 − R·|W|, and the
//    pivot descends a coil pitch per turn. W is a pure function of the ball's position + winding number, so the
//    constraint g(p) = |p − pivot| + R·|W| − L0 ≤ 0 is static: the tangent point never jumps (it stays at the tie
//    point while the ball crosses the deadband), and reversing just runs the same surface backwards.
//  · Integrator: semi-implicit Euler, equal substeps, positions projected onto {pole, ground, lid, rope}, velocity
//    taken from the displacement and the rope pulled along ∇g at the step's start (SHAKE). That is symplectic, so
//    orbits and windings keep their energy; drag is implicit, so any dt is stable.
//  · The lid. A hit from rest can only give the ball a little angular momentum about the pole (it starts 0.2 m
//    off-axis), so a real pendulum would loop over the pole top instead of orbiting it. The lid is a ceiling just
//    under the tie height with a steering band beneath it: velocity that would climb through it is ROTATED (speed
//    kept) into the orbit direction. It does no work, so energy still holds; it is the funnel that turns a hard
//    swipe into the flat, fast orbit this game is about. Slow orbits never touch it.
//  · The glance. A hand cannot push a ball through a pole, and a swipe up the screen at the resting ball (which leans on
//    the pole) is the most natural first swipe there is. So a ball a hit drives into the pole is struck and glances off:
//    its inward velocity is turned (speed kept, like the lid) into tangential velocity round the pole, in the sense it
//    already circulates or the swipe's side. applyHit does it for a ball in the contact band, so HitResult.dir is the
//    real launch; step() does it for a ball a hit sent in from further out, at the moment it meets the pole. Balls
//    nobody hit still bounce off the pole (poleRest).

Object.assign(CFG, {
  physics: {
    maxStep: 1 / 240, // longest substep (s)
    maxAngle: 0.1, // rad of orbit per substep: tight, fast orbits near the pole get extra substeps
    gravity: 9.81,
    dragLin: 0, // 1/s
    dragQuad: 0.045, // 1/m: v̇ = −dragQuad·|v|·v, the felt air resistance at speed
    ropeBounce: 0.12, // restitution when the rope snaps taut
    snapMin: 1.5, // m/s of outward speed removed before it counts as a snap event
    snapRef: 14, // m/s that reads as snap strength 1
    groundRest: 0.45, groundFric: 0.4,
    poleRest: 0.3, poleFric: 0.4,
    bounceMin: 0.6, // m/s: slower contacts are resting, not impacts
    lidGap: 0.05, // the lid sits this far under the tie point
    lidBand: 0.6, // steering depth under the lid
    lidRate: 45, // 1/s: how hard the band turns climbing velocity into orbit
    spinDecay: 1.6, // 1/s: spin relaxes to the rolling spin
    rollSpin: 0.22, // fraction of true rolling the spin follows (readable, not a blur)
    woundMargin: 0.03, // m of free rope left over the geometric minimum when the pole is full
    woundKeep: 0.1, // fraction of speed that survives the slam
    woundDamp: 9, // 1/s settling damping once wound
    sleepSpeed: 0.02, sleepTime: 0.35, // below this speed for this long, the ball sleeps

    minReachPx: 30,
    minHandSpeed: 1.2, // m/s: slower swipes are ignored
    restitution: 0.35, // hand ↔ ball
    vMax: 17.5, // m/s: soft cap on the ball after a hit
    softKnee: 0.5, // fraction of vMax where tanh compression starts
    poleBand: 0.2, // m: a ball this close to the pole (surface gap) that a hit drives inward glances round it at once (a fresh ball sways 0.16 out); further out it glances when it meets the pole. 0 = off
    perfectOffset: 0.28, grazeOffset: 0.7, perfectSpeed: 0.75,
    powerFull: 0.97, // blended strength that counts as power 1
    spinGain: 0.3,
    cooldownMs: 140, // the caller's job; physics is stateless about wall time
    warpMinPower: 0.12,

  // direction the constraint force acts along. It is the rope direction n plus a small azimuthal part (the pole

  function ropeDir(S, p) {

  // Pull p back onto the rope if it is stretched. Returns true when it moved. The pull runs along ∇g at the START of
  // the step (SHAKE): symplectic, so orbits keep their energy. Pulling along the end-of-step direction instead bleeds
  // O(θ²) of speed per step (10 % per lap here). W moves with p, so Newton-solve the pull.
  function ropePass(S, p) {
    ropeGeom(S, p);
    let dx = p.x - S.pvx, dy = p.y - S.pvy, dz = p.z - S.pvz, dist = Math.sqrt(dx * dx + dy * dy + dz * dz), r = dist - S.A;
    S.dist = dist;
    if (r <= 0 || dist < 1e-9) return false;
    if (S.cRope === 0) { S.nx = dx / dist; S.ny = dy / dist; S.nz = dz / dist; }
    const x0 = p.x, y0 = p.y, z0 = p.z, ax = S.dgx, ay = S.dgy, az = S.dgz, gm = S.gm > 0.25 ? S.gm : 0.25;
    let lam = 0;
    for (let k = 0; k < 5; k++) {
      lam += r / gm;
      p.x = x0 - ax * lam; p.y = y0 - ay * lam; p.z = z0 - az * lam;
      ropeGeom(S, p);
      dx = p.x - S.pvx; dy = p.y - S.pvy; dz = p.z - S.pvz; dist = Math.sqrt(dx * dx + dy * dy + dz * dz); r = dist - S.A;
      if (r < 1e-7 && r > -1e-7) break;

  }

  function step(w, S, h) {
    const b = w.ball, p = b.p, v = b.v;
    // forces: gravity, then implicit drag (stable for any h)
    v.y -= K.g * h;
    const sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    const damp = 1 / (1 + (K.dl + K.dq * sp + (S.frozen ? K.wd : 0)) * h);
    v.x *= damp; v.y *= damp; v.z *= damp;

    // lid steering: rotate climbing velocity into the orbit direction (speed unchanged)
    const lowEdge = K.lid - K.band;
    if (v.y > 0 && p.y > lowEdge && K.lidRate > 0 && !S.frozen) {
      const rho = Math.sqrt(p.x * p.x + p.z * p.z);
      if (rho > 1e-6) {
        const vphi = (v.x * -p.z + v.z * p.x) / rho;
        if (vphi > 0.5) S.swirl = 1; else if (vphi < -0.5) S.swirl = -1;
        const tx = -p.z / rho * S.swirl, tz = p.x / rho * S.swirl;
        const s = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
        // only steep climbs are steered (a slowly rising winding orbit already follows the rope); about to meet the lid,
        // turn all of it now so the clamp never has speed left to eat
        const climb = clamp01((v.y / s - 0.12) / 0.3);
        const beta = p.y + v.y * h > K.lid ? 1 : 1 - Math.exp(-K.lidRate * clamp01((p.y - lowEdge) / K.band) * climb * h);
        let nx = v.x / s, ny = v.y / s, nz = v.z / s;

        const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);

    }

    const ux = v.x, uy = v.y, uz = v.z, ox = p.x, oy = p.y, oz = p.z;
    const slackPrev = S.A - S.dist;
    p.x += v.x * h; p.y += v.y * h; p.z += v.z * h;

    // constraints, alternated: they intersect, so a few passes converge
    S.cRope = 0; S.cPole = 0; S.cGnd = 0; S.cLid = 0;
    const lim = K.R + K.r;
    for (let it = 0; it < 4; it++) {

      if (p.y < K.r) { S.cGnd += K.r - p.y; p.y = K.r; moved = true; }
      if (p.y < K.poleH) {
        const rho = Math.sqrt(p.x * p.x + p.z * p.z);
        if (rho < lim) {

          p.x = S.pnx * lim; p.z = S.pnz * lim; S.cPole += lim - rho; moved = true;
        } else { S.pnx = p.x / rho; S.pnz = p.z / rho; }
      }
      if (p.y > K.lid) { S.cLid += p.y - K.lid; p.y = K.lid; moved = true; }

    ropeDir(S, p); // end-of-step rope geometry: the outputs, and the next step's SHAKE direction

    // velocity from displacement (SHAKE), then contact responses on top
    v.x = (p.x - ox) / h; v.y = (p.y - oy) / h; v.z = (p.z - oz) / h;

    if (S.cGnd > 0) {

      if (uy < -K.bounceMin * 2 && S.tG <= w.t) { emit(w, { type: 'ground', speed: -uy, at: at(p) }); S.tG = w.t + 0.1; }
      v.y = want;
      const hs = Math.sqrt(v.x * v.x + v.z * v.z);
      if (hs > 1e-9) { const f = Math.max(0, hs - K.gFric * (S.cGnd / h + add)) / hs; v.x *= f; v.z *= f; }
    }
    if (S.cPole > 0) {

      if (S.drive > w.t && un < -K.bounceMin) {

        const ut = uz * nx - ux * nz, hs = Math.sqrt(ux * ux + uz * uz), sg = (ut > 1e-3 ? 1 : ut < -1e-3 ? -1 : S.swirl) * hs;
        if (-un > K.bounceMin * 2 && S.tP <= w.t) { emit(w, { type: 'pole', speed: -un, at: at(p) }); S.tP = w.t + 0.1; }

        if (un < -K.bounceMin * 2 && S.tP <= w.t) { emit(w, { type: 'pole', speed: -un, at: at(p) }); S.tP = w.t + 0.1; }

        const tn = v.x * nx + v.z * nz; // = want

    if (S.cRope > 0) {

      if ((slackPrev > 0.003 || S.kick) && vnOut > K.snapMin) {
        const vn = v.x * S.nx + v.y * S.ny + v.z * S.nz;
        const kill = vn + K.rb * vnOut;

      }

    // whole turns gained / lost
    const turns = Math.floor((S.W < 0 ? -S.W : S.W) / TAU + 1e-9);
    if (turns !== S.turnsInt) {

      S.turnsInt = turns;
    }

    // the pole is full: the free rope can no longer clear it
    if (!S.frozen && S.A <= K.Aw) {
      const s = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
      emit(w, { type: 'pole', speed: s, at: at(p) });
      emit(w, { type: 'wound', speed: s, at: at(p) });
      w.state = 'wound'; S.frozen = true; S.Af = Math.max(S.A, K.Aw - K.wm * 0.5);
      v.x *= K.wKeep; v.y *= K.wKeep; v.z *= K.wKeep;
    }
  }

  function readConfig(w) {
    const W = CFG.world, P = CFG.physics;
    K.R = W.poleR; K.L0 = W.ropeL; K.ay = W.attachY; K.poleH = W.poleH; K.pitch = W.coilPitch || 0; K.r = w.ball.r;
    K.g = P.gravity; K.dl = P.dragLin; K.dq = P.dragQuad; K.rb = P.ropeBounce; K.snapMin = P.snapMin; K.snapRef = P.snapRef;
    K.gRest = P.groundRest; K.gFric = P.groundFric; K.pRest = P.poleRest; K.pFric = P.poleFric; K.bounceMin = P.bounceMin;

  function publish(w, S) {
    const b = w.ball, rp = w.rope;

  }

  resetWorld = function (w, opts) {
    opts = opts || {};
    const W = CFG.world, b = w.ball, R = W.poleR, r = W.ballR;
    // The pole is solid, so the resting ball hangs just in front of it, leaning on it. A fresh ball starts a little
    // out from the pole and swings back to tap it: alive for a moment, then settled (it sleeps).
    // opts.phi: the side of the pole the rope is tied on and the ball hangs (a serve starts on the server's half); the
    // default is the front, where the camera sees it.
    const sway = opts.sway == null ? W.swayD : opts.sway;
    const rho = R + r + sway, a0 = typeof opts.phi === 'number' && isFinite(opts.phi) ? opts.phi : PSI0;
    w.t = 0; w.state = 'live'; w.events = [];
    b.r = r;
    if (a0 === PSI0) { b.p.x = 0; b.p.z = rho; } else { b.p.x = rho * Math.cos(a0); b.p.z = rho * Math.sin(a0); }
    b.p.y = W.attachY - Math.sqrt(W.ropeL * W.ropeL - (rho - R) * (rho - R));
    b.prevP.x = b.p.x; b.prevP.y = b.p.y; b.prevP.z = b.p.z;
    b.v.x = 0; b.v.y = 0; b.v.z = 0;
    b.spin.x = 0; b.spin.y = 0; b.spin.z = 0;
    b.q.w = 1; b.q.x = 0; b.q.y = 0; b.q.z = 0;
    w.stats.maxSpeed = 0; w.stats.hits = 0; w.stats.lastHit = null;
    const S = w._s;
    S.psi0 = a0; S.phiU = a0; S.aPrev = a0 === PSI0 ? PSI0 : Math.atan2(b.p.z, b.p.x); S.W = 0; S.turnsInt = 0; S.frozen = false; S.Af = 0;

    S.pnx = 0; S.pnz = 1; S.nx = 0; S.ny = 1; S.nz = 0; S.cRope = 0; S.cPole = 0; S.cGnd = 0; S.cLid = 0;

    ropeDir(S, b.p);
    w.rope.tension = 0;

  };

  createWorld = function (opts) {
    const w = {
      t: 0, state: 'live',
      ball: {
        p: { x: 0, y: 0, z: 0 }, v: { x: 0, y: 0, z: 0 }, r: 0, speed: 0, prevP: { x: 0, y: 0, z: 0 },
        spin: { x: 0, y: 0, z: 0 }, q: { w: 1, x: 0, y: 0, z: 0 },
      },
      rope: { L0: 0, free: 0, wrap: 0, turns: 0, pivot: { x: 0, y: 0, z: 0 }, dist: 0, slack: 0, tension: 0, taut: true },
      pole: { r: 0, h: 0, attachY: 0 },
      phi: 0, laps: 0,
      stats: { maxSpeed: 0, hits: 0, lastHit: null },
      events: [],
      _s: {}, // solver state (unwrapped azimuth, winding, sleep timers...): physics-private
    };
    resetWorld(w, opts);
    return w;
  };

  advance = function (w, dt) {
    if (!(dt > 0)) return;
    if (dt > 2) dt = 2; // a tab that slept: never simulate more than this
    while (dt > 0.05) { frame(w, 0.05); dt -= 0.05; }
    frame(w, dt);
  };

  function frame(w, dt) {
    const S = w._s, b = w.ball, p = b.p, v = b.v;
    b.prevP.x = p.x; b.prevP.y = p.y; b.prevP.z = p.z;
    w.t += dt;
    if (S.asleep) return;
    readConfig(w);
    ropeDir(S, p); // fresh at the start: nothing here may assume the ball is where the last step left it
    const P = CFG.physics;
    let n = Math.ceil(dt / P.maxStep - 1e-9);
    const rho = Math.max(0.2, Math.sqrt(p.x * p.x + p.z * p.z));
    const na = Math.ceil((dt * Math.sqrt(v.x * v.x + v.z * v.z) / rho) / P.maxAngle);
    if (na > n) n = na;
    if (n > 48) n = 48;
    const h = dt / n;
    S.tens = 0;
    for (let i = 0; i < n; i++) step(w, S, h);
    const vphi = (v.z * p.x - v.x * p.z) / Math.max(0.05, Math.sqrt(p.x * p.x + p.z * p.z)); // the way it circulates, for the glance and the lid
    if (vphi > 0.5) S.swirl = 1; else if (vphi < -0.5) S.swirl = -1;
    // tension for visuals: rope acceleration against a whip-taut reference, smoothed across frames
    const tk = clamp01(S.tens / n / 160);
    w.rope.tension += (tk - w.rope.tension) * (1 - Math.exp(-dt * 30));

    // spin = what the finger gave it (fades) + a readable rolling spin that follows the travel, so the markings turn
    // as it orbits; the scene turns them with q
    const kd = Math.exp(-P.spinDecay * dt);
    S.hx *= kd; S.hy *= kd; S.hz *= kd;
    b.spin.x = S.hx + P.rollSpin * v.z / b.r; b.spin.y = S.hy; b.spin.z = S.hz - P.rollSpin * v.x / b.r;
    const wl = Math.sqrt(b.spin.x * b.spin.x + b.spin.y * b.spin.y + b.spin.z * b.spin.z);
    if (wl > 1e-6) {
      const ha = wl * dt * 0.5, sn = Math.sin(ha) / wl, q = b.q;
      const rx = b.spin.x * sn, ry = b.spin.y * sn, rz = b.spin.z * sn, rw = Math.cos(ha);
      const qw = rw * q.w - rx * q.x - ry * q.y - rz * q.z, qx = rw * q.x + rx * q.w + ry * q.z - rz * q.y;
      const qy = rw * q.y - rx * q.z + ry * q.w + rz * q.x, qz = rw * q.z + rx * q.y - ry * q.x + rz * q.w;
      const ql = 1 / Math.sqrt(qw * qw + qx * qx + qy * qy + qz * qz);
      q.w = qw * ql; q.x = qx * ql; q.y = qy * ql; q.z = qz * ql;
    }

    // sleep: slow for long enough means at rest (also what makes the wound pole stop dead)
    const spd = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    if (spd < P.sleepSpeed) {
      S.slowT += dt;
      if (S.slowT > P.sleepTime && (S.frozen || S.A - S.dist < 0.01)) { v.x = 0; v.y = 0; v.z = 0; S.asleep = true; b.spin.x = 0; b.spin.y = 0; b.spin.z = 0; S.hx = 0; S.hy = 0; S.hz = 0; }
    } else S.slowT = 0;
    publish(w, S);
  }

  drainEvents = function (w) {
    if (!w.events.length) return EMPTY;
    const e = w.events;
    w.events = [];
    return e;
  };

  // ---- the hit ----
  const SS = { s: 0, t: 0, d2: 0 };
  // closest points between segments P1Q1 and P2Q2 (Ericson): parameters in SS.s / SS.t, distance² in SS.d2
  function segSeg(p1x, p1y, p1z, q1x, q1y, q1z, p2x, p2y, p2z, q2x, q2y, q2z) {
    const d1x = q1x - p1x, d1y = q1y - p1y, d1z = q1z - p1z, d2x = q2x - p2x, d2y = q2y - p2y, d2z = q2z - p2z;
    const rx = p1x - p2x, ry = p1y - p2y, rz = p1z - p2z;
    const a = d1x * d1x + d1y * d1y + d1z * d1z, e = d2x * d2x + d2y * d2y + d2z * d2z, f = d2x * rx + d2y * ry + d2z * rz;
    let s, t;
    const EPS = 1e-12;
    if (a <= EPS && e <= EPS) { s = 0; t = 0; }
    else if (a <= EPS) { s = 0; t = clamp01(f / e); }
    else {
      const c = d1x * rx + d1y * ry + d1z * rz;
      if (e <= EPS) { t = 0; s = clamp01(-c / a); }
      else {
        const bb = d1x * d2x + d1y * d2y + d1z * d2z, den = a * e - bb * bb;
        s = den > EPS ? clamp01((bb * f - c * e) / den) : 0;
        t = (bb * s + f) / e;
        if (t < 0) { t = 0; s = clamp01(-c / a); } else if (t > 1) { t = 1; s = clamp01((bb - c) / a); }
      }
    }
    const cx = p1x + d1x * s - (p2x + d2x * t), cy = p1y + d1y * s - (p2y + d2y * t), cz = p1z + d1z * s - (p2z + d2z * t);
    SS.s = s; SS.t = t; SS.d2 = cx * cx + cy * cy + cz * cz;
  }

  function softCap(sp, vMax, knee) {
    const k = vMax * knee;
    return sp <= k ? sp : k + (vMax - k) * Math.tanh((sp - k) / (vMax - k));
  }

  applyHit = function (w, hand) {
    const H = CFG.hit, S = w._s;
    if (w.state !== 'live' || !hand || !(hand.speed >= H.minHandSpeed) || !(hand.speed > 1e-6)) return null;
    const b = w.ball, p = b.p, v = b.v, a = b.prevP, h0 = hand.p0, h1 = hand.p1;
    const rs = b.r + (hand.r || 0);
    segSeg(a.x, a.y, a.z, p.x, p.y, p.z, h0.x, h0.y, h0.z, h1.x, h1.y, h1.z);
    if (!(SS.d2 <= rs * rs)) return null;

    // swipe direction: the stroke's own line, falling back to the smoothed hand velocity
    const hs = hand.speed, vxn = hand.vx / hs, vzn = hand.vz / hs;
    let gx = h1.x - h0.x, gz = h1.z - h0.z;
    const gl = Math.sqrt(gx * gx + gz * gz);
    if (gl > 0.01 && (gx * vxn + gz * vzn) / gl > 0.3) { gx /= gl; gz /= gl; } else { gx = vxn; gz = vzn; }
    const gn = Math.sqrt(gx * gx + gz * gz);
    if (!(gn > 1e-9)) return null;
    gx /= gn; gz /= gn;
    // first-contact normal of a disc sweeping past a sphere (billiards): centre hits go straight along the
    // swipe, glancing ones are pushed sideways. lat = ball centre's offset from the swipe line.
    const bs = SS.s, bx = a.x + (p.x - a.x) * bs, bz = a.z + (p.z - a.z) * bs;
    const lat = (bx - h0.x) * -gz + (bz - h0.z) * gx;
    const off = Math.max(-1, Math.min(1, lat / rs));
    const q = Math.max(-0.985, Math.min(0.985, off)), fw = Math.sqrt(1 - q * q);
    const nx = fw * gx + q * -gz, nz = fw * gz + q * gx;

    const uh = hs * (vxn * nx + vzn * nz), ub = v.x * nx + v.z * nz, rel = uh - ub;
    if (!(rel > 0.05)) return null; // the ball is already moving away from the hand faster than the hand follows
    const sb = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    // hand.gain < 1: a touch on a ball the other player charged with a special (energy.js) lands at that share of its push
    const dv = (1 + H.restitution) * rel * (hand.gain > 0 && hand.gain < 1 ? hand.gain : 1);
    let wx = v.x + dv * nx, wy = v.y, wz = v.z + dv * nz;

    // driven into the pole: glance off it. The inward part of the velocity becomes tangential at constant speed, in the
    // sense the swipe's side gives it (that already includes any circulation it had), else the one it circulates, else +1.
    let glanced = false;
    const rho = Math.sqrt(p.x * p.x + p.z * p.z);
    if (H.poleBand > 0 && rho > 1e-6 && wx * p.x + wz * p.z < 0) {
      S.drive = w.t + DRIVE_T;
      if (rho - CFG.world.poleR - b.r < H.poleBand) {
        const ex = p.x / rho, ez = p.z / rho, vt = wz * ex - wx * ez, hw = Math.sqrt(wx * wx + wz * wz);
        const sg = (vt > 1e-3 ? 1 : vt < -1e-3 ? -1 : S.swirl) * hw;

      }
    }

    // stays a weak special)

// timewarp.js — the signature beat of a hit: STOP, then WHIP up to full speed.
//
//   freeze  scale 0                              the contact lands and nothing moves while fx paints the impact
//   slow    scale = slowScale                    a short crawl out of the hit (0 for soft hits, ~70 ms for the hardest)
//   ramp    scale = s + (1 − s)·t^rampEase       ease-IN: the ball lurches, then whips up and arrives at 1 at speed
//
// The whole beat is over in ~0.6 s for a perfect hit (back to 0.9 at ~580 ms), ~0.3 s for a medium one and a blink for a tap: a hit
// is a punctuation mark, not a stretch of slow-motion the player has to sit through. Rally pacing: a "slow-time budget" is a debt
// of ms spent under half speed that is paid back, at a fraction of a ms per ms, while the game runs at half speed or better. The
// next sequence shrinks as the debt climbs, so a run of fast hits stays snappy (about a quarter of the time slowed) while a
// single hit after a quiet moment gets the whole treatment.
//
// Every duration is REAL milliseconds, lerped between a soft and a hard end by hit power. update() returns the AVERAGE scale
// over the frame it just consumed (the exact integral of the curve), so the sim covers the same time at 30 and 60 fps and a
// phase that ends mid-frame is not rounded to a whole frame. Pure: no wall clock, no DOM; time only moves when update() is fed.

CFG.timeWarp = {
  freezeSoft: 0, freezeHard: 110, // ms of dead stillness at power 0 / 1 (a tap barely stops; before powerCurve)
  perfectMul: 1.15, // a perfect hit holds the freeze this much longer: 126 ms
  slowSoft: 0.5, slowHard: 0.1, // sim speed while crawling: a harder hit crawls slower
  holdSoft: 0, holdHard: 70, // ms spent crawling (the ramp starts almost straight out of the freeze)
  rampSoft: 0, rampHard: 410, // ms to climb back to full speed
  rampEase: 2, // t^ease: higher stays low for longer, then whips harder
  powerCurve: 1.15, // hit power ^ this before the soft↔hard lerp: above 1 keeps taps short (power 0.3 is over in ~150 ms)
  retriggerMs: 450, // a hit inside this window of the last sequence's start gets a micro-stop, not a new sequence (≈ the longest beat)
  microStopMs: 35, // the micro-stop's ceiling
  upgradeGap: 0.2, // a hit this much harder than the running one swaps in its own slow-mo
  budgetFree: 260, // ms of slow-time debt that costs nothing
  budgetStrength: 0.35, // fraction of the next sequence shaved per 100 ms of debt past the free band
  budgetFloor: 0.25, // the budget never shrinks a sequence below this fraction of its full length
  budgetRecover: 0.3, // ms of debt repaid per ms spent at half speed or better: the debt left by a rally is gone ~1.2 s after it
};
CFG_SCHEMA.push(
  { path: 'timeWarp.freezeSoft', label: 'Freeze, soft hit', min: 0, max: 200, step: 5, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.freezeHard', label: 'Freeze, hard hit', min: 0, max: 300, step: 5, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.perfectMul', label: 'Perfect hit freeze', min: 1, max: 2.5, step: 0.05, group: 'Time warp', unit: 'x' },
  { path: 'timeWarp.slowSoft', label: 'Slow-mo speed, soft', min: 0.02, max: 1, step: 0.01, group: 'Time warp', unit: 'x' },
  { path: 'timeWarp.slowHard', label: 'Slow-mo speed, hard', min: 0.02, max: 1, step: 0.01, group: 'Time warp', unit: 'x' },
  { path: 'timeWarp.holdSoft', label: 'Slow-mo hold, soft', min: 0, max: 600, step: 10, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.holdHard', label: 'Slow-mo hold, hard', min: 0, max: 800, step: 10, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.rampSoft', label: 'Speed-up ramp, soft', min: 0, max: 1200, step: 10, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.rampHard', label: 'Speed-up ramp, hard', min: 0, max: 1500, step: 10, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.rampEase', label: 'Ramp whip', min: 1, max: 5, step: 0.1, group: 'Time warp', unit: '' },
  { path: 'timeWarp.powerCurve', label: 'Big hits only (power curve)', min: 0.5, max: 3, step: 0.05, group: 'Time warp', unit: '' },
  { path: 'timeWarp.retriggerMs', label: 'Re-hit window', min: 0, max: 1500, step: 25, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.budgetStrength', label: 'Rally pacing: shrink per 100 ms owed', min: 0, max: 1, step: 0.05, group: 'Time warp', unit: 'x' },
  { path: 'timeWarp.budgetFree', label: 'Rally pacing: free slow-mo', min: 0, max: 600, step: 10, group: 'Time warp', unit: 'ms' },
  { path: 'timeWarp.budgetFloor', label: 'Rally pacing: shortest beat', min: 0.1, max: 1, step: 0.05, group: 'Time warp', unit: 'x' },
  { path: 'timeWarp.budgetRecover', label: 'Rally pacing: recovery speed', min: 0, max: 2, step: 0.05, group: 'Time warp', unit: 'x' }
);

function createTimeWarp() {
  const OVERDRAFT = 200; // ms of debt kept past the point where the shrink hits its floor, so a rally's tail is remembered
  const MAX_MS = 1e7; // a frame longer than this (Infinity, a tab asleep for hours) still just finishes the sequence
  const seq = { power: 0, freezeMs: 0, holdMs: 0, rampMs: 0, slowScale: 1, ease: 1, totalMs: 0, budget: 1 }; // budget: the rally shrink this sequence was planned with
  const tw = { scale: 1, phase: 'idle', phaseT: 0, seq, trigger, update, canHit, cancel };
  // V8 boxes a double every time it is written to a closure variable, so the mutable numbers live in fields of one object
  const st = {
    phaseMs: 0, // elapsed in the current phase; negative = the lead-in before the first frozen frame
    held: 0, // micro-stop left (ms): the sequence is paused and the scale is 0
    clock: 0, lastAt: -1e9, // real ms fed to update(), and when the running sequence began
    lastFrameMs: 0, // the previous frame's length: how far back the hit that is landing now began
    debt: 0, lowIn: 0, // the slow-time budget: ms owed for time under half speed / what the frame being consumed added
    todo: 0, sum: 0, ia: 0, ib: 0, // run()'s working numbers: ms left to consume, the scale integral so far, and the span area() integrates
  };

  // how much of a full sequence the player has earned right now: 1 after a quiet moment, less as a rally fills the budget
  function budget() {
    const T = CFG.timeWarp, over = st.debt - T.budgetFree;
    return over > 0 && T.budgetStrength > 0 ? U.clamp(1 - T.budgetStrength * over / 100, U.clamp01(T.budgetFloor), 1) : 1;
  }

  function plan(p, perfect, mul) {
    const T = CFG.timeWarp, q = T.powerCurve === 1 ? p : Math.pow(p, T.powerCurve);
    seq.power = p; seq.budget = mul;
    seq.freezeMs = Math.max(0, U.lerp(T.freezeSoft, T.freezeHard, q)) * (perfect ? Math.max(0, T.perfectMul) : 1) * mul;
    seq.holdMs = Math.max(0, U.lerp(T.holdSoft, T.holdHard, q)) * mul;
    seq.rampMs = Math.max(0, U.lerp(T.rampSoft, T.rampHard, q)) * mul;
    seq.slowScale = U.clamp(U.lerp(T.slowSoft, T.slowHard, q), 0.001, 1);
    seq.ease = Math.max(0.1, T.rampEase);
    seq.totalMs = seq.freezeMs + seq.holdMs + seq.rampMs;
  }

  // exact ∫ scale dt over [st.ia, st.ib] ms of the current phase, added to st.sum; and the ms of it spent under half speed, added to
  // st.lowIn (the slow-time budget's input). Numbers travel in fields of `st`, never as arguments or results: a double that crosses a
  // call V8 does not inline is boxed, once per frame per number.
  function area() {
    const a = st.ia, b = st.ib, s = seq.slowScale;
    if (tw.phase === 'freeze') { st.lowIn += b - a; return; }
    if (tw.phase === 'slow') { if (s < 0.5) st.lowIn += b - a; st.sum += s * (b - a); return; }
    if (tw.phase !== 'ramp') return;
    const D = seq.rampMs, e = seq.ease + 1;
    if (s < 0.5) { const edge = D * Math.pow((0.5 - s) / (1 - s), 1 / seq.ease); st.lowIn += b < edge ? b - a : edge > a ? edge - a : 0; } // edge: where the ramp crosses 0.5
    st.sum += s * (b - a) + (1 - s) * D * (Math.pow(b / D, e) - Math.pow(a / D, e)) / e;
  }

  // consume st.todo ms of real time across any number of phase boundaries, accumulating st.sum and st.lowIn
  function run() {
    while (st.todo > 0) {
      if (st.held > 0) { const h = st.held < st.todo ? st.held : st.todo; st.held -= h; st.lowIn += h; st.todo -= h; continue; }
      if (tw.phase === 'idle') { st.sum += st.todo; break; }
      const dur = tw.phase === 'freeze' ? seq.freezeMs : tw.phase === 'slow' ? seq.holdMs : seq.rampMs, left = dur - st.phaseMs;
      if (left > st.todo) { st.ia = st.phaseMs; st.ib = st.phaseMs + st.todo; area(); st.phaseMs += st.todo; break; }
      if (left > 0) { st.ia = st.phaseMs; st.ib = dur; area(); st.todo -= left; }
      tw.phase = tw.phase === 'freeze' ? 'slow' : tw.phase === 'slow' ? 'ramp' : 'idle';
      st.phaseMs = 0;
    }
  }

  // the scale right now (not averaged over a frame)
  function instant() {
    if (st.held > 0 || tw.phase === 'freeze') return 0;
    if (tw.phase === 'slow') return seq.slowScale;
    if (tw.phase === 'ramp') return seq.slowScale + (1 - seq.slowScale) * Math.pow(seq.rampMs > 0 ? U.clamp01(st.phaseMs / seq.rampMs) : 1, seq.ease);
    return 1;
  }

  function settle() {
    const d = tw.phase === 'freeze' ? seq.freezeMs : tw.phase === 'slow' ? seq.holdMs : tw.phase === 'ramp' ? seq.rampMs : 0;
    tw.phaseT = d > 0 ? U.clamp01(st.phaseMs / d) : 0;
  }

  // Returns what the hit became: 'full' (a new sequence), 'upgrade' (a harder hit took over a running one),
  // 'micro' (a short stop inside the sequence already running) or '' (too soft to warp time at all).
  // `force` (the finish) is always a 'full' sequence: no re-hit window, no rally shrink, and it replaces whatever is running.
  function trigger(power, quality, force) {
    const T = CFG.timeWarp, Hc = CFG.hit;
    if (!(power >= (Hc && Hc.warpMinPower != null ? Hc.warpMinPower : 0.12))) return '';
    const p = power > 1 ? 1 : power, perfect = quality === 'perfect', mul = force ? 1 : budget();
    if (!force && st.clock - st.lastAt < T.retriggerMs) {
      const micro = T.microStopMs * (0.4 + 0.6 * p);
      if (tw.phase !== 'idle' && p > seq.power + T.upgradeGap) {
        plan(p, perfect, mul);
        st.lastAt = st.clock;
        if (tw.phase !== 'freeze') { tw.phase = 'slow'; st.phaseMs = 0; if (micro > st.held) st.held = micro; } // no second freeze, just a bite
        settle();
        tw.scale = instant();
        return 'upgrade';
      }
      if (tw.phase !== 'freeze' && micro > st.held) st.held = micro;
      tw.scale = instant();
      return 'micro';
    }
    plan(p, perfect, mul);
    tw.phase = 'freeze';
    st.phaseMs = -st.lastFrameMs; // the frame this hit lands in is already frozen: the freeze runs its full length from its start
    st.held = 0; st.lastAt = st.clock;
    settle();
    tw.scale = 0;
    return 'full';
  }

  function update(realDt) {
    let ms = realDt * 1000;
    ms = ms > 0 ? (ms < MAX_MS ? ms : MAX_MS) : 0; // NaN, negative and zero all consume nothing
    st.clock += ms;
    st.lowIn = 0; st.sum = 0; st.todo = ms;
    run();
    const T = CFG.timeWarp, d = st.debt + st.lowIn - T.budgetRecover * (ms - st.lowIn);
    // capped a little past where the shrink bottoms out: the player never owes more than ~1.5 s of recovery
    const cap = T.budgetStrength > 0 ? T.budgetFree + (1 - U.clamp01(T.budgetFloor)) * 100 / T.budgetStrength + OVERDRAFT : 1e6;
    st.debt = d < 0 ? 0 : d > cap ? cap : d;
    if (ms > 0) st.lastFrameMs = ms < 34 ? ms : 34;
    settle();
    tw.scale = ms > 0 ? U.clamp01(st.sum / ms) : instant();
    return tw.scale;
  }

  function canHit() { return tw.phase !== 'freeze'; }

  function cancel() {
    tw.phase = 'idle'; tw.phaseT = 0; tw.scale = 1;
    st.phaseMs = 0; st.held = 0; st.lastAt = -1e9; st.debt = 0; seq.power = 0; seq.budget = 1;
  }

  return tw;
}
