    if (st.armK > 0.01) R.drawAura(ctx, kx, ky, pose, NEON, st.armK * (0.35 + 0.25 * pulse) * gl);
    R.drawRig(ctx, kx, ky, pose);
    if (st.armK > 0.01) R.drawTint(ctx, kx, ky, pose, NEON, st.armK * (0.18 + 0.18 * pulse) * gl, true);
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
  }

  const actor = {
    // depth for the scene's sort: through a strike he goes behind the ball, so the contact is never hidden by his hood
    get z() { return st.phase === 'swing' && lastW && Math.abs(st.t - st.tc) < 0.2 ? Math.min(st.z, lastW.ball.p.z - 0.02) : st.z; },
    drawShadow, drawSay,
    draw(ctx, cam, kx, ky, w) { draw(ctx, cam, kx, ky, w); },
  };

  return {
    st, SK, G, dbg, actor, pose, setSide, reset, update, onSwing, onWorldHit, onRoundEnd, wantsSpecial, onSpecial, predict: (w) => { predict(w); return np; },
    get side() { return st.side; }, get dir() { return st.dir; },
    ensureArt: R.ensureArt, drawRig: R.drawRig, hasCanvas, art: R.art,
  };
}

// ════════ kiru.js ════════
// kiru.js — Kiru (Neo Dojo Cast), your avatar on your half of the court. You still swipe. The moment your swipe lands he
// flash-steps to the ball, a dash along the floor or a leap when it is high, and his fist is on it, with afterimages strung
// back to where he stood. Then he drives through, drops, lands, and flashes back to his spot.
//
// He is the picture, not the physics: the hit is your swipe's (the same applyHit as ever) and nothing he does touches the
// world, so switching him off leaves the game exactly as it was.
//
// ART. As the cast sheet draws him (Tools/neo-dojo-cast/index.html kiru()), on the rig in ninja.js: blue hood and gi, the
// vermilion headband and its two ribbons (drawn live here, so they ripple and stream), the steel plate with the bolt, the
// katana on his back, wrapped fists. Five faces are baked: open, blink, fierce (a strike or a finger down), happy (a round
// won) and sad (a round lost). Afterimages are baked silhouettes of a dash and a leap, in a cool blue.
//
// SPECIAL (energy.js). Armed, he glows storm blue. His special (Raijin) closes a ring of afterimages on the ball from every
// side as his fist lands; the lightning itself is fx.js's.
//
// Clocks: the flash (afterimages, speed lines, the white flash he arrives in, the ring he kicks off from) runs on REAL time,
// so it plays out inside a hit's freeze; his body (the follow-through, the fall, the landing, his moods) runs on SIM time, so
// a big hit holds him in the strike with his fist on the ball, which is the hit-stop the game is built on.

CFG.kiru = {
  on: 1, // 1 = Kiru plays your half (0: just your finger, as before)
  move: 0, // 0 auto (a dash for a ball in his reach, a leap for a high one), 1 always dash in, 2 always leap in
  ghosts: 4, // afterimages a flash step leaves behind
  flashBack: 1, // 1 = after a hit he flashes back to his spot; 0 = he runs back
  size: 1.75, // m tall
};
CFG_SCHEMA.push(
  { path: 'kiru.on', label: 'Play as Kiru', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kiru', rank: -2.5, unit: '' },
  { path: 'kiru.move', label: 'Flash move', type: 'choice', options: ['Auto', 'Dash', 'Leap'], min: 0, max: 2, step: 1, group: 'Kiru', rank: -2.5, unit: '' },
  { path: 'kiru.ghosts', label: 'Afterimages', min: 0, max: 8, step: 1, group: 'Kiru', rank: -2.5, unit: '' },
  { path: 'kiru.flashBack', label: 'Flashes back to his spot', type: 'toggle', min: 0, max: 1, step: 1, group: 'Kiru', rank: -2.5, unit: '' },
  { path: 'kiru.size', label: 'Height', min: 1.1, max: 2.2, step: 0.05, group: 'Kiru', rank: -2.5, unit: 'm' }
);

// Kiru on the Neo Dojo rig (ninja.js): the sheet's colours, paths and faces
const KIRU_ART = {
  RED: '#e8432a', RED_D: '#bd3019', SKIN: '#f6d0a8', SKIN_S: '#e2b083', BLUSH: '#f08a78', RIM: '#a9bcff', INK: '#13152a',
  STEEL: '#cfd5e2', STEEL_E: '#8d95ab', GOLD: '#dcae4e',
  FACE_SH: 'M44 80 C70 68 130 68 156 80 C160 82 162 85 163 88 C130 77 70 77 37 88 C38 85 40 82 44 80 Z',
  // the headband ribbons as the sheet draws them, as points: the top edge (start, control, mid, control, end), the tip,
  // then the bottom edge back (control, mid, control, start). Lower one first (it sits behind).
  TAIL_LO: [166, 74, 192, 78, 206, 94, 218, 108, 238, 108, 234, 117, 212, 120, 199, 103, 188, 89, 166, 83],
  TAIL_HI: [166, 61, 194, 50, 213, 63, 229, 75, 248, 68, 247, 79, 227, 90, 208, 77, 193, 67, 167, 71],

const KIRU_LOOK = {

  heads: ['open', 'blink', 'fierce', 'happy', 'sad'],

  sil: {
    dash: { lax: 62, lay: 221, lknee: 10, lrot: -0.15, rax: 142, ray: 216, rknee: -6, rrot: 0.4, fx: 60, fy: 176, bx: 172, by: 174, bBend: -4, wind: 1, lift: 0.2 },
    leap: { lax: 86, lay: 204, lknee: 16, lrot: 0.4, rax: 122, ray: 212, rknee: 12, rrot: 0.2, fx: 36, fy: 140, fBend: 4, bx: 150, by: 168, wind: 0.8, lift: 0.8 },
  },
  tint: true, // the white flash he arrives in
  head(H, g, k, face) {
    const A = KIRU_ART, hood = new Path2D(NINJA.HOOD);
    g.lineWidth = 6; g.strokeStyle = H.L; g.stroke(hood);
    g.fillStyle = H.grad(g, 48, 24, 152, 156, ['#34417c', '#252d56', '#181d3b']); g.fill(hood);

    if (st.y > 0.04 && !striking) { // in the air: tucked, reaching down for the floor as it comes
      const low = st.vy < 0 && st.y < 0.35 * G.k;
      P.lax = 90; P.lay = low ? 218 : 208; P.rax = 116; P.ray = low ? 220 : 213; P.lknee = low ? 7 : 13; P.rknee = low ? 6 : 10; P.lrot = 0.2; P.rrot = 0.1;
      P.lift = Math.max(P.lift, 0.6); P.wind = Math.max(P.wind, 0.5);
    }
    // a finger is down: he crouches, fists up, eyes narrowed
    const rk = st.ready;
    if (rk > 0.01 && !striking && (st.phase === 'idle' || st.phase === 'land' || st.phase === 'strike')) {
      P.sqy *= 1 - 0.05 * rk; P.sqx *= 1 + 0.03 * rk; P.lax -= 7 * rk; P.rax += 7 * rk; P.lknee += 6 * rk; P.rknee += 6 * rk;
      P.fx = U.lerp(P.fx, 58, rk); P.fy = U.lerp(P.fy, 158, rk); P.fBend = U.lerp(P.fBend, 6, rk); P.bx = U.lerp(P.bx, 138, rk); P.by = U.lerp(P.by, 165, rk);
      P.headDy += 3 * rk; P.tilt += -P.mir * 0.05 * rk; P.wind = Math.max(P.wind, 0.25 * rk);

  // the strike: his fist on the ball, driving on through it the way the ball goes, then back to guard
  function strikePose(cam, P, u) {
    if (st.y > 0.04) { P.lax = 86; P.lay = 205; P.lknee = 15; P.lrot = 0.35; P.rax = 122; P.ray = 213; P.rknee = 11; P.rrot = 0.2; P.lift = 0.6; }
    else { P.lax = 66; P.lay = 223.5; P.lknee = 11; P.lrot = -0.12; P.rax = 136; P.ray = 222; P.rknee = -3; P.rrot = 0.3; P.sqy *= 0.96; P.sqx *= 1.04; } // a lunge

    P.tilt = -P.mir * U.clamp(-ax / al, 0, 1) * 0.16 * (1 - back);

    ax = T1.x - N.SH_F.x; ay = T1.y - N.SH_F.y; al = Math.sqrt(ax * ax + ay * ay) || 1;
    P.fx = U.lerp(T1.x, 60, back); P.fy = U.lerp(T1.y, 160, back); P.fBend = U.lerp(3, 7, back);
    P.smear = (1 - 0.65 * e) * (1 - back); P.sx0 = N.SH_F.x + ax * 0.12; P.sy0 = N.SH_F.y + ay * 0.12;
    P.bx = 156 + (ax / al) * 10; P.by = 178 - (ay / al) * 8; P.bBend = -6; // the back arm pulls the other way

  }

  // the steps still fading: speed lines, then the afterimages (oldest step first, oldest image first), in his ghost blue
  function drawFlashes(ctx, cam, kx, ky) {
    const sz = CFG.kiru.size;
    for (let j = 0; j < NF; j++) {
      const f = FL[(fi + j) % NF], age = st.rt - f.rt;
      if (!(age >= 0 && age < FADE)) continue;
      cam.project(f.x0, f.y0, f.z0, A); cam.project(f.x1, f.y1, f.z1, B);
      // as many images as the step has room for on screen (about a third of his width apart), so a short step does not
      // pile them into one blob
      const mir = B.x > A.x ? -1 : 1, span = Math.sqrt((B.x - A.x) * (B.x - A.x) + (B.y - A.y) * (B.y - A.y)), wide = 150 * (A.s * sz) / 207.5;
      const n = Math.min(f.n, Math.floor(span / Math.max(1, wide * 0.3)) + 1);
      if (f.strike && age < LINES) speedLines(ctx, cam, kx, ky, f, 0.5 * (1 - age / LINES));
      for (let i = 0; i < n; i++) {
        const s = i / n, a = f.a * (0.16 + 0.34 * s) * U.clamp01(1 - age / (FADE * (0.45 + 0.55 * s)));
        if (a <= 0.004) continue;
        pathAt(f, s, Q); cam.project(Q.x, Q.y, Q.z, Cc);
        GP.x = Cc.x; GP.y = Cc.y; GP.s = (Cc.s * sz) / 207.5; GP.mir = mir; GP.tilt = -mir * 0.2; GP.sqx = 1.06; GP.sqy = 0.96;
        R.drawSil(ctx, kx, ky, GP, f.kind === 1 || (f.kind === 2 && s > 0.7) ? 'leap' : 'dash', a, true);
      }
    }
  }
  // Raijin: five afterimages on the floor round the ball, closing in on it from every side and facing it, as his fist lands
  function drawRaijin(ctx, cam, kx, ky) {
    const age = st.rt - st.specialRt;
    if (!(age >= 0 && age < RAIJIN)) return;
    const q = age / RAIJIN, sz = CFG.kiru.size, rr = (1.25 - 0.7 * U.easeOut(q, 2)) * G.k, a0 = st.specials * 0.9;
    cam.project(st.spX, st.spY, st.spZ, B);
    for (let i = 0; i < 5; i++) {
      const th = a0 + (i / 5) * TAU, x = st.spX + Math.cos(th) * rr, z = st.spZ + Math.sin(th) * rr;
      cam.project(x, 0, z, Cc);
      const mir = B.x > Cc.x ? -1 : 1;
      GP.x = Cc.x; GP.y = Cc.y; GP.s = (Cc.s * sz) / 207.5; GP.mir = mir; GP.tilt = -mir * 0.25; GP.sqx = 1.06; GP.sqy = 0.96;
      R.drawSil(ctx, kx, ky, GP, 'dash', 0.3 * (1 - q) * (0.6 + 0.4 * U.clamp01(q * 4)), true);
    }
  }
  // three streaks along the step at foot, belt and head height, brightening toward where he arrived
  function speedLines(ctx, cam, kx, ky, f, a) {
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#d8ecff'; ctx.lineCap = 'round';
    for (let l = 0; l < 3; l++) {
      const hy = (l === 0 ? 0.18 : l === 1 ? 0.55 : 1.05) * G.k;
      pathAt(f, 0, Q); cam.project(Q.x, Q.y + hy, Q.z, A);
      for (let i = 1; i <= 8; i++) {
        pathAt(f, i / 8, Q); cam.project(Q.x, Q.y + hy, Q.z, B);

  // a flat ellipse on the floor at (x, z): the transform maps metres on the floor to the screen around that point
  function onFloor(ctx, cam, kx, ky, x, z, m) {
    cam.project(x, 0, z, A); cam.project(x + m, 0, z, B); cam.project(x, 0, z + m, Cc);
    ctx.setTransform(kx * (B.x - A.x), ky * (B.y - A.y), kx * (Cc.x - A.x), ky * (Cc.y - A.y), kx * A.x, ky * A.y);
  }
  function drawShadow(ctx, cam, kx, ky) {
    const K = CFG.kiru, lift = U.clamp01(st.y / 1.5), rr = 0.3 * K.size / 1.6 * (1 - 0.35 * lift);
    if (shadowCtx !== ctx) { shadowCtx = ctx; shadowG = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); shadowG.addColorStop(0, 'rgba(0,0,0,0.85)'); shadowG.addColorStop(0.6, 'rgba(0,0,0,0.6)'); shadowG.addColorStop(1, 'rgba(0,0,0,0)'); }
    onFloor(ctx, cam, kx, ky, st.x, st.z, rr);

  }

  function draw(ctx, cam, kx, ky, w) {
    if (!hasCanvas) return;
    poseFor(cam, w);
    if (!R.ensureArt(pose.s * Math.max(kx, ky) * 1.15)) return;
    drawRaijin(ctx, cam, kx, ky);
    drawFlashes(ctx, cam, kx, ky);
    const pulse = 0.5 + 0.5 * Math.sin(st.rt * 15); // armed: an aura behind him and a storm-blue charge over him
    if (st.armK > 0.01) R.drawAura(ctx, kx, ky, pose, '#5ad1ff', st.armK * (0.4 + 0.25 * pulse));
    R.drawRig(ctx, kx, ky, pose);
    if (st.armK > 0.01) R.drawTint(ctx, kx, ky, pose, '#8fd2ff', st.armK * (0.22 + 0.2 * pulse), true);
    const ar = st.rt - st.arriveRt;
    if (ar >= 0 && ar < ARRIVE) R.drawTint(ctx, kx, ky, pose, '#ffffff', st.arriveA * (1 - ar / ARRIVE), true);
    ctx.setTransform(kx, 0, 0, ky, 0, 0);
  }

  const actor = {
    // depth for the scene's sort: through a strike he goes behind the ball, so his fist never hides the contact
    get z() { return st.phase === 'strike' && lastW && st.t - st.ts < 0.25 ? Math.min(st.z, lastW.ball.p.z - 0.02) : st.z; },
    drawShadow,
    draw(ctx, cam, kx, ky, w) { draw(ctx, cam, kx, ky, w); },
  };

  return {
    st, G, actor, pose, flashes: FL, setSide, reset, update, onHit, onRoundEnd,
    get side() { return st.side; },
    ensureArt: R.ensureArt, drawRig: R.drawRig, hasCanvas, art: R.art,
  };
}

// ════════ ui.js ════════
// ui.js — everything in the DOM: the HUD numbers, the energy rings and the special button, the round card, the bottom hint
// and the Feel panel.
//
// The markup lives in shell.html (ids below) and the look in style.css; this file binds to them and keeps them current.
// HUD text is written only when the number it shows changes (last-value cache per field), so a steady frame costs a
// handful of compares and no allocation. The canvas owns every swipe: only the HUD buttons take the pointer (CSS).
//
// The Feel panel persists only the numbers you moved off their defaults, so retuning a default in code reaches every
// slider you never touched instead of being masked by a stale snapshot. Copy/Paste speak the full snapshot. A schema entry
// is a slider unless it says `type: 'toggle'` (a 0/1 switch) or `type: 'choice'` (an index into `options`): every value is
// still a number, so saving, resetting and Copy/Paste treat them all alike. Groups are listed by their entries' `rank`
// (lowest first, default 0), then in the order modules declared them. The panel opens as a drawer and expands to fill the
// screen (columns of groups, a filter, open/close all), remembered.

CFG.ui = {
  ease: 18, // 1/s: how fast the big mph number chases the ball as it speeds up (it settles down at 30 % of this)
  pop: 0.3, // how far the number swells on a hit (0.3 = +30 %)
  resultArmMs: 450, // taps on the round card are ignored this long after it appears, so a finishing swipe cannot dismiss it
};
CFG_SCHEMA.push(
  { path: 'ui.pop', label: 'Speed number pop', min: 0, max: 0.8, step: 0.02, group: 'HUD', unit: '' },
  { path: 'ui.ease', label: 'Speed number chase', min: 4, max: 40, step: 1, group: 'HUD', unit: '1/s' }
);

function createUI(root, opts) {
  opts = opts || {};
  const $ = (id) => root.querySelector('#' + id);
  const doc = root.ownerDocument;
  const hud = $('hud'), speedEl = $('hSpeed'), hitsEl = $('hHits'), barEl = $('hBar'), barWrap = barEl.parentNode;
  const resultEl = $('result'), hintEl = $('hint'), soundBtn = $('bSound'), gearBtn = $('bFeel');

  // A text field that rewrites its node only when its key changes. Callers pass a small integer key (the value already
  // quantised to what is shown), so an unchanged frame neither formats a string nor touches the DOM.
  function field(id, fmt) {
    const e = $(id);
    if (!e.firstChild) e.appendChild(doc.createTextNode(''));
    const node = e.firstChild;
    let last = NaN;
    return (k) => { if (k !== last) { last = k; node.data = fmt(k); } };
  }
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const clock = (cs) => Math.floor(cs / 6000) + ':' + pad2(Math.floor(cs / 100) % 60) + '.' + pad2(cs % 100);
  const setSpeed = field('hSpeed', String), setHits = field('hHits', String), setTime = field('hTime', clock);
  const setTurns = field('hTurns', (k) => (k / 10).toFixed(1)), setGoal = field('hGoal', (k) => (k / 10).toFixed(1));
  const setYou = field('hYou', String), setKage = field('hKage', String);
  const setTY = field('hTY', (k) => (k / 10).toFixed(1)), setTK = field('hTK', (k) => (k / 10).toFixed(1));
  const tugY = $('hTugY'), tugK = $('hTugK');

  // ───────────── HUD ─────────────
  let shown = 0, lastHits = 0, heat = -1, barQ = -1, tickQ = -1, state = '', mode = '', ks = 0, lead = '-', tyQ = -1, tkQ = -1;

  // a hit: the number swells and flashes white-hot, then settles (the counter follows at half strength)
  function pop() {
    const k = CFG.ui.pop;
    if (!(k > 0) || !speedEl.animate) return;
    const kick = (e, m) => e.animate([{ transform: 'scale(' + (1 + k * m) + ')', filter: 'brightness(' + (1 + m) + ')' }, { transform: 'scale(1)', filter: 'brightness(1)' }], { duration: 340, easing: 'cubic-bezier(.2,1.6,.4,1)' });
    kick(speedEl, 1);
    kick(hitsEl, 0.5);
  }

  function update(snap, dt) {
    if (!snap) return;
    const w = opts.getWorld ? opts.getWorld() : null;
    const target = w && w.ball ? U.mph(w.ball.speed) : 0;
    // the number chases the ball fast on the way up (it revs with the hit) and settles slower on the way down
    shown = U.damp(shown, target, target > shown ? CFG.ui.ease : CFG.ui.ease * 0.3, dt > 0 ? dt : 0);
    setSpeed(shown < 1.5 ? 0 : Math.round(shown)); // a hanging ball's last few cm/s are not a speed
    const f = shown / U.mph((CFG.hit && CFG.hit.vMax) || 17);
    const h = f < 0.3 ? 0 : f < 0.55 ? 1 : f < 0.8 ? 2 : f < 0.95 ? 3 : 4;
    if (h !== heat) { heat = h; speedEl.setAttribute('data-heat', h); }

    if (snap.state !== state) { state = snap.state; hud.setAttribute('data-state', state); }
    const m = snap.mode === 'versus' ? 'versus' : 'solo';
    if (m !== mode) { mode = m; hud.setAttribute('data-mode', m); }
    if (m === 'versus') { versusHud(snap); return; }
    const goal = snap.turnsGoal > 0 ? snap.turnsGoal : 1, turns = snap.turns > 0 ? snap.turns : 0;
    setTurns(Math.round(turns * 10));
    setGoal(Math.round(goal * 10));
    setTime(snap.timeMs > 0 ? Math.floor(snap.timeMs / 10) : 0);
    setHits(snap.hits | 0);
    const bq = Math.round(U.clamp01(turns / goal) * 500);
    if (bq !== barQ) { barQ = bq; barEl.style.transform = 'scaleX(' + bq / 500 + ')'; }
    const tq = Math.round(goal * 10);
    if (tq !== tickQ) { tickQ = tq; barWrap.style.setProperty('--tick', 1000 / tq + '%'); }

    if (snap.hits !== lastHits) { if (snap.hits > lastHits) pop(); lastHits = snap.hits; }
  }

  // versus: the score (Kage's on his side of the screen), and a tug of war for the rope, filling from the middle toward
  // whoever it is winding for, with that many turns on their end
  function versusHud(snap) {
    const k = snap.kageSide < 0 ? -1 : 1;
    if (k !== ks) { ks = k; hud.setAttribute('data-ks', k < 0 ? 'l' : 'r'); }
    setYou(snap.you | 0); setKage(snap.kage | 0);
    const g = snap.turnsGoal > 0 ? snap.turnsGoal : 1, l = snap.lead || 0;
    const yq = l > 0 ? Math.round(U.clamp01(l / g) * 500) : 0, kq = l < 0 ? Math.round(U.clamp01(-l / g) * 500) : 0;
    if (yq !== tyQ) { tyQ = yq; tugY.style.transform = 'scaleX(' + yq / 500 + ')'; }
    if (kq !== tkQ) { tkQ = kq; tugK.style.transform = 'scaleX(' + kq / 500 + ')'; }
    setTY(l > 0 ? Math.round(l * 10) : 0); setTK(l < 0 ? Math.round(-l * 10) : 0);
    const ld = l > 0.05 ? 'y' : l < -0.05 ? 'k' : '';
    if (ld !== lead) { lead = ld; hud.setAttribute('data-lead', ld); }
    if (snap.hits !== lastHits) { if (snap.hits > lastHits) pop(); lastHits = snap.hits; }
  }

  // ───────────── energy (versus): your special button and Kage's gauge, filled round their rings ─────────────
  const enBtn = $('bSpecial'), enY = $('eYouR'), enK = $('eKageR'), enKEl = $('eKage');
  let enOn = -1, enYQ = -1, enKQ = -1, enYS = '', enKS = '', enTrig = -1;
  // charged: your swing has curved enough to unleash it (it shows as armed). The trigger setting decides whether the ring is a button.
  function energy(es, show, charged) {
    const on = show && es && es.on ? 1 : 0;
    if (on !== enOn) { enOn = on; hud.setAttribute('data-energy', on ? 'on' : ''); }
    if (!on) return;
    const trig = CFG.energy ? CFG.energy.trigger | 0 : 1;
    if (trig !== enTrig) { enTrig = trig; enYS = ''; hud.setAttribute('data-trigger', trig === 0 ? 'curve' : trig === 1 ? 'tap' : 'both'); }
    const yq = Math.round(U.clamp01(es.you) * 100), kq = Math.round(U.clamp01(es.kage) * 100);
    // an empty ring hides its stroke: a round cap would still draw a dot
    if (yq !== enYQ) { enYQ = yq; enY.style.strokeDashoffset = String(100 - yq); enY.style.opacity = yq > 0 ? '1' : '0'; }
    if (kq !== enKQ) { enKQ = kq; enK.style.strokeDashoffset = String(100 - kq); enK.style.opacity = kq > 0 ? '1' : '0'; }
    const ys = es.armedYou || charged ? 'armed' : yq >= 100 ? 'full' : 'fill', ks = es.armedKage ? 'armed' : kq >= 100 ? 'full' : 'fill';
    if (ys !== enYS) {
      enYS = ys; enBtn.setAttribute('data-st', ys); enBtn.disabled = ys === 'fill' || trig === 0;
      enBtn.setAttribute('aria-pressed', ys === 'armed' ? 'true' : 'false');
      enBtn.setAttribute('aria-label', ys === 'armed' ? 'Special armed: your next hit is the special' : ys === 'fill' ? 'Special: charging' : trig === 0 ? 'Special ready: swipe in a curve to unleash it' : 'Special ready: arm it');
    }
    if (ks !== enKS) { enKS = ks; enKEl.setAttribute('data-st', ks); enKEl.setAttribute('aria-label', ks === 'armed' ? 'Kage has armed his special' : ks === 'full' ? "Kage's special is ready" : "Kage's energy"); }
  }
  enBtn.addEventListener('click', () => { if (opts.onSpecial) opts.onSpecial(); });

  function hint(text) {
    if (text) { $('hintText').textContent = text; hintEl.classList.add('on'); } else hintEl.classList.remove('on');
  }

  function setMuted(m) {
    soundBtn.classList.toggle('muted', !!m);
    soundBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  }
  soundBtn.addEventListener('click', () => {
    const r = opts.onMuteToggle ? opts.onMuteToggle() : undefined;
    setMuted(typeof r === 'boolean' ? r : !!(opts.audio && opts.audio.muted));
  });
  setMuted(!!(opts.audio && opts.audio.muted));
  $('bReset').addEventListener('click', () => { hideResult(); if (opts.onReset) opts.onReset(); });
  gearBtn.addEventListener('click', () => tuner.toggle());

  // ───────────── round card ─────────────
  let armedAt = 0;
  const secs = (ms) => (ms / 1000).toFixed(2) + 's';
  // a rope this slow reads better as m:ss.cc than as 94.20s
  const span = (ms) => (ms >= 60000 ? clock(Math.floor(ms / 10)) : secs(ms));

  function showResult(s) {
    if (!s) return;
    const vs = s.mode === 'versus';
    resultEl.setAttribute('data-mode', vs ? 'versus' : 'solo');
    resultEl.setAttribute('data-winner', vs ? s.winner || '' : '');
    if (vs) {
      $('rTitle').textContent = s.matchOver ? 'Match over' : 'Round ' + s.round + ' · first to ' + s.rounds;
      $('rWho').textContent = s.winner === 'you' ? (s.matchOver ? 'You win the match' : 'You win the round') : s.matchOver ? 'Kage wins the match' : 'Kage takes the round';
      $('rScore').textContent = 'You ' + s.you + ' – ' + s.kage + ' Kage';
      $('rHits').textContent = s.hits;
      $('rTop').textContent = Math.round(s.topMph);
      $('rBest').textContent = span(Math.max(0, s.timeMs)); $('rBestK').textContent = 'Rally';
      $('rAgain').textContent = s.matchOver ? 'Rematch' : 'Next round';
      $('rNew').hidden = true; $('rDelta').textContent = '';
      armedAt = performance.now() + CFG.ui.resultArmMs;
      resultEl.classList.add('on'); resultEl.setAttribute('aria-hidden', 'false');
      try { $('rAgain').focus({ preventScroll: true }); } catch (e) { /* nothing to focus */ }
      return;
    }
    $('rTitle').textContent = 'Rope wound'; $('rBestK').textContent = 'Best'; $('rAgain').textContent = 'Go again';
    const ms = Math.max(0, s.timeMs), slow = ms >= 60000;
    $('rTime').textContent = slow ? clock(Math.floor(ms / 10)) : (ms / 1000).toFixed(2);
    $('rUnit').hidden = slow;
    $('rHits').textContent = s.hits;
    $('rTop').textContent = Math.round(s.topMph);
    $('rBest').textContent = s.best > 0 ? span(s.best) : '-';
    $('rNew').hidden = !s.newBest;
    $('rDelta').textContent = !s.newBest && s.best > 0 ? '+' + secs(ms - s.best) + ' off your best' : '';
    armedAt = performance.now() + CFG.ui.resultArmMs;
    resultEl.classList.add('on');
    resultEl.setAttribute('aria-hidden', 'false');
    try { $('rAgain').focus({ preventScroll: true }); } catch (e) { /* nothing to focus */ }
  }
  function hideResult() { resultEl.classList.remove('on'); resultEl.setAttribute('aria-hidden', 'true'); }
  // the whole overlay is the button: a tap anywhere (Go again included, it bubbles) starts the next round
  resultEl.addEventListener('click', () => {
    if (!resultEl.classList.contains('on') || performance.now() < armedAt) return;
    hideResult();
    const go = opts.onNext || opts.onReset;
    if (go) go();
  });

  // ───────────── Feel panel ─────────────
  const tuner = (function () {
    const FEEL = 'tetherball.feel.v1', GROUPS = 'tetherball.feel.groups.v1', FULL = 'tetherball.feel.full.v1';
    const panel = $('panel'), listEl = $('feelGroups'), body = $('feelBody');
    const fullBtn = $('feelFull'), filterEl = $('feelFilter');
    const ioWrap = $('feelIOWrap'), ta = $('feelIO'), ioHint = $('feelIOHint'), applyBtn = $('feelApply'), toastEl = $('feelToast');
    const RESET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.3-5.4"/><path d="M19.8 4.2v4.6h-4.6"/></svg>';
    const rows = [], badges = {}, known = new Set();
    let built = -1, saveT = 0, toastT = 0;

    const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private window: tuning lasts the session */ } };
    const parse = (s) => { try { const o = JSON.parse(s); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; } };
    function dflt(path) {
      let o = CFG_DEFAULT;
      const ks = path.split('.');
      for (let i = 0; i < ks.length; i++) o = o && o[ks[i]];
      return typeof o === 'number' ? o : undefined;
    }
    const moved = (path, v) => { const d = dflt(path); return d !== undefined && Math.abs(v - d) > 1e-9 * Math.max(1, Math.abs(d)); };

    // only what differs from the defaults is stored (see the header comment)
    function save() {
      clearTimeout(saveT);
      const snap = cfgSnapshotTuned(), out = {};
      let n = 0;
      for (const p in snap) if (typeof snap[p] === 'number' && (dflt(p) === undefined || moved(p, snap[p]))) { out[p] = snap[p]; n++; }
      lsSet(FEEL, n ? JSON.stringify(out) : null);
    }
    const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 160); };

    // schema entries can arrive after createUI (a module loaded later): they get their saved value when first seen
    function adopt() {
      const saved = parse(lsGet(FEEL));
      for (let i = 0; i < CFG_SCHEMA.length; i++) {
        const p = CFG_SCHEMA[i].path;
        if (known.has(p)) continue;
        known.add(p);
        if (saved && typeof saved[p] === 'number') { const one = {}; one[p] = saved[p]; cfgApplyTuned(one); }
      }
    }

    const el = (tag, cls) => { const e = doc.createElement(tag); if (cls) e.className = cls; return e; };
    const decimals = (s) => { const d = String(s.step).split('.')[1]; return d ? d.length : 0; };

    function paint(r, dragging) {
      const v = cfgGet(r.s.path), num = typeof v === 'number' && isFinite(v) ? v : r.s.min;
      if (r.kind === 'toggle') r.sw.setAttribute('aria-checked', num >= 0.5 ? 'true' : 'false');
      else if (r.kind === 'choice') { const k = Math.round(num); for (let i = 0; i < r.opts.length; i++) r.opts[i].setAttribute('aria-checked', i === k ? 'true' : 'false'); }
      else {
        if (!dragging) r.inp.value = String(num);
        r.inp.style.setProperty('--f', String(U.clamp01((num - r.s.min) / (r.s.max - r.s.min || 1))));
        r.num.data = num.toFixed(r.dec);
      }
      r.row.classList.toggle('chg', moved(r.s.path, num));
    }
    function badge() {
      const count = {};
      for (let i = 0; i < rows.length; i++) if (rows[i].row.classList.contains('chg')) count[rows[i].g] = (count[rows[i].g] || 0) + 1;
      for (const g in badges) { badges[g].textContent = count[g] || ''; badges[g].hidden = !count[g]; }
    }
    function paintAll() { for (let i = 0; i < rows.length; i++) paint(rows[i], false); badge(); }

    // A touch on a slider must never move it while the list is being scrolled. The native input stays for the look, the
    // keyboard and the step grid, but its wrapper takes the pointer: a horizontal drag moves it (relative to where the
    // finger landed), a short tap jumps to that spot, and a vertical pan is the browser's (pointercancel) and leaves it be.
    function dragWire(sl, inp, s) {
      let id = -1, x0 = 0, y0 = 0, t0 = 0, v0 = 0, drag = false;
      const reach = () => Math.max(1, sl.clientWidth - 26); // the thumb's travel: its centre runs 13 px in from each end
      const put = (v) => { inp.value = String(U.clamp(v, s.min, s.max)); inp.dispatchEvent(new Event('input', { bubbles: true })); };
      sl.addEventListener('pointerdown', (e) => { if (id >= 0 || e.button) return; id = e.pointerId; x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp; drag = false; });
      sl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== id) return;
        if (!drag) {
          const dx = e.clientX - x0;
          if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(e.clientY - y0)) return;
          drag = true; x0 = e.clientX; v0 = cfgGet(s.path);
          sl.classList.add('held');
          try { sl.setPointerCapture(id); } catch (err) { /* a synthetic pointer: moves still arrive */ }
        }
        put(v0 + (e.clientX - x0) / reach() * (s.max - s.min));
      });
      const end = (e) => {
        if (e.pointerId !== id) return;
        const tap = !drag && e.type === 'pointerup' && e.timeStamp - t0 < 400;
        if (tap) put(s.min + U.clamp01((e.clientX - sl.getBoundingClientRect().left - 13) / reach()) * (s.max - s.min));
        if (tap || drag) inp.dispatchEvent(new Event('change', { bubbles: true }));
        id = -1; drag = false; sl.classList.remove('held');
      };
      sl.addEventListener('pointerup', end);
      sl.addEventListener('pointercancel', end);
    }

    // a switch (0/1) or a row of choices (an index): same row, same reset, same storage as a slider
    function setNum(r, v) { cfgSet(r.s.path, v); paint(r, false); badge(); save(); }
    function makeToggle(r, id) {
      const s = r.s, lab = el('span', 'lab'), rst = el('button', 'rst'), sw = r.sw = el('button', 'sw');
      lab.id = id + '-l'; lab.textContent = s.label;
      rst.type = 'button'; rst.setAttribute('aria-label', 'Reset ' + s.label); rst.innerHTML = RESET_SVG;
      sw.type = 'button'; sw.id = id; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-labelledby', lab.id);
      sw.addEventListener('click', () => setNum(r, cfgGet(s.path) >= 0.5 ? 0 : 1));
      rst.addEventListener('click', () => { const d = dflt(s.path); if (d !== undefined) setNum(r, d); });
      r.row.classList.add('tg'); r.row.append(lab, rst, sw);
      return r;
    }
    function makeChoice(r, id) {
      const s = r.s, lab = el('span', 'lab'), rst = el('button', 'rst'), seg = el('div', 'seg');
      lab.id = id + '-l'; lab.textContent = s.label;
      rst.type = 'button'; rst.setAttribute('aria-label', 'Reset ' + s.label); rst.innerHTML = RESET_SVG;
      seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-labelledby', lab.id); seg.id = id;
      r.opts = [];
      const names = s.options || [];
      for (let i = 0; i < names.length; i++) {
        const b = el('button', 'opt');
        b.type = 'button'; b.textContent = names[i]; b.setAttribute('role', 'radio');
        b.addEventListener('click', () => setNum(r, i));
        r.opts.push(b); seg.appendChild(b);
      }
      rst.addEventListener('click', () => { const d = dflt(s.path); if (d !== undefined) setNum(r, d); });
      r.row.classList.add('ch'); r.row.append(lab, rst, seg);
      return r;
    }

    function makeRow(s) {
      const r = { s, g: s.group || 'Other', dec: decimals(s), row: el('div', 'row'), num: doc.createTextNode(''), kind: s.type === 'toggle' || s.type === 'choice' ? s.type : 'range' };
      const id = 'f-' + s.path.replace(/\W/g, '-');
      r.row.dataset.find = (s.label + ' ' + r.g).toLowerCase();
      if (r.kind === 'toggle') return makeToggle(r, id);
      if (r.kind === 'choice') return makeChoice(r, id);
      const lab = el('label', 'lab'); lab.htmlFor = id; lab.textContent = s.label;
      const val = el('output', 'val'); val.htmlFor = id; val.appendChild(r.num);
      if (s.unit) { const u = el('small'); u.textContent = s.unit; val.appendChild(u); }
      const rst = el('button', 'rst'); rst.type = 'button'; rst.setAttribute('aria-label', 'Reset ' + s.label); rst.innerHTML = RESET_SVG;
      const sl = el('div', 'sl'), inp = r.inp = el('input'); inp.type = 'range'; inp.id = id; inp.min = s.min; inp.max = s.max; inp.step = s.step;
      sl.appendChild(inp);
      dragWire(sl, inp, s);
      inp.addEventListener('input', () => { cfgSet(s.path, +(+inp.value).toFixed(r.dec)); paint(r, true); badge(); saveSoon(); });
      inp.addEventListener('change', save);
      rst.addEventListener('click', () => { const d = dflt(s.path); if (d !== undefined) { cfgSet(s.path, d); paint(r, false); badge(); save(); } });
      r.row.append(lab, rst, val, sl);
      return r;
    }

    function openGroups() { try { const a = JSON.parse(lsGet(GROUPS)); return Array.isArray(a) ? a : null; } catch (e) { return null; } }
    function saveGroups() {
      if (listEl.classList.contains('filtering')) return; // a filter opens groups for itself: not a choice to remember
      const open = [];
      for (let i = 0; i < listEl.children.length; i++) if (listEl.children[i].open) open.push(listEl.children[i].dataset.g);
      lsSet(GROUPS, JSON.stringify(open));
    }
    function build() {
      listEl.textContent = ''; rows.length = 0;
      for (const g in badges) delete badges[g];
      const byGroup = new Map(), remembered = openGroups(), rank = new Map();
      for (let i = 0; i < CFG_SCHEMA.length; i++) {
        const g = CFG_SCHEMA[i].group || 'Other', rk = typeof CFG_SCHEMA[i].rank === 'number' ? CFG_SCHEMA[i].rank : 0;
        if (!byGroup.has(g)) { byGroup.set(g, []); rank.set(g, rk); } else if (rk < rank.get(g)) rank.set(g, rk);
        byGroup.get(g).push(CFG_SCHEMA[i]);
      }
      const order = Array.from(byGroup.keys()).map((g, i) => [g, i]).sort((a, b) => rank.get(a[0]) - rank.get(b[0]) || a[1] - b[1]);
      let first = true;
      order.forEach(([name]) => {
        const items = byGroup.get(name);
        const d = el('details', 'grp'), sum = el('summary'), n = badges[name] = el('span', 'n');
        d.dataset.g = name;
        d.open = remembered ? remembered.indexOf(name) >= 0 : first;
        first = false;
        sum.append(doc.createTextNode(name), n);
        d.appendChild(sum);
        for (let i = 0; i < items.length; i++) { const r = makeRow(items[i]); rows.push(r); d.appendChild(r.row); }
        d.addEventListener('toggle', saveGroups);
        listEl.appendChild(d);
      });
      built = CFG_SCHEMA.length;
    }

    // ---- toast and the copy / paste box ----
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('on');
      clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1800);
    }
    function showIO(mode, text, hintText) {
      ta.readOnly = mode === 'copy'; ta.value = text; ta.placeholder = mode === 'paste' ? '{ "hit.vMax": 17, ... }' : '';
      ioHint.textContent = hintText; ioHint.classList.remove('err');
      applyBtn.hidden = mode === 'copy';
      ioWrap.hidden = false; body.scrollTop = 0;
      ta.focus({ preventScroll: true });
      if (mode === 'copy') { ta.select(); ta.setSelectionRange(0, text.length); }
    }
    function ioError(msg) { ioHint.textContent = msg; ioHint.classList.add('err'); }

    // The async clipboard when allowed; otherwise the JSON in a readonly box, selected, with a last try at execCommand.
    function copy() {
      const text = JSON.stringify(cfgSnapshotTuned(), null, 2);
      let p;
      try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard')); } catch (e) { p = Promise.reject(e); }
      return p.then(() => { ioWrap.hidden = true; toast('Settings copied'); return 'clipboard'; }, () => {
        showIO('copy', text, 'Clipboard blocked. Copy the selected text:');
        let ok = false;
        try { ok = doc.execCommand('copy'); } catch (e) { /* manual copy it is */ }
        if (ok) { ioHint.textContent = 'Copied. The text is below too.'; toast('Settings copied'); }
        return 'textarea';
      });
    }

    // Applies a pasted snapshot (clamped by cfgApplyTuned). Returns how many values it set, or -1 when it is not settings JSON.
    function paste(text) {
      const o = parse(text);
      if (!o) return -1;
      let n = 0;
      for (let i = 0; i < CFG_SCHEMA.length; i++) { const v = o[CFG_SCHEMA[i].path]; if (typeof v === 'number' && isFinite(v)) n++; }
      cfgApplyTuned(o);
      paintAll(); save();
      return n;
    }
    function applyPasted() {
      const n = paste(ta.value);
      if (n < 0) return ioError('That is not settings JSON.');
      if (n === 0) return ioError('No matching settings in that text.');
      ioWrap.hidden = true; toast('Applied ' + n + (n === 1 ? ' value' : ' values'));
    }

    function reset() { cfgResetTuned(); lsSet(FEEL, null); paintAll(); toast('Reset to defaults'); }

    function isOpen() { return panel.classList.contains('open'); }
    function isFull() { return panel.classList.contains('full'); }
    // full screen: the groups flow into as many columns as fit, and the filter row shows
    function setFull(on) {
      panel.classList.toggle('full', !!on);
      fullBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      fullBtn.setAttribute('aria-label', on ? 'Shrink settings back to a drawer' : 'Expand settings to full screen');
      lsSet(FULL, on ? '1' : null);
      if (!on && filterEl.value) { filterEl.value = ''; filter(); }
    }
    // a filter shows only the rows whose label (or group) has every word typed, and opens their groups for as long as it runs
    function filter() {
      const words = filterEl.value.toLowerCase().split(/\s+/).filter(Boolean), groupsOpen = openGroups();
      for (let i = 0; i < listEl.children.length; i++) {
        const d = listEl.children[i];
        let any = false;
        for (const row of d.querySelectorAll('.row')) {
          const hit = words.every((w) => row.dataset.find.indexOf(w) >= 0);
          row.hidden = !hit; if (hit) any = true;
        }
        d.hidden = !any;
        if (words.length) { if (any) d.open = true; } else d.open = groupsOpen ? groupsOpen.indexOf(d.dataset.g) >= 0 : i === 0;
      }
      listEl.classList.toggle('filtering', words.length > 0);
    }
    function openAll(on) {
      for (let i = 0; i < listEl.children.length; i++) listEl.children[i].open = on;
      saveGroups();
    }
    function open() {
      adopt();
      if (built !== CFG_SCHEMA.length) { build(); if (filterEl.value) filter(); }
      paintAll();
      panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); gearBtn.setAttribute('aria-expanded', 'true');
    }
    function close() {
      save();
      panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); gearBtn.setAttribute('aria-expanded', 'false');
    }
    const toggle = () => (isOpen() ? close() : open());

    $('feelClose').addEventListener('click', close);
    fullBtn.addEventListener('click', () => setFull(!isFull()));
    filterEl.addEventListener('input', filter);
    filterEl.addEventListener('keydown', (e) => { if (e.key !== 'Escape') e.stopPropagation(); else if (filterEl.value) { e.stopPropagation(); filterEl.value = ''; filter(); } });
    $('feelOpenAll').addEventListener('click', () => openAll(true));
    $('feelCloseAll').addEventListener('click', () => openAll(false));
    $('feelCopy').addEventListener('click', copy);
    $('feelPaste').addEventListener('click', () => showIO('paste', '', 'Paste settings JSON, then tap Apply.'));
    $('feelReset').addEventListener('click', reset);
    $('feelDone').addEventListener('click', () => { ioWrap.hidden = true; });
    applyBtn.addEventListener('click', applyPasted);
    ta.addEventListener('paste', () => setTimeout(() => { if (!ta.readOnly && parse(ta.value)) applyPasted(); }, 0));
    // typing JSON must not reach the page's own hotkeys (main.js resets the round on "r")
    ta.addEventListener('keydown', (e) => { if (e.key !== 'Escape') e.stopPropagation(); });
    doc.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) { close(); gearBtn.focus(); } });
    window.addEventListener('pagehide', save);

    // Saved numbers take effect now: createUI runs after every module has declared its section. The defaults must be
    // frozen first or "reset" and "changed" have nothing to compare with (main.js already does it; this covers a bare page).
    if (!CFG_DEFAULT) cfgFreezeDefaults();
    adopt();
    if (lsGet(FULL) === '1') setFull(true);

    return { open, close, toggle, isOpen, isFull, setFull, filter, copy, paste, reset, save };
  })();

  return { update, energy, showResult, hideResult, hint, setMuted, tuner };
}

// ════════ main.js ════════
// main.js — the loop. REAL time drives input, FX, the camera and the HUD; SIM time (real × time-warp scale)
// drives the physics and Kage. A freeze is scale 0, so the world (and Kage) hold perfectly still while the impact
// animates; slow-mo is smooth because advance() substeps the already-scaled dt.
//
// Kiru (kiru.js, the Feel panel's Kiru group) is your avatar in both modes: every hit of yours flashes him to the ball. He is
// drawn, not simulated, so with him switched off the game is the same game.
//
// Against Kage, volleys fill both players' energy bars (energy.js, the Feel panel's Energy group): a full bar is a special,
// unleashed by a curved swipe (the stroke shows it is charged the moment it has curved enough; a tap on your ring or E can do it
// instead, by the setting). Kage arms his as a swing starts. Every hit goes through energy.prepare first, which is all the
// physics ever sees of it: a boost on the special itself, a damp on the touch that answers it.
//
// Two rule sets: the solo time trial (game.js) and versus Kage (versus.js), picked by CFG.match.opponent (the Feel
// panel's Match group; "#solo" or "#versus" in the URL picks one for this page load without touching saved settings).
(function boot() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hash = (location.hash || '').toLowerCase();

  const cam = createCamera();
  const world = createWorld();
  const tw = createTimeWarp();
  const fx = createFX();
  const scene = createScene(canvas);
  const input = createTouchInput(canvas, cam);
  const game = createGame();
  const versus = createVersus();
  const energy = createEnergy();
  const kage = createKage(document);
  const kiru = createKiru(document);
  const audio = createAudio();
  cfgFreezeDefaults(); // every module has declared its CFG section by now
  let rules = game;
  const ui = createUI(document.getElementById('app') || document.body, {
    getWorld: () => world,
    onReset: resetAll,
    onNext: nextRound,
    onMuteToggle: () => { audio.unlock(); audio.setMuted(!audio.muted); return audio.muted; },
    onSpecial: armSpecial,
    audio,
  });
  // after createUI: the panel has applied the saved settings, and the URL wins over them for this load only
  const forced = hash.indexOf('solo') >= 0 ? 0 : hash.indexOf('versus') >= 0 ? 1 : -1;
  input.onGesture(() => audio.unlock());

  // ---- size ----
  let quality = 1; // the governor steps this 1 → .75 → .5 only if the main thread is genuinely slow
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  function resize() {
    const vv = window.visualViewport;
    const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth)), h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    const cs = getComputedStyle(probe);
    const inset = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    const short = h < 520;
    const safe = { top: (short ? 48 : 88) + inset.t, bottom: (short ? 28 : 64) + inset.b, left: 10 + inset.l, right: 10 + inset.r };
    cam.resize(w, h, Math.min(window.devicePixelRatio || 1, 2) * quality, safe);
    scene.resize(w, h, Math.min(window.devicePixelRatio || 1, 2) * quality);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---- state ----
  let lastHitAt = -1e9, woundAt = -1, resultShown = false, prevPhase = 'idle', hintUntil = 0, sideWarnAt = -1e9;
  let kageSide = -1, sidePick = NaN; // Kage's half this match (−1 left, +1 right), and the setting it was resolved from
  const NEUTRAL = 0.06; // m either side of the centre line where either player may hit
  const handBuf = { p0: { x: 0, y: 0, z: 0 }, p1: { x: 0, y: 0, z: 0 }, vx: 0, vz: 0, speed: 0, r: 0.26, stroke: 0, owner: 'you', curved: false };
  const view = { fx, input, time: tw, now: 0, actors: [], halves: 0, world, charged: false };
  const ballScr = { x: 0, y: 0, s: 0, d: 0 };
  const tick = { speed01: 0, pan: 0, timeScale: 1 };
  const info = { state: 'ready', server: 'you', armed: false };
  const kinfo = { ready: false, armed: false }, kiruHit = { half: false, kage: null, special: false };
  let kiruWas = false; // was Kiru on last frame (switching him on puts him on his spot)
  let kageSwing = -1; // the swing (his st.ts) Kage last weighed his special for
  let fullWas = false, toldSpecial = false; // your bar was full last frame; the "special ready" hint was shown this match
  let chargedWas = false; // the finger's swing was charged (curved enough, on a full bar) last frame
  const swing = { turn: 0, turnAbs: 0, arc: 0, curved: false }; // the shape of the swing that last hit, as it met the ball (tests, tuning)
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const vs = () => rules === versus;
  const kiruOn = () => CFG.kiru.on > 0;

  function pickRules() {
    const want = (forced >= 0 ? forced : CFG.match.opponent) > 0 ? versus : game;
    if (want === rules) return false;
    rules = want;
    return true;
  }
  function pickSide() {
    const s = Math.round(CFG.kage.side);
    sidePick = CFG.kage.side;
    kageSide = s === 1 ? 1 : s === 2 ? (Math.random() < 0.5 ? -1 : 1) : -1;
    versus.setSides(kageSide); kage.setSide(kageSide);
    kiru.setSide(vs() ? -kageSide : 1); // your half, or the right in a time trial
  }

  function hintText() {
    if (!vs()) return 'Swipe the ball';
    if (versus.state !== 'ready') return null;
    return versus.snap.server === 'you' ? 'Your serve · swipe up' : 'Kage serves';
  }

  // a fresh ball: the start of a round. Against Kage it hangs on the server's half (the rope tied on that side of the pole).
  function startRally() {
    if (vs()) {
      const sx = versus.snap.server === 'kage' ? kageSide : -kageSide; // which side of the pole (+1 = +x) the server plays
      resetWorld(world, { phi: Math.PI / 2 - 1.45 * sx });
      kage.reset(world, { server: versus.snap.server });
    } else resetWorld(world);
    kiru.reset();
    energy.newRally(); kageSwing = -1;
    tw.cancel();
    fx.reset();
    ui.hideResult();
    ui.hint(hintText());
    resultShown = false; woundAt = -1; lastHitAt = -1e9; prevPhase = 'idle'; hintUntil = 0;
  }
  // a new match (or a new solo round)
  function resetAll() {
    pickRules();
    pickSide();
    if (vs()) versus.reset(); else game.reset();
    energy.reset(); fullWas = false; toldSpecial = false;
    startRally();
  }
  // the round card was tapped: next round, or a new match once it is over
  function nextRound() {
    if (vs() && versus.state === 'wound' && !versus.snap.matchOver) { versus.nextRound(); startRally(); } else resetAll();
  }

  // ---- a hit, from either player: a finger's swipe, or Kage's fist ----
  function tryHit(hand, now, who) {
    if (world.state !== 'live' || !tw.canHit()) return null;
    const you = who !== 'kage';
    if (you && now - lastHitAt < CFG.hit.cooldownMs) return null;
    // a curved swipe on a full bar is your special: armed for this one touch (a miss leaves it unarmed again)
    const auto = you && vs() && hand.curved === true && energy.curveOn && energy.full('you') && !energy.armed('you') && energy.arm('you', true);
    if (vs()) energy.prepare(you ? 'you' : 'kage', hand); else { hand.boost = 1; hand.gain = 1; }
    const res = applyHit(world, hand);
    if (!res) { if (auto) energy.arm('you', false); return null; }
    if (you) lastHitAt = now;
    res.owner = you ? 'you' : 'cpu';
    res.charged = hand.gain < 1; // it answered the other player's special: it landed heavy
    rules.onHit(res, who);
    const e = vs() && versus.state !== 'wound' ? energy.onHit(you ? 'you' : 'kage', versus.state === 'playing') : '';
    res.special = e === 'special' ? (you ? 'you' : 'kage') : '';
    if (you || CFG.kage.warp > 0) {
      if (res.special) tw.trigger(Math.max(0.9, res.power), 'perfect', true); // a special is always a big moment
      else tw.trigger(you ? res.power : res.power * CFG.kage.warpScale, res.quality);
    }
    fx.impact(res, cam, world);
    audio.hit(res);
    if (res.special) audio.special(res.special);
    if (you) audio.vibrate(res.special ? [30, 40, 60] : res.power > 0.7 ? [20, 30, 35] : res.power > 0.25 ? [12] : null);
    if (vs()) kage.onWorldHit(res, who);
    if (res.special === 'kage') kage.onSpecial();
    if (you && kiruOn()) { // Kiru flash-steps to the ball your swipe just hit
      kiruHit.half = vs(); kiruHit.kage = vs() ? kage.st : null; kiruHit.special = res.special === 'you';
      const d = kiru.onHit(res, world, kiruHit);
      if (d > 0.05) audio.flash(d, 0.6);
    }
    ui.hint(null); hintUntil = 0;
    return res;
  }

  // how to use a full bar, by the trigger setting and the device
  function readyHint() {
    const m = CFG.energy.trigger | 0;
    if (m === 1) return coarse ? 'Special ready · tap ⚡' : 'Special ready · press E';
    return coarse || m === 0 ? 'Curve your swipe ⚡' : 'Curve a swipe or press E'; // short: it sits between the two rings
  }

  // the special button (or E), when the trigger setting allows a tap: arm a full bar, or disarm it again
  function armSpecial() {
    audio.unlock();
    if (!vs() || !energy.tapOn || versus.state === 'wound' || !energy.full('you')) return false;
    const a = energy.arm('you');
    audio.energy(a ? 'arm' : 'disarm');
    return a;
  }

  // Against Kage your swipes count on your half and on the line, and on a ball that has died anywhere; only the server opens
  // a round. "You may hit on his half" lifts the half rule.
  function mayHit() {
    if (!vs()) return true;
    if (versus.state === 'ready') return versus.snap.server === 'you';
    if (CFG.match.crossHits > 0) return true;
    const b = world.ball;
    return b.speed < 1.2 || b.p.x * kageSide <= NEUTRAL;
  }
  // a swipe through the ball on his half: say why nothing happened (once in a while, not every segment)
  function sideWarn(hand, now) {
    if (now - sideWarnAt < 1400) return;
    const b = world.ball.p, ax = hand.p1.x - hand.p0.x, az = hand.p1.z - hand.p0.z, l2 = ax * ax + az * az;
    const t = l2 > 1e-9 ? Math.max(0, Math.min(1, ((b.x - hand.p0.x) * ax + (b.z - hand.p0.z) * az) / l2)) : 0;
    const dx = hand.p0.x + ax * t - b.x, dz = hand.p0.z + az * t - b.z, rs = world.ball.r + hand.r;
    if (dx * dx + dz * dz > rs * rs) return;
    sideWarnAt = now;
    ui.hint(versus.state === 'ready' ? 'Kage serves' : "Kage's half"); hintUntil = now + 1100;
  }

  function pumpInput(now) {
    input.poll(now);
    const segs = input.segments;
    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      if (world.state !== 'live' || !tw.canHit()) continue; // swipes during the freeze are swallowed: no double hit on the follow-through
      const hand = input.toHand(seg, world.ball.p.y, handBuf);
      if (!hand) continue;
      hand.owner = 'you';
      hand.curved = energy.curved(seg.turn, seg.turnAbs, seg.arc); // its swing's shape when it reached the ball
      if (!mayHit()) { sideWarn(hand, now); continue; }
      if (input.shouldHold(seg, hand, world.ball)) continue; // a finger that landed ON the ball: its first contact is the slowest part of the swipe, so wait ~2 frames for the peak
      if (tryHit(hand, now, 'you')) {
        input.consumeStroke(seg.stroke);
        swing.turn = seg.turn; swing.turnAbs = seg.turnAbs; swing.arc = seg.arc; swing.curved = hand.curved;
      }
    }
  }

  function onEvents(now) {
    const evs = drainEvents(world);
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      fx.event(ev, cam, world);
      rules.onEvent(ev, world);
      if (ev.type === 'snap') audio.snap(ev.strength);
      else if (ev.type === 'ground') audio.ground(ev.speed);
      else if (ev.type === 'pole') audio.pole(ev.speed);
      else if (ev.type === 'wrap') audio.wrapTick(ev.turns);
      else if (ev.type === 'wound') {
        audio.wound();
        audio.vibrate([25, 40, 45]);
        tw.trigger(Math.min(1, Math.max(0.85, ev.speed / CFG.hit.vMax)), 'perfect', true); // the finish is always a big moment: forced past the re-hit window and the rally pacing
        woundAt = now;
        if (vs() && versus.snap.winner) kage.onRoundEnd(versus.snap.winner);
        if (kiruOn()) kiru.onRoundEnd(!vs() || versus.snap.winner === 'you');
      }
    }
  }

  // The court's size is on the Feel panel (pole, rope, ball): a change re-ties the rope and replays the round. The tie point
  // stays just under the pole top and the court ring just outside the rope's reach.
  const court = { poleH: NaN, ropeL: NaN, ballR: NaN, poleR: NaN };
  function watchCourt() {
    const W = CFG.world;
    if (W.poleH === court.poleH && W.ropeL === court.ropeL && W.ballR === court.ballR && W.poleR === court.poleR) return false;
    const first = court.poleH !== court.poleH;
    court.poleH = W.poleH; court.ropeL = W.ropeL; court.ballR = W.ballR; court.poleR = W.poleR;
    W.attachY = W.poleH - 0.1;
    W.groundR = Math.max(1.2, W.ropeL + 0.3);
    if (!first) { if (vs() && versus.state !== 'wound') versus.replay(); else if (!vs()) game.reset(); startRally(); }
    return true;
  }
  // the mode and Kage's half come from the panel too: either change starts a new match
  function watchRules() {
    if (pickRules() || (vs() && CFG.kage.side !== sidePick)) resetAll();
  }

  // The Feel panel is a bottom drawer on tall phones: lift the court above it while it is open so the ball stays in view.
  // Expanded to the whole screen it covers the court anyway, so the court keeps its full-height fit then.
  // offsetHeight is layout size (the slide-in transform does not change it), so the camera refits once, not every frame.
  const panelEl = document.getElementById('panel');
  let panelInset = 0, panelKey = -1;
  function syncPanel(force) {
    const open = ui.tuner.isOpen(), full = ui.tuner.isFull(), key = (open ? 1 : 0) + (full ? 2 : 0);
    if (key === panelKey && !force) return;
    panelKey = key;
    const inset = open && !full && panelEl.offsetWidth > cam.w * 0.8 ? panelEl.offsetHeight + 8 : 0;
    if (inset !== panelInset) { panelInset = inset; cam.setInsetBottom(inset); }
  }
  window.addEventListener('resize', () => syncPanel(true)); // a rotation can turn the drawer into a side panel (and back)

  // ---- one frame of the whole game ----
  // realDt drives the sim (clamped by the caller); clockDt is the true elapsed time, which is all the stopwatch should count
  function step(realDt, now, draw, clockDt) {
    watchRules();
    watchCourt();
    pumpInput(now);
    const scale = tw.update(realDt);
    const simDt = realDt * scale;
    energy.update(simDt);
    if (vs()) {
      info.state = versus.state; info.server = versus.snap.server; info.armed = energy.armed('kage');
      const hand = kage.update(simDt, realDt, world, info);
      if (kage.st.phase === 'swing' && kage.st.ts !== kageSwing) { // he weighs his special as a swing starts, so it shows on him before the fist lands
        kageSwing = kage.st.ts;
        if (CFG.energy.kage > 0 && energy.full('kage') && !energy.armed('kage') && kage.wantsSpecial(versus.snap.lead)) energy.arm('kage', true);
      }
      if (hand) kage.onSwing(tryHit(hand, now, 'kage'));
    }
    // your bar filling: a chime, and the first time in a match, a word on how to use it
    const fullNow = vs() && energy.full('you');
    if (fullNow && !fullWas) {
      audio.energy('full');
      if (!toldSpecial && versus.state !== 'wound') { toldSpecial = true; ui.hint(readyHint()); hintUntil = now + 2200; }
    }
    fullWas = fullNow;
    // a swing that has curved enough on a full bar is charged: the trail turns storm blue, Kiru lights up, and its hit is the special
    const charged = fullNow && energy.curveOn && input.active && !input.spent && versus.state !== 'wound' && energy.curved(input.turn, input.turnAbs, input.arc);
    if (charged && !chargedWas) audio.energy('arm');
    chargedWas = charged; view.charged = charged;
    if (kiruOn()) {
      if (!kiruWas) { kiru.setSide(vs() ? -kageSide : 1); kiru.reset(); }
      kinfo.ready = input.active && world.state === 'live' && tw.canHit() && mayHit();
      kinfo.armed = vs() && (energy.armed('you') || charged);
      const back = kiru.update(simDt, realDt, world, kinfo);
      if (back > 0.05) audio.flash(back, 0.4);
    }
    kiruWas = kiruOn();
    if (simDt > 0) advance(world, simDt);
    onEvents(now);
    if (prevPhase !== 'ramp' && tw.phase === 'ramp') audio.release(tw.seq.power); // the running sequence's power, so the whoosh fits the ramp tw plays (a wound slam can replace it)
    prevPhase = tw.phase;

    fx.setCharge(vs() ? energy.snap.charge : '', energy.snap.chargeK);
    fx.update(realDt, simDt, tw, world);
    fx.applyCamera(cam);
    rules.update(clockDt, world);

    cam.project(world.ball.p.x, world.ball.p.y, world.ball.p.z, ballScr);
    tick.speed01 = Math.min(1, world.ball.speed / CFG.hit.vMax);
    tick.pan = Math.max(-1, Math.min(1, (ballScr.x / cam.w) * 2 - 1));
    tick.timeScale = scale;
    audio.tick(realDt, tick);

    if (hintUntil && now > hintUntil) { hintUntil = 0; ui.hint(hintText()); }
    if (rules.state === 'wound' && !resultShown && woundAt >= 0 && now - woundAt > 900) { resultShown = true; ui.showResult(rules.snap); }
    ui.update(rules.snap, realDt);
    ui.energy(energy.snap, vs(), charged);
    syncPanel(false);

    if (draw) {
      view.now = now; view.halves = vs() ? kageSide : 0;
      view.actors.length = 0;
      if (vs()) view.actors.push(kage.actor);
      if (kiruOn()) view.actors.push(kiru.actor);
      scene.draw(ctx, cam, world, view);
    }
  }

  // ---- the frame loop, with a governor that watches main-thread WORK (not frame interval:
  //      a 30 fps embed cap would otherwise read as a slow phone) ----
  const work = new Float32Array(90);
  let wi = 0, wn = 0, lastDown = 0, last = performance.now(), manual = false;
  const perf = { workMs: 0, fps: 0 };
  function frame(now) {
    requestAnimationFrame(frame);
    if (manual) return;
    let realDt = (now - last) / 1000;
    last = now;
    if (!(realDt > 0)) realDt = 0;
    const clockDt = realDt > 0.5 ? 0 : realDt; // the stopwatch runs on true time (a 20 fps phone is not 33 % faster), but a hidden tab is a pause
    if (realDt > 1 / 30) realDt = 1 / 30; // a hidden tab or a hiccup must not teleport the ball
    const t0 = performance.now();
    step(realDt, now, true, clockDt);
    const w = performance.now() - t0;
    work[wi] = w; wi = (wi + 1) % work.length; if (wn < work.length) wn++;
    perf.fps = clockDt > 0 ? 1 / clockDt : 0; // the real frame rate, not the clamped one
    if (wn === work.length && now - lastDown > 2500 && quality > 0.5) {
      const s = Array.from(work).sort((a, b) => a - b);
      perf.workMs = s[s.length >> 1];
      if (perf.workMs > 11) { quality = quality > 0.75 ? 0.75 : 0.5; scene.setQuality(quality); resize(); lastDown = now; wn = 0; }
    }
  }

  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  window.addEventListener('keydown', (e) => { // not while a Feel-panel slider or the paste box has focus
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'r' || e.key === 'R') resetAll();
    else if ((e.key === 'e' || e.key === 'E') && !e.repeat) armSpecial();
  });

  // ---- test hooks: manual stepping and synthetic swipes through the SAME hit path as a finger ----
  window.__tb = {
    CFG, world, cam, tw, fx, game, versus, energy, kage, kiru, input, scene, audio, ui, perf, swing, special: armSpecial,
    get rules() { return rules; },
    manual(b) { manual = b !== false; },
    // advance REAL time by ms in 1/60 s frames (with drawing on the last one)
    advance(ms) {
      let t = performance.now();
      const n = Math.max(1, Math.round(ms / 16.667));
      for (let i = 0; i < n; i++) { t += 16.667; step(1 / 60, t, i === n - 1, 1 / 60); }
    },
    // a synthetic swipe through the ball along (dx,dz) at `speed` m/s, via the real hit path (the half rule is the finger's, not this hook's);
    // curved: as if its swing had curved enough for a special
    hit(dx, dz, speed, curved) {
      lastHitAt = -1e9; // tests may chain hits freely; the real cooldown still guards fingers
      const l = Math.hypot(dx, dz) || 1, ux = dx / l, uz = dz / l, b = world.ball.p;
      const h = handBuf;
      h.p0.x = b.x - ux * 0.5; h.p0.y = b.y; h.p0.z = b.z - uz * 0.5;
      h.p1.x = b.x + ux * 0.05; h.p1.y = b.y; h.p1.z = b.z + uz * 0.05;
      h.vx = ux * speed; h.vz = uz * speed; h.speed = speed; h.r = CFG.hit.handR; h.stroke = -1; h.owner = 'you'; h.curved = curved === true;
      return tryHit(h, performance.now(), 'you');
    },
    reset: resetAll,
    next: nextRound,
  };

  watchCourt();
  resetAll();
  requestAnimationFrame(frame);
})();

})();
</script>
</body>
</html>
