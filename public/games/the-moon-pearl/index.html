  // ───────── title: a proscenium of velvet and gilt, the Moon Pearl rising like a moon ─────────
  let newArm = 0;
  function buildTitle() {
    titleEl = mk('div', 'title'); titleEl.hidden = true;
    const T0 = STORY.title;
    const nm = String(T0.name || ''), m = /^(THE)\s+(.+)$/i.exec(nm);
    const deco = mk('div', 't-deco', '<i class="t-spot"></i><i class="t-fl"></i><i class="t-cur l"></i><i class="t-cur r"></i><i class="t-tie l"></i><i class="t-tie r"></i><i class="t-val"></i><i class="t-swag"></i>');
    deco.setAttribute('aria-hidden', 'true');
    const top = mk('div', 't-top', `<div class="t-moon" aria-hidden="true"><i class="halo"></i><i class="orb"></i></div><div class="t-kick">${esc(T0.place)}</div>`
      + `<h1 class="t-name" aria-label="${esc(nm)}">${m ? `<span class="a">${esc(m[1])}</span>` : ''}<span class="b">${(m ? m[2] : nm).split(' ').map((w) => `<span>${esc(w)}</span>`).join(' ')}</span></h1>`
      + `<div class="t-sub">${esc(T0.sub)}</div><p class="t-tag">${esc(T0.tagline)}</p>`);
    const bot = mk('div', 't-bot');
    newBtn = mk('button', 'btn gold', `${I.play}<span>${esc(TXT.newGame)}</span>`); newBtn.type = 'button';
    contBtn = mk('button', 'btn gilt', `<span>${esc(TXT.cont)}</span>`); contBtn.type = 'button';
    const setBtn = mk('button', 'btn gilt ghost', `${I.gear}<span>${esc(TXT.settings)}</span>`); setBtn.type = 'button';
    const foot = mk('div', 't-foot', TXT.footer);
    bot.append(newBtn, contBtn, setBtn, foot);
    titleEl.append(deco, top, bot);
    const site = window.PN_SITE;   // set only by the site build (build.mjs --site): the way back to the Arcade
    if (site && site.back) { const a = mk('a', 't-back', `${I.back}<span>${esc(site.label || 'Arcade')}</span>`); a.href = site.back; titleEl.appendChild(a); }
    titleEl.addEventListener('pointerdown', gesture);
    newBtn.addEventListener('click', (e) => {
      tapFx(e);
      if (SAVE.has() && !newArm) {
        newArm = setTimeout(() => { newArm = 0; newBtn.classList.remove('warn'); newBtn.innerHTML = `${I.play}<span>${esc(TXT.newGame)}</span>`; }, 4000);
        newBtn.classList.add('warn'); newBtn.innerHTML = `<span>${esc(TXT.startOver)} <small>${esc(TXT.startOverSub)}</small></span>`;
        return;
      }
      leaveTitle(); BUS.emit('ui:new');
    });
    contBtn.addEventListener('click', (e) => { tapFx(e); leaveTitle(); BUS.emit('ui:continue'); });
    setBtn.addEventListener('click', (e) => { tapFx(e); openSettings(); });
    root.appendChild(titleEl);
  }
  function showTitle() {
    titleOn = true; root.classList.add('ttl');
    clearTimeout(newArm); newArm = 0; newBtn.classList.remove('warn'); newBtn.innerHTML = `${I.play}<span>${esc(TXT.newGame)}</span>`;
    contBtn.hidden = !SAVE.has();
    titleEl.classList.remove('out'); titleEl.hidden = !!bootEl;
    syncHud();
  }
  function leaveTitle() {
    if (!titleOn) return;
    titleOn = false; root.classList.remove('ttl');
    if (RM) titleEl.hidden = true;
    else { titleEl.classList.add('out'); setTimeout(() => { if (!titleOn) { titleEl.hidden = true; titleEl.classList.remove('out'); } }, 450); }
    syncHud();
  }

  // ───────── credits over the dawn ─────────
  let CR = null;
  const fmtTime = (s) => { s = Math.max(0, Math.round(+s || 0)); const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0'); };
  function credits(stats) {
    stats = stats || {};
    closeCredits(true);
    closePanels(true);
    return new Promise((resolve) => {
      OPEN.credits = 1; root.classList.add('cred'); syncHud(); prompt(null);
      const c = mk('div', 'cr');
      const lines = STORY.credits.map((t, i) => `<div class="${i === 0 ? 'c0' : i >= STORY.credits.length - 2 ? 'ln sm' : 'ln'}">${esc(t)}</div>`).join('');
      const roll = mk('div', 'cr-roll', lines);
      const coda = mk('div', 'cr-coda', `<p>${esc(STORY.coda)}</p>`);
      const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
      const played = num(stats.played, S.played), hints = num(stats.hints, S.hints);
      const found = num(stats.found, S.journal.length), of = num(stats.of, Object.keys(STORY.journal).length);
      const wrong = num(stats.wrong, (S.accuse && S.accuse.wrong || []).length) + num(stats.misses, (S.accuse && S.accuse.misses) || 0);
      const tile = (b, s) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`;
      const end = mk('div', 'cr-end', `<div class="stats"><h3>${esc(TXT.yourNight)}</h3><div class="st">${tile(fmtTime(played), TXT.time)}${tile(found + '/' + of, TXT.clues)}${tile(String(hints | 0), TXT.hints)}${tile(String(wrong | 0), TXT.wrong)}</div></div>`);
      const acts = mk('div', 'acts');
      const again = mk('button', 'btn gold', `${I.replay}<span>${esc(TXT.again)}</span>`); again.type = 'button';
      const tt = mk('button', 'btn gilt', `${I.home}<span>${esc(TXT.title)}</span>`); tt.type = 'button';
      again.addEventListener('click', (e) => { e.stopPropagation(); tapFx(e); BUS.emit('ui:new'); });
      tt.addEventListener('click', (e) => { e.stopPropagation(); tapFx(e); BUS.emit('ui:title'); });
      acts.append(again, tt); end.appendChild(acts);
      c.append(roll, coda, end);
      root.appendChild(c);
      const timers = [];
      CR = { el: c, roll, coda, end, timers, anim: null, stage: 0, resolve };
      c.addEventListener('click', () => skipCredits());
      const H = innerHeight, h = roll.offsetHeight;
      if (RM) {
        roll.style.top = '50%'; roll.style.transform = 'translateY(-50%)';
        timers.push(setTimeout(() => { roll.style.transition = 'opacity .6s'; roll.style.opacity = '0'; toCoda(); }, autoMs ? 200 : 6000));
      } else {
        const dur = autoMs ? 500 : Math.max(9000, ((H + h) / 64) * 1000);
        CR.anim = roll.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-(H + h + 40)}px)` }], { duration: dur, easing: 'linear', fill: 'forwards' });
        timers.push(setTimeout(toCoda, dur - (autoMs ? 0 : 900)));
      }
    });
  }
  function toCoda() {
    if (!CR || CR.stage >= 1) return;
    CR.stage = 1; CR.coda.classList.add('on');
    CR.timers.push(setTimeout(toEnd, autoMs ? 150 : 4200));
  }
  function toEnd() {
    if (!CR || CR.stage >= 2) return;
    CR.stage = 2;
    if (CR.anim) { try { CR.anim.finish(); } catch (e) {} }
    CR.roll.style.opacity = '0';
    CR.coda.classList.add('on');
    // lift the coda into the space above the stats card
    const p = CR.coda.firstChild.getBoundingClientRect(), e = CR.end.getBoundingClientRect();
    const target = (HUD.safeT + e.top) / 2, lift = Math.max(0, (p.top + p.bottom) / 2 - target);
    CR.coda.style.setProperty('--lift', lift.toFixed(0) + 'px');
    CR.coda.classList.add('up'); CR.end.classList.add('on');
    const r = CR.resolve; CR.resolve = null; if (r) r();
  }
  function skipCredits() { if (!CR) return; if (CR.stage === 0) { CR.coda.classList.add('on'); toEnd(); } else if (CR.stage === 1) toEnd(); }
  function closeCredits(instant) {
    if (!CR) return;
    const c = CR; CR = null;
    for (const t of c.timers) clearTimeout(t);
    if (c.anim) { try { c.anim.cancel(); } catch (e) {} }
    if (c.resolve) c.resolve();
    OPEN.credits = 0; root.classList.remove('cred');
    if (instant || RM) c.el.remove(); else { c.el.classList.add('out'); setTimeout(() => c.el.remove(), 400); }
    syncHud();
  }

  // ───────── resets ─────────
  function closePanels(instant) {
    while (toastList.length) dropToast(toastList[0], true);
    if (noteCtl) noteCtl.close(true);
    if (evCtl) evCtl.finish(null, true);
    closeBoard(instant); closeMenu(instant); closeSettings(instant);
  }
  function flush() {
    gen++;
    if (cur) cur.finish();
    if (curPick && OPEN.choose) curPick(0, true);
    if (evCtl) evCtl.finish(null, true);
    if (noteCtl) noteCtl.close(true);
    prompt(null);
  }
  function resync() {
    if (S.jseen === undefined || S.jseen > S.journal.length) S.jseen = S.journal.length;
    renderClock(); renderBadge(); renderTray();
    renderNav(VIEW.top && VIEW.top.id);
    renderCall();
    lastProgress = now();
  }

  // ───────── keys ─────────
  const btnFocused = () => { const a = D.activeElement; return !!(a && a !== D.body && root.contains(a) && (a.tagName === 'BUTTON' || a.getAttribute('role') === 'button')); };
  function escape(k) {
    if (OPEN.note) { if (noteCtl) noteCtl.close(); return; }
    if (OPEN.settings) { closeSettings(); return; }
    if (OPEN.menu) { closeMenu(); return; }
    if (OPEN.board) { closeBoard(); return; }
    if (OPEN.credits) { skipCredits(); return; }
    if (k === 'Escape' && hudOn && !busy() && !titleOn && now() - viewT > 450 && VIEW.top && VIEW.top.id === 'room') openMenu();
  }
  function onKey(p) {
    const k = p.key;
    if (k === 'Escape' || k === 'Backspace') { escape(k); return; }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if (titleOn) return;
    if (OPEN.credits) { if (k === ' ' || k === 'Enter') skipCredits(); return; }
    if (OPEN.note) { if ((k === 'Enter' || k === ' ') && !btnFocused() && noteCtl) noteCtl.close(); return; }
    if (OPEN.present && evCtl) {
      if (/^[1-9]$/.test(k)) { evCtl.select(+k - 1); return; }
      if (k === 'ArrowDown' || k === 'ArrowRight') { evCtl.select(Math.min(evCtl.n - 1, evCtl.sel + 1)); return; }
      if (k === 'ArrowUp' || k === 'ArrowLeft') { evCtl.select(Math.max(0, evCtl.sel - 1)); return; }
      if (k === 'Enter' && !btnFocused()) { evCtl.go(); return; }
      return;
    }
    if (OPEN.choose && /^[1-9]$/.test(k)) { if (curPick) curPick(+k - 1); return; }
    if (OPEN.say && (k === ' ' || k === 'Enter')) { if (!btnFocused() && cur) cur.tap(); return; }
    if (k === 'c' || k === 'C' || k === 'j' || k === 'J') { if (OPEN.board) closeBoard(); else if (hudOn && !busy()) openBoard(); return; }
    if (!hudOn || panelOpen()) return;
    if ((k === 'h' || k === 'H') && !busy()) hint();
  }

  // ───────── boot screen ─────────
  // the boot screen holds long enough to read as Mei's headset powering up (not in dev/test runs)
  let bootTimer = 0;
  function hideBoot(instant) {
    if (!bootEl) return;
    const b = bootEl;
    const go = () => {
      if (bootEl !== b) return;
      bootEl = null; clearTimeout(bootTimer); b.classList.add('done'); setTimeout(() => b.remove(), 500);
      if (titleOn && titleEl.hidden) titleEl.hidden = false;   // the title makes its entrance as the headset finishes booting
    };
    const left = instant || DEV ? 0 : Math.max(0, 900 - (now() - bootT0));
    clearTimeout(bootTimer);
    if (left) bootTimer = setTimeout(go, left); else go();
  }

  return {
    init() {
      if (RM) D.documentElement.classList.add('rm');
      SPK_BY_NAME = Object.create(null);
      for (const k in STORY.speakers) if (k !== 'narr' && STORY.speakers[k].name) SPK_BY_NAME[STORY.speakers[k].name] = k;
      bootEl = $('boot'); bootT0 = now();
      buildHud(); buildDialogue(); buildTitle();
      root.addEventListener('pointerdown', gesture, true);
      root.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0) setTimeout(() => { if (D.activeElement === b) b.blur(); }, 0); });

      BUS.on('ready', () => { hideBoot(); redrawTray(); });
      BUS.on('fonts', () => { redrawTray(); });
      BUS.on('rebuild', () => { redrawTray(); if (sayVisible && P.on) sizePortrait(); if (bdEl) renderBoard(); });
      BUS.on('title', () => { flush(); closePanels(true); closeCredits(true); hideBoot(); showTitle(); resync(); });
      BUS.on('phase', (p) => { if (p.phase !== 'title') leaveTitle(); syncHud(); if (p.phase !== 'play') { closeBoard(true); closeMenu(true); prompt(null); } renderCall(); });
      BUS.on('game:new', () => { dropLog(); flush(); closePanels(true); closeCredits(true); hideBoot(true); leaveTitle(); S.jseen = 0; resync(); syncHud(); });
      BUS.on('game:load', () => { dropLog(); flush(); closePanels(true); closeCredits(true); leaveTitle(); resync(); syncHud(); });
      BUS.on('jump', () => { dropLog(); flush(); closePanels(true); closeCredits(true); hideBoot(true); leaveTitle(); S.jseen = S.journal.length; resync(); syncHud(); });
      BUS.on('inv', (p) => { if (p.add || p.remove) renderTray(p.add); else renderSel(); lastProgress = now(); });
      BUS.on('time', () => { renderClock(); if (bdEl) bdEl.querySelector('.lg span').textContent = TXT.caseSub(TIME.label(), S.journal.length); });
      BUS.on('journal', onJournal);
      BUS.on('flag', () => { lastProgress = now(); if (bdEl) renderBoard(); renderCall(); });
      BUS.on('call:buzz', () => { renderCall(); if (!callEl.hidden && !RM && callEl.animate) callEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' }); });
      BUS.on('view', (p) => { viewT = now(); renderNav(p.id); renderCall(); });
      BUS.on('view:settled', () => renderCall());
      BUS.on('key', onKey);
      resync();
    },
    update(dt) {
      if (T.on) stepTyping();
      if (P.on) { P.acc += dt; if (P.acc >= (T.on || P.voiceOn ? 0.033 : 0.083)) { P.acc = 0; drawPortrait(); } }   // 30 fps talking, 12 idle
      slowAcc += dt;
      if (slowAcc >= 0.5) {
        slowAcc = 0;
        renderCall();
        const nudge = hudOn && !busy() && S.phase === 'play' && now() - lastProgress > 150000;
        if (thinkBtn.classList.contains('nudge') !== nudge) thinkBtn.classList.toggle('nudge', nudge);
      }
    },
    say, choose, note, present, toast, prompt, chapter, credits, hint,
    busy,
    presenting: () => !!OPEN.present,
    cinema: () => chapN > 0,
    choosing: () => !!OPEN.choose,
    openBoard, closeBoard, openSettings, openMenu, drawItem,
    // dev hooks (tools/shot.mjs, the headless playthrough)
    advance() {
      if (cur) { completeTyping(); cur.finish(); return; }
      if (noteCtl) { noteCtl.close(true); return; }
      if (CR) skipCredits();
    },
    pick(i) { if (curPick) curPick(i | 0, true); },
    setAuto(ms) {
      autoMs = Math.max(0, ms | 0);
      if (autoMs && cur) { const c = cur; completeTyping(); setTimeout(() => c.finish(), autoMs); }
      if (autoMs && noteCtl) { const n = noteCtl; setTimeout(() => n.close(true), autoMs); }
    },
  };
})();

// ⟪cabinet⟫
// ───────────────────────────── 50. Cabinet: Madame Luna's moon cabinet ─────────────────────────────
// The `cabinet` view: Madame's tall black-lacquer trick cabinet. Gold-leaf moon phases climb its two stiles and arc
// over its night-sky crown to a full moon at the top; three drawers, each with its own kind of lock:
//   ☾ crescent  a star-shaped keyhole between two crescents        → Pip's tiny star-bowed brass key
//   ◐ half      a brass theater-seat dial, ROW and SEAT wheels      → A 7 (Silas's seat)
//   ● full      no keyhole, a round velvet hollow the pearl's size  → the Moon Pearl itself
// Sub-states: the dial face (drag/tap/arrow keys, a pull ring), and each drawer's inside seen from above. Placing the
// pearl wakes the cabinet: the phases light one by one up to the crown, the full moon blazes, the drawer glides out.
// Speed: everything static is baked in bake() at the stage's device resolution; a frame is ~12 blits plus a few
// additive glow sprites. Animation runs on frame time in update(), so solve() works with the view closed.
const Cabinet = (() => {
  // ═════════════════════════ basics ═════════════════════════
  const NEW_TEXT = {
    row: 'ROW',     // NEW-TEXT: engraved over the first wheel of the half-moon lock (it's a theater seat plate)
    seat: 'SEAT',   // NEW-TEXT: engraved over the second wheel
  };
  const ORDER = STORY.cabinet.order;                       // crescent half full, top → bottom
  const ROWS = STORY.answers.rows, NSEAT = STORY.answers.seats;
  const SEATS = []; for (let i = 1; i <= NSEAT; i++) SEATS.push(String(i));
  // where the half-moon wheels start on a new night: ROW E, SEAT 3, no part of the answer, and fixed (not random)
  // so screenshots and tests stay stable. If the answer ever changes to share a wheel with it, that wheel moves on.
  const START = (() => {
    let r = ROWS.indexOf('E'), n = 3 - 1;
    const ar = ROWS.indexOf(STORY.answers.seat.row), an = STORY.answers.seat.num - 1;
    if (r < 0 || r === ar) r = (ar + 4) % ROWS.length;
    if (n === an) n = (an + 4) % NSEAT;
    return [r, n];
  })();
  const NOOP = { stop() {}, vol() {}, rate() {} };
  function sfx(n, o) { try { if (typeof Snd !== 'undefined' && Snd && Snd.sfx) return Snd.sfx(n, o) || NOOP; } catch (e) { reportErr('Cabinet.sfx', e); } return NOOP; }
  const FX = () => QUALITY[QL].fx;

  // ── frame-time waits and tweens: they pause with the game; a jump or a new game cancels a running sequence ──
  let RUN = 0, T = 0, SPD = 1, busy = false;
  const WAITS = [], TW = [];
  const rmK = () => (RM ? 0.6 : 1);
  const sleep = (s) => new Promise((r) => { const t = s / SPD * rmK(); if (t <= 0.001) r(); else WAITS.push({ t, r }); });
  function tween(o, k, to, d, e) {
    for (let i = TW.length - 1; i >= 0; i--) if (TW[i].o === o && TW[i].k === k) TW.splice(i, 1);
    d = d / SPD * rmK();
    if (!(d > 0.001)) { o[k] = to; return; }
    TW.push({ o, k, a: o[k], b: to, t: 0, d, e: e || smooth });
  }
  function tick(dt) {
    T += dt;
    for (let i = TW.length - 1; i >= 0; i--) { const w = TW[i]; w.t += dt; const p = Math.min(1, w.t / w.d); w.o[w.k] = w.a + (w.b - w.a) * w.e(p); if (p >= 1) TW.splice(i, 1); }
    for (let i = WAITS.length - 1; i >= 0; i--) { const w = WAITS[i]; w.t -= dt; if (w.t <= 0) { WAITS.splice(i, 1); w.r(); } }
  }
  // run one puzzle sequence at a time; `gone()` turns true if the game was reset underneath it
  async function seq(fn, speed) {
    if (busy) return 'busy';
    busy = true; SPD = speed || 1;
    const run = RUN, gone = () => run !== RUN;
    try { await fn(gone); } catch (e) { reportErr('Cabinet.seq', e); } finally { if (run === RUN) { busy = false; SPD = 1; } }
    return 'ok';
  }

  // ═════════════════════════ geometry (cabinet units, CU) ═════════════════════════
  // A frontal elevation. The crown is a segmental arch over the cornice; the body has two stiles and three drawers.
  const CW = 600, CH = 1100;
  const CORN = { y0: 196, y1: 236 };
  const BODY = { y0: 236, y1: 992 };
  const BASE = { y0: 992, y1: 1050 };
  const DW = 416, DH = 224, FW = DW - 12, FH = DH - 12;
  const DR = {};
  ORDER.forEach((d, i) => { DR[d] = { x: (CW - DW) / 2, y: BODY.y0 + 20 + i * (DH + 25), w: DW, h: DH }; });
  const ARCH = { cx: 300, cy: 337.84, r: 331.84, a0: Math.atan2(196 - 337.84, -300), a1: Math.atan2(196 - 337.84, 300) };
  // the moon phases, lit in six steps from the bottom of the stiles up to the crown's full moon
  //   [x, y, r, lit fraction, side (+1 lit on the right: waxing, up the left stile; -1 waning, up the right)]
  const STEPS = [];
  (() => {
    const sy = [DR.full.y + DH / 2, DR.half.y + DH / 2, DR.crescent.y + DH / 2], f = [0, 0.24, 0.5];
    for (let i = 0; i < 3; i++) STEPS.push([[46, sy[i], 24, f[i], 1], [CW - 46, sy[i], 24, f[i], -1]]);
    const ac = { x: 300, y: 330, R: 262 }, at = (deg) => [ac.x + Math.sin(deg * Math.PI / 180) * ac.R, ac.y - Math.cos(deg * Math.PI / 180) * ac.R];
    const p1 = at(50), p2 = at(27);
    STEPS.push([[CW - p1[0], p1[1], 22, 0.74, 1], [p1[0], p1[1], 22, 0.74, -1]]);
    STEPS.push([[CW - p2[0], p2[1], 22, 0.9, 1], [p2[0], p2[1], 22, 0.9, -1]]);
    STEPS.push([[300, 96, 50, 1, 1]]);
  })();
  const APEX = STEPS[5][0];
  const SPARK = [0, 1].map((j) => [[300, DR.full.y + 6 + FH / 2]].concat(STEPS.map((st) => [st[Math.min(j, st.length - 1)][0], st[Math.min(j, st.length - 1)][1]])));
  const BB = { x0: -34, y0: -52, x1: CW + 34, y1: CH + 16 };
  const KEYHOLE = { x: FW / 2, y: FH / 2 };          // face-local
  const HOLLOW = { x: FW / 2, y: FH / 2, r: 31 };     // face-local; the pearl is r 28
  const PEARL_R = 28;
  const MINI = { x: FW / 2, y: FH / 2, w: 52, h: 66, gap: 76 };   // the half face's little seat plate (window centres ±gap/2)

  // ═════════════════════════ fit to the stage ═════════════════════════
  let K = 1, OX = 0, OY = 0, PORT = true;
  const IN = { k: 1, x: 0, y: 0 };            // a drawer's inside (interior units: 900×740)
  const DIAL = { k: 1, x: 0, y: 0 };          // the dial (dial units: 860 wide, plate 0..560, ring below)
  const IW = 900, IH = 740, PW = 860, PH = 560, DIALH = 800;
  function fit() {
    const ax0 = STAGE.cx0, ax1 = STAGE.cx1, ay0 = STAGE.cy0, ay1 = STAGE.cy1, aw = ax1 - ax0, ah = ay1 - ay0;
    PORT = ah > aw * 1.15;
    const bw = BB.x1 - BB.x0, bh = BB.y1 - BB.y0;
    K = Math.max(0.2, Math.min(Math.min(aw, 1150) * 0.94 / bw, ah * (PORT ? 0.86 : 0.96) / bh));
    OX = (ax0 + ax1) / 2 - K * (BB.x0 + BB.x1) / 2;
    OY = ay0 + (ah - K * bh) * (PORT ? 0.4 : 0.5) - K * BB.y0;
    IN.k = Math.max(0.2, Math.min(Math.min(aw, 1060) * 0.92 / IW, ah * (PORT ? 0.62 : 0.92) / IH));
    IN.x = (ax0 + ax1) / 2 - IN.k * IW / 2; IN.y = ay0 + (ah - IN.k * IH) * (PORT ? 0.4 : 0.5);
    DIAL.k = Math.max(0.2, Math.min(Math.min(aw, 1060) * 0.92 / PW, ah * (PORT ? 0.7 : 0.94) / DIALH));
    DIAL.x = (ax0 + ax1) / 2 - DIAL.k * PW / 2; DIAL.y = ay0 + (ah - DIAL.k * DIALH) * (PORT ? 0.42 : 0.5);
  }
  const cu = (x, y) => ({ x: (x - OX) / K, y: (y - OY) / K });
  const iu = (x, y) => ({ x: (x - IN.x) / IN.k, y: (y - IN.y) / IN.k });
  const du = (x, y) => ({ x: (x - DIAL.x) / DIAL.k, y: (y - DIAL.y) / DIAL.k });

  // ═════════════════════════ paint library (bake time only) ═════════════════════════
  function lg(g, x0, y0, x1, y1, st) { const q = g.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < st.length; i += 2) q.addColorStop(st[i], st[i + 1]); return q; }
  function rg(g, x, y, r, st, fx, fy) { const q = g.createRadialGradient(fx === undefined ? x : fx, fy === undefined ? y : fy, 0, x, y, Math.max(0.01, r)); for (let i = 0; i < st.length; i += 2) q.addColorStop(st[i], st[i + 1]); return q; }
  function poly(g, p) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); }
  function seg(g, x0, y0, x1, y1, col, w) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.strokeStyle = col; g.lineWidth = w; g.stroke(); }
  const GILT = [0, '#8a5a1a', 0.22, '#c8952f', 0.46, '#f2d27c', 0.56, '#e6bd5e', 0.8, '#b5832c', 1, '#7a5016'];
  const BRASS = [0, '#6a4513', 0.18, '#b07a22', 0.42, '#f6d77e', 0.52, '#e8bd5c', 0.72, '#b8862c', 1, '#6e4a14'];
  const gilt = (g, x0, y0, x1, y1) => lg(g, x0, y0, x1, y1, GILT);
  const brass = (g, x0, y0, x1, y1) => lg(g, x0, y0, x1, y1, BRASS);
  function rivet(g, x, y, r) {
    g.fillStyle = 'rgba(20,10,2,0.55)'; g.beginPath(); g.arc(x + r * 0.2, y + r * 0.3, r * 1.08, 0, TAU); g.fill();
    g.fillStyle = rg(g, x, y, r, [0, '#fff4c8', 0.32, '#ecc466', 1, '#76511a'], x - r * 0.38, y - r * 0.42); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  function starPath(g, x, y, n, ro, ri, rot) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? ri : ro; const px = x + Math.sin(a) * r, py = y - Math.cos(a) * r; if (i) g.lineTo(px, py); else g.moveTo(px, py); }
    g.closePath();
  }
  // the lit part of a moon of radius r: f = lit fraction (0 new … 1 full), side +1 lit on the right, -1 on the left
  function phasePath(g, x, y, r, f, side) {
    g.beginPath();
    if (f >= 0.999) { g.arc(x, y, r, 0, TAU); return true; }
    if (f <= 0.001) return false;
    const k = Math.max(0.001, Math.abs(2 * f - 1));
    g.save(); g.translate(x, y); g.scale(side, 1);
    g.moveTo(0, -r); g.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    g.ellipse(0, 0, k * r, r, 0, Math.PI / 2, -Math.PI / 2, f < 0.5);
    g.closePath(); g.restore();
    return true;
  }
  // gold leaf: laid in little squares, so it's never one flat colour; a cool glint from the window up top
  function goldLeaf(g, x, y, r, f, side, seed) {
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.arc(x + r * 0.05, y + r * 0.08, r * 1.02, 0, TAU); g.fill();
    // the unlit part: black lacquer, a hair of gilt round the edge
    g.fillStyle = lg(g, x, y - r, x, y + r, [0, '#1b1622', 1, '#0b080e']); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.lineWidth = Math.max(0.8, r * 0.06); g.strokeStyle = 'rgba(217,164,65,0.55)'; g.stroke();
    if (phasePath(g, x, y, r, f, side)) {
      g.fillStyle = gilt(g, x - r, y - r, x + r * 0.9, y + r * 1.2); g.fill();
      g.save(); g.clip();
      const R = mulberry(seed || 7), s = r * 0.5;
      for (let yy = y - r; yy < y + r; yy += s) for (let xx = x - r; xx < x + r; xx += s) { g.fillStyle = R() < 0.5 ? `rgba(255,236,170,${0.02 + R() * 0.05})` : `rgba(90,50,8,${0.02 + R() * 0.045})`; g.fillRect(xx + R() * 3, yy + R() * 3, s, s); }
      g.lineWidth = Math.max(0.5, r * 0.012);
      for (let i = 0; i < 5; i++) { const a = R() * TAU, l = r * (0.3 + R() * 0.6), x0 = x + (R() - 0.5) * r, y0 = y + (R() - 0.5) * r; seg(g, x0, y0, x0 + Math.cos(a) * l, y0 + Math.sin(a) * l, 'rgba(110,64,10,0.18)', g.lineWidth); }
      g.fillStyle = rg(g, x - r * 0.35, y - r * 0.45, r * 0.9, [0, 'rgba(255,250,225,0.5)', 1, 'rgba(255,250,225,0)']); g.fillRect(x - r, y - r, r * 2, r * 2);
      g.fillStyle = lg(g, 0, y - r, 0, y + r, [0, 'rgba(0,0,0,0)', 0.7, 'rgba(0,0,0,0)', 1, 'rgba(60,30,0,0.35)']); g.fillRect(x - r, y - r, r * 2, r * 2);
      g.restore();
      g.lineWidth = Math.max(0.6, r * 0.03); g.strokeStyle = 'rgba(90,56,10,0.6)'; phasePath(g, x, y, r, f, side); g.stroke();
    }
    g.restore();
  }
  // black lacquer: deep, glossy, the window's cool light on one edge, the vanity's warm bulbs on the other
  function lacquer(g, x, y, w, h, o) {
    o = o || {};
    g.fillStyle = lg(g, 0, y, 0, y + h, o.sky ? [0, '#1a1d3e', 0.5, '#121431', 1, '#0b0c20'] : [0, '#2a2232', 0.12, '#1c1622', 0.6, '#120e17', 1, '#09070c']); g.fillRect(x, y, w, h);
    g.fillStyle = lg(g, x, 0, x + Math.min(w, 260), 0, [0, 'rgba(255,170,90,0.14)', 1, 'rgba(255,170,90,0)']); g.fillRect(x, y, w, h);
    g.fillStyle = lg(g, x + w, 0, x + w - Math.min(w, 260), 0, [0, 'rgba(150,175,255,0.13)', 1, 'rgba(150,175,255,0)']); g.fillRect(x, y, w, h);
    g.fillStyle = lg(g, 0, y, 0, y + Math.min(h, 120), [0, 'rgba(255,255,255,0.06)', 1, 'rgba(255,255,255,0)']); g.fillRect(x, y, w, Math.min(h, 120));
    if (!o.noGrain) {
      const R = mulberry((o.seed || 3) + (w | 0));
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.lineWidth = 1;
      for (let i = 0; i < Math.max(4, h / 9); i++) {
        const yy = y + R() * h, amp = 1.5 + R() * 4, ph = R() * 6;
        g.strokeStyle = R() < 0.5 ? `rgba(120,80,110,${0.035 * (0.5 + R())})` : `rgba(0,0,0,${0.12 * R()})`;
        g.beginPath(); g.moveTo(x, yy); for (let xx = x; xx <= x + w + 30; xx += 30) g.lineTo(xx, yy + Math.sin(xx * 0.013 + ph) * amp); g.stroke();
      }
      g.restore();
    }
  }
  // a reflection of the dressing-room window in the gloss: two panes and a mullion, slanted, very faint
  function windowGlint(g, x, y, w, h, a) {
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
    g.fillStyle = `rgba(185,205,255,${a})`;
    const sk = h * 0.18;
    poly(g, [x + w * 0.62, y, x + w * 0.74, y, x + w * 0.74 - sk, y + h, x + w * 0.62 - sk, y + h]); g.fill();
    poly(g, [x + w * 0.77, y, x + w * 0.86, y, x + w * 0.86 - sk, y + h, x + w * 0.77 - sk, y + h]); g.fill();
    g.restore();
  }
  // the vanity bulbs, reflected in the lacquer as a row of tiny warm dots
  function bulbGlints(g, x, y, n, step, r) {
    for (let i = 0; i < n; i++) { const px = x + i * step; g.fillStyle = rg(g, px, y, r * 3, [0, 'rgba(255,214,150,0.35)', 1, 'rgba(255,190,120,0)']); g.fillRect(px - r * 3, y - r * 3, r * 6, r * 6); g.fillStyle = 'rgba(255,236,200,0.8)'; g.beginPath(); g.arc(px, y, r * 0.5, 0, TAU); g.fill(); }
  }

  // ═════════════════════════ the cabinet (bake) ═════════════════════════
  function paintFoot(g, x) {
    const y = BASE.y1;
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.ellipse(x + 4, y + 44, 40, 10, 0, 0, TAU); g.fill();
    g.fillStyle = rg(g, x, y + 24, 30, [0, '#ffe7a6', 0.35, '#d9a441', 0.8, '#8a6420', 1, '#4e340c'], x - 10, y + 12); g.beginPath(); g.ellipse(x, y + 24, 32, 24, 0, 0, TAU); g.fill();
    g.fillStyle = brass(g, x - 26, y, x + 26, y + 10); g.fillRect(x - 26, y - 2, 52, 10);
    seg(g, x - 24, y - 1, x + 24, y - 1, 'rgba(255,246,206,0.6)', 1.5);
  }
  function paintCarcass(g) {
    // ── feet and plinth ──
    paintFoot(g, 52); paintFoot(g, CW - 52);
    const px0 = -10, px1 = CW + 10, py0 = BASE.y0, py1 = BASE.y1;
    g.beginPath(); g.moveTo(px0, py0); g.lineTo(px1, py0); g.lineTo(px1, py1); g.lineTo(CW - 92, py1);
    g.quadraticCurveTo(CW - 120, py0 + 26, CW - 170, py0 + 26); g.lineTo(170, py0 + 26); g.quadraticCurveTo(120, py0 + 26, 92, py1); g.lineTo(px0, py1); g.closePath();
    g.save(); g.clip(); lacquer(g, px0, py0, px1 - px0, py1 - py0, { seed: 9 }); g.restore();
    g.fillStyle = gilt(g, px0, py0, px1, py0 + 30); g.fillRect(px0, py0 + 5, px1 - px0, 4);
    seg(g, px0, py0 + 0.8, px1, py0 + 0.8, 'rgba(210,220,255,0.35)', 1.6);
    // ── the body ──
    const bx0 = 0, bx1 = CW, by0 = BODY.y0, by1 = BODY.y1;
    lacquer(g, bx0, by0, CW, by1 - by0, { seed: 5 });
    windowGlint(g, bx0, by0, CW, by1 - by0, 0.045);
    seg(g, bx0 + 1, by0, bx0 + 1, by1, 'rgba(255,190,120,0.42)', 2);
    seg(g, bx1 - 1, by0, bx1 - 1, by1, 'rgba(170,190,255,0.5)', 2);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(bx0, by1 - 4, CW, 4);
    // ── stiles: a gilt frame each, three moons and little stars ──
    for (const sx of [0, CW - 92]) {
      g.lineWidth = 2; g.strokeStyle = gilt(g, sx, by0, sx + 92, by1); g.strokeRect(sx + 14, by0 + 16, 64, by1 - by0 - 32);
      g.lineWidth = 0.9; g.strokeStyle = 'rgba(217,164,65,0.55)'; g.strokeRect(sx + 20, by0 + 22, 52, by1 - by0 - 44);
      for (const yy of [by0 + 74, (DR.crescent.y + DR.half.y + DH) / 2, (DR.half.y + DR.full.y + DH) / 2, by1 - 50]) twinkle(g, sx + 46, yy, 9);
    }
    // ── the drawer openings: dark, with a lit lip at the bottom ──
    for (const d of ORDER) {
      const o = DR[d];
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(o.x - 3, o.y - 3, o.w + 6, o.h + 6);
      g.fillStyle = lg(g, 0, o.y, 0, o.y + o.h, [0, '#020103', 0.4, '#07050a', 1, '#0d0a11']); g.fillRect(o.x, o.y, o.w, o.h);
      seg(g, o.x - 2, o.y + o.h + 2.5, o.x + o.w + 2, o.y + o.h + 2.5, 'rgba(190,205,255,0.18)', 1.2);
      g.lineWidth = 1.5; g.strokeStyle = 'rgba(217,164,65,0.35)'; g.strokeRect(o.x - 8, o.y - 8, o.w + 16, o.h + 16);
    }
    // the stile moons (unlit gold leaf), each in a ring of short rays
    for (let i = 0; i < 3; i++) for (const p of STEPS[i]) { moonRays(g, p[0], p[1], p[2], 10, 0.55); goldLeaf(g, p[0], p[1], p[2], p[3], p[4], 11 + i * 3); }
    // ── the cornice ──
    const cx0 = -22, cx1 = CW + 22, cy0 = CORN.y0, cy1 = CORN.y1;
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, cy1, CW, 22);
    g.fillStyle = lg(g, 0, cy1, 0, cy1 + 22, [0, 'rgba(0,0,0,0.6)', 1, 'rgba(0,0,0,0)']); g.fillRect(0, cy1, CW, 22);
    g.fillStyle = lg(g, 0, cy0, 0, cy1, [0, '#3a3044', 0.18, '#241c2b', 0.45, '#0f0b13', 0.7, '#1d1724', 1, '#0a080d']); g.fillRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
    lacquer(g, cx0, cy0, cx1 - cx0, cy1 - cy0, { noGrain: true });
    g.fillStyle = gilt(g, cx0, cy0, cx1, cy1 + 40); g.fillRect(cx0, cy0 + 25, cx1 - cx0, 4);
    for (let x = cx0 + 10; x < cx1; x += 16) { g.fillStyle = 'rgba(255,230,160,0.55)'; g.beginPath(); g.arc(x, cy0 + 33, 1.6, 0, TAU); g.fill(); }
    seg(g, cx0, cy0 + 0.8, cx1, cy0 + 0.8, 'rgba(220,228,255,0.5)', 1.6);
    seg(g, cx0, cy0 + 24, cx1, cy0 + 24, 'rgba(0,0,0,0.6)', 1);

  // ── the inside of a drawer ──

  // ── the dial ──

  // ═════════════════════════ the puzzle ═════════════════════════

  // the drawer slides out, then the camera drops into it

  function goSubFrom(d) { const o = DR[d]; goSub(d, OX + K * (o.x + o.w / 2), OY + K * (o.y + o.h / 2)); }

  // ── the dial's wheels: drag them (1:1), tap above or below the middle, or use the arrow keys ──

  // ═════════════════════════ the view ═════════════════════════
  let hoverD = null, hoverItem = null, hoverRing = false;
  function drawerAt(x, y) { const p = cu(x, y); for (const d of ORDER) { const o = DR[d]; if (p.x > o.x - 20 && p.x < o.x + o.w + 20 && p.y > o.y - 12 && p.y < o.y + o.h + 12) return d; } return null; }

  function zoomSub(c, s, z, a, base) { if (a <= 0.003) return; c.save(); c.translate(XF.x, XF.y); c.scale(z, z); c.translate(-XF.x, -XF.y); c.globalAlpha = A0 = base * a; drawSub(c, s); c.restore(); }
  VIEW.def('cabinet', {
    enter() {
      sub = null; XF.on = false; hoverD = null; dial.focus = -1;
      syncFromS();
      ensure('front');
      if (!S.f.seen_cabinet) { FLAG.set('seen_cabinet'); SAY('cabinet'); }
    },
    resume() { syncFromS(); },
    exit() { dial.drag = -1; hoverD = null; },
    back() { if (busy) return false; if (sub) { const o = DR[sub === 'dial' ? 'half' : sub]; goSub(null, OX + K * (o.x + o.w / 2), OY + K * (o.y + o.h / 2)); return false; } },
    draw(c) {

    },
    down(x, y) {

    },
    move(x, y) {

  // ═════════════════════════ module hooks ═════════════════════════

};
boot();
})();
</script>
