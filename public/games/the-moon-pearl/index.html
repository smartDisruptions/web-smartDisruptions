<style>
/* ───────── THE MOON PEARL · the interface is Mei's headset HUD, in a theater ───────── */
:root {
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --hud-top: 56px; --hud-bot: 84px;
  --mint: #3dffc2; --m: 61,255,194; --mint-ink: #04140e;
  --gilt: #d9a441; --gilt-hi: #f6d77e; --gilt-lo: #8a6420; --g: 217,164,65;
  --velvet: #8e1b2c; --velvet-hi: #c23a4b; --velvet-lo: #4f0d18;
  --moon: #dfe8ff; --halo: #9fc4ff; --mo: 159,196,255;
  --rose: #ff9fb2; --ro: 255,159,178; --neon: #ff5a7a;
  --night: #0c0f22; --deep: #070914;
  --text: #eef1ff; --dim: #9aa3cc;
  --hair: 1px;
  --gut: 10px;
  --f-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.35, .45, 1);
}
@media (min-resolution: 2dppx) { :root { --hair: .5px; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #0c0f22; color: var(--text); overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { position: fixed; inset: 0; font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
#ui svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
#ui svg .f { fill: currentColor; stroke: none; }
button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 1.5px solid var(--mint); outline-offset: 2px; }
[hidden] { display: none !important; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: thin; scrollbar-color: rgba(var(--m), .25) transparent; }
.scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: rgba(var(--m), .22); border-radius: 3px; }

/* ───────── boot: Mei's headset powering up ───────── */
#boot { position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse 90% 60% at 50% 45%, #110c24 0%, #060812 70%); display: grid; place-items: center; transition: opacity .45s ease, visibility 0s linear .45s; }
#boot.done { opacity: 0; visibility: hidden; }
#boot .bk { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(var(--m), .7); animation: bkIn .6s var(--ease) both; }
#boot .bk:nth-child(1) { top: calc(var(--sat) + 8px); left: calc(var(--sal) + 8px); border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 8px; --dx: 30px; --dy: 30px; }
#boot .bk:nth-child(2) { top: calc(var(--sat) + 8px); right: calc(var(--sar) + 8px); border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 8px; --dx: -30px; --dy: 30px; }
#boot .bk:nth-child(3) { bottom: calc(var(--sab) + 8px); left: calc(var(--sal) + 8px); border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 8px; --dx: 30px; --dy: -30px; }
#boot .bk:nth-child(4) { bottom: calc(var(--sab) + 8px); right: calc(var(--sar) + 8px); border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 8px; --dx: -30px; --dy: -30px; }
@keyframes bkIn { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
#boot .log { width: min(300px, 82vw); font: 500 12px/1 var(--f-mono); color: rgba(var(--m), .82); letter-spacing: .04em; }
#boot .l { display: flex; align-items: baseline; height: 22px; opacity: 0; animation: blIn .01s steps(1) both; animation-delay: calc(140ms + var(--d) * 150ms); }
#boot .l b { font-weight: 700; color: var(--mint); letter-spacing: .2em; text-shadow: 0 0 12px rgba(var(--m), .6); }
#boot .l .ld { flex: 1; margin: 0 .6em; border-bottom: 1px dotted rgba(var(--m), .28); transform: translateY(-3px); }
#boot .l em { font-style: normal; color: #eafff7; }
#boot .l.h { height: 34px; font-size: 13px; }
#boot .l.h span { color: rgba(var(--m), .5); margin-left: .8em; letter-spacing: .1em; }
#boot .bar { margin-top: 14px; height: 2px; background: rgba(var(--m), .12); border-radius: 2px; overflow: hidden; }
#boot .bar i { display: block; height: 100%; background: var(--mint); box-shadow: 0 0 10px var(--mint); transform-origin: left; transform: scaleX(.04); animation: blBar 1.6s .15s var(--ease) both; }
#boot.done .bar i { transform: scaleX(1); animation: none; transition: transform .25s ease; }
#boot .cur { display: inline-block; width: .6em; height: 1em; background: var(--mint); vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blIn { to { opacity: 1; } }
@keyframes blBar { to { transform: scaleX(.86); } }
@keyframes blink { 50% { opacity: 0; } }

/* ───────── the lens frame: corner brackets ───────── */
.brk { position: fixed; width: 20px; height: 20px; border: 0 solid rgba(var(--m), .55); pointer-events: none; z-index: 15; transition: border-color .5s ease, opacity .4s ease; }
.brk.tl { top: calc(var(--sat) + 4px); left: calc(var(--sal) + 4px); border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 8px; }
.brk.tr { top: calc(var(--sat) + 4px); right: calc(var(--sar) + 4px); border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 8px; }
.brk.bl { bottom: calc(var(--sab) + 4px); left: calc(var(--sal) + 4px); border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 8px; }
.brk.br { bottom: calc(var(--sab) + 4px); right: calc(var(--sar) + 4px); border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 8px; }
#ui.cred .brk, #ui.ttl .brk { opacity: 0; }
#ui.cine .brk { border-color: rgba(var(--g), .45); }

/* ───────── the HUD bars ───────── */
.hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; transition: opacity .45s ease, visibility 0s; }
.hud.off { opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .3s; }
.hud.off * { pointer-events: none !important; }
.bt { position: absolute; left: 0; right: 0; top: 0; height: var(--hud-top); padding: var(--sat) max(4px, var(--sar)) 0 max(4px, var(--sal));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: linear-gradient(to bottom, rgba(5,7,18,.8), rgba(5,7,18,.44) 72%, rgba(5,7,18,0)); }
.bt::after { content: ''; position: absolute; left: 14%; right: 14%; bottom: 0; height: var(--hair); background: linear-gradient(90deg, rgba(var(--m),0), rgba(var(--m),.32), rgba(var(--m),0)); }
.bt .l { justify-self: start; display: flex; }
.bt .r { justify-self: end; display: flex; gap: 2px; }
.bb { position: absolute; left: 0; right: 0; bottom: 0; height: var(--hud-bot); padding: 0 max(10px, var(--sar)) var(--sab) max(10px, var(--sal));
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to top, rgba(5,7,18,.86), rgba(5,7,18,.52) 70%, rgba(5,7,18,0)); }
.bb::before { content: ''; position: absolute; left: 14%; right: 14%; top: 0; height: var(--hair); background: linear-gradient(90deg, rgba(var(--m),0), rgba(var(--m),.22), rgba(var(--m),0)); }
.scanline { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, rgba(var(--m),0), var(--mint) 20%, var(--mint) 80%, rgba(var(--m),0)); box-shadow: 0 0 14px var(--mint); z-index: 16; pointer-events: none; opacity: 0; }
.scanline.go { animation: scan .7s var(--ease) both; }
@keyframes scan { 0% { opacity: 0; transform: translateY(0); } 10% { opacity: .9; } 85% { opacity: .7; } 100% { opacity: 0; transform: translateY(100vh); } }

/* HUD buttons: icon + micro label (stacked on phones, inline on wider screens) */
.hb { pointer-events: auto; position: relative; min-width: 46px; height: 46px; padding: 0 4px; border-radius: 14px; color: var(--mint);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font: 700 8.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase;
  transition: background-color .18s ease, transform .14s var(--ease), opacity .2s ease, box-shadow .2s ease; }
.hb svg { width: 22px; height: 22px; filter: drop-shadow(0 0 5px rgba(var(--m), .35)); }
.hb span { opacity: .82; white-space: nowrap; }
.hb:active { transform: scale(.92); }
@media (hover: hover) { .hb:hover { background: rgba(var(--m), .09); } }
.hb .badge { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 0 2px #070914, 0 0 8px rgba(255,90,122,.7); transform: scale(0); transition: transform .25s var(--spring); }
.hb.new .badge { transform: scale(1); }
.hb.ping { animation: ping .7s var(--ease); }
@keyframes ping { 25% { transform: scale(1.16); background: rgba(var(--m), .22); box-shadow: 0 0 22px rgba(var(--m), .35); } }
.hb.nudge svg { animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; opacity: 1; } 78% { transform: translateY(-2px) scale(1.12); } 86% { transform: none; opacity: .7; } }
.hb[hidden] { display: none; }
#ui.talking .hb-back { opacity: .3; pointer-events: none; }
@media (min-width: 640px) {
  .hb { flex-direction: row; gap: 8px; padding: 0 12px 0 10px; font-size: 10.5px; letter-spacing: .16em; }
  .hb svg { width: 20px; height: 20px; }
  .bt .r { gap: 4px; }
  .hb .badge { top: 8px; right: 6px; }
}

/* the clock */
.clock { text-align: center; color: var(--mint); padding: 0 4px; min-width: 84px; }
.clock b { display: block; font: 700 18px/1 var(--f-mono); letter-spacing: .03em; text-shadow: 0 0 14px rgba(var(--m), .5); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b span { font-size: .62em; margin-left: .3em; letter-spacing: .1em; opacity: .8; }
.clock small { display: flex; justify-content: center; gap: 5px; align-items: center; margin-top: 5px; font: 500 8.5px/1 var(--f-mono); letter-spacing: .16em; color: rgba(var(--m), .55); white-space: nowrap; }
.clock .g { width: 64px; height: 2px; margin: 5px auto 0; border-radius: 2px; background: rgba(var(--m), .14); overflow: hidden; }
.clock .g i { display: block; height: 100%; background: var(--mint); transform-origin: left; transform: scaleX(var(--t, 0)); transition: transform .8s var(--ease); box-shadow: 0 0 6px var(--mint); }
.clock.late b { color: #ffd27a; text-shadow: 0 0 14px rgba(255,210,122,.5); }
.clock.late .g i { background: #ffd27a; box-shadow: 0 0 6px #ffd27a; }

/* an incoming intercom call, from anywhere */
.callp { pointer-events: auto; display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 15px 0 11px; border-radius: 999px;
  font: 700 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: #ffe2e6;
  background: rgba(40,6,14,.9); box-shadow: inset 0 0 0 1px rgba(255,77,94,.7), 0 0 22px rgba(255,77,94,.28), 0 10px 24px rgba(0,0,0,.4);
  animation: tIn .42s var(--spring) both; }
.callp i { width: 10px; height: 10px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 10px #ff4d5e, 0 0 2px #fff inset; animation: callBlink 1s steps(1) infinite; }
.callp svg { width: 16px; height: 16px; color: #ffb3bd; }
@keyframes callBlink { 50% { opacity: .25; } }

/* inventory tray */
.tray { display: flex; align-items: center; gap: 8px; }
.slot { pointer-events: auto; position: relative; flex: none; align-self: center; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center;
  background: rgba(10,13,32,.55); transition: transform .2s var(--ease), background-color .2s ease, box-shadow .2s ease; }
.slot::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(var(--mint), var(--mint)) top left / 9px 1.5px, linear-gradient(var(--mint), var(--mint)) top left / 1.5px 9px,
    linear-gradient(var(--mint), var(--mint)) bottom right / 9px 1.5px, linear-gradient(var(--mint), var(--mint)) bottom right / 1.5px 9px;
  background-repeat: no-repeat; opacity: .35; }
.slot canvas { position: relative; z-index: 1; width: 46px; height: 46px; display: block; pointer-events: none; }
.slot .gl { position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(223,232,255,.55) 0, rgba(159,196,255,.22) 34%, rgba(159,196,255,0) 66%); }
.slot.glow .gl { opacity: 1; animation: pearlGlow 3.2s ease-in-out infinite; }
@keyframes pearlGlow { 0%, 100% { opacity: .65; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
.slot.empty { background: rgba(10,13,32,.3); box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .1); cursor: default; }
.slot.empty::before { opacity: .3; }
.slot.full { box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .28); }
.slot.full::before { opacity: .6; }
@media (hover: hover) { .slot.full:hover { background: rgba(var(--m), .1); } }
.slot.full:active { transform: scale(.93); }
.slot.sel { background: rgba(var(--m), .17); box-shadow: inset 0 0 0 1px rgba(var(--m), .9), 0 0 22px rgba(var(--m), .3); transform: translateY(-4px); }
.slot.sel:active { transform: translateY(-4px) scale(.95); }
.slot .nm { position: absolute; z-index: 2; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px); opacity: 0; white-space: nowrap; pointer-events: none;
  font: 700 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mint-ink); background: var(--mint); padding: 6px 9px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.4);
  transition: opacity .2s ease, transform .2s var(--ease); }
.slot .nm::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--mint); }
.slot.sel .nm, .slot.tip .nm { opacity: 1; transform: translate(-50%, 0); }
#ui.talking .slot .nm, #ui.talking .prompt { opacity: 0; }

/* one-line instruction */
.prompt { position: fixed; left: 50%; bottom: calc(var(--hud-bot) + 10px); z-index: 22; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  width: max-content; max-width: calc(100vw - 28px); text-align: center; text-wrap: balance;
  font: 700 11.5px/1.35 var(--f-mono); letter-spacing: .04em; color: var(--mint); padding: 9px 16px 9px 14px; border-radius: 18px;
  background: rgba(6,9,22,.84); box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .4), 0 8px 24px rgba(0,0,0,.35);
  transition: opacity .25s ease, transform .3s var(--ease); }
.prompt::before { content: '› '; opacity: .6; }
.prompt.on { opacity: 1; transform: translate(-50%, 0); }
#ui.talking .prompt { opacity: 0; transform: translate(-50%, 8px); }

/* ───────── dialogue ───────── */
.catch { position: fixed; inset: 0; z-index: 12; pointer-events: auto; display: none; cursor: pointer; }
.catch.on { display: block; }
.dock { position: fixed; z-index: 50; left: max(var(--gut), var(--sal)); right: max(var(--gut), var(--sar)); bottom: calc(var(--hud-bot) + 6px);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; transition: bottom .3s var(--ease); }
#ui.cine .dock { bottom: calc(var(--sab) + 12px); }
.say { --sc: #3dffc2; --scr: 61,255,194; pointer-events: auto; position: relative; width: 100%; max-width: 700px; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; gap: 13px; align-items: start; padding: 12px 16px 16px 12px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(15,19,42,.96), rgba(8,10,24,.97));
  box-shadow: inset 0 0 0 var(--hair) rgba(var(--scr), .42), 0 20px 46px rgba(0,0,0,.5), 0 0 30px rgba(var(--scr), .06); }
.say[hidden], .choices[hidden] { display: none; }
.say.in { animation: sheetIn .32s var(--ease) both; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(18px) scale(.985); } }
.say::before, .say::after { content: ''; position: absolute; width: 14px; height: 14px; border: 0 solid var(--sc); pointer-events: none; opacity: .9; }
.say::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 20px; }
.say::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 20px; }
.say.ctx { pointer-events: none; }
.say.ctx > * { opacity: .4; transition: opacity .2s ease; }
.say.ctx .nx { display: none; }
.pf { position: relative; width: 74px; height: 74px; border-radius: 16px; overflow: hidden;
  background: radial-gradient(circle at 50% 38%, rgba(var(--scr), .22), rgba(9,11,26,1) 72%);
  box-shadow: inset 0 0 0 var(--hair) rgba(var(--scr), .55); }
.pf canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pf::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(to bottom, rgba(var(--scr), .07) 0 1px, transparent 1px 3px), linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,0) 40%); }
.pf .lamp { display: none; }
.pf.sw canvas { animation: pfSw .28s var(--ease); }
@keyframes pfSw { from { opacity: 0; transform: scale(1.08); } }
.sb { min-width: 0; padding-top: 2px; }
.sn { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; min-height: 14px; margin-bottom: 7px; font: 700 11px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--sc); }
.sn::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--sc); box-shadow: 0 0 8px var(--sc); }
.sn b { white-space: nowrap; }
.sn i { display: inline-flex; align-items: center; gap: 5px; font-style: normal; font-weight: 700; font-size: 9px; letter-spacing: .14em; color: #f3e6c8; white-space: nowrap; padding: 3px 7px 3px 5px; border-radius: 6px; background: rgba(243,230,200,.1); box-shadow: inset 0 0 0 var(--hair) rgba(243,230,200,.35); }
.sn i svg { width: 12px; height: 12px; stroke-width: 2; }
.sn i:empty { display: none; }
.tx { font: 400 16.5px/1.5 var(--f-body); color: #f0f2ff; min-height: 3em; overflow-wrap: break-word; letter-spacing: .005em; }
.tx .r { color: transparent; }
.tx .cur { display: inline-block; width: 0; height: 1em; position: relative; vertical-align: -2px; }
.tx .cur::after { content: ''; position: absolute; left: 1px; top: 0; width: 7px; height: 100%; background: var(--sc); opacity: .85; animation: blink .9s steps(2) infinite; }
.say.done .tx .cur { display: none; }
.nx { position: absolute; right: 15px; bottom: 11px; width: 9px; height: 9px; border-right: 2px solid var(--sc); border-bottom: 2px solid var(--sc); transform: rotate(45deg); opacity: 0; transition: opacity .2s ease; }
.say.done .nx { opacity: .9; animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px) rotate(45deg); } }
/* a line over the backstage intercom: the speaker grille over the portrait, the cream box's edge */
.say.ic .pf { background: radial-gradient(circle at 50% 40%, #3a2f28, #17110f 75%); box-shadow: inset 0 0 0 3px #e9dcc0, inset 0 0 0 4px rgba(0,0,0,.35), 0 0 0 var(--hair) rgba(233,220,192,.6); }
.say.ic .pf::after { background: radial-gradient(circle, rgba(10,8,6,.3) 0 .8px, transparent 1.3px) 0 0 / 4px 4px, linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,0) 45%); }
.say.ic .pf .lamp { display: block; position: absolute; z-index: 2; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 8px #ff4d5e, 0 0 0 2px rgba(0,0,0,.4); }

/* a stage direction: no portrait, no name */
.say.narr { grid-template-columns: 1fr; padding: 16px 22px 18px; background: linear-gradient(180deg, rgba(14,10,24,.95), rgba(7,6,14,.97)); box-shadow: inset 0 0 0 var(--hair) rgba(var(--g), .45), 0 20px 46px rgba(0,0,0,.5); }

/* choices */
.choices { pointer-events: auto; width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 8px; }
.chp { align-self: center; max-width: 100%; margin: 0 0 4px; padding: 10px 18px 11px; border-radius: 14px; text-align: center;
  font: 600 italic 19px/1.25 var(--f-serif); color: #fff6e0; background: rgba(10,8,20,.9); box-shadow: inset 0 0 0 var(--hair) rgba(var(--g), .6), 0 12px 30px rgba(0,0,0,.45);
  animation: chIn .34s var(--ease) both; }
.ch { position: relative; min-height: 50px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 11px; border-radius: 15px; text-align: left;
  background: rgba(9,12,30,.95); color: #eef2ff; font: 500 15px/1.35 var(--f-body);
  box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .45), 0 10px 26px rgba(0,0,0,.35);
  animation: chIn .34s var(--ease) both; animation-delay: calc(var(--i) * 55ms); transition: background-color .15s ease, transform .12s var(--ease); }
@keyframes chIn { from { opacity: 0; transform: translateY(12px); } }
.ch .k { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 12px/1 var(--f-mono); color: var(--mint-ink); background: var(--mint); box-shadow: 0 0 12px rgba(var(--m), .4); }
.ch canvas { flex: none; width: 44px; height: 44px; margin: -4px 0; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(var(--scr, 61,255,194), .25), rgba(9,11,26,.9) 72%); box-shadow: inset 0 0 0 var(--hair) rgba(var(--scr, 61,255,194), .55); }
.ch.who { font: 600 17px/1.2 var(--f-serif); letter-spacing: .01em; }
@media (hover: hover) { .ch:not(:disabled):hover { background: rgba(var(--m), .12); } }

.choices.gone .ch:not(.picked), .choices.gone .chp { opacity: 0; transition: opacity .12s ease; }

/* toasts */
.toasts { position: fixed; left: 0; right: 0; top: calc(var(--hud-top) + 8px); z-index: 44; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 14px; }
.toast { display: flex; align-items: center; gap: 11px; max-width: min(460px, 100%); padding: 8px 16px 8px 8px; border-radius: 16px;
  background: rgba(8,11,28,.95); color: #f0fff9; font: 500 14px/1.3 var(--f-body);
  box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .5), 0 12px 32px rgba(0,0,0,.45), 0 0 26px rgba(var(--m), .12);
  animation: tIn .42s var(--spring) both; }
.toast.plain { padding: 10px 16px; }
.toast.out { animation: tOut .3s ease both; }
@keyframes tIn { from { opacity: 0; transform: translateY(-12px) scale(.94); } }
@keyframes tOut { to { opacity: 0; transform: translateY(-8px) scale(.97); } }
.toast canvas { width: 40px; height: 40px; border-radius: 11px; background: radial-gradient(circle, rgba(var(--m), .16), rgba(var(--m), .03)); flex: none; }
.toast .k { display: block; margin-bottom: 4px; font: 700 9px/1 var(--f-mono); letter-spacing: .22em; color: var(--mint); text-transform: uppercase; }
.toast.log { max-width: min(420px, 100%); padding: 7px 13px 7px 9px; gap: 9px; border-radius: 12px; background: rgba(4,7,16,.9); font: 500 12px/1.25 var(--f-mono); color: rgba(220,255,243,.94); box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .32); }
.toast.log svg { width: 18px; height: 18px; color: var(--mint); }
.toast.log .k { display: inline; margin: 0 4px 0 0; flex: none; font-size: 9px; }
.toast.log .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chapter card */
.chap { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; pointer-events: none; --dur: 2400ms; }
.chap .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 36% at 50% 50%, rgba(6,4,14,.84), rgba(6,4,14,0) 74%); animation: chapFade var(--dur) ease both; }
.chap .cc { position: relative; text-align: center; padding: 0 24px; animation: chapCard var(--dur) var(--ease) both; }
.chap .k { display: flex; align-items: center; justify-content: center; gap: 14px; font: 700 12px/1 var(--f-mono); letter-spacing: .38em; color: var(--mint); text-shadow: 0 0 12px rgba(var(--m), .6); }
.chap .k::before, .chap .k::after { content: ''; width: 46px; height: 1px; background: var(--mint); box-shadow: 0 0 6px var(--mint); animation: chapLine calc(var(--dur) * .35) .1s var(--ease) both; }
.chap .k::before { transform-origin: right; } .chap .k::after { transform-origin: left; }
.chap .t { margin-top: 12px; font: 600 italic clamp(38px, 11vw, 78px)/1.05 var(--f-serif); color: #fff8e8; letter-spacing: .005em; text-shadow: 0 2px 30px rgba(0,0,0,.7), 0 0 40px rgba(var(--g), .25); }
.chap .orn { display: block; width: 150px; height: 14px; margin: 14px auto 0; color: var(--gilt); animation: chapLine calc(var(--dur) * .4) .2s var(--ease) both; }
.chap .orn svg { width: 100%; height: 100%; stroke-width: 1.3; }
@keyframes chapFade { 0% { opacity: 0; } 14% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes chapCard { 0% { opacity: 0; transform: translateY(10px) scale(.98); } 16% { opacity: 1; transform: none; } 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
@keyframes chapLine { from { transform: scaleX(0); } }

/* ───────── documents ───────── */
.note { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: auto;
  padding: calc(var(--sat) + 14px) max(14px, var(--sar)) calc(var(--sab) + 14px) max(14px, var(--sal));
  background: radial-gradient(ellipse 90% 70% at 50% 45%, rgba(10,8,14,.55), rgba(3,3,8,.82)); animation: fadeIn .28s ease both; }

.note .cap { display: inline-flex; align-items: center; gap: 8px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--mint); text-shadow: 0 0 10px rgba(var(--m), .5); animation: fadeIn .4s .1s ease both; }

.paper { position: relative; width: min(500px, 100%); max-height: calc(100% - 30px); display: flex; flex-direction: column; color: #2a2440; border-radius: 4px;
  background: linear-gradient(172deg, #fbf5e6, #f1e6cc 60%, #e9dcbd);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 34px 70px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.35);
  animation: paperIn .5s var(--ease) both; }
.note.out .paper { animation: paperOut .26s ease both; }

@keyframes paperOut { to { opacity: 0; transform: translateY(18px) scale(.97); } }
.paper .ps-scroll { padding: 24px 26px 8px; flex: 1 1 auto; min-height: 0; }
.paper p { margin: 0 0 .6em; overflow-wrap: break-word; }
.paper .ft { flex: none; display: flex; justify-content: center; padding: 6px 20px 18px; }
.fold { min-height: 46px; padding: 0 22px; border-radius: 12px; font: 700 11.5px/1 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: #3a3152;
  box-shadow: inset 0 0 0 1px rgba(42,36,64,.32); background: rgba(255,255,255,.24); transition: background-color .15s ease, transform .12s var(--ease); display: inline-flex; align-items: center; gap: 10px; }
.fold svg { width: 16px; height: 16px; }
@media (hover: hover) { .fold:hover { background: rgba(42,36,64,.08); } }
.fold:active { transform: scale(.96); }
/* the pearl's ivory certificate */
.paper.k-card { width: min(430px, 100%); color: #33260f; border-radius: 6px; text-align: center;
  background: radial-gradient(130% 90% at 50% 30%, #fffcf3 0%, #f8f1de 55%, #ecdfc0 100%); }
.k-card .fr { position: absolute; inset: 9px; border: 1.5px solid rgba(var(--g), .9); border-radius: 3px; pointer-events: none; box-shadow: inset 0 0 0 3px rgba(255,250,236,.9), inset 0 0 0 4px rgba(var(--g), .55); }
.k-card .fr i { position: absolute; width: 9px; height: 9px; background: var(--gilt); transform: rotate(45deg); box-shadow: 0 0 0 2px #fbf5e6; }
.k-card .fr i:nth-child(1) { top: -5px; left: -5px; } .k-card .fr i:nth-child(2) { top: -5px; right: -5px; } .k-card .fr i:nth-child(3) { bottom: -5px; left: -5px; } .k-card .fr i:nth-child(4) { bottom: -5px; right: -5px; }

.k-card .rule { display: flex; align-items: center; gap: 10px; margin: 12px auto 16px; width: 70%; color: var(--gilt); }
.k-card .rule::before, .k-card .rule::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--g), 0), rgba(var(--g), .9)); }
.k-card .rule::after { transform: scaleX(-1); }
.k-card .rule b { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #dfe8ff 50%, #9fb7e6); box-shadow: 0 0 6px rgba(var(--mo), .8); }
.k-card p { font: 400 17px/1.45 var(--f-serif); color: #3b2c12; }
.k-card p.sign { display: inline-block; margin-top: 10px; padding: 8px 6px 0; border-top: 1px solid rgba(var(--g), .7); font: 600 italic 14.5px/1.3 var(--f-serif); color: #6a5124; }
.k-card .fold { color: #5a4316; box-shadow: inset 0 0 0 1px rgba(138,100,32,.4); }
/* a letter */
.paper.k-letter { background: linear-gradient(176deg, #fdf9ef, #f3ead6 70%, #ece0c6); }
.k-letter .lh { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 3px double rgba(42,36,64,.25); font: 600 italic 22px/1.15 var(--f-serif); color: #2b2542; }
.k-letter .lh svg { width: 22px; height: 22px; color: var(--gilt-lo); stroke-width: 1.5; }
.k-letter p { font: 400 17px/1.55 var(--f-serif); color: #2e2843; }
.k-letter p.hd { font-weight: 600; }
.k-letter p.sign { text-align: right; font-style: italic; font-weight: 600; margin-top: .9em; }
/* crumpled in the bin */
.paper.k-crumpled { width: min(400px, 100%); transform: rotate(-1.6deg); border-radius: 5px 9px 4px 11px; color: #2b2542;
  background:
    linear-gradient(118deg, rgba(0,0,0,0) 36%, rgba(80,60,30,.11) 37%, rgba(255,255,255,.5) 38.3%, rgba(0,0,0,0) 40%),
    linear-gradient(64deg, rgba(0,0,0,0) 56%, rgba(80,60,30,.09) 57%, rgba(255,255,255,.45) 58.3%, rgba(0,0,0,0) 60%),
    linear-gradient(172deg, rgba(0,0,0,0) 22%, rgba(80,60,30,.08) 23%, rgba(255,255,255,.4) 24%, rgba(0,0,0,0) 25.5%),
    linear-gradient(-14deg, rgba(0,0,0,0) 70%, rgba(80,60,30,.09) 71%, rgba(255,255,255,.4) 72.2%, rgba(0,0,0,0) 73.6%),
    linear-gradient(96deg, rgba(0,0,0,0) 12%, rgba(80,60,30,.07) 13%, rgba(255,255,255,.35) 14%, rgba(0,0,0,0) 15.2%),
    radial-gradient(120% 90% at 45% 40%, rgba(0,0,0,0) 50%, rgba(110,84,44,.3) 100%),
    linear-gradient(170deg, #f6efde, #ebe0c7); animation-name: crumpIn; }
@keyframes crumpIn { from { opacity: 0; transform: translateY(34px) rotate(-6deg) scale(.9); } }
.k-crumpled .ps-scroll { padding: 26px 28px 8px; }

.k-crumpled p.sign { text-align: right; margin-right: .4em; font-size: clamp(28px, 8vw, 34px); }
/* the bank's final notice */
.paper.k-bank { width: min(480px, 100%); border-radius: 2px; color: #1d2230; background: linear-gradient(178deg, #fbfaf6, #f1efe7); }
.k-bank .lh { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 18px; border-bottom: 3px double #1f2c4d; }
.k-bank .lh svg { width: 34px; height: 34px; color: #1f2c4d; stroke-width: 1.5; }
.k-bank .lh b { font: 800 14px/1.25 var(--f-serif); letter-spacing: .16em; color: #1f2c4d; }
/* the stamp floats, so the opening lines wrap around it instead of running under it */
.k-bank .stamp { float: right; position: relative; margin: 4px -6px 12px 16px; transform: rotate(-9deg); padding: 6px 10px 5px; border: 3px solid rgba(194,24,58,.85); border-radius: 4px;
  font: 800 15px/1 var(--f-serif); letter-spacing: .2em; color: rgba(194,24,58,.9); background: rgba(255,255,255,.2); pointer-events: none; }
.k-bank p { font: 400 16px/1.55 var(--f-serif); color: #222838; }
.k-bank p.hd { font-weight: 600; margin-bottom: 1em; }
.k-bank .fold { color: #1f2c4d; }
/* the theater ticket */
.paper.k-ticket { width: min(440px, 100%); background: none; box-shadow: none; filter: drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
/* the perforation's two notches are real cut-outs (a mask), so the room shows through them */
.tk { position: relative; display: flex; border-radius: 12px; color: #4a1020; background: linear-gradient(160deg, #f9eed6, #eedbb4 70%, #e2c99a);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 0 0 6px rgba(142,27,44,.0);
  -webkit-mask: radial-gradient(circle 12px at calc(100% - 70px) 0, transparent 11.5px, #000 12px) top / 100% 51% no-repeat, radial-gradient(circle 12px at calc(100% - 70px) 100%, transparent 11.5px, #000 12px) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 12px at calc(100% - 70px) 0, transparent 11.5px, #000 12px) top / 100% 51% no-repeat, radial-gradient(circle 12px at calc(100% - 70px) 100%, transparent 11.5px, #000 12px) bottom / 100% 51% no-repeat; }
.tk .tk-m::after { content: ''; position: absolute; left: 10px; right: 80px; top: 10px; bottom: 10px; border: 1px solid rgba(142,27,44,.28); border-radius: 6px; pointer-events: none; }
.tk .tk-m { flex: 1; min-width: 0; padding: 20px 18px 18px 22px; border-right: 2px dashed rgba(74,16,32,.32); }
.tk .tk-h { font: 800 13px/1.2 var(--f-serif); letter-spacing: .22em; color: var(--velvet); }
.tk .tk-e { margin-top: 8px; font: 600 italic 15px/1.3 var(--f-serif); color: #3a1420; }
.tk .tk-s { display: inline-block; margin: 14px 0 12px; padding: 9px 14px 8px; border: 2px solid var(--velvet); border-radius: 6px; font: 800 clamp(20px, 6vw, 25px)/1 var(--f-serif); letter-spacing: .08em; color: #3a0a16; }
.tk .tk-c { font: 700 10.5px/1 var(--f-mono); letter-spacing: .3em; color: #8a6420; }
.tk .tk-b { width: 70px; flex: none; display: grid; place-items: center; color: var(--velvet); }
.tk .tk-b svg { width: 34px; height: 34px; stroke-width: 1.4; }
.k-ticket .ft { padding: 18px 0 0; }
.k-ticket .fold { color: #f3ead6; box-shadow: inset 0 0 0 1px rgba(243,234,214,.4); background: rgba(255,255,255,.06); }

/* ───────── the case board ───────── */
.cb { position: fixed; inset: 0; z-index: 45; pointer-events: auto; display: flex; flex-direction: column; color: #dfe6ff;
  background: radial-gradient(ellipse 120% 80% at 50% 0%, #121633, #06070f 72%); animation: jrIn .32s var(--ease) both; }
.cb.out { animation: jrOut .22s ease both; }
@keyframes jrIn { from { opacity: 0; transform: scale(1.025); } }
@keyframes jrOut { to { opacity: 0; transform: scale(1.02); } }
.cb::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(to bottom, rgba(var(--m), .022) 0 1px, rgba(0,0,0,0) 1px 3px), radial-gradient(ellipse 110% 90% at 50% 45%, rgba(0,0,0,0) 62%, rgba(0,0,0,.5)); }
.cb-h { position: relative; z-index: 2; flex: none; display: flex; align-items: center; gap: 12px; padding: calc(var(--sat) + 8px) max(10px, var(--sar), calc(50vw - 420px)) 10px max(18px, var(--sal), calc(50vw - 400px)); border-bottom: var(--hair) solid rgba(var(--m), .25); }
.cb-h .lg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.cb-h .lg b { font: 700 16px/1 var(--f-mono); letter-spacing: .24em; color: var(--mint); text-shadow: 0 0 14px rgba(var(--m), .55); }
.cb-h .lg span { font: 500 10.5px/1.2 var(--f-mono); color: rgba(var(--m), .55); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xb { pointer-events: auto; flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--mint); transition: background-color .15s ease, transform .12s var(--ease); }

@media (hover: hover) { .xb:hover { background: rgba(var(--m), .1); } }
.xb:active { transform: scale(.9); }
.cb-b { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 14px max(14px, var(--sar)) calc(var(--sab) + 40px) max(14px, var(--sal)); }
.cb-in { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.sh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .26em; text-transform: uppercase; color: rgba(var(--m), .75); }
.sh::after { content: ''; flex: 1; height: var(--hair); background: linear-gradient(90deg, rgba(var(--m), .3), rgba(var(--m), 0)); }
.sh em { font-style: normal; color: rgba(var(--m), .45); letter-spacing: .1em; }
.goal { position: relative; padding: 14px 16px 14px 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(var(--m), .13), rgba(var(--m), .04)); box-shadow: inset 0 0 0 1px rgba(var(--m), .45), 0 0 30px rgba(var(--m), .08); display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
.goal .k { grid-column: 1 / -1; font: 700 10px/1 var(--f-mono); letter-spacing: .28em; text-transform: uppercase; color: var(--mint); }
.goal p { margin: 0; font: 700 18.5px/1.3 var(--f-body); color: #f2fff9; }
.hintb { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mint); box-shadow: inset 0 0 0 1px rgba(var(--m), .55); background: rgba(5,8,20,.5); }
.hintb svg { width: 18px; height: 18px; }
@media (hover: hover) { .hintb:hover { background: rgba(var(--m), .12); } }
.hintb:active { transform: scale(.96); }
.sg { display: grid; grid-template-columns: 1fr; gap: 10px; }
.sc { position: relative; display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; align-content: start; padding: 12px 14px 12px 12px; border-radius: 16px; background: rgba(14,16,36,.82); box-shadow: inset 0 0 0 var(--hair) rgba(var(--sr), .4); --sr: 207,214,255; }

.sc.broken { box-shadow: inset 0 0 0 1px rgba(var(--ro), .7), 0 0 26px rgba(var(--ro), .12); }

.nl { display: flex; flex-direction: column; }

.nt p { margin: 4px 0 0; font: 400 14px/1.45 var(--f-body); color: #c4cbe8; overflow-wrap: break-word; }
.nt .ab { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px 2px 6px; border-radius: 6px; font: 700 9px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--sr)); background: rgba(var(--sr), .12); }
.nt .ab::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--sr)); }
.nt .nw { padding: 2px 5px 1px; border-radius: 4px; font: 700 8.5px/1.2 var(--f-mono); letter-spacing: .14em; color: #fff; background: var(--neon); }

.rdb { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 36px; padding: 0 12px; border-radius: 9px; font: 700 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mint); box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .55); }

/* ───────── the evidence picker (the accusation) ───────── */
.ev { position: fixed; inset: 0; z-index: 46; pointer-events: auto; display: flex; flex-direction: column;
  background: radial-gradient(ellipse 120% 70% at 50% 0%, rgba(40,10,22,.94), rgba(6,5,12,.97) 70%); animation: jrIn .3s var(--ease) both; }
.ev.out { animation: jrOut .22s ease both; }
.ev-h { flex: none; padding: calc(var(--sat) + 16px) max(18px, var(--sar)) 12px max(18px, var(--sal)); text-align: center; }
.ev-h .k { display: inline-flex; align-items: center; gap: 12px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--gilt-hi); }
.ev-h .k::before, .ev-h .k::after { content: ''; width: 26px; height: 1px; background: rgba(var(--g), .7); }
.ev-h p { max-width: 640px; margin: 10px auto 0; font: 600 italic clamp(20px, 5.4vw, 28px)/1.25 var(--f-serif); color: #fff7e6; }
.ev-b { flex: 1; min-height: 0; padding: 6px max(14px, var(--sar)) 16px max(14px, var(--sal)); }
.eg { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 8px; }
.ec { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; width: 100%; padding: 12px 14px 12px 12px; border-radius: 15px; text-align: left;
  background: rgba(16,14,30,.9); box-shadow: inset 0 0 0 var(--hair) rgba(var(--g), .38); color: #eef0ff; animation: chIn .34s var(--ease) both; animation-delay: calc(var(--i) * 30ms);
  transition: background-color .15s ease, box-shadow .15s ease, transform .12s var(--ease); }
.ec .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: var(--gilt-hi); background: rgba(var(--g), .1); box-shadow: inset 0 0 0 var(--hair) rgba(var(--g), .4); }
.ec .ic svg { width: 22px; height: 22px; }
.ec b { display: block; font: 700 15px/1.3 var(--f-body); color: #fff8ee; }
.ec p { margin: 3px 0 0; font: 400 13.5px/1.42 var(--f-body); color: #c9c8dc; }
@media (hover: hover) { .ec:hover { background: rgba(var(--g), .1); } }
.ec:active { transform: scale(.99); }
.ec.on { background: rgba(var(--m), .13); box-shadow: inset 0 0 0 1.5px var(--mint), 0 0 26px rgba(var(--m), .2); }
.ec.on .ic { color: var(--mint-ink); background: var(--mint); box-shadow: 0 0 14px rgba(var(--m), .45); }
.ev-f { flex: none; display: flex; justify-content: center; padding: 10px max(16px, var(--sar)) calc(var(--sab) + 14px) max(16px, var(--sal)); background: linear-gradient(to top, rgba(6,5,12,.98), rgba(6,5,12,.8) 70%, rgba(6,5,12,0)); }
.ev-f .btn { width: min(420px, 100%); }
.ev-f .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ───────── panels: menu, settings ───────── */
.modal { position: fixed; inset: 0; z-index: 65; pointer-events: auto; display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 14px) max(14px, var(--sar)) calc(var(--sab) + 14px) max(14px, var(--sal));
  background: rgba(3,4,12,.6); animation: fadeIn .22s ease both; }
.modal.out { animation: fadeOut .2s ease both; }
.card { position: relative; width: min(440px, 100%); max-height: 100%; border-radius: 24px; padding: 8px 18px 18px;
  background: linear-gradient(180deg, #12173a, #090c20 70%); box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .35), 0 34px 80px rgba(0,0,0,.65);
  animation: cardIn .34s var(--ease) both; }
.modal.out .card { animation: cardOut .2s ease both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes cardOut { to { opacity: 0; transform: translateY(8px) scale(.98); } }
.card::before, .card::after { content: ''; position: absolute; width: 16px; height: 16px; border: 0 solid var(--mint); pointer-events: none; }
.card::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 24px; }
.card::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 24px; }
.card h2 { display: flex; align-items: center; justify-content: space-between; margin: 0 -10px 4px 0; font: 700 12px/1 var(--f-mono); letter-spacing: .28em; color: var(--mint); text-transform: uppercase; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 56px; border-top: var(--hair) solid rgba(255,255,255,.07); }
.row > span { font: 500 14.5px/1.25 var(--f-body); color: #e9edff; }
.row > span small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--dim); }
.rng { -webkit-appearance: none; appearance: none; width: min(190px, 46vw); height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: none; --v: 80%; }
.rng::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--mint) var(--v), rgba(var(--m), .16) var(--v)); }
.rng::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--mint) var(--v), rgba(var(--m), .16) var(--v)); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: #eafff8; border: 0; box-shadow: 0 0 0 4px rgba(var(--m), .25), 0 2px 8px rgba(0,0,0,.5); }
.rng::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #eafff8; border: 0; box-shadow: 0 0 0 4px rgba(var(--m), .25), 0 2px 8px rgba(0,0,0,.5); }
.rng:disabled { opacity: .35; }
.tog::before { content: ''; position: absolute; inset: -8px -6px; }
.tog { position: relative; width: 52px; height: 32px; border-radius: 32px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 var(--hair) rgba(255,255,255,.18); transition: background-color .2s ease; flex: none; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #dfe4ff; box-shadow: 0 2px 6px rgba(0,0,0,.45); transition: transform .25s var(--spring), background-color .2s ease; }
.tog[aria-checked="true"] { background: var(--mint); box-shadow: 0 0 14px rgba(var(--m), .35); }
.tog[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 var(--hair) rgba(255,255,255,.1); }
.seg button { min-width: 44px; height: 44px; padding: 0 9px; border-radius: 9px; font: 700 10px/1 var(--f-mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; transition: background-color .15s ease, color .15s ease; }
.seg button[aria-checked="true"] { background: var(--mint); color: var(--mint-ink); }
.btn { min-height: 52px; padding: 0 22px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; pointer-events: auto;
  font: 700 12.5px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--mint); background: rgba(8,12,30,.6);
  box-shadow: inset 0 0 0 1px rgba(var(--m), .5); transition: background-color .15s ease, transform .12s var(--ease), box-shadow .15s ease, opacity .15s ease; }
.btn svg { width: 18px; height: 18px; }
@media (hover: hover) { .btn:hover { background: rgba(var(--m), .12); } .btn.primary:hover { background: #6effd4; } }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn.primary { background: var(--mint); color: var(--mint-ink); box-shadow: 0 0 0 1px var(--mint), 0 0 28px rgba(var(--m), .4), 0 10px 26px rgba(0,0,0,.35); }
.btn.ghost { box-shadow: inset 0 0 0 var(--hair) rgba(var(--m), .35); background: rgba(8,12,30,.35); }
.btn.danger { color: #ff9cb0; box-shadow: inset 0 0 0 1px rgba(255,90,122,.5); background: rgba(255,90,122,.06); }
.btn.danger.primary { color: #fff; background: #e8466a; box-shadow: 0 0 22px rgba(255,90,122,.35); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 11px; }
/* gilt buttons: the theater's own (title, credits) */
.btn.gold { color: #2a1606; background: linear-gradient(180deg, #ffeab0 0%, #f6d77e 30%, #d9a441 72%, #b9852c 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(120,80,20,.45), 0 0 0 1px #8a6420, 0 10px 28px rgba(0,0,0,.45), 0 0 26px rgba(var(--g), .25); }
.btn.gilt { color: var(--gilt-hi); background: rgba(14,8,10,.55); box-shadow: inset 0 0 0 1px rgba(var(--g), .7); }
.btn.gilt.ghost { box-shadow: inset 0 0 0 var(--hair) rgba(var(--g), .45); background: rgba(14,8,10,.35); color: rgba(246,215,126,.85); }
@media (hover: hover) { .btn.gold:hover { background: linear-gradient(180deg, #fff2c8 0%, #f9e099 30%, #e2b257 72%, #c08f35 100%); } .btn.gilt:hover { background: rgba(var(--g), .14); } }
.card .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.card .acts .btn { flex: 1; }
.card .fine { margin: 12px 0 0; text-align: center; font: 500 10px/1.4 var(--f-mono); letter-spacing: .12em; color: rgba(var(--m), .35); }
.confirm { margin-top: 4px; padding: 14px; border-radius: 16px; background: rgba(255,90,122,.07); box-shadow: inset 0 0 0 var(--hair) rgba(255,90,122,.35); }
.confirm p { margin: 0 0 12px; font: 500 14px/1.4 var(--f-body); color: #ffe3ea; }
.confirm .acts { margin-top: 0; }
.menu { align-items: flex-start; justify-content: flex-start; background: rgba(3,4,12,.42); padding-top: calc(var(--hud-top) + 4px); }
.menu .card { width: 270px; padding: 8px; border-radius: 20px; transform-origin: top left; animation: menuIn .28s var(--ease) both; }
.menu .card::before { border-top-left-radius: 20px; } .menu .card::after { border-bottom-right-radius: 20px; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-8px) scale(.94); } }
.mi { width: 100%; min-height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-radius: 13px; text-align: left; font: 500 15px/1 var(--f-body); color: #edf0ff; transition: background-color .15s ease; }
.mi svg { width: 20px; height: 20px; color: var(--mint); }
@media (hover: hover) { .mi:hover { background: rgba(var(--m), .1); } }
.mi:active { background: rgba(var(--m), .16); }
.mi + .mi { margin-top: 2px; }
.mi.sep { margin-top: 6px; position: relative; }
.mi.sep::before { content: ''; position: absolute; left: 14px; right: 14px; top: -4px; height: var(--hair); background: rgba(255,255,255,.1); }
.menu .fine { margin: 4px 0 6px; text-align: center; font: 500 9.5px/1.3 var(--f-mono); letter-spacing: .14em; color: rgba(var(--m), .4); }
/* settings: a bottom sheet on portrait phones (thumb reach), a centred card elsewhere */
.grab { display: none; }
@media (orientation: portrait) and (max-width: 560px) {
  .modal.set { align-items: flex-end; padding: calc(var(--sat) + 40px) 0 0; }
  .modal.set .card { width: 100%; max-width: none; border-radius: 26px 26px 0 0; padding: 6px max(20px, var(--sar)) calc(var(--sab) + 16px) max(20px, var(--sal)); animation: sheetUp .38s var(--ease) both; }
  .modal.set.out .card { animation: sheetDown .24s ease both; }
  .modal.set .card::after { display: none; }
  .modal.set .grab { display: block; width: 38px; height: 4px; border-radius: 4px; margin: 4px auto 10px; background: rgba(255,255,255,.18); }
}
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes sheetDown { to { transform: translateY(100%); } }

/* ───────── title: a proscenium of velvet and gilt, the pearl rising like a moon ───────── */
.title { position: fixed; inset: 0; z-index: 55; pointer-events: auto; overflow: hidden; display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); justify-items: center;
  padding: calc(var(--sat) + 78px) max(26px, calc(var(--sar) + 15vw)) calc(var(--sab) + 22px) max(26px, calc(var(--sal) + 15vw));
  background: radial-gradient(ellipse 70% 55% at 50% 38%, rgba(18,16,42,.5), rgba(6,5,14,.86) 72%), rgba(6,5,14,.3); animation: fadeIn .7s ease both; }
.title.out { animation: fadeOut .45s ease both; pointer-events: none; }
.title[hidden] { display: none; }
.t-deco { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.t-deco i { position: absolute; display: block; }
.t-spot { left: 50%; top: 0; width: 120vmax; height: 120vh; margin-left: -60vmax; background: radial-gradient(ellipse 26% 58% at 50% 0%, rgba(206,218,255,.17), rgba(206,218,255,.05) 55%, rgba(206,218,255,0) 75%); }
.t-cur { top: 0; bottom: 0; width: 15vw; max-width: 230px; min-width: 50px;
  background:
    linear-gradient(180deg, rgba(14,0,4,.65), rgba(14,0,4,0) 22%, rgba(14,0,4,0) 64%, rgba(14,0,4,.75)),
    repeating-linear-gradient(90deg, #3e0a14 0, #6b1222 7px, #9a2236 13px, #c23a4b 16px, #a32740 19px, #741528 25px, #4f0d18 31px, #3e0a14 34px);
  animation: curIn 1.1s var(--ease) both; }
.t-cur.l { left: 0; transform-origin: left; box-shadow: inset -14px 0 26px rgba(0,0,0,.55); border-bottom-right-radius: 100% 26%; }
.t-cur.r { right: 0; transform-origin: right; box-shadow: inset 14px 0 26px rgba(0,0,0,.55); border-bottom-left-radius: 100% 26%; }
@keyframes curIn { from { transform: scaleX(1.9); } }
/* the gilt rope that ties each curtain back, with a tassel */
.t-tie { top: 61%; width: calc(max(50px, min(15vw, 230px)) * .82); height: 8px; border-radius: 8px; background: repeating-linear-gradient(115deg, #ffe7a6 0 4px, #c9953a 4px 7px, #8a6420 7px 9px); box-shadow: 0 3px 8px rgba(0,0,0,.55); }
.t-tie::after { content: ''; position: absolute; top: 3px; width: 10px; height: 26px; border-radius: 4px 4px 7px 7px; background: repeating-linear-gradient(90deg, #f6d77e 0 2px, #b9852c 2px 3px); box-shadow: 0 3px 6px rgba(0,0,0,.5); }
.t-tie.l { left: 0; transform: rotate(-6deg); transform-origin: left; } .t-tie.l::after { right: -3px; }
.t-tie.r { right: 0; transform: rotate(6deg); transform-origin: right; } .t-tie.r::after { left: -3px; }
.t-val { left: 0; right: 0; top: 0; height: calc(var(--sat) + 40px);
  background: linear-gradient(180deg, rgba(10,0,4,.55), rgba(10,0,4,0) 70%), repeating-linear-gradient(90deg, #5a0f1c 0, #8e1b2c 10px, #b02e44 16px, #8e1b2c 22px, #5a0f1c 32px);
  box-shadow: 0 8px 18px rgba(0,0,0,.5); }
.t-val::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: repeating-linear-gradient(90deg, #f6d77e 0 2px, rgba(217,164,65,.0) 2px 5px), linear-gradient(180deg, #f6d77e, #b9852c); -webkit-mask: linear-gradient(180deg, #000 30%, rgba(0,0,0,.6)); mask: linear-gradient(180deg, #000 30%, rgba(0,0,0,.6)); }
.t-swag { left: 0; right: 0; top: calc(var(--sat) + 40px); height: 46px;
  background: radial-gradient(ellipse 50% 100% at 50% 0%, #8e1b2c 0, #74162a 52%, #4f0d18 70%, rgba(79,13,24,0) 71%) 0 0 / 160px 46px repeat-x; opacity: .96; }
.t-fl { left: 0; right: 0; bottom: 0; height: 110px; background: radial-gradient(22px 14px at 50% 100%, rgba(255,214,150,.7), rgba(255,180,100,0)) 0 100% / 74px 26px repeat-x, linear-gradient(0deg, rgba(255,170,90,.14), rgba(255,170,90,0)); }
.t-top { position: relative; z-index: 1; align-self: center; text-align: center; display: flex; flex-direction: column; align-items: center; max-width: 640px; }
.t-name .b span { display: block; }
.t-moon { position: relative; width: clamp(66px, 19vw, 136px); aspect-ratio: 1; margin-bottom: 18px; animation: moonUp 1.6s .25s var(--ease) both; }
.t-moon .halo { position: absolute; inset: -95%; border-radius: 50%; background: radial-gradient(circle, rgba(223,232,255,.42) 0, rgba(159,196,255,.17) 26%, rgba(159,196,255,.05) 46%, rgba(159,196,255,0) 64%); animation: breathe 5.5s ease-in-out infinite; }
.t-moon .orb { position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #ffffff 0, #f6f9ff 18%, #e3ebff 42%, #bccff3 70%, #8ea6d8 100%);
  box-shadow: 0 0 26px rgba(223,232,255,.7), 0 0 70px rgba(159,196,255,.45), inset -9px -12px 22px rgba(70,92,160,.38); }
.t-moon .orb::after { content: ''; position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: soft-light; opacity: .55;
  background: conic-gradient(from 200deg, rgba(255,190,225,.7), rgba(190,255,235,.6), rgba(190,210,255,.7), rgba(255,226,190,.6), rgba(255,190,225,.7)); }
@keyframes moonUp { from { opacity: 0; transform: translateY(30px) scale(.9); } }
@keyframes breathe { 0%, 100% { opacity: .78; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.t-kick { display: flex; align-items: center; gap: 12px; white-space: nowrap; font: 700 clamp(9.5px, 2.6vw, 11px)/1.3 var(--f-mono); letter-spacing: clamp(.18em, .7vw, .32em); text-transform: uppercase; color: rgba(246,215,126,.85); animation: tUp .8s .5s var(--ease) both; }

    rect(g, x0, FL - 13, W, 1.2, 'rgba(255,214,160,0.25)');
    // the floor: planks across, deeper toward the front; end joints aimed at the vanishing point
    const vpx = (L.safe[0] + L.safe[2]) / 2;
    let y = FL, row = 0;
    while (y < y1) {
      const k = kAt(y), dyp = 15 * k * (LID === 'tall' ? 0.62 : 0.45), ya = y, yb = y + dyp;
      const base = 0.78 + R() * 0.3;
      g.fillStyle = `rgb(${Math.round(112 * base)},${Math.round(74 * base)},${Math.round(50 * base)})`; g.fillRect(x0, ya, W, dyp + 0.5);
      rect(g, x0, ya, W, Math.max(0.6, 0.9 * k), 'rgba(30,16,10,0.75)');

    ell(g, rx, ry, rw, rh, '#2b3478');
    ell(g, rx, ry, rw - 7, rh - 7 * rh / rw - 1, null, '#d9a441', Math.max(1.2, rh / 12));
    ell(g, rx, ry, rw - 13, rh - 13 * rh / rw - 2, null, 'rgba(217,164,65,0.55)', Math.max(0.6, rh / 30));
    ell(g, rx, ry, rw - 20, rh - 20 * rh / rw - 3, '#232b66');

    path(g, `M${-rw * 0.12} ${-rw * 0.32} A${rw * 0.34} ${rw * 0.34} 0 1 0 ${rw * 0.2} ${rw * 0.26} A${rw * 0.27} ${rw * 0.27} 0 1 1 ${-rw * 0.12} ${-rw * 0.32} Z`, '#d9a441');
    for (const [a, d, s] of [[0.3, 0.62, 5], [1.4, 0.55, 4], [2.4, 0.66, 6], [3.6, 0.6, 4], [4.6, 0.5, 5], [5.5, 0.68, 4]]) {

  // ═════════════════════════════ Madame's moon cabinet (a miniature of Cabinet's close-up: 1 unit = 6 of its units) ═════════════════════════════

  function phasePath(g, x, y, r, f, side) {   // the lit part of a moon (as Cabinet draws it)

  }
  function twinkle(g, x, y, r, f) { path(g, `M${x} ${y - r} Q${x + r * 0.12} ${y - r * 0.12} ${x + r} ${y} Q${x + r * 0.12} ${y + r * 0.12} ${x} ${y + r} Q${x - r * 0.12} ${y + r * 0.12} ${x - r} ${y} Q${x - r * 0.12} ${y - r * 0.12} ${x} ${y - r} Z`, f || 'rgba(255,226,150,0.85)'); }

  function pCabinet(g) {

  async function intro() {

    setShot('outside'); planFor('outside');

  // Madame presents the pearl; a drumroll lands on "the Vanishing Moon!" (timed to her voice when there is one)

        go.disabled = false; goLb.textContent = TXT.showIt + ': ' + STORY.journal[ids[i]].title;
        try { cards[i].scrollIntoView({ block: 'nearest' }); } catch (e) {}
      };
      const finish = (id, instant) => {

  // ───────── menu & settings ─────────

  const vol = (k) => { const v = typeof Snd !== 'undefined' && Snd && Snd.vols ? Snd.vols[k] : undefined; return typeof v === 'number' ? v : 1; };
  const isMuted = () => !!(typeof Snd !== 'undefined' && Snd && Snd.vols && Snd.vols.muted);

    const mt = tog(muted, (t, on) => { setMute(on); t.setAttribute('aria-checked', on ? 'true' : 'false'); for (const r of ranges) r.disabled = on; });
    mt.setAttribute('aria-label', TXT.mute); row(TXT.mute, TXT.muteSub, mt);
    const seg = mk('div', 'seg'); seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', TXT.speed);
    TXT.speeds.forEach((nm, i) => { const b = mk('button', '', esc(nm)); b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === speedI ? 'true' : 'false'); b.addEventListener('click', (e) => { tapFx(e); speedI = i; store.set('textSpeed', i); for (const c of seg.children) c.setAttribute('aria-checked', c === b ? 'true' : 'false'); }); seg.appendChild(b); });
    row(TXT.speed, '', seg);
    const canErase = inGame || SAVE.has();
    if (canErase) {
      const eb = mk('button', 'btn sm danger', esc(inGame ? TXT.restart : TXT.erase)); eb.type = 'button';
      row(TXT.save, inGame ? TXT.saveSubGame : TXT.saveSubTitle, eb);
      const cf = mk('div', 'confirm', `<p>${esc(inGame ? TXT.restartQ : TXT.eraseQ)}</p>`); cf.hidden = true;
      const acts = mk('div', 'acts');

      acts.append(no, yes); cf.appendChild(acts); card.appendChild(cf);
      eb.addEventListener('click', (e) => { tapFx(e); cf.hidden = false; eb.disabled = true; });
      no.addEventListener('click', (e) => { tapFx(e); cf.hidden = true; eb.disabled = false; });
      yes.addEventListener('click', (e) => {
        tapFx(e); SAVE.clear(); closeSettings(true);
        if (inGame) BUS.emit('ui:new'); else if (contBtn) contBtn.hidden = true;
      });
    }
    card.appendChild(mk('p', 'fine', 'MEI · LIGHTS · THE LANTERN'));
    setEl = modal('set', card, () => closeSettings());

  }
  function closeSettings(instant) { if (!setEl) return; dropModal(setEl, instant); setEl = null; OPEN.settings = 0; }
  function toggleMute() {
    const on = !isMuted();
    setMute(on);
    toast(on ? TXT.soundOff : TXT.soundOn, 'quiet');
