<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:url" content="https://smartdisruptions.com/games/blueline">
<meta property="og:image" content="https://smartdisruptions.com/images/apps/blueline-og.jpg">

<style>
:root{
  --font:"DIN Alternate","DIN Condensed","Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",ui-monospace,"SF Mono","JetBrains Mono","DejaVu Sans Mono",monospace;
  --ink:#f1f7ff; --dim:#a9c8ec; --edge:rgba(230,242,255,.82); --panel:rgba(12,46,96,.86); --red:#e2493d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d356d;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:100dvh;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:absolute;visibility:hidden;pointer-events:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
button,a.btn{font-family:var(--font);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--edge);border-radius:2px;color:var(--ink);background:rgba(12,48,100,.78);
  box-shadow:inset 0 0 0 2.5px rgba(12,48,100,.95),inset 0 0 0 3.5px rgba(230,242,255,.28),0 6px 18px rgba(2,14,40,.35);
  text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer;
  transition:transform .1s ease,background .15s ease,color .15s ease,opacity .25s ease}
.btn:active,.btn.on{background:var(--ink);color:#0f3a77;transform:scale(.96)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.btn:focus-visible{outline:2px dashed #fff;outline-offset:3px}
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.show{opacity:1}
#hud.show .live{pointer-events:auto}
#back{position:absolute;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 8px);height:44px;padding:0 14px 0 10px;font-size:11px;letter-spacing:.16em}
#back b{font-size:18px;font-weight:400;letter-spacing:0;margin-top:-2px}
.tr{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 8px);display:flex;gap:8px}
.sq{width:44px;height:44px;padding:0}
#bSound[aria-pressed="false"] .on,#bSound[aria-pressed="true"] .off{display:none}
#gauge{position:absolute;top:calc(var(--sat) + 58px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);height:18px;
  display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:700;white-space:nowrap}
#gauge .gl b{color:var(--ink)}
#gauge .gl i{display:inline-block;width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%;margin-right:5px;vertical-align:-1px}
#gauge.done .gl i{background:#ffd27a;border-color:#ffd27a;box-shadow:0 0 8px #ffd27a}
#gbar{position:relative;flex:1;height:10px;border:1px solid var(--edge);background:repeating-linear-gradient(90deg,rgba(230,242,255,.12) 0 1px,transparent 1px 10%)}
#gbar .u,#gbar .p{position:absolute;top:1px;bottom:1px;left:1px;width:0;background:var(--ink);transition:width .25s ease}
#gbar .p{background:rgba(230,242,255,.4);transition:none}
#gbar .t{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:#ffd27a}
#gbar .t::after{content:attr(data-s);position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:0;color:#ffd27a}
#gauge .gv{color:var(--ink);min-width:86px;text-align:right}
#bar{position:absolute;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 12px);display:flex;gap:10px;justify-content:center}
#bar .btn{height:56px;font-size:13px;flex:1 1 0;max-width:220px}
#bRun{flex:1.5 1 0 !important;font-size:15px !important;letter-spacing:.26em}
#bRun.go{background:var(--ink);color:#0f3a77}
#bRun.go:active{background:#cfe4ff}
#bRun:disabled{opacity:.35;pointer-events:none}
#bErase:disabled{opacity:.4;pointer-events:none}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 86px);transform:translate(-50%,-8px);max-width:min(92vw,380px);padding:9px 14px 8px;
  background:var(--panel);border:1.5px solid var(--edge);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px rgba(230,242,255,.25);
  text-align:center;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-size:11.5px;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
#toast span{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;color:#ffd27a}
#toast em{display:block;margin-top:3px;font-style:normal;font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity .6s ease}
.screen.show{opacity:1;pointer-events:auto}
#title{justify-content:center;gap:0;padding:calc(var(--sat) + 20px) 22px calc(var(--sab) + 26px);
  background:radial-gradient(75% 34% at 50% 44%,rgba(8,32,70,.86),rgba(8,32,70,.62) 55%,rgba(8,32,70,.18) 100%),radial-gradient(120% 70% at 50% 50%,rgba(8,32,70,.3),rgba(8,32,70,0))}
.kick{font-size:10.5px;letter-spacing:.42em;padding-left:.42em;color:var(--dim);font-weight:700;text-align:center}
#mark{width:min(84vw,430px);height:auto;margin:18px 0 6px;overflow:visible}
#mark .g{stroke:rgba(200,228,255,.35);stroke-width:.18;stroke-dasharray:.6 .5;fill:none}
#mark .d{stroke:rgba(225,240,255,.75);stroke-width:.22;fill:none}
#mark .dt{fill:rgba(225,240,255,.85);font:700 2.2px var(--font);letter-spacing:.35px}
#mark .p{stroke:rgba(190,215,245,.35);stroke-width:.35;fill:none;stroke-miterlimit:1.5}
#mark .l{stroke:#f6fbff;stroke-width:1.55;fill:none;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:1.5;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(150,215,255,.55))}
#title.show #mark .l{animation:draft .65s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes draft{to{stroke-dashoffset:0}}
.pitch{margin-top:12px;font-size:13px;letter-spacing:.2em;padding-left:.2em;white-space:nowrap;font-weight:700;text-align:center;color:var(--ink)}
.sub2{margin-top:8px;font-size:10.5px;letter-spacing:.22em;padding-left:.22em;color:var(--dim);text-align:center;line-height:1.7}
#bPlay{margin-top:34px;height:60px;min-width:236px;font-size:15px;letter-spacing:.3em;background:var(--ink);color:#0f3a77;
  box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4.5px #0f3a77,0 10px 30px rgba(2,14,40,.45)}
#bPlay:active{transform:scale(.96);background:#cfe4ff}
#bPlay{position:relative}
#bPlay.pulse::after{content:"";position:absolute;inset:-7px;border:1.5px solid rgba(230,242,255,.55);opacity:0;animation:pulse 2.4s ease-out 1.4s infinite;pointer-events:none}
@keyframes pulse{0%{opacity:.9;transform:scale(.97)}70%,100%{opacity:0;transform:scale(1.08)}}
.tback{margin-top:16px;height:44px;padding:0 16px;font-size:10.5px;background:transparent;box-shadow:none;border-color:rgba(230,242,255,.4)}
#win{justify-content:flex-start;pointer-events:none}
#win.show{pointer-events:none}
#card{position:absolute;left:50%;transform:translate(-50%,12px) scale(.96);width:min(88vw,330px);padding:12px 14px 14px;
  background:var(--panel);border:1.5px solid var(--edge);box-shadow:inset 0 0 0 3.5px var(--panel),inset 0 0 0 4.5px rgba(230,242,255,.3),0 18px 50px rgba(2,12,36,.5);
  text-align:center;opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,1.4,.4,1)}
#win.show #card{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#card .k{font-size:9.5px;letter-spacing:.3em;color:var(--dim);font-weight:700}
#card .h{margin-top:6px;font-size:22px;letter-spacing:.32em;padding-left:.32em;font-weight:800}
#stars{display:flex;justify-content:center;gap:14px;margin:9px 0 7px}
#stars svg{width:36px;height:36px;overflow:visible;transform:scale(0);opacity:0}
#stars svg.pop{animation:pop .45s cubic-bezier(.2,1.8,.4,1) forwards}
#stars .f{fill:#ffd27a;stroke:#fff3d6;stroke-width:1.2}
#stars .e{fill:none;stroke:rgba(230,242,255,.55);stroke-width:1.4;stroke-dasharray:2.5 2}
@keyframes pop{to{transform:scale(1);opacity:1}}
#card .st{font-size:10px;letter-spacing:.16em;color:var(--ink)}
#card .st2{margin-top:3px;font-size:9px;letter-spacing:.14em;color:var(--dim)}
#card .row{display:flex;gap:10px;margin-top:12px}
#card .row .btn{flex:1;height:48px;font-size:11.5px;letter-spacing:.18em}
#bReplay{background:var(--ink) !important;color:#0f3a77 !important}
/* Landscape and desktop: controls move into a side column. */
body.land #gauge{left:auto;right:calc(var(--sar) + 16px);top:auto;bottom:calc(var(--sab) + 150px);width:min(230px,30vw);flex-wrap:wrap;height:auto;row-gap:12px;justify-content:space-between}
body.land #gauge .gv{min-width:0}
body.land #gauge #gbar{flex:1 1 100%;order:3}
body.land #bar{left:auto;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 16px);width:min(230px,30vw);flex-direction:column-reverse}
body.land #bar .btn{max-width:none;flex:none !important;width:100%}
body.land #toast{top:auto;bottom:calc(var(--sab) + 220px);left:auto;right:calc(var(--sar) + 16px);transform:none;width:min(230px,30vw)}
@media (prefers-reduced-motion:reduce){#mark .l{animation:none !important;stroke-dashoffset:0}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Blueprint sheet. Drag to draft steel beams."></canvas>
<div id="probe"></div>
<div id="hud">
  <a id="back" class="btn live" href="/games" aria-label="Back to the Arcade"><b>‹</b>Arcade</a>
  <div class="tr live">
    <button id="bRestart" class="btn sq" aria-label="Restart: clear the sheet"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v5h5"/></svg></button>
    <button id="bSound" class="btn sq" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>

</div>
<div id="title" class="screen show" role="dialog" aria-label="Blueline title">

    <path class="g" d="M-5 0H94M-5 7H94M-5 14H94"/>
    <path class="d" d="M0 -6.5H87M0 -8V-5M87 -8V-5M0 -6.5l1.4 -.5v1zM87 -6.5l-1.4 -.5v1z"/>
    <text class="dt" x="43.5" y="-7.3" text-anchor="middle">870 · TYPICAL CAP HEIGHT 140</text>
    <path class="d" d="M91 0V14M89.5 0H92.5M89.5 14H92.5"/>
    <g transform="translate(.35 .35)"><path class="p" d="M0 14V0H5.5A3.5 3.5 0 0 1 5.5 7H0M5.5 7H6A3.5 3.5 0 0 1 6 14H0M13 0V14H21M25 0V9.5A4.5 4.5 0 0 0 34 9.5V0M46 0H38V14H46M38 7H44M50 0V14H58M62 0V14M66 14V0L75 14V0M87 0H79V14H87M79 7H85"/></g>
    <path class="l" pathLength="1" d="M0 14V0H5.5A3.5 3.5 0 0 1 5.5 7H0M5.5 7H6A3.5 3.5 0 0 1 6 14H0" style="animation-delay:0.1s"/>
    <path class="l" pathLength="1" d="M13 0V14H21" style="animation-delay:0.2s"/>
    <path class="l" pathLength="1" d="M25 0V9.5A4.5 4.5 0 0 0 34 9.5V0" style="animation-delay:0.3s"/>
    <path class="l" pathLength="1" d="M46 0H38V14H46M38 7H44" style="animation-delay:0.4s"/>
    <path class="l" pathLength="1" d="M50 0V14H58" style="animation-delay:0.5s"/>
    <path class="l" pathLength="1" d="M62 0V14" style="animation-delay:0.6s"/>
    <path class="l" pathLength="1" d="M66 14V0L75 14V0" style="animation-delay:0.7s"/>
    <path class="l" pathLength="1" d="M87 0H79V14H87M79 7H85" style="animation-delay:0.8s"/>
  </svg>
  <div class="pitch">DRAFT A LINE. PHYSICS DECIDES.</div>
  <div class="sub2">EVERY BEAM YOU DRAW TURNS TO STEEL</div>
  <button id="bPlay" class="btn pulse">Play</button>
  <a class="btn tback" href="/games">‹ Arcade</a>
</div>
<div id="win" class="screen" role="dialog" aria-label="Drawing approved">
  <div id="card">
    <div class="k">DWG BL-001 · TIPPING POINT</div>
    <div class="h">IT WORKS.</div>
    <div id="stars">
      <svg viewBox="-12 -12 24 24"><path d="M0-10 2.9-3.9 9.5-3.1 4.6 1.4 5.9 8.1 0 4.8-5.9 8.1-4.6 1.4-9.5-3.1-2.9-3.9z"/></svg>
      <svg viewBox="-12 -12 24 24"><path d="M0-10 2.9-3.9 9.5-3.1 4.6 1.4 5.9 8.1 0 4.8-5.9 8.1-4.6 1.4-9.5-3.1-2.9-3.9z"/></svg>
      <svg viewBox="-12 -12 24 24"><path d="M0-10 2.9-3.9 9.5-3.1 4.6 1.4 5.9 8.1 0 4.8-5.9 8.1-4.6 1.4-9.5-3.1-2.9-3.9z"/></svg>
    </div>
    <div class="st" id="wStat">INK 560 MM · 40% OF BUDGET</div>
    <div class="st2" id="wStat2">3 STARS AT ≤ 40% INK</div>
    <div class="row"><button id="bReplay" class="btn">↻ Replay</button><a class="btn" href="/games">‹ Arcade</a></div>
  </div>
</div>
